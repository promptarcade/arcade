  }
  idle(dt) {
    if (this.state !== 'rest' && this.state !== 'seat') return;
    this.idleT -= dt;
    if (this.idleT > 0) return;
    this.idleT = rand(4, 9);
    if (this.asleep) return;
    if (this.seat && this.seat.owner.idleSeat && this.seat.owner.idleSeat(this)) return;
    if (this.hand && this.hand.def.use && Rnd.f() < 0.5) { const u = this.hand.def.use; if (ACTIONS['idle_' + u]) { this.doAct('idle_' + u, this.hand); return; } }
    const room = this.room();
    if (room && room.tv > 0 && this.seat) { this.doAct('watchTv'); return; }
    if (World.night > 0.5 && Rnd.f() < 0.4) { this.doAct('yawn'); return; }
    if (this.dirt > 0.3 && Rnd.f() < 0.3) { this.doAct('scratch'); return; }
    this.doAct(pick(this.seat ? ['wave', 'lookAround', 'swingLegs', 'giggle'] : ['wave', 'lookAround', 'hop', 'stretch', 'giggle', 'spin']));
  }
  tap() {
    if (this.asleep) { this.doAct('wakeUp'); return; }
    if (this.seat && this.seat.owner.tapSeated && this.seat.owner.tapSeated(this)) return;
    this.doAct(pick(['tickle', 'tickle', 'wave', 'hop', 'spin']));
  }

  /* ---------- drawing ---------- */
  pose() {
    const P = this._pose || (this._pose = {});
    P.legs = this.legs; P.phase = this.t; P.kick = this.kick; P.armL = this.armL; P.armR = this.armR;
    P.face = this.face; P.bob = this.bob; P.lean = 0; P.headTilt = this.headTilt || 0; P.squash = this.squash; P.dirt = this.dirt;
    P.held = this.hand ? handDrawer(this, this.hand) : (this.actHeld || null);
    P.over = (ctx, rx, ry) => drawWorn(ctx, this, rx, ry);
    return P;
  }
  draw(ctx) {
    const P = this.pose(), B = this.B;
    const [hx, hy] = this.hip();
    ctx.save();
    if (this.held || this.state === 'fall') {
      // dangling from the fingertip: swing about the top of the head
      const gx = hx, gy = hy - this.headTop + 10;
      ctx.translate(gx, gy); ctx.rotate(this.lean); ctx.translate(-gx, -gy);
      if (this.state === 'fall') this.drawShadow(ctx, B.tw * 1.1);
      ctx.translate(hx, hy);
    } else if (this.seat && (this.seat.pose === 'lie' || this.seat.pose === 'pram')) {
      ctx.translate(hx, hy); ctx.rotate(this.seat.flip ? Math.PI / 2 : -Math.PI / 2);
      if (this.seat.flip) ctx.scale(-1, 1);
    } else if (this.seat) {
      ctx.translate(hx, hy);
      if (this.seatRot) ctx.rotate(this.seatRot);
    } else {
      this.drawShadow(ctx, B.tw * 1.15);
      ctx.translate(hx, hy);
      if (this.lean) ctx.rotate(this.lean);
    }
    if (this.flipX) ctx.scale(-1, 1);
    if (this.scaleK) ctx.scale(this.scaleK, this.scaleK);
    this._lastS = skeleton(B, P);
    drawPerson(ctx, this.look, P);
    if (this.wet > 0.4 && !this.seat) drawWetShine(ctx, this);
    ctx.restore();
    if (this.asleep && Rnd.f() < 0.012) { const [x, y] = this.headPos(); Parts.add('zzz', x + 30, y - 40, { size: 26, life: 2.2, vx: 30, vy: -40, layer: 1 }); }
  }
}

// a milk moustache, a dangling noodle, a bubble of gum: drawn on the face (the canvas is at the head's centre)
Person.prototype.faceOver = function (ctx, rx, ry) {
  if (this.moustacheT > 0) {
    const a = Math.min(1, this.moustacheT);
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = this.moustacheCol || '#ffffff'; ctx.strokeStyle = rgba(PLINE, 0.5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-rx * 0.4, ry * 0.42);
    ctx.quadraticCurveTo(-rx * 0.2, ry * 0.3, 0, ry * 0.38); ctx.quadraticCurveTo(rx * 0.2, ry * 0.3, rx * 0.4, ry * 0.42);
    ctx.quadraticCurveTo(rx * 0.3, ry * 0.52, rx * 0.15, ry * 0.46); ctx.quadraticCurveTo(0, ry * 0.5, -rx * 0.15, ry * 0.46); ctx.quadraticCurveTo(-rx * 0.3, ry * 0.52, -rx * 0.4, ry * 0.42);
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if (this.noodleT > 0) {
    const L = ry * 0.9 * this.noodleT;
    ctx.save(); ctx.strokeStyle = '#f5d06a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, ry * 0.5); ctx.bezierCurveTo(rx * 0.1, ry * 0.5 + L * 0.5, -rx * 0.15, ry * 0.5 + L * 0.7, rx * 0.05, ry * 0.5 + L); ctx.stroke(); ctx.restore();
  }
  if (this.gumT > 0) {
    const r = rx * (0.15 + this.gumT * 0.55);
    ctx.save(); ctx.beginPath(); ctx.arc(0, ry * 0.5 + r * 0.2, r, 0, TAU); ctx.fillStyle = 'rgba(255,130,190,0.85)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#c8407a'; ctx.stroke();
    ctx.beginPath(); ctx.arc(-r * 0.35, ry * 0.5 - r * 0.15, r * 0.2, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill(); ctx.restore();
  }
};
// a prop in someone's hand, drawn by the hand (things held up — balloons, umbrellas, kites — float above it)
function handDrawer(p, item) {
  const d = item._hd || (item._hd = { hand: 'R', draw: null });
  d.hand = 'R';
  d.draw = (ctx, x, y) => {
    const up = item.def.holdUp;
    ctx.save();
    if (up) {
      // a string or a handle up to the thing
      const top = item.type === 'umbrella' ? y - item.h * 0.85 : y - 160 - Math.sin(p.t * 2) * 6;
      ctx.strokeStyle = PLINE; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 14, (y + top) / 2, x + Math.sin(p.t * 1.5) * 8, top); ctx.stroke();
      if (item.type === 'umbrella') item.drawAt(ctx, x + 4, y + item.h * 0.12, 1, 0);
      else item.drawAt(ctx, x + Math.sin(p.t * 1.5) * 8, top + 8, 1, Math.sin(p.t * 1.3) * 0.1);
    } else {
      const k = Math.min(1, (p.B.head * 1.5) / Math.max(item.h, item.w));
      item.drawAt(ctx, x + 6, y + item.h * k * 0.45, k, p.handTilt || 0);
    }
    ctx.restore();
  };
  return d;
}

// hats, glasses and bows on the head (rx, ry: the head's radii; the canvas is at the head's centre)
function drawWorn(ctx, p, rx, ry) {
  if (p.faceOver) p.faceOver(ctx, rx, ry);
  const g = p.wear.glasses;
  if (g) { const d = PROPS[g], w = rx * 2 * d.wk, h = w / Art.aspect(d.pic); Art.rect(ctx, d.pic, -w / 2, ry * 0.06 - h * 0.55, w, h); }
  const b = p.wear.bow;
  if (b) { const d = PROPS[b], w = rx * 2 * d.wk, h = w / Art.aspect(d.pic); Art.rect(ctx, d.pic, rx * 0.25, -ry * 0.98, w, h); }
  const hat = p.wear.hat;
  if (hat) {
    const d = PROPS[hat], w = rx * 2 * d.wk, h = w / Art.aspect(d.pic);
    const base = -ry * 1.0 + ry * 2 * d.wy;      // where the brim sits
    Art.rect(ctx, d.pic, -w / 2, base - h, w, h);
  }
}
function drawWetShine(ctx, p) {
  ctx.fillStyle = 'rgba(160,220,255,0.35)';
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-p.B.tw * 0.3 + i * p.B.tw * 0.2, -p.B.th * (0.3 + (i % 2) * 0.3), 5, 9, 0, 0, TAU); ctx.fill(); }
}

// what people say out loud (the device's voice, pitched for who is talking), never too often
const LINES = {
  hello: ['Hello!', 'Hiya!', 'Hi!'], yum: ['Yummy!', 'Mmm!', 'Yum yum!'], yuck: ['Yuck!', 'Eww!', 'No thank you!'],
  wee: ['Wheee!', 'Weee!'], night: ['Night night!', 'Sleepy time.'], morning: ['Good morning!', 'Morning!'],
  boo: ['Boo!', 'Peekaboo!'], uhoh: ['Uh oh!', 'Oops!'], thanks: ['Thank you!', 'Ta!'], hot: ['Hot hot hot!'], cold: ['Brrr!'],
  clean: ['All clean!', 'Squeaky clean!'], bye: ['Bye bye!'], hug: ['Cuddle!'], yay: ['Yay!', 'Hooray!'],
};
function voiceLine(p, kind) {
  if (p.sayT > 0) return;
  const L = LINES[kind]; if (!L) return;
  p.sayT = 3;
  Say.line(pick(L), p.fam.voice, p.fam.rate);
}

/* ---------- src/reactions.js ---------- */
/* reactions.js — what people do: little scripts (generators, see anim.js) that run for a few
   seconds and set the face, arms and legs every frame. giveTo() decides what someone does with a
   thing put into their hands; eating reacts to the food's fx from foods.js. */

// helpers for scripts: run fn every frame for d seconds; fn(t, dt, k) with k = t / d
function* hold(d, fn) { let t = 0; while (t < d) { const dt = yield; t += dt; if (fn) fn(t, dt, Math.min(1, t / d)); } }

const ACTIONS = {
  *tickle(p) {
    SFX.play('giggle', { pitch: p.fam.voice });
    yield* hold(1.3, t => {
      p.face = { mouth: 'laugh', eyes: 'squint', blush: 1 };
      p.lean = Math.sin(t * 22) * 0.08; p.armL = [0.5, -2.2]; p.armR = [0.5, -2.2]; p.bob = -Math.abs(Math.sin(t * 11)) * 6;
      if (p.seat) p.kick = 1;
    });
  },
  *giggle(p) { SFX.play('giggle', { pitch: p.fam.voice * 1.1 }); yield* hold(0.9, t => { p.face = { mouth: 'grin', eyes: 'happy', blush: 1 }; p.bob = -Math.abs(Math.sin(t * 12)) * 4; }); },
  *wave(p) {
    if (Rnd.f() < 0.5) p.say('hello'); else SFX.play('babble', { pitch: p.fam.voice, n: 2, mood: 'happy' });
    yield* hold(1.5, t => { p.armR = [2.55 + Math.sin(t * 12) * 0.35, 0.35]; p.face = { mouth: 'grin', eyes: 'happy' }; });
  },
  *hop(p) {
    if (p.state !== 'rest' || p.seat) return;
    p.startFall(0, -680, false); p.floorTarget = p.y;
    SFX.play('boing', { f: 300 });
    yield* hold(0.6, t => { p.legs = 'kick'; p.armL = [2.3, 0.3]; p.armR = [2.3, 0.3]; p.face = { mouth: 'laugh', eyes: 'happy' }; });
  },
  *spin(p) {
    SFX.play('whoosh', { dur: 0.4, f0: 600, f1: 1400, vol: 0.3 });
    yield* hold(0.7, (t, dt, k) => { p.spinX = Math.cos(k * TAU); p.armL = [1.5, 0.2]; p.armR = [1.5, 0.2]; p.face = { mouth: 'grin', eyes: 'happy' }; });
    p.spinX = 0;
  },
  *lookAround(p) { yield* hold(1.8, t => { p.face = { mouth: 'smile', look: [t < 0.9 ? -1 : 1, -0.2] }; p.headTilt = (t < 0.9 ? -1 : 1) * 0.08; }); p.headTilt = 0; },
  *stretch(p) { yield* hold(1.5, (t, dt, k) => { p.armL = [2.75, 0.1]; p.armR = [2.75, 0.1]; p.face = { mouth: 'O', eyes: 'closed' }; p.bob = -Math.sin(k * Math.PI) * 10; }); },
  *swingLegs(p) { yield* hold(2.2, () => { p.kick = 1; p.face = { mouth: 'smile', eyes: 'happy' }; }); },
  *scratch(p) { yield* hold(1.4, t => { p.armR = { to: [p.B.head * 0.55 + Math.sin(t * 20) * 6, p.headL[1] - p.B.head * 0.7] }; p.face = { mouth: 'flat', brows: 'worried', look: [0.5, -0.6] }; }); },
  *yawn(p) {
    SFX.play('yawn', { pitch: p.fam.voice });
    yield* hold(1.9, (t, dt, k) => { p.face = { mouth: 'yawn', eyes: k < 0.5 ? 'half' : 'closed' }; p.armR = { to: [p.B.head * 0.2, p.mouthL[1] + 6] }; p.armL = [2.6, 0.2]; });
  },
  *bump(p) {
    SFX.play('boing', { f: 120 });
    const [x, y] = p.headPos();
    for (let i = 0; i < 4; i++) Parts.add('star', x, y - p.B.head, { size: 16, life: 1.2, orbit: { cx: x, cy: y - p.B.head * 1.1, r: p.B.head * 0.9, a: i * TAU / 4, spin: 5 }, layer: 1 });
    yield* hold(1.2, () => { p.face = { mouth: 'wavy', eyes: 'spiral' }; p.squash = 0.92; });
    SFX.play('giggle', { pitch: p.fam.voice });
    yield* hold(0.7, () => { p.face = { mouth: 'grin', eyes: 'happy' }; });
  },
  *fallAsleep(p) {
    if (World.night > 0.5 && Rnd.f() < 0.5) p.say('night');
    yield* hold(1.6, (t, dt, k) => { p.face = { mouth: 'flat', eyes: k < 0.6 ? 'half' : 'closed' }; });
    p.asleep = true; SFX.play('snore', { dur: 1.2 });
  },
  *wakeUp(p) {
    p.asleep = false;
    SFX.play('yawn', { pitch: p.fam.voice });
    yield* hold(1.5, (t, dt, k) => { p.face = { mouth: 'yawn', eyes: 'half' }; p.armL = [2.75, 0.1]; p.armR = [2.75, 0.1]; });
    if (World.night < 0.5) p.say('morning');
    yield* hold(0.8, () => { p.face = { mouth: 'grin', eyes: 'happy' }; });
  },
  *watchTv(p) {
    const tv = World.fixtures.find(f => f.type === 'tv' && p.room().contains(f.x, f.y - 10));
    yield* hold(3.5, t => {
      if (tv) { const [hx, hy] = p.headPos(); p.face = { mouth: Math.sin(t * 3) > 0.6 ? 'laugh' : 'smile', eyes: Math.sin(t * 3) > 0.6 ? 'happy' : 'open', look: [clamp((tv.x - hx) / 300, -1, 1), clamp((tv.y - tv.h * 0.7 - hy) / 300, -1, 1)] }; }
    });
  },
  *hug(p, toy) {
    p.putInHand(toy, true);
    SFX.play('squish'); p.say('hug');
    yield* hold(1.8, t => {
      p.armR = { to: [6, p.chestL[1] - 4] }; p.armL = { to: [-10, p.chestL[1] + 6] }; p.handTilt = Math.sin(t * 4) * 0.1;
      p.face = { mouth: 'grin', eyes: 'happy', blush: 1 }; p.lean = Math.sin(t * 5) * 0.06;
      if (Rnd.f() < 0.05) { const [x, y] = p.headPos(); Parts.add('heart', x + rand(-40, 40), y - p.B.head, { size: 18, life: 1.2, vy: -60, layer: 1 }); }
    });
    p.handTilt = 0;
  },
  *idle_hug(p) { yield* ACTIONS.hug(p, p.hand); },
  *read(p, book) {
    p.putInHand(book, true);
    p.reading = true;
    yield* hold(4, (t) => {
      p.armR = { to: [16, p.chestL[1] - 6] }; p.armL = { to: [-16, p.chestL[1] - 6] };
      p.face = { mouth: Math.sin(t * 2) > 0.5 ? 'o' : 'smile', look: [0, 0.8] };
      if (((t * 1.25) % 1) < 0.02) SFX.play('page');
    });
    p.reading = false;
  },
  *idle_read(p) { yield* ACTIONS.read(p, p.hand); },
  *call(p, phone) {
    p.putInHand(phone, true);
    SFX.play('ring');
    yield* hold(0.8, () => { p.face = { mouth: 'O', eyes: 'wide', brows: 'up' }; });
    p.say('hello');
    yield* hold(2.6, t => {
      p.armR = { to: [p.B.head * 0.85, p.headL[1] + 10] }; p.face = { mouth: Math.sin(t * 9) > 0 ? 'grin' : 'smile', eyes: 'happy', look: [0.6, 0] };
      if (Rnd.f() < 0.04) SFX.play('babble', { pitch: p.fam.voice, n: 3, mood: 'happy' });
    });
    p.say('bye');
  },
  *play(p, inst) {
    p.putInHand(inst, true);
    const drum = inst.type === 'drum';
    yield* hold(3, t => {
      const beat = Math.floor(t * 4), ph = (t * 4) % 1;
      p.armR = drum ? [1.4 - (ph < 0.3 ? 0.5 : 0), -0.6] : [1.2 + Math.sin(t * 8) * 0.3, -0.8];
      p.armL = [1.0, -1.2]; p.face = { mouth: 'grin', eyes: 'happy' }; p.bob = -Math.abs(Math.sin(t * 12)) * 5;
      if (ph < 0.06 && p._lastBeat !== beat) {
        p._lastBeat = beat;
        if (drum) SFX.play('drum'); else Music.nextNote('twinkle', 'xylophone');
        const [x, y] = p.headPos(); Parts.add('note', x + 50, y - 40, { size: 22, life: 1.2, vx: rand(20, 60), vy: -70, layer: 1 });
      }
    });
  },
  *shake(p, rattle) {
    p.putInHand(rattle, true);
    yield* hold(2, t => { p.armR = [1.8 + Math.sin(t * 24) * 0.5, 0.2]; p.face = { mouth: 'laugh', eyes: 'happy' }; if (Rnd.f() < 0.15) SFX.play('rattle'); });
  },
  *sniff(p, flower) {
    p.putInHand(flower, true);
    SFX.play('sniff');
    yield* hold(1.2, () => { p.armR = { to: [16, p.mouthL[1] - 4] }; p.face = { mouth: 'o', eyes: 'closed' }; });
    if (Rnd.f() < 0.35) yield* ACTIONS.sneeze(p);
    else { SFX.play('mmm', { pitch: p.fam.voice }); yield* hold(1, () => { p.face = { mouth: 'grin', eyes: 'happy' }; }); }
  },
  *sneeze(p) {
    SFX.play('sneezeIn', { k: p.fam.voice });
    yield* hold(0.9, (t, dt, k) => { p.face = { mouth: 'O', eyes: k > 0.5 ? 'squint' : 'half', brows: 'up' }; p.headTilt = -k * 0.2; });
    SFX.play('sneezeOut');
    const [x, y] = p.mouthPos();
    Parts.burst('puff', x, y, 8, { ang: 0, spread: 1.2, v0: 200, v1: 400, sizeR: [12, 22], lifeR: [0.4, 0.8], col: '#ffffff', drag: 3, layer: 1 });
    yield* hold(0.5, () => { p.face = { mouth: 'O', eyes: 'squint' }; p.headTilt = 0.15; p.bob = 6; });
    p.headTilt = 0;
    yield* ACTIONS.giggle(p);
  },
  *dummy(p, d) {
    World.remove(d); d.gone = false; p.actProp = d;
    if (p.age !== 'baby') {
      p.faceDummy = true;
      yield* hold(1.6, () => { p.face = { mouth: 'flat', eyes: 'squint', dummy: true }; });
      SFX.play('giggle', { pitch: p.fam.voice });
      p.faceDummy = false; p.actProp = null;
      p.putInHand(d, true); p.dropHand();
      return;
    }
    SFX.play('suck', { dur: 0.6 });
    p.babyDummy = 12;
    yield* hold(3, () => { p.face = { mouth: 'flat', eyes: 'happy', dummy: true }; });
    yield* hold(9, () => { p.face = { mouth: 'flat', eyes: p.seat && p.seat.pose === 'lie' ? 'closed' : 'open', dummy: true }; });
    p.actProp = null; World.add(d); const [x, y] = p.mouthPos(); d.x = x; d.y = y + 20; d.startFall(rand(-100, 100), -200, false); d.floorTarget = p.room().bandY(p.seat ? p.hip()[1] + 100 : p.y);
  },
  *putOn(p, item) {
    // lift it over the head, then on it goes
    p.putInHand(item, true);
    yield* hold(0.5, () => { p.armR = { to: [0, p.headL[1] - p.B.head * 1.3] }; p.armL = { to: [-p.B.head * 0.5, p.headL[1] - p.B.head * 1.1] }; p.face = { mouth: 'O', eyes: 'wide', look: [0, -1] }; });
    p.hand = null;
    p.wearThing(item);
    SFX.play('sparkle'); const [x, y] = p.headPos();
    Parts.burst('sparkle', x, y - p.B.head * 0.8, 10, { v0: 80, v1: 220, life: 0.8, sizeR: [8, 14], layer: 1 });
    p.say(Rnd.f() < 0.5 ? 'yay' : 'thanks');
    yield* hold(1.1, t => { p.armL = [2.5, 0.3]; p.armR = [2.5, 0.3]; p.face = { mouth: 'grin', eyes: 'happy' }; p.spinX = t < 0.6 ? Math.cos(t / 0.6 * TAU) : 0; });
    p.spinX = 0;
  },
  *brush(p, brush) {
    p.putInHand(brush, true);
    SFX.play('brushing');
    yield* hold(2.6, t => {
      p.armR = { to: [Math.sin(t * 18) * 14 + 10, p.mouthL[1] + 2] }; p.handTilt = 1.4;
      p.face = { mouth: 'grin', eyes: 'squint' };
      if (Rnd.f() < 0.4) { const [x, y] = p.mouthPos(); Parts.add('bubble', x + rand(-20, 20), y + rand(-4, 10), { size: rand(6, 12), life: 0.9, vy: rand(-30, 10), vx: rand(-30, 30), layer: 1 }); }
    });
    p.handTilt = 0;
    SFX.play('ting'); const [x, y] = p.mouthPos();
    Parts.add('sparkle', x, y, { size: 24, life: 0.8, layer: 1 });
    yield* hold(1, () => { p.face = { mouth: 'grin', eyes: 'happy' }; });
  },
  *brushHair(p, brush) {
    p.putInHand(brush, true);
    SFX.play('brushing');
    yield* hold(1.8, t => { p.armR = { to: [Math.sin(t * 9) * 30, p.headL[1] - p.B.head * 0.95] }; p.face = { mouth: 'smile', eyes: 'closed' }; });
    newHair(p, false);
    yield* hold(1.2, () => { p.face = { mouth: 'grin', eyes: 'happy' }; p.armL = [2.4, 0.3]; });
  },
  *wash(p, soap) {
    p.putInHand(soap, true);
    SFX.play('scrub');
    yield* hold(2.4, t => {
      p.armR = { to: [Math.sin(t * 10) * 40, p.chestL[1] + Math.cos(t * 7) * 30] }; p.face = { mouth: 'grin', eyes: 'squint' };
      if (Rnd.f() < 0.5) { const [hx, hy] = p.hip(); Parts.add('bubble', hx + rand(-60, 60), hy - rand(0, p.headTop), { size: rand(8, 18), life: 1.1, vy: -30, layer: 1 }); }
    });
    p.dirt = 0; p.cleanT = 1.5;
    yield* ACTIONS.sparkleClean(p);
  },

/* ---------- handing things over ---------- */
function giveTo(p, prop) {
  if (p.held || p.asleep) { if (p.asleep) p.doAct('wakeUp'); return false; }
  const d = prop.def, u = d.use;
  if (p.act && (p.actName === 'eat' || p.actName === 'drink')) return false;
  switch (u) {
    case 'eat': p.doAct('eat', prop); return true;
    case 'drink': p.doAct('drink', prop); return true;
    case 'wear': p.doAct('putOn', prop); return true;
    case 'hug': p.doAct('hug', prop); return true;
    case 'read': p.doAct('read', prop); return true;
    case 'brush': p.doAct('brush', prop); return true;
    case 'hair': p.doAct('brushHair', prop); return true;
    case 'wash': p.doAct('wash', prop); return true;
    case 'dry': p.doAct('dry', prop); return true;
    case 'call': p.doAct('call', prop); return true;
    case 'play': p.doAct('play', prop); return true;
    case 'shake': p.doAct('shake', prop); return true;
    case 'sniff': p.doAct('sniff', prop); return true;
    case 'dummy': p.doAct('dummy', prop); return true;
    default:
      if (d.critter) {
        p.putInHand(prop, true);
        if (p.who === 'nana' || p.who === 'mum' || p.who === 'lily') { p.doAct('yuck', prop); later(() => { if (p.hand === prop) p.dropHand(true); }, 1600); }
        else { p.say('hello'); p.doAct('giggle'); }
        return true;
      }
      p.putInHand(prop, true); p.doAct('giggle');
      return true;
  }
}

/* ---------- src/interact.js ---------- */
/* interact.js — what happens when something is let go over something else: a person over a seat
   sits in it, food over a person gets eaten, toast goes in the toaster, a teddy over the open toy
   box goes inside. Fixtures and people get the first say; otherwise things just fall. */

const Interact = {
  // a prop let go: does a machine, a box, a person or a pet want it?
  drop(t) {
    if (t.kind !== 'prop') return false;
    const [cx, cy] = t.centre();
    // fixtures first, nearest first (a toaster on a worktop beats the worktop)
    const fs = World.fixtures.filter(f => f.accept && f.near(cx, cy, 110)).sort((a, b) => dist(cx, cy, a.x, a.y - a.h / 2) - dist(cx, cy, b.x, b.y - b.h / 2));
    for (const f of fs) if (f.accept(t, cx, cy)) return true;
    // then a person or a pet the thing is over
    const who = this.personAt(cx, cy, t);
    if (who && who.give(t)) return true;
    return false;
  },
  personAt(x, y, except) {
    let best = null, bd = 1e9;
    for (const p of World.things) {
      if ((p.kind !== 'person' && p.kind !== 'pet') || p === except || p.held || p.gone || p.hidden()) continue;
      const b = p.box(), pad = 30;
      if (x < b.x0 - pad || x > b.x1 + pad || y < b.y0 - pad || y > b.y1 + pad) continue;
      const [hx, hy] = p.headPos(), d = dist(x, y, hx, hy);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  },
  // the free seat a person (or pet) let go at hip (x, y) drops into
  seatFor(t, x, y) {
    let best = null, bd = 1e9;
    const consider = s => {
      if (!s.free(t) || !s.captures(x, y)) return;
      const [sx, sy] = s.pos(s.who.length), d = dist(x, y, sx, sy) - (s.pri || 0);
      if (d < bd) { bd = d; best = s; }
    };
    for (const f of World.fixtures) for (const s of f.seats) consider(s);
    for (const p of World.things) if (p.kind === 'prop' && p.seats.length && !p.held && !p.hidden()) for (const s of p.seats) consider(s);
    return best;
  },
  // a person let go somewhere special that is not a seat: onto someone else (a cuddle), into mud
  dropPerson(p) {
    const [cx, cy] = p.centre();
    for (const f of World.fixtures) if (f.acceptPerson && f.near(cx, cy, 20) && f.acceptPerson(p, cx, cy)) return true;
    const other = this.personAt(cx, cy - 20, p);
    if (other && other.kind === 'person' && other.state === 'rest' && !other.seat && !other.on && !other.carrier && !other.busy()) {
      // land next to them and have a cuddle
      p.x = other.x + (cx < other.x ? -1 : 1) * other.B.tw * 0.9; p.startFall(0, 0, true); p.floorTarget = other.y;
      later(() => { if (!p.held && !p.gone) p.doAct('hugPerson', other); if (!other.held) other.doAct('hugPerson', p); }, 250);
      return true;
    }
    return false;
  },
};

/* ---------- src/fixtures.js ---------- */
/* fixtures.js — the furniture: a painted picture standing in a room (or hanging on its wall), with
   places on it things can be put (surfaces), places people sit or lie (seats), bits a finger can
   tap (hot spots), doors that swing open on a hinge to show what is inside, and lights.
   Each kind of furniture is a class in fx_*.js; FIXTURE_TYPES maps a type name to its class. */

const FIXTURE_TYPES = {};

class Fixture {
  // o: { room, x (from the room's left edge), y (its base, from the room's top; default the room's furniture line),
  //      h, flip, wall (hangs on the wall), z, id }
  constructor(o) {
    this.room = World.room(o.room);
    this.type = o.type; this.id = o.id || (o.room + ':' + o.type + (o.n ? o.n : ''));
    this.pic = o.pic || this.constructor.pic || this.type;
    this.h = o.h || Art.h(this.pic) * (o.scale || 1);
    this.w = Art.w(this.pic, this.h);
    this.flip = !!o.flip; this.wall = !!o.wall;
    this.x = this.room.x + (o.x === undefined ? this.room.w / 2 : o.x);
    this.y = o.y === undefined ? this.room.baseY : this.room.y + o.y;
    this.z = o.z !== undefined ? this.room.y + o.z : this.wall ? this.room.y + 60 + (o.zw || 0) : this.y - (o.back || 0);
    this.surfaces = []; this.seats = []; this.doors = []; this.lights = []; this.hots = [];
    this.o = o; this.t = 0; this.wob = 0; this.wobV = 0;
    this.setup(o);
  }
  setup() {}
  get x0() { return this.x - this.w / 2; }
  get x1() { return this.x + this.w / 2; }
  get y0() { return this.y - this.h; }
  get y1() { return this.y; }
  zOrder() { return this.z; }
  // a point on the picture (fractions of its width and height) in the world
  at(u, v) { const uu = this.flip ? 1 - u : u; return [this.x - this.w / 2 + uu * this.w, this.y - this.h + v * this.h]; }
  box(u0, v0, u1, v1) {
    const a = this.at(u0, v0), b = this.at(u1, v1);
    return { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(b[0] - a[0]), h: Math.abs(b[1] - a[1]) };
  }
  addSurface(u0, u1, v, o) {
    const a = this.at(u0, v), b = this.at(u1, v);
    const s = surface(Object.assign({ x0: Math.min(a[0], b[0]), x1: Math.max(a[0], b[0]), y: a[1], z: this.z, owner: this }, o || {}));
    if (s.inside && !s.accepts) s.accepts = t => t.kind === 'prop';
    this.surfaces.push(s); World.addSurface(s);
    return s;
  }
  addSeat(o) { const s = new Seat(this, o); this.seats.push(s); return s; }
  hot(name, u0, v0, u1, v1, pri) { this.hots.push({ name, r: [u0, v0, u1, v1], pri: pri || 1 }); }
  near(x, y, pad) { return x >= this.x0 - pad && x <= this.x1 + pad && y >= this.y0 - pad && y <= this.y1 + pad; }
  inBox(x, y, r) { const b = this.box(r[0], r[1], r[2], r[3]); return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
  // what part of the furniture a finger is on
  hit(x, y) {
    if (!this.near(x, y, 10)) return null;
    let best = null;
    for (const h of this.hots) if (this.inBox(x, y, h.r) && (!best || h.pri > best.pri)) best = h;
    if (best) return best;
    if (this.solid && !this.solid(x, y)) return null;

/* ---------- a door on a hinge ---------- */
// rect: [u0, v0, u1, v1] of the picture; hinge: 'L' | 'R' (side), 'B' (drops down), 'T' (a lid that lifts)
class Door {
  constructor(f, rect, hinge, o = {}) {
    this.f = f; this.r = rect; this.hinge = f.flip && (hinge === 'L' || hinge === 'R') ? (hinge === 'L' ? 'R' : 'L') : hinge;
    this.open = 0; this.v = 0; this.to = 0; this.o = o;
    this.inner = o.inner || null; this.back = o.back || '#e8e0d0'; this.circle = !!o.circle;
    f.doors.push(this);
  }
  shut() { return this.open < 0.3; }

  set(open, quiet) {
    if ((this.to > 0.5) === open) return;

    World.dirty = true;
    if (this.o.onChange) this.o.onChange(open);
  }
  toggle() { this.set(this.to < 0.5); }
  update(dt) {
    // a springy swing that settles

    this.open = clamp(this.open + this.v * dt, -0.05, 1.08);
  }
  rectW() { const f = this.f, r = this.r; return f.box(r[0], r[1], r[2], r[3]); }
  drawCavity(ctx) {
    if (this.open <= 0.02) return;
    const b = this.rectW();
    ctx.save();
    ctx.beginPath();
    if (this.circle) ctx.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) / 2, 0, TAU); else rrect(ctx, b.x, b.y, b.w, b.h, Math.min(b.w, b.h) * 0.06);
    ctx.clip();
    if (this.inner) this.inner(ctx, b, this);
    else { ctx.fillStyle = '#5a3a2a'; ctx.fillRect(b.x, b.y, b.w, b.h); }
    ctx.restore();
    ctx.beginPath();
    if (this.circle) ctx.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) / 2, 0, TAU); else rrect(ctx, b.x, b.y, b.w, b.h, Math.min(b.w, b.h) * 0.06);
    ctx.lineWidth = 6; ctx.strokeStyle = PLINE; ctx.stroke();
  }
  drawPanel(ctx) {
    if (this.open <= 0.02) return;

    const a = clamp(this.open, 0, 1.08) * 0.64 * Math.PI, k = Math.cos(a);
    ctx.save();
    const side = this.hinge === 'L' || this.hinge === 'R';
    // squashed toward the hinge; past a right angle the scale goes negative and the inside shows beyond it
    if (side) {
      const hx = this.hinge === 'L' ? b.x : b.x + b.w;
      ctx.translate(hx, 0); ctx.scale(k, 1); ctx.translate(-hx, 0);
      if (k > 0.02) this.drawFace(ctx, b, f, r, 1, k);
      else if (k < -0.02) this.drawBack(ctx, b, 1);
    } else {
      const hy = this.hinge === 'B' ? b.y + b.h : b.y;
      ctx.translate(0, hy); ctx.scale(1, k); ctx.translate(0, -hy);
      if (k > 0.02) this.drawFace(ctx, b, f, r, 1, k);

  }
  drawFace(ctx, b, f, r, dir, k) {
    if (this.circle) { ctx.save(); ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) / 2 + 2, 0, TAU); ctx.clip(); }
    f.drawPart(ctx, r[0], r[1], r[2], r[3]);
    if (this.circle) ctx.restore();

    if (this.circle) { ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) / 2, 0, TAU); ctx.fill(); }
    else ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  drawBack(ctx, b, dir) {
    // the inside of the door
    ctx.beginPath();
    if (this.circle) ctx.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) / 2, 0, TAU); else rrect(ctx, b.x, b.y, b.w, b.h, Math.min(b.w, b.h) * 0.06);
    const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
    g.addColorStop(0, lighten(this.back, 0.15)); g.addColorStop(1, darken(this.back, 0.12));
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = PLINE; ctx.stroke();
    if (this.o.backDetail) this.o.backDetail(ctx, b);
    else if (!this.circle) { ctx.beginPath(); rrect(ctx, b.x + b.w * 0.12, b.y + b.h * 0.08, b.w * 0.76, b.h * 0.84, 8); ctx.lineWidth = 3; ctx.strokeStyle = rgba(PLINE, 0.35); ctx.stroke(); }
  }
}

/* ---------- inside looks for cupboards and machines ---------- */
function cavityWood(ctx, b, shelves) {
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, '#6a4026'); g.addColorStop(1, '#8a5a36');
  ctx.fillStyle = g; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(b.x, b.y, b.w, b.h * 0.08);
  for (const v of shelves || []) {
    const y = b.y + b.h * v;
    ctx.fillStyle = '#c8935a'; ctx.fillRect(b.x, y - 8, b.w, 12);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(b.x, y + 4, b.w, 6);
  }
}
function cavityFridge(ctx, b, shelves, lit) {
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, lit ? '#f4fbff' : '#c8d8e0'); g.addColorStop(1, lit ? '#d8ecf6' : '#a8b8c0');
  ctx.fillStyle = g; ctx.fillRect(b.x, b.y, b.w, b.h);
  if (lit) { const r = ctx.createRadialGradient(b.x + b.w / 2, b.y + 10, 10, b.x + b.w / 2, b.y + 10, b.h * 0.7); r.addColorStop(0, 'rgba(255,255,230,0.8)'); r.addColorStop(1, 'rgba(255,255,230,0)'); ctx.fillStyle = r; ctx.fillRect(b.x, b.y, b.w, b.h); }
  for (const v of shelves) {
    const y = b.y + b.h * v;
    ctx.fillStyle = 'rgba(200,235,255,0.85)'; ctx.fillRect(b.x, y - 6, b.w, 8);
    ctx.fillStyle = 'rgba(90,140,170,0.6)'; ctx.fillRect(b.x, y + 2, b.w, 3);
  }
}
function cavityDark(ctx, b, glow) {
  ctx.fillStyle = '#2a2230'; ctx.fillRect(b.x, b.y, b.w, b.h);
  if (glow > 0) {
    const r = ctx.createRadialGradient(b.x + b.w / 2, b.y + b.h * 0.6, 4, b.x + b.w / 2, b.y + b.h * 0.6, b.w * 0.7);
    r.addColorStop(0, rgba('#ffb040', 0.85 * glow)); r.addColorStop(1, rgba('#ff7020', 0.15 * glow));
    ctx.fillStyle = r; ctx.fillRect(b.x, b.y, b.w, b.h);

}

/* ---------- water from a tap ---------- */
function drawStream(ctx, x, y0, y1, t, w = 10) {
  const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
  g.addColorStop(0, 'rgba(120,200,255,0.5)'); g.addColorStop(0.5, 'rgba(230,248,255,0.95)'); g.addColorStop(1, 'rgba(120,200,255,0.5)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.6, y0);
  for (let y = y0; y <= y1; y += 12) ctx.lineTo(x - w * 0.6 - Math.sin(y * 0.08 + t * 25) * 1.6, y);
  for (let y = y1; y >= y0; y -= 12) ctx.lineTo(x + w * 0.6 + Math.sin(y * 0.08 + t * 25) * 1.6, y);
  ctx.closePath(); ctx.fill();
}
function splashAt(x, y, n) { for (let i = 0; i < n; i++) Parts.add('drop', x + rand(-12, 12), y, { size: rand(3, 6), vx: rand(-120, 120), vy: rand(-220, -80), g: 1200, life: 0.5, col: '#9ad8ff', floor: y + 4, layer: 1 }); }

// make a fixture from a room plan line
function makeFixture(o) {
  const C = FIXTURE_TYPES[o.type] || Fixture;
  const f = new C(o);
  World.addFixture(f);
  return f;
}

/* fx_common.js — furniture found all over the house: windows (with their own bit of sky, and

/* ---------- a window: sky behind, a frame, a sill, curtains ---------- */
class Window extends Fixture {
  setup(o) {
    this.pic = 'window'; this.curt = o.curtains === false ? null : { c: 0, to: 0, col: o.curtainCol || '#ff9aa8' };
    this.hot('glass', 0.17, 0.1, 0.83, 0.75, 2);
    this.addSurface(0.06, 0.94, 0.85);           // things can sit on the sill
    this.seed = Math.floor(rand(1, 999));

  }
  hit(x, y) {
    if (this.curt) for (const r of this.curtRects()) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return { name: 'curtain', pri: 3 };
    return super.hit(x, y);
  }
  curtRects() {
    const c = Ease.inOut(clamp(this.curt.c, 0, 1)), b = this.box(0, 0, 1, 1);
    const top = b.y - b.h * 0.1, h = b.h * 1.18, open = b.w * 0.2, shut = b.w * 0.56;
    const w = lerp(open, shut, c);
    return [{ x: b.x - b.w * 0.08, y: top, w, h }, { x: b.x + b.w * 1.08 - w, y: top, w, h }];
  }
  tap(part) {
    if (part === 'curtain') { this.curt.to = this.curt.to > 0.5 ? 0 : 1; SFX.play('curtain'); World.dirty = true; return; }
    if (part === 'glass') { World.setNight(World.nightTo < 0.5); return; }
    super.tap();
  }
  update(dt) {
    super.update(dt);
    if (this.curt) {
      const c = this.curt; c.c += clamp(c.to - c.c, -dt * 2.5, dt * 2.5);
      // the room's darkness counts how drawn its curtains are
      const ws = World.fixtures.filter(f => f instanceof Window && f.room === this.room && f.curt);
      this.room.curtains = ws.reduce((a, w) => a + w.curt.c, 0) / Math.max(1, ws.length);
    }

  draw(ctx) {

    ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
    drawSkyPatch(ctx, b, this.seed, !this.upstairs);

  }
  drawOver(ctx) {
    if (!this.curt) return;
    const b = this.box(0, 0, 1, 1);
    // the rail

    ctx.beginPath(); ctx.moveTo(b.x - b.w * 0.12, b.y - b.h * 0.08); ctx.lineTo(b.x + b.w * 1.12, b.y - b.h * 0.08); ctx.stroke();
    ctx.lineWidth = 9; ctx.strokeStyle = '#d8a040'; ctx.stroke();
    [-0.12, 1.12].forEach(u => { ctx.beginPath(); ctx.arc(b.x + b.w * u, b.y - b.h * 0.08, 14, 0, TAU); ctx.fillStyle = '#e8b048'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = PLINE; ctx.stroke(); });
    const cv = Art.copy('curtain', 360, this.curt.col);

    const sy = cv.height * 0.08;

      ctx.save();

// the view out of a window: sky, sun or moon, a cloud, hills from downstairs
function drawSkyPatch(ctx, b, seed, low) {
  const n = World.night, sc = skyCols(n);
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  g.addColorStop(0, sc[0]); g.addColorStop(1, sc[2]);
  ctx.fillStyle = g; ctx.fillRect(b.x, b.y, b.w, b.h);
  const f = seeded(seed);
  if (n > 0.1) {
    ctx.fillStyle = rgba('#fff8d8', n);
    for (let i = 0; i < 10; i++) { ctx.beginPath(); starPath(ctx, b.x + f() * b.w, b.y + f() * b.h * 0.7, 7, 3, 4); ctx.fill(); }
    if (seed % 2) { ctx.globalAlpha = n; ctx.beginPath(); ctx.arc(b.x + b.w * 0.7, b.y + b.h * 0.28, b.w * 0.1, 0, TAU); ctx.arc(b.x + b.w * 0.75, b.y + b.h * 0.24, b.w * 0.085, 0, TAU, true); ctx.fillStyle = '#fff4c8'; ctx.fill('evenodd'); ctx.globalAlpha = 1; }
  }
  if (n < 0.9) {
    ctx.globalAlpha = 1 - n;
    const cx = b.x + ((World.t * 8 + f() * b.w) % (b.w * 1.4)) - b.w * 0.2;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); cloudPath(ctx, cx, b.y + b.h * 0.3, b.w * 0.14, 6, seed); ctx.fill();
    if (seed % 3 === 0) { ctx.beginPath(); ctx.arc(b.x + b.w * 0.25, b.y + b.h * 0.22, b.w * 0.08, 0, TAU); ctx.fillStyle = '#ffd84a'; ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  if (low) {
    ctx.fillStyle = mix('#7ac85a', '#1e3350', n * 0.85);
    ctx.beginPath(); ctx.moveTo(b.x, b.y + b.h);
    for (let x = 0; x <= 1.001; x += 0.1) ctx.lineTo(b.x + x * b.w, b.y + b.h * (0.72 - Math.sin(x * 5 + seed) * 0.07));
    ctx.lineTo(b.x + b.w, b.y + b.h); ctx.closePath(); ctx.fill();
  }
}

/* ---------- lights ---------- */
class CeilingLamp extends Fixture {

  }

    // the cord up to the ceiling, swinging after a tap

    ctx.save(); ctx.translate(px, py); ctx.rotate(this.wob * 0.05); ctx.translate(-px, -py);
    const [bx, by] = this.at(0.5, 0.86);
    const g = ctx.createRadialGradient(bx, by, 4, bx, by, this.w * 0.45);

// a lamp that clicks on and off: the floor lamp, table lamps, the wall lamp, the moon night light, the garden lamp post
class Lamp extends Fixture {

    this.glow = L;

// [u, v of the glow, light radius, colour]
const LAMP_GLOW = { floorlamp: [0.5, 0.25, 700], tablelamp: [0.5, 0.3, 520], walllamp: [0.62, 0.3, 560], nightlight: [0.45, 0.4, 420, '#ffe890'], lamppost: [0.5, 0.22, 800] };

/* ---------- restocking: the fridge and the food cupboard fill up again when opened ---------- */
function restock(shelves, stock, want) {
  const on = World.things.filter(t => shelves.indexOf(t.on) >= 0);
  if (on.length >= want || World.crowded() || World.foodCount() > 45) return;
  const have = new Set(on.map(t => t.type));
  const pool = shuffle(stock.filter(id => !have.has(id) && PROPS[id]));
  let added = 0;
  for (const s of shelves) {
    // the free gaps along this shelf
    const here = on.filter(t => t.on === s).map(t => [t.x - t.w / 2, t.x + t.w / 2]);
    let x = s.x0 + 10;
    while (pool.length && on.length + added < want) {
      const id = pool[0], d = PROPS[id], w = d.h * Art.aspect(d.pic);
      if (x + w > s.x1 - 6) break;
      if (here.some(([a, b]) => x < b + 4 && x + w > a - 4)) { x += 24; continue; }
      pool.shift();
      const p = spawnProp(id, x + w / 2, s.y);
      p.state = 'rest'; p.on = s; p.y = s.y;
      if (id === 'block') p.tint = pick(BLOCK_TINTS);
      x += w + 12; added++;
    }
  }
}

class Bin extends Fixture {
  setup() { this.swallow = []; this.slotZ = 0.5; this.lid = new Door(this, [0.0, 0.0, 1.0, 0.17], 'T', { inner: (ctx, b) => { ctx.fillStyle = '#2a2a30'; ctx.fillRect(b.x, b.y, b.w, b.h); }, back: '#b8bcc4', sndOpen: 'binopen', sndShut: 'binshut' }); }

    for (const f of this.fish) {
      f.dart = Math.max(0, f.dart - dt);
      const food = this.flakes.length ? this.flakes.reduce((a, b) => Math.abs(b.x - f.x) + Math.abs(b.y - f.y) < Math.abs(a.x - f.x) + Math.abs(a.y - f.y) ? b : a) : null;

// a little cartoon fish (also used in the pond and on the telly's sea)
function drawTankFish(ctx, x, y, s, col, left, t, gulp) {

  ctx.restore();

  ctx.beginPath(); ctx.ellipse(-s * 0.1, -s * 0.25, s * 0.4, s * 0.15, -0.2, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.45, -s * 0.12, s * 0.17, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = s * 0.06; ctx.stroke();
  ctx.beginPath(); ctx.arc(s * 0.5, -s * 0.12, s * 0.09, 0, TAU); ctx.fillStyle = PLINE; ctx.fill();
  if (gulp) { ctx.beginPath(); ctx.arc(s * 0.85, s * 0.12, s * 0.12, 0, TAU); ctx.fillStyle = '#7a2a3a'; ctx.fill(); }
  ctx.restore();
}
function feedFish(p) {
  const tank = World.fixtures.find(f => f instanceof FishTank && f.room === p.room()) || World.fixtures.find(f => f instanceof FishTank);
  hop(p, 0.4);
  if (tank) tank.feed(); else SFX.play('sprinkle');
}

/* ---------- the toy box: open it and out jump the toys; drop them back in ---------- */
class ToyBox extends Fixture {
  setup() {
    this.lid = new Door(this, [0.0, 0.0, 1.0, 0.3], 'T', { inner: (ctx, b) => { ctx.fillStyle = '#5a2418'; ctx.fillRect(b.x, b.y, b.w, b.h); }, back: '#c83a2a', sndOpen: 'chestopen', sndShut: 'chestshut', onChange: open => { if (open) this.spill(); } });
    this.inside = this.addSurface(0.08, 0.92, 0.7, { inside: { shut: () => true } });
  }
  tap() { this.lid.toggle(); }
  spill() {
    const toys = World.things.filter(t => t.on === this.inside);
    toys.slice(0, 6).forEach((t, i) => {
      later(() => {
        if (t.on !== this.inside) return;
        t.x = this.x + rand(-0.3, 0.3) * this.w; t.y = this.y - this.h * 0.6;
        t.startFall(rand(-1, 1) * 380, -rand(900, 1250), false);
        t.floorTarget = this.room.bandY(this.y + rand(30, 140));
        SFX.play('boing', { f: 250 + i * 40 });
      }, 120 + i * 170);
    });
  }
  accept(t, x, y) {
    if (t.kind !== 'prop' || t.h > 160 || (t.seats.length && t.seats.some(s => s.who.length)) || !this.lid.isOpen() || y > this.y - this.h * 0.3) return false;
    t.state = 'rest'; t.on = this.inside; t.carrier = null; t.vx = t.vy = 0; t.x = clamp(x, this.inside.x0 + 20, this.inside.x1 - 20); t.y = this.inside.y;
    SFX.play('clonk'); Parts.add('puff', this.x, this.y - this.h * 0.8, { size: 26, life: 0.4, col: '#ffffff' });
    return true;
  }
}

/* ---------- the piano: whatever key, the next note of the tune ---------- */
class Piano extends Fixture {
  setup() { this.hot('keys', 0.06, 0.38, 0.94, 0.56, 3); this.addSurface(0.03, 0.97, 0.03); this.keyT = 0; this.keyX = 0; this.tune = 'twinkle'; this.notes = 0; }
  tap(part, x) {
    if (part !== 'keys') { this.wiggle(); SFX.play('knock'); return; }
    // a new tune every so often
    if (this.notes++ > 42) { this.notes = 0; this.tune = pick(['twinkle', 'lamb', 'rowboat', 'bridge', 'jacques', 'hickory']); }
    Music.nextNote(this.tune, 'piano');
    this.keyT = 0.18; this.keyX = x;
    Parts.add('note', x, this.at(0.5, 0.36)[1], { size: 26, life: 1.4, vx: rand(-40, 40), vy: -90, layer: 1, col: pick(['#ff4a6a', '#4aa0f0', '#5ac85a', '#ffb02a', '#b07ae8']) });
    const sitter = World.things.find(t => t.kind === 'person' && t.seat && t.seat.owner.type === 'stool' && Math.abs(t.x - this.x) < this.w * 0.6);
    if (sitter && !sitter.busy()) sitter.doAct('giggle');
  }
  update(dt) { super.update(dt); this.keyT = Math.max(0, this.keyT - dt); }
  drawOver(ctx) {
    if (this.keyT <= 0) return;
    const b = this.box(0.08, 0.42, 0.93, 0.54), kw = b.w / 22;
    const i = Math.floor((this.keyX - b.x) / kw);
    ctx.fillStyle = 'rgba(255,220,80,0.65)'; ctx.fillRect(b.x + i * kw, b.y, kw, b.h);
  }
}

/* ---------- the cuckoo clock ---------- */
class Cuckoo extends Fixture {
  setup() { this.out = 0; this.outT = 0; this.calls = 0; this.hot('clock', 0, 0, 1, 1, 2); }
  tap() { if (this.outT > 0) return; this.outT = 2.2; this.calls = 0; SFX.play('click'); }
  update(dt) {
    super.update(dt);
    if (this.outT > 0) {
      this.outT -= dt;
      this.out = lerp(this.out, this.outT > 0.4 ? 1 : 0, Math.min(1, dt * 12));
      const want = this.outT < 1.6 ? (this.outT < 0.9 ? 2 : 1) : 0;
      if (this.calls < want) { this.calls++; SFX.play('cuckoo'); this.wiggle(0.5); }
    } else this.out = lerp(this.out, 0, Math.min(1, dt * 12));
  }
  drawOver(ctx) {
    if (this.out < 0.02) return;
    const [x, y] = this.at(0.5, 0.21), k = this.out, s = this.w * 0.17;
    ctx.fillStyle = '#3a2418'; ctx.beginPath(); ctx.ellipse(x, y, s * 0.9, s, 0, 0, TAU); ctx.fill();
    // the little bird pops forward on its stick
    ctx.save(); ctx.translate(x, y + s * 0.1); ctx.scale(0.4 + k * 0.6, 0.4 + k * 0.6);
    ctx.lineWidth = 4; ctx.strokeStyle = PLINE;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 1.1, s * 0.8, 0, 0, TAU); ctx.fillStyle = '#5ab0e8'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.9, -s * 0.1); ctx.lineTo(s * 1.7, s * 0.05 + (this.calls % 2) * s * 0.2); ctx.lineTo(s * 0.9, s * 0.25); ctx.closePath(); ctx.fillStyle = '#ffb02a'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.4, -s * 0.25, s * 0.18, 0, TAU); ctx.fillStyle = PLINE; ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s * 0.2, s * 0.15, s * 0.5, s * 0.3, -0.3, 0, TAU); ctx.fillStyle = '#3a80c8'; ctx.fill();
    ctx.restore();
  }
}

  }

    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = this.ring > 0 ? '#ffe070' : '#ffb02a'; ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
    if (this.ring > 0) { ctx.lineWidth = 4; ctx.strokeStyle = rgba('#ffb02a', this.ring * 2); [1, 2].forEach(i => { ctx.beginPath(); ctx.arc(x, y, 24 + i * 14 * (1 - this.ring), -0.8, 0.8); ctx.stroke(); }); }

/* ---------- src/fx_bath.js ---------- */
/* fx_bath.js — the bathroom: a bath that fills (people sit in it, ducks and boats float, bubble
   bath makes foam), a shower, a toilet whose lid lifts and that flushes away whatever goes in
   (toys turn up again in the toy box), the basin, the towel rail and the laundry basket. */

class Bathtub extends Fixture {
  setup() {
    this.level = 0; this.fill = 0; this.bubbles = 0;
    for (let i = 0; i < 2; i++) this.addSeat({ u: 0.36 + i * 0.3, v: 0.42, pose: 'bath', cap: [0.02, -0.6, 0.98, 0.85], kinds: ['person', 'pet'] });
    this.float = this.addSurface(0.1, 0.9, 0.14, { accepts: t => this.level > 0.55 && (t.def && t.def.floats), water: true });
    this.bottom = this.addSurface(0.1, 0.9, 0.62, { accepts: t => !(this.level > 0.55 && t.def && t.def.floats) });
    this.rim = this.addSurface(0.06, 0.94, 0.04, { accepts: t => t.kind === 'prop' && t.h < 110 });
    this.hot('tub', 0.02, 0.0, 0.98, 0.85, 1);
  }
  waterY() { return this.at(0, lerp(0.6, 0.13, this.level))[1]; }
  tap() {
    if (this.fill) { this.fill = 0; Sound.loop(this, 'fill', null); SFX.play('tapturn'); return; }
    if (this.level < 0.6) { this.fill = 1; SFX.play('tapturn'); Sound.loop(this, 'fill', 'bathfill'); }
    else { this.fill = -1; SFX.play('gurgle'); Sound.loop(this, 'fill', 'drain'); }
    World.dirty = true;
  }
  addBubbles(k) { this.bubbles = Math.min(1, this.bubbles + k); if (this.level < 0.3) { this.fill = 1; Sound.loop(this, 'fill', 'bathfill'); } }
  onSit(p) {
    const [x, y] = this.at(0.5, 0.12);
    if (this.level > 0.3) for (let i = 0; i < 12; i++) Parts.add('drop', p.x + rand(-60, 60), y, { size: rand(4, 8), vx: rand(-260, 260), vy: rand(-520, -200), g: 1500, life: 0.9, col: '#9ad8ff', floor: this.y - 10, layer: 1 });
  }
  seatDyFor(p) { return p.kind === 'person' ? ({ adult: 0, elder: 0, child: -24, toddler: -42, baby: -50 }[p.age] || 0) : 0; }
  update(dt) {
    super.update(dt);
    if (this.fill > 0) { this.level = Math.min(1, this.level + dt * 0.18); if (this.level >= 1) { this.fill = 0; Sound.loop(this, 'fill', null); } if (Rnd.f() < dt * 10) splashAt(this.at(0.2, 0)[0], this.waterY(), 1); }
    if (this.fill < 0) { this.level = Math.max(0, this.level - dt * 0.22); this.bubbles = Math.max(0, this.bubbles - dt * 0.25); if (this.level <= 0) { this.fill = 0; Sound.loop(this, 'fill', null); SFX.play('gurgle'); } }
    this.float.y = this.waterY();
    for (const t of World.things) {
      if (t.state !== 'rest' || !(t.def && t.def.floats)) continue;
      if (t.on === this.bottom && this.level > 0.55) { t.on = this.float; t.y = this.float.y; }
      else if (t.on === this.float && this.level <= 0.55) { t.on = this.bottom; t.y = this.bottom.y; }
    }
    // floating toys bob
    for (const t of World.things) if (t.on === this.float && t.state === 'rest') { t.y = this.float.y + Math.sin(this.t * 2.5 + t.x * 0.05) * 3; t.rot = Math.sin(this.t * 2 + t.x) * 0.1; }
    for (const s of this.seats) for (const p of s.who) {
      if (p.kind !== 'person') { p.wet = 1; continue; }
      if (this.level > 0.3) { p.wet = 1; if (p.dirt > 0) { p.dirt = Math.max(0, p.dirt - dt * 0.15); if (p.dirt === 0) p.doAct('sparkleClean'); } }
      if (this.level > 0.4 && Rnd.f() < dt * 2) Parts.add('drop', p.x + rand(-50, 50), this.waterY(), { size: rand(3, 6), vx: rand(-150, 150), vy: rand(-380, -160), g: 1500, life: 0.7, col: '#9ad8ff', floor: this.y - 10, layer: 1 });
    }
  }
  posePerson(p) {
    if (this.level < 0.3) { p.face = { mouth: 'o', eyes: 'open', brows: 'worried' }; p.armL = [0.6, 0.3]; p.armR = [0.6, 0.3]; }
  }
  drawFront(ctx) {
    // water and foam at the rim, the bath's front over whoever is in it
    if (this.level > 0.5) {
      const a = (this.level - 0.5) * 2, y = this.waterY(), [x0] = this.at(0.06, 0), [x1] = this.at(0.94, 0);
      ctx.fillStyle = rgba('#7ac8f0', 0.85 * a); ctx.beginPath(); ctx.ellipse((x0 + x1) / 2, y + 8, (x1 - x0) / 2, 14, 0, 0, TAU); ctx.fill();
    }
    this.drawPart(ctx, 0, 0.16, 1, 1);
    if (this.bubbles > 0.05 && this.level > 0.4) {
      const f = seeded(4), n = Math.round(this.bubbles * 16), y = this.waterY();
      for (let i = 0; i < n; i++) {
        const [x] = this.at(0.05 + f() * 0.9, 0), r = 18 + f() * 22, yy = y - 4 + Math.sin(this.t * 2 + i) * 3 - f() * 16;
        ctx.beginPath(); ctx.arc(x, yy, r, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(150,190,220,0.8)'; ctx.stroke();
        ctx.beginPath(); ctx.arc(x - r * 0.35, yy - r * 0.35, r * 0.2, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
      }
    }
  }
  saveState() { return { l: Math.round(this.level * 100) / 100, b: this.bubbles > 0.1 ? 1 : 0 }; }
  loadState(s) { this.level = s.l || 0; this.bubbles = s.b || 0; }
}
Person.prototype.hipBase = Person.prototype.hip;
Person.prototype.hip = function () { const h = this.hipBase(), dy = this.seat && this.seat.owner.seatDyFor ? this.seat.owner.seatDyFor(this) : 0; return dy ? [h[0], h[1] + dy] : h; };

class Shower extends Fixture {
  setup() { this.on = false; this.hot('knob', 0.15, 0.55, 0.6, 0.85, 3); this.hot('head', 0.45, 0.0, 1.0, 0.3, 2); }
  tap() { this.on = !this.on; SFX.play('tapturn'); Sound.loop(this, 'shower', this.on ? 'shower' : null); World.dirty = true; }
  spray() { const [x, y] = this.at(0.72, 0.22); return [x, y]; }
  update(dt) {
    super.update(dt);
    if (!this.on) return;
    const [x, y] = this.spray(), floor = this.room.floorY - 20;
    for (let i = 0; i < 3; i++) if (Rnd.f() < dt * 30) Parts.add('drop', x + rand(-36, 36), y + 10, { size: rand(3, 5), vx: rand(-40, 40), vy: rand(300, 500), g: 1800, life: 1.2, col: '#a8dcff', floor, layer: 1, edge: false });
    // anyone standing or sitting under it gets wet and clean
    for (const p of World.people()) {
      const [hx, hy] = p.headPos();
      if (Math.abs(hx - x) < 110 && hy > y && hy - y < 700) {
        p.wet = 1;
        if (p.dirt > 0) { p.dirt = Math.max(0, p.dirt - dt * 0.25); if (p.dirt === 0) p.doAct('sparkleClean'); }
        if (Rnd.f() < dt * 3) Parts.add('bubble', hx + rand(-40, 40), hy - p.B.head * 0.8, { size: rand(8, 16), life: 1, vy: -20, layer: 1 });
      }
    }
    const tub = World.fixtures.find(f => f instanceof Bathtub && f.room === this.room);
    if (tub && Math.abs(tub.x - x) < tub.w * 0.5 && tub.level < 0.75) tub.level = Math.min(0.75, tub.level + dt * 0.03);
  }
  saveState() { return this.on ? { on: 1 } : null; }
  loadState(s) { if (s.on) { this.on = true; Sound.loop(this, 'shower', 'shower'); } }
}

class Toilet extends Fixture {
  setup() {
    this.open = false; this.flushT = 0; this.swirl = []; this.slotZ = 0.5;
    this.hot('flush', 0.72, 0.08, 1.0, 0.28, 3);
    this.seat = this.addSeat({ u: 0.5, v: 0.47, pose: 'sit', cap: [-0.2, -0.3, 1.2, 0.85], kinds: ['person', 'pet'] });
  }
  get pic() { return this.open ? 'toiletopen' : 'toilet'; }
  animating() { return this.flushT > 0; }
  staticKey() { return this.open ? 'o' : 'c'; }
  set pic(v) {}
  tap(part) {
    if (part === 'flush') { this.flush(); return; }
    this.open = !this.open; SFX.play(this.open ? 'binopen' : 'clonk'); this.wiggle(1); World.dirty = true;
  }
  flush() {
    if (this.flushT > 0) return;
    this.flushT = 2; SFX.play('flush');
    for (const p of this.seat.who) if (p.kind === 'person') later(() => { if (p.seat === this.seat && !p.busy()) p.doAct('giggle'); }, 500);
  }
  accept(t, x, y) {
    if (t.kind !== 'prop' || t.h > 130 || !this.open || this.seat.who.length || !this.inBox(x, y, [0.08, -0.45, 0.92, 0.8])) return false;
    // into the bowl it goes, waiting for a flush
    t.state = 'slot'; t.slot = { owner: this, name: 'bowl' }; t.x = this.at(0.5, 0)[0]; t.y = this.at(0, 0.6)[1];
    this.swirl.push(t); SFX.play('plop');
    return true;
  }
  update(dt) {
    super.update(dt);
    this.swirl = this.swirl.filter(t => !t.gone && !t.held && t.state === 'slot');
    if (this.flushT > 0) {
      this.flushT -= dt;
      this.swirl.forEach((t, i) => { t.rot += dt * 9; t.x = this.at(0.5, 0)[0] + Math.cos(this.t * 9 + i) * 20; t.flushK = Math.max(0, this.flushT / 2); });
      if (this.flushT <= 0) {

        for (const t of this.swirl) {

/* fx_bed.js — the bedrooms: beds (lie someone down and at night they sleep, tucked under the
   duvet), the cot with its bars and the mobile that plays a lullaby, the wardrobe of clothes,
   drawers full of socks, the dressing table (its mirror shows whoever sits on the stool, and
   gives them new hair colours), the rocking horse, and the play tent for hiding. */

// [u, v of the head on the pillow] for each sleeper; the duvet is drawn back over them from u0 rightward
const BEDS = {
  bigbed: { heads: [[0.25, 0.39], [0.29, 0.5]], duvet: [0.4, 0.33, 1.0, 1.0], cap: [0.0, -0.5, 1.0, 0.85] },

class Bed extends Fixture {

    this.addSurface(0.42, 0.92, B.heads[0][1] + 0.05, { soft: true });
    this.bounce = 0;
  }
  tap() {
    this.wiggle(2.5); SFX.play('boing', { f: 180 });

      if (p.asleep) p.doAct('wakeUp'); else p.doAct('giggle');
    }
  }
  posePerson(p) {
    // tucked in: arms under the covers, legs bent so they fit
    p.legs = 'sit';

  }
  drawFront(ctx) {
    const d = this.B.duvet;

    if (this.B.bars) this.drawBars(ctx);
    else this.drawPart(ctx, d[0], d[1], d[2], d[3]);
  }
  drawBars(ctx) {
    // the cot's bars and blanket redrawn over the baby
    this.drawPart(ctx, 0.42, 0.54, 0.9, 0.86);

}

Person.prototype.hipBed = Person.prototype.hip;

  if (this.seat && this.seat.headAt) { const [hx, hy] = this.seat.pos(this.seatI); return [hx + (this.seat.flip ? -1 : 1) * (this.B.th + this.B.head * 0.82), hy]; }

class DressingTable extends Fixture {

/* ---------- src/fx_garden.js ---------- */
/* fx_garden.js — the garden: a swing (push it), a slide (whoosh down), a trampoline (higher with
   every tap), a paddling pool, a sandpit (tap for a sandcastle), the apple tree (tap and an apple
   falls), the dog's kennel, a flower bed that grows when watered, a bird bath the birds visit,
   and a mud puddle that is very good for jumping in. */

class Swing extends Fixture {
  setup() {
    this.a = 0; this.av = 0; this.L = 400;

  }

  seatPoint() { const [px, py] = this.pivot(), d = this.L * 0.86; return [px + Math.sin(this.a) * d, py + Math.cos(this.a) * d]; }
  tap() { this.push(); }
  push() { this.av += (this.av >= 0 ? 1 : -1) * 1.1 + (Math.abs(this.av) < 0.2 ? 0.6 : 0); SFX.play('whoosh', { dur: 0.4, f0: 500, f1: 1100, vol: 0.3 }); for (const p of this.seats[0].who) if (p.kind === 'person') p.say('wee'); }
  tapSeated(p) { this.push(); return true; }
  animating() { return Math.abs(this.a) > 0.003 || Math.abs(this.av) > 0.02; }
  update(dt) {
    super.update(dt);
    this.av += -Math.sin(this.a) * 9 * dt - this.av * 0.25 * dt; this.a += this.av * dt; this.a = clamp(this.a, -1.2, 1.2);
    for (const p of this.seats[0].who) p.seatRot = -this.a;
  }
  draw(ctx) {
    super.draw(ctx);
    const [px, py] = this.pivot(), h = this.L, w = Art.w('swingseat', h);
    ctx.save(); ctx.translate(px, py); ctx.rotate(-this.a); Art.rect(ctx, 'swingseat', -w / 2, 0, w, h); ctx.restore();
  }
  layers(L) { super.layers(L); }
}

class Slide extends Fixture {
  setup() {
    this.path = [[0.3, 0.1], [0.42, 0.22], [0.56, 0.42], [0.7, 0.64], [0.84, 0.83], [0.97, 0.9]];
    this.k = 0; this.sliding = 0;
    const s = this.addSeat({ u: 0.3, v: 0.1, pose: 'slide', cap: [0.05, -0.4, 1.0, 1.0], kinds: ['person', 'pet'] });
    s.pos = () => this.pathAt(this.k);
  }
  pathAt(k) {
    const P = this.path, f = clamp(k, 0, 1) * (P.length - 1), i = Math.min(P.length - 2, Math.floor(f)), t = f - i;

  tap() { if (this.seats[0].who.length && this.sliding <= 0) this.sliding = 0.01; else { this.wiggle(); SFX.play('boing', { f: 300 }); } }
  update(dt) {
    super.update(dt);
    const who = this.seats[0].who;
    if (!who.length) { this.k = 0; this.sliding = 0; return; }
    if (this.sliding < 0) { this.sliding += dt; if (this.sliding >= 0) { this.sliding = 0.01; SFX.play('whoosh', { dur: 0.9, f0: 300, f1: 1500 }); if (who[0].kind === 'person') who[0].say('wee'); } return; }

/* ---------- src/pets.js ---------- */
/* pets.js — the dog and the cat: drawn in code like the family, with lives of their own. They
   wander about, sit, lie down, sleep at night (the dog in its kennel if it is in the garden),
   chase balls and wool, eat from the dog bowl, and come running for food. The dog eats nearly
   anything (but turns its nose up at chocolate, grapes and onions); the cat only likes fish and
   dairy. Both bark or meow when tapped and can wear hats. */

const PETS = {
  dog: { name: 'Biscuit', body: '#d89a5a', patch: '#fff4e0', ear: '#9a5a2e', nose: '#2e2226', len: 92, ht: 60, head: 46, leg: 44, voice: 'woof', likes: f => ['chocolate', 'grapes', 'onion', 'garlic', 'raisins'].indexOf(f.type) < 0 },
  cat: { name: 'Pudding', body: '#a8a8b4', patch: '#ffffff', ear: '#ffb6c8', nose: '#ff8aa8', stripe: '#7a7a88', len: 80, ht: 50, head: 42, leg: 38, voice: 'meow', likes: f => /fish|prawn|milk|cheese|ham|yoghurt|sushi|crab|icecream/.test(f.type) },
};

class Pet extends Thing {
  constructor(o) {
    super('pet', o);
    this.species = o.species || 'dog'; this.S = PETS[this.species];
    this.w = this.S.len * 2.3; this.h = this.S.ht + this.S.leg + this.S.head * 1.1;
    this.face = 1; this.mode = 'stand'; this.walkTo = null; this.walkV = 0; this.phase = 0; this.wag = 0; this.aiT = rand(2, 5);
    this.asleep = !!o.asleep; this.dirt = o.dirt || 0; this.wet = 0; this.wear = o.wear || {}; this.eatT = 0; this.happy = 0; this.mouthItem = null;
    this.bark = 0; this.blink = 0; this.blinkT = rand(2, 5);
  }
  static fromSave(s) { return new Pet(s); }
  save() { const s = super.save(); Object.assign(s, { species: this.species, asleep: this.asleep, dirt: this.dirt, wear: this.wear }); return s; }
  get name() { return this.S.name; }
  liftBy() { return 0; }
  headPos() {
    if (this.seat) { const [x, y] = this.seat.pos(this.seatI); return [x + this.face * this.S.len * 0.7, y - this.S.ht * 0.9]; }
    return [this.x + this.face * this.S.len * 0.95, this.y - this.S.leg - this.S.ht * 1.2];
  }
  box() {
    const S = this.S;
    if (this.seat) { const [x, y] = this.seat.pos(this.seatI); return { x0: x - S.len * 1.3, y0: y - S.ht * 2.2, x1: x + S.len * 1.3, y1: y + 10 }; }

/* ---------- src/props_extra.js ---------- */
/* props_extra.js — props that do more than hop: the radio (carry the music anywhere; everyone in
   the room dances), the alarm clock (wakes the room up), the jack-in-the-box (Pop goes the
   weasel, then POP), bubble bath, and wardrobe clothes (drawn in the colours they put on). */

/* ---------- the radio ---------- */
function radioTap(p) {
  const list = Music.radioList || ['wheels', 'rowboat', 'twinkle'];
  p.tune = (p.tune === undefined ? -1 : p.tune) + 1;
  if (p.music) { p.music.stop(0.2); p.music = null; }
  if (p.tune >= list.length) { p.tune = -1; SFX.play('click'); Sound.track(p, 'music', null); return; }
  SFX.play('click');
  p.music = Music.play(list[p.tune], { style: 'radio', loop: true, vol: 0.9, onNote: () => { p.beat = 1; } });
  Sound.track(p, 'music', p.music);
}
function radioOff(p) { if (p.music) { p.music.stop(0.2); p.music = null; } p.tune = -1; Sound.track(p, 'music', null); }
function radioUpdate(p, dt) {
  p.beat = Math.max(0, (p.beat || 0) - dt * 5);
  const on = !!(p.music && p.music.playing !== false);
  if (on && Rnd.f() < dt * 2.5) Parts.add('note', p.x + rand(-30, 30), p.y - p.h, { size: rand(18, 26), life: 1.6, vx: rand(-50, 50), vy: -80, layer: 1, col: pick(['#ff4a6a', '#4aa0f0', '#5ac85a', '#ffb02a', '#b07ae8']) });
}
function radioDraw(ctx, p) {
  if (!p.music) return;
  // the speakers bounce with the beat
  const k = (p.beat || 0) * 0.06;
  if (k > 0.001) { p.squash = Math.min(p.squash, 1 - k); }
}

/* ---------- the alarm clock ---------- */
function alarm(p) {
  SFX.play('ring'); later(() => SFX.play('ring'), 700);
  p.shakeT = 1.4;
  if (!p._shakeHooked) {
    p._shakeHooked = true; const up = p.update.bind(p);
    p.update = dt => { up(dt); if (p.shakeT > 0) { p.shakeT -= dt; p.rot = Math.sin(p.t * 60) * 0.12; if (p.shakeT <= 0) p.rot = 0; } };
  }
  const r = p.room();
  for (const q of World.people()) if (q.room() === r && q.asleep) later(() => { if (q.asleep) q.doAct('wakeUp'); }, 300 + Rnd.f() * 500);
  for (const q of World.things) if (q.kind === 'pet' && q.room() === r && q.asleep) q.wake();
}

/* ---------- the jack-in-the-box ---------- */
function jackInBox(p) {
  if (p.jackT > 0) return;
  if (p.jackOut) { p.jackOut = 0; SFX.play('clunk'); return; }       // pushed back in
  p.jackT = 0.01; p.crank = 0;
  const tune = TUNES.weasel, popAt = tune && tune.popAt !== undefined ? tune.popAt : 12;
  p.music = Music.play('weasel', { style: 'musicbox', loop: false, vol: 0.8, onNote: i => { p.crank += 0.6; if (i >= popAt && !p.jackOut) pop(); } });
  const pop = () => {
    if (p.music) { p.music.stop(0.05); p.music = null; }
    p.jackOut = 1; p.jackT = 0; p.springV = 0; p.spring = 0;
    SFX.play('boing', { f: 220 }); SFX.play('giggle', { pitch: 1.5 });
    Parts.burst('confetti', p.x, p.y - p.h, 16, { v0: 150, v1: 380, g: 600, life: 1.2, sizeR: [6, 10], cols: ['#ff4a6a', '#ffd84a', '#4aa0f0'], spread: Math.PI, ang: -Math.PI / 2 });
    for (const q of World.people()) if (q.room() === p.room() && !q.busy() && !q.held) q.doAct('giggle');
  };
  later(() => { if (!p.jackOut && p.jackT > 0) pop(); }, 9000);
  if (!p._jackHooked) {
    p._jackHooked = true; const up = p.update.bind(p);
    p.update = dt => { up(dt); if (p.jackOut) { p.springV += (1 - p.spring) * 160 * dt - p.springV * 6 * dt; p.spring += p.springV * dt; } };
  }
}
function drawJackBox(ctx, p, x, y, h) {
  const out = p.jackOut ? clamp(p.spring || 0, 0, 1.4) : 0;
  if (out > 0.01) {
    // the spring, then a jolly round head with a pointed hat
    const top = y - h * 0.95 - out * h * 0.9, w = h * 0.28;
    ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = '#8a8a96';
    ctx.beginPath(); for (let i = 0; i <= 12; i++) { const yy = lerp(y - h * 0.9, top + w, i / 12); ctx.lineTo(x + (i % 2 ? -w * 0.5 : w * 0.5), yy); } ctx.stroke();
    ctx.beginPath(); ctx.arc(x, top, w, 0, TAU); ctx.fillStyle = '#ffe0c8'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = PLINE; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, top + w * 0.15, w * 0.22, 0, TAU); ctx.fillStyle = '#ff4a4a'; ctx.fill();
    ctx.fillStyle = PLINE; [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x + s * w * 0.4, top - w * 0.2, w * 0.12, 0, TAU); ctx.fill(); });
    ctx.beginPath(); ctx.arc(x, top + w * 0.35, w * 0.45, 0.2 * Math.PI, 0.8 * Math.PI); ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - w * 0.85, top - w * 0.55); ctx.lineTo(x + w * 0.2, top - w * 2.1); ctx.lineTo(x + w * 0.85, top - w * 0.55); ctx.closePath(); ctx.fillStyle = '#4aa0f0'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + w * 0.2, top - w * 2.1, w * 0.22, 0, TAU); ctx.fillStyle = '#ffd84a'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  Art.standFast(ctx, 'jackbox', x, y, h);
  if (p.jackT > 0) {
    // the crank going round
    const cx = x + h * 0.52, cy = y - h * 0.55, a = (p.crank || 0) + p.t * 6;
    ctx.save(); ctx.lineWidth = 6; ctx.strokeStyle = PLINE; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * h * 0.14, cy + Math.sin(a) * h * 0.14); ctx.stroke(); ctx.restore();
  }
}

/* ---------- bubble bath: tipped into a bath, bubbles everywhere ---------- */
function bubbleBath(p) {
  const tub = World.fixtures.find(f => f.type === 'bathtub' && f.near(p.x, p.y - p.h / 2, 160));
  SFX.play('bubbles'); hop(p, 0.5);
  if (tub) tub.addBubbles(1); else blowBubbles(p);
}

/* ---------- clothes from the wardrobe ---------- */
function drawGarment(ctx, o, x, y, h) {
  // a little top or dress on a hanger, in its colours and pattern
  const w = h * 0.95, top = y - h * 0.82, dress = o.style === 'dress';
  ctx.save();
  ctx.lineWidth = 4; ctx.strokeStyle = PLINE; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - w * 0.35, top + 4); ctx.lineTo(x, top - h * 0.12); ctx.lineTo(x + w * 0.35, top + 4); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, top - h * 0.17, h * 0.05, Math.PI, 0); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - w * 0.2, top); ctx.lineTo(x - w * 0.5, top + h * 0.12); ctx.lineTo(x - w * 0.4, top + h * 0.3); ctx.lineTo(x - w * 0.28, top + h * 0.25);
  if (dress) { ctx.lineTo(x - w * 0.3, top + h * 0.45); ctx.lineTo(x - w * 0.48, y); ctx.lineTo(x + w * 0.48, y); ctx.lineTo(x + w * 0.3, top + h * 0.45); }
  else { ctx.lineTo(x - w * 0.28, y - h * 0.08); ctx.lineTo(x + w * 0.28, y - h * 0.08); }
  ctx.lineTo(x + w * 0.28, top + h * 0.25); ctx.lineTo(x + w * 0.4, top + h * 0.3); ctx.lineTo(x + w * 0.5, top + h * 0.12); ctx.lineTo(x + w * 0.2, top);
  ctx.quadraticCurveTo(x, top + h * 0.1, x - w * 0.2, top);
  ctx.closePath();
  ctx.fillStyle = o.col; ctx.fill();
  ctx.save(); ctx.clip();
  if (o.pat) drawPattern(ctx, o.pat, o.patCol || '#ffffff', x - w * 0.5, top, w, h, w * 1.1);
  if (o.style === 'dungarees') { ctx.fillStyle = o.dcol; ctx.fillRect(x - w * 0.22, top + h * 0.3, w * 0.44, h); }
  ctx.fillStyle = 'rgba(40,20,40,0.12)'; ctx.fillRect(x + w * 0.1, top, w, h);
  ctx.restore();
  ctx.stroke();
  ctx.restore();
}

/* ---------- src/tv.js ---------- */
/* tv.js — the cartoons on the living-room television: five little looping shows drawn in code in
   the stickers' look (bold dark outlines, bright fills, soft gradients, white gloss), and the
   coloured fuzz between channels.
   TV_CHANNELS[i].draw(ctx, w, h, t) paints the whole screen: origin top-left, w x h world units,
   t = seconds since the channel came on (t >= 0). drawTvStatic(ctx, w, h, t) is the fuzz (t 0..0.3).
   The caller has already clipped to the screen. Both leave the context as they found it, draw a
   few dozen paths a frame (never per pixel), and take their randomness from fixed seeds, so the
   same t always gives the same picture. */

const TV_CHANNELS = (() => {
  // (nothing from util.js is called until a frame is drawn, so the order the files are joined in does not matter)
  const LINE = '#3b2a2a';
  const SH = 330;                       // every show is drawn on a stage 330 units tall, as wide as the screen
  const OL = 9.5;                       // the bold outline, about 3% of the screen height
  const OL2 = 7.5;                      // the outline of small things
  const SOFT = 'rgba(59,42,42,0.45)';   // the thinner, softer lines of the scenery behind

  /* ---------- shared bits ---------- */
  function stage(draw) {
    return (ctx, w, h, t) => {
      const k = h / SH;

      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      draw(ctx, w / k, t);

  function sticker(ctx, fill, lw) {

  function shine(ctx, x, y, rx, ry, rot, a) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);

    g.addColorStop(0, lighten(col, 0.4)); g.addColorStop(0.5, col); g.addColorStop(1, darken(col, 0.14));

    path(); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
  }

  function bigEye(ctx, x, y, r, lx, ly, lw) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
    const g = ctx.createRadialGradient(x - r * 0.2, y - r * 0.3, r * 0.2, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e2deec');
    paint(ctx, g, lw);
    const pr = r * 0.56, px = x + lx * (r - pr) * 0.8, py = y + ly * (r - pr) * 0.8;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fillStyle = '#2e2230'; ctx.fill();
    ctx.beginPath();

  }

    shine(ctx, x - s * 0.42, y - s * 0.42, s * 0.2, s * 0.13, -0.6, 0.7);
  }

  /* ---------- 1. monster: a green blob monster at the kitchen table, eating the fruit that floats in ---------- */
  const FRUITS = ['apple', 'banana', 'orange', 'grapes'];

  const MON = '#55d64a';

      ctx.beginPath();

      ctx.beginPath();
      for (let i = 0; i < 9; i++) { const a = f() * TAU, d = r * (0.2 + f() * 0.55), x2 = Math.cos(a) * d, y2 = Math.sin(a) * d; ctx.moveTo(x2 + r * 0.045, y2); ctx.arc(x2, y2, r * 0.045, 0, TAU); }
      ctx.fillStyle = 'rgba(190,80,0,0.35)'; ctx.fill();
      leaf(ctx, r * 0.04, -r * 0.92, r * 0.62, -0.4, lw * 0.75);
      ctx.beginPath(); ctx.arc(0, -r * 0.9, r * 0.11, 0, TAU); paint(ctx, '#7a9a2a', lw * 0.55);

        ctx.lineWidth = lw * 0.4; ctx.strokeStyle = darken(col, 0.5); ctx.stroke();
      });

    }

  }

  function kitchen(ctx, W, t) {
    // a peach wall, a check of pastel tiles behind the table
    ctx.fillStyle = vgrad(ctx, 0, 170, ['#ffead6', '#ffdcc8']); ctx.fillRect(0, 0, W, 172);
    ctx.fillStyle = '#fff8ee'; ctx.fillRect(0, 170, W, SH - 170);

    ctx.fillStyle = '#d2ebfa'; ctx.fill();
    ctx.beginPath(); ctx.rect(-10, 163, W + 20, 9); paint(ctx, '#ffffff', 4, SOFT);

      ctx.quadraticCurveTo(ex - sd * 10, wy + wh + 14, ex, wy + wh + 10); ctx.closePath();
    });

    const sx = W - 200, sy = 118;
    ctx.beginPath(); rrect(ctx, sx, sy, 170, 12, 5); paint(ctx, '#f0b98a', 5, SOFT);
    const px = sx + 58, py = sy - 30;
    ctx.beginPath(); ctx.moveTo(px + 30, py + 2); ctx.bezierCurveTo(px + 58, py - 4, px + 56, py + 28, px + 26, py + 22);
    ctx.lineWidth = 7; ctx.strokeStyle = '#8fd0f0'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px - 26, py + 8); ctx.quadraticCurveTo(px - 44, py + 4, px - 52, py - 14); ctx.lineTo(px - 42, py - 14); ctx.quadraticCurveTo(px - 40, py - 2, px - 20, py - 4); ctx.closePath();

    ctx.beginPath(); ctx.arc(px, py - 33, 5, 0, TAU); paint(ctx, '#ff9ab8', 3, SOFT);
    shine(ctx, px - 14, py - 8, 9, 5, -0.5, 0.7);
    const jx = sx + 118, jy = sy - 52;
    ctx.beginPath(); rrect(ctx, jx, jy, 40, 52, 10); paint(ctx, 'rgba(255,255,255,0.75)', 4, SOFT);
    ctx.beginPath(); for (let i = 0; i < 3; i++) { const cx2 = jx + 12 + (i % 2) * 16, cy2 = jy + 40 - i * 13; ctx.moveTo(cx2 + 9, cy2); ctx.arc(cx2, cy2, 9, 0, TAU); }
    paint(ctx, '#e0a060', 3, SOFT);
    ctx.beginPath(); rrect(ctx, jx - 3, jy - 9, 46, 11, 4); paint(ctx, '#ff9ab8', 4, SOFT);
  }

  function gingham(ctx, W, ty) {

  // a frond of seaweed: a wavy ribbon from (x, y) up h, swaying
  function seaweed(ctx, x, y, h, wd, col, t, ph) {

      const ww = wd * (1 - f * 0.75) * (0.8 + 0.2 * Math.sin(f * 14 + ph));

  /* ---------- 3. space: twinkling stars, a rocket looping the loop, ringed planets drifting by, shooting stars ---------- */

  /* ---------- 4. garden: a turning sun, a rainbow arcing in, flowers dancing to the beat, a butterfly, clouds ---------- */
  const RAINBOW = ['#ff4d4d', '#ff9a2a', '#ffe04a', '#5ccc58', '#4aa4f2', '#9a66e2'];
  const FLOWERS = [
    { kind: 'round', col: '#ff4a5a', h: 84, leaf: 1 },
    { kind: 'daisy', col: '#ffffff', h: 66, leaf: -1 },
    { kind: 'tulip', col: '#ff7ac8', h: 92, leaf: 1 },
    { kind: 'round', col: '#a46aff', h: 74, leaf: -1 },
    { kind: 'daisy', col: '#ffe04a', h: 90, leaf: 1 },
    { kind: 'tulip', col: '#ff8a2a', h: 70, leaf: -1 },
  ];

    ctx.save(); ctx.translate(hx, hy); ctx.rotate(sway * 0.22); ctx.scale(1 + (1 - sq) * 0.7, sq);
    const col = F.col;
    if (F.kind === 'tulip') {

      ctx.quadraticCurveTo(22, 14, 0, 16); ctx.quadraticCurveTo(-22, 14, -18, -16); ctx.closePath();
      paint(ctx, vgrad(ctx, -20, 16, [lighten(col, 0.35), col, darken(col, 0.12)]), OL2);
      ctx.beginPath(); ctx.moveTo(-9, -6); ctx.quadraticCurveTo(-6, 8, 0, 13); ctx.moveTo(9, -6); ctx.quadraticCurveTo(6, 8, 0, 13);
      ctx.lineWidth = 3; ctx.strokeStyle = rgba(darken(col, 0.35), 0.6); ctx.stroke();

      ctx.beginPath();

  function drawGarden(ctx, W, t) {

    const sx = 64, sy = 60, sr = 31;
    const gl = ctx.createRadialGradient(sx, sy, sr * 0.8, sx, sy, sr * 2.8);
    gl.addColorStop(0, 'rgba(255,240,150,0.65)'); gl.addColorStop(1, 'rgba(255,240,150,0)');

    });

    ctx.beginPath(); ctx.moveTo(-10, 224); ctx.quadraticCurveTo(W * 0.22, 178, W * 0.46, 216); ctx.quadraticCurveTo(W * 0.72, 186, W + 10, 210);
    ctx.lineTo(W + 10, SH + 10); ctx.lineTo(-10, SH + 10); ctx.closePath();
    paint(ctx, vgrad(ctx, 190, 260, ['#a6ea86', '#86d86a']), OL2 * 0.8, SOFT);
    ctx.beginPath(); ctx.moveTo(-10, 262); ctx.quadraticCurveTo(W * 0.3, 234, W * 0.58, 256); ctx.quadraticCurveTo(W * 0.84, 274, W + 10, 248);

  /* ---------- 5. peekaboo: a round orange bear hides its eyes behind its paws, then PEEKABOO! ---------- */
  const BEAR = '#ff9a3c', BEAR_PALE = '#ffe2c0', BEAR_PAD = '#ffbfa0';

    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); paint(ctx, ball(ctx, 0, 0, r, BEAR), OL);
    ctx.beginPath(); ctx.ellipse(0, r * 0.2, r * 0.46, r * 0.38, 0, 0, TAU);
    [-0.5, 0, 0.5].forEach(a => { const bx = Math.sin(a) * r * 0.6, by = -Math.cos(a) * r * 0.5; ctx.moveTo(bx + r * 0.17, by); ctx.arc(bx, by, r * 0.17, 0, TAU); });
    paint(ctx, BEAR_PAD, OL2 * 0.55);

    ctx.restore();
  }
  function drawPeekaboo(ctx, W, t) {

    ctx.save(); ctx.translate(cx, hy + 40); ctx.rotate(tilt); ctx.scale(pop, pop); ctx.translate(0, -40);
    // the body below, a pale tummy on it
    ctx.beginPath(); ctx.moveTo(-160, 220); ctx.quadraticCurveTo(-150, 88, 0, 84); ctx.quadraticCurveTo(150, 88, 160, 220); ctx.closePath();
    paint(ctx, ball(ctx, 0, 140, 150, BEAR), OL);
    ctx.beginPath(); ctx.ellipse(0, 168, 78, 58, 0, 0, TAU); ctx.fillStyle = BEAR_PALE; ctx.fill();
    // ears, then the head over them
    [-1, 1].forEach(sd => {
      ctx.beginPath(); ctx.arc(sd * 84, -78, 34, 0, TAU); paint(ctx, ball(ctx, sd * 84, -78, 34, BEAR), OL);
      ctx.beginPath(); ctx.arc(sd * 84, -76, 19, 0, TAU); ctx.fillStyle = BEAR_PAD; ctx.fill();
    });
    ctx.beginPath(); ctx.ellipse(0, 0, 122, 106, 0, 0, TAU); paint(ctx, ball(ctx, 0, 0, 122, BEAR), OL);
    shine(ctx, -60, -62, 26, 12, -0.6, 0.45);
    // cheeks, the muzzle, the nose
    ctx.beginPath(); [-1, 1].forEach(sd => { ctx.moveTo(sd * 82 + 17, 30); ctx.ellipse(sd * 82, 30, 17, 11, 0, 0, TAU); });
    ctx.fillStyle = 'rgba(255,110,130,0.5)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 40, 56, 42, 0, 0, TAU); paint(ctx, BEAR_PALE, OL2 * 0.6);
    // the face: a smile while it hides; wide eyes, raised brows and a big open mouth when it peeks
    if (o > 0.05) {
      const big = wow ? 1.25 : 1;
      [-1, 1].forEach(sd => {
        const ex = sd * 46, ey = -20, rx = 13 * big, ry = 16 * big;
        ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, TAU); ctx.fillStyle = '#2e2230'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex - rx * 0.32, ey - ry * 0.36, rx * 0.42, 0, TAU); ctx.moveTo(ex + rx * 0.55, ey + ry * 0.3); ctx.arc(ex + rx * 0.35, ey + ry * 0.3, rx * 0.2, 0, TAU);
        ctx.fillStyle = '#ffffff'; ctx.fill();
      });
      ctx.beginPath(); [-1, 1].forEach(sd => { const by = wow ? -62 : -50; ctx.moveTo(sd * 30, by + 4); ctx.quadraticCurveTo(sd * 46, by - 8, sd * 62, by + 4); });
      ctx.lineWidth = OL2 * 0.9; ctx.strokeStyle = '#8a3a16'; ctx.stroke();
    }
    ctx.strokeStyle = LINE;
    if (wow) {
      const m = () => { ctx.beginPath(); ctx.moveTo(-30, 36); ctx.quadraticCurveTo(0, 30, 30, 36); ctx.quadraticCurveTo(28, 82, 0, 82); ctx.quadraticCurveTo(-28, 82, -30, 36); ctx.closePath(); };
      m(); ctx.fillStyle = '#7a2238'; ctx.fill();
      ctx.save(); m(); ctx.clip(); ctx.beginPath(); ctx.ellipse(0, 84, 22, 16, 0, 0, TAU); ctx.fillStyle = '#ff7a96'; ctx.fill(); ctx.restore();
      m(); ctx.lineWidth = OL2 * 0.9; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(0, 28); ctx.lineTo(0, 40); ctx.moveTo(-24, 36); ctx.quadraticCurveTo(-12, 52, 0, 40); ctx.quadraticCurveTo(12, 52, 24, 36);
      ctx.lineWidth = OL2 * 0.9; ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0, 20, 17, 12, 0, 0, TAU); ctx.fillStyle = '#3b2a2a'; ctx.fill();
    shine(ctx, -5, 15, 6, 3.5, -0.3, 0.75);
    // arms up from the shoulders to the paws: over the eyes, or flung out wide
    const jig = o < 0.05 ? Math.sin(t * 9) * 3 : 0;
    const P = sd => [sd * lerp(46, 186, o) + jig, lerp(-18, -30, o) + Math.sin(t * 6 + sd) * 5 * o];
    rope(ctx, () => {
      ctx.beginPath();
      [-1, 1].forEach(sd => { const p = P(sd); ctx.moveTo(sd * 104, 112); ctx.quadraticCurveTo(sd * lerp(118, 170, o), lerp(60, 70, o), p[0], p[1]); });
    }, 44, BEAR, OL);
    [-1, 1].forEach(sd => { const p = P(sd); paw(ctx, p[0], p[1], 38, sd * lerp(0.25, -0.35, o)); });
    ctx.restore();
  }

  return [
    { id: 'monster', draw: stage(drawMonster) },
    { id: 'sea', draw: stage(drawSea) },
    { id: 'space', draw: stage(drawSpace) },
    { id: 'garden', draw: stage(drawGarden) },
    { id: 'peekaboo', draw: stage(drawPeekaboo) },
  ];
})();

// the fuzz between channels: chunky bands of coloured blocks, a fresh jumble thirty times a second, and a bright bar rolling down
function drawTvStatic(ctx, w, h, t) {
  const f = seeded(7 + Math.floor(t * 30) * 131);
  const cols = ['#f7f4ff', '#d9d4e6', '#aaa3ba', '#6d6580', '#ff8fc4', '#7fdcff', '#ffe36e', '#a6f28c'];
  const rects = cols.map(() => []);
  for (let y = 0; y < h;) {
    const bh = h * (0.025 + f() * 0.07);
    for (let x = -f() * w * 0.1; x < w;) {
      const bw = w * (0.04 + f() * 0.22), c = f() < 0.62 ? Math.floor(f() * 4) : 4 + Math.floor(f() * 4);
      rects[c].push(x, y, bw + 0.5, bh + 0.5);
      x += bw;
    }
    y += bh;
  }
  ctx.save();
  rects.forEach((list, i) => {
    if (!list.length) return;
    ctx.beginPath();
    for (let j = 0; j < list.length; j += 4) ctx.rect(list[j], list[j + 1], list[j + 2], list[j + 3]);
    ctx.fillStyle = cols[i]; ctx.fill();
  });
  const ry = ((t * 2.6) % 1) * h * 1.3 - h * 0.15, bh = h * 0.12;
  const g = ctx.createLinearGradient(0, ry - bh, 0, ry + bh);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, ry - bh, w, bh * 2);
  ctx.restore();
}

function buildRooms() {
  for (const id in ROOM_PLANS) {
    const room = World.room(id), made = {}, count = {};
    for (const line of ROOM_PLANS[id]) {
      if (line.skip) continue;
      const o = Object.assign({ room: id }, line);
      count[o.type] = (count[o.type] || 0) + 1;
      if (!o.n && count[o.type] > 1) o.n = count[o.type];
      if (o.pic && o.type !== 'flowerbed' && !o.n) o.id = id + ':' + o.pic;
      if (o.on) {
        // stands on the top of a piece already placed
        const parent = made[o.on];
        const top = parent.surfaces.reduce((a, s) => (!a || s.y < a.y) && !s.inside ? s : a, null);
        o.x = lerp(top.x0, top.x1, o.u === undefined ? 0.5 : o.u) - room.x; o.y = top.y - room.y; o.z = (parent.z - room.y) + 0.3;
      }
      if (o.onTopOf) { const p = made[o.onTopOf]; o.y = p.y0 - room.y + p.h * 0.12; o.z = (p.z - room.y) + 0.2; }
      const f = makeFixture(o);
      made[o.type + (o.n || '')] = f;
      if (!made[o.type]) made[o.type] = f;
      if (o.pic) made[o.pic] = f;
    }
  }
}

// a prop resting on a fixture's surface (si: which one; u: how far along it)
function putOn(type, fixtureId, si, u, o) {
  const f = World.fixture(fixtureId);
  if (!f) return null;
  const s = f.surfaces[si || 0];
  const p = spawnProp(type, lerp(s.x0, s.x1, u === undefined ? 0.5 : u), s.y, o);
  p.state = 'rest'; p.on = s; p.y = s.y;
  return p;
}
function putFloor(type, roomId, x, y, o) {
  const r = World.room(roomId), p = spawnProp(type, r.x + x, r.y + y, o);
  p.state = 'rest'; p.on = null;
  return p;
}
function putPerson(who, roomId, x, y) {
  const r = World.room(roomId), p = new Person({ who, x: r.x + x, y: r.y + y });
  p.state = 'rest'; World.add(p); return p;
}
function seatPerson(who, fixtureId, si) {
  const f = World.fixture(fixtureId), p = new Person({ who, x: f.x, y: f.y });
  World.add(p); p.sitIn(f.seats[si || 0]); return p;
}
