/* ---------- src/lighting.js ---------- */
/* lighting.js — night falls over the house: each room darkens unless its ceiling light is on, and
   every lamp, fire, telly and open fridge makes a warm pool of light. The darkness is painted at
   a quarter of the screen's resolution (it is soft anyway) and laid over everything. */

const Light = {
  can: null, K: 0.25,
  darkness(r) {
    const n = World.night;
    if (r.outdoor) return n * 0.5;
    let d = r.lightOn ? n * 0.05 : n * 0.62;
    if (r.curtains > 0) d = Math.max(d, (1 - n) * 0.3 * r.curtains + n * (r.lightOn ? 0.05 : 0.62));
    return d;
  },
  // every light that is on and in view: { x, y, r, k, col }
  sources(v) {
    const out = [];
    for (const f of World.fixtures) for (const L of f.lights) {
      if (!L.on()) continue;
      const [x, y] = f.at(L.u, L.v), r = L.r;
      if (x + r < v.x0 || x - r > v.x1 || y + r < v.y0 || y - r > v.y1) continue;
      out.push({ x, y, r, k: L.k === undefined ? 1 : (typeof L.k === 'function' ? L.k() : L.k), col: L.col || '#ffd890' });
    }
    return out;
  },
  draw(ctx) {
    const v = Cam.view();
    let any = World.night > 0.02;
    if (!any) for (const r of World.rooms) if (r.curtains > 0) { any = true; break; }
    if (!any) return;
    const K = this.K, W = Math.max(1, Math.ceil(G.W * K)), H = Math.max(1, Math.ceil(G.H * K));
    if (!this.can) this.can = makeCanvas(W, H);
    const c = this.can;
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H);
    g.setTransform(Cam.s * K, 0, 0, Cam.s * K, K * (G.W / 2 - Cam.x * Cam.s), K * (G.H / 2 - Cam.y * Cam.s));
    // the outside and the walls, then each room's own darkness
    const n = World.night;
    if (n > 0.01) { g.fillStyle = 'rgba(10,16,52,' + (0.42 * n) + ')'; g.fillRect(v.x0 - 10, v.y0 - 10, v.x1 - v.x0 + 20, v.y1 - v.y0 + 20); }
    for (const r of World.rooms) {
      if (r.x > v.x1 || r.x + r.w < v.x0 || r.y > v.y1 || r.y + r.h < v.y0) continue;
      const d = this.darkness(r);
      const top = r.outdoor ? r.y - 400 : r.y;
      g.clearRect(r.x, top, r.w, r.y + r.h - top);
      if (d > 0.005) { g.fillStyle = 'rgba(10,16,52,' + d + ')'; g.fillRect(r.x, top, r.w, r.y + r.h - top); }
    }
    // pools of light
    const S = this.sources(v);
    g.globalCompositeOperation = 'destination-out';
    for (const L of S) {
      const gr = g.createRadialGradient(L.x, L.y, L.r * 0.08, L.x, L.y, L.r);
      gr.addColorStop(0, 'rgba(0,0,0,' + (0.92 * L.k) + ')'); gr.addColorStop(0.5, 'rgba(0,0,0,' + (0.55 * L.k) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(L.x, L.y, L.r, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    if (n > 0.05) for (const L of S) {
      const gr = g.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r * 0.6);
      gr.addColorStop(0, rgba(L.col, 0.2 * n * L.k)); gr.addColorStop(1, rgba(L.col, 0));
      g.fillStyle = gr; g.beginPath(); g.arc(L.x, L.y, L.r * 0.6, 0, TAU); g.fill();
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(c, 0, 0, W, H, 0, 0, W / K * G.dpr, H / K * G.dpr);
    ctx.restore();
  },
};

/* ---------- src/camera.js ---------- */
/* camera.js — what part of the house is on screen. One room fills the screen; a swipe across
   empty floor or wall slides to the next room (and settles on it); the house button zooms out to
   the whole dollhouse, where tapping a room zooms back in. Carrying something to the edge of the
   screen takes the camera (and the thing) into the next room. */

const Cam = {
  x: 0, y: 0, s: 1, ppu: 1, moving: false, mode: 'room', stop: null,
  tw: null,                // a tween: { from, to, t, d }
  vx: 0, vy: 0, panning: false, edgeT: 0, edgeDir: null, settleT: 0,
  stops() {
    const out = [];
    for (const r of World.rooms) r.stops().forEach(([x, y], i) => out.push({ room: r, x, y, i }));
    return out;
  },
  roomScale() { return Math.min(G.W / 1440, G.H / 990); },
  houseView() {
    const x0 = -380, x1 = GARDEN_X + GARDEN_W + 260, y0 = -820, y1 = GROUND_Y + 200;
    const s = Math.min(G.W / (x1 - x0), (G.H - 70) / (y1 - y0));
    return { x: (x0 + x1) / 2, y: (y0 + y1) / 2 - 20 / s, s };
  },
  fit(stop) { return { x: stop.x, y: stop.y, s: this.roomScale() }; },
  // keep the view inside the world (and a room's view square on it)
  clampView(v) {
    const hw = G.W / 2 / v.s, hh = G.H / 2 / v.s;
    v.x = clamp(v.x, WORLD.x0 + hw, WORLD.x1 - hw);
    if (2 * hw > WORLD.x1 - WORLD.x0) v.x = (WORLD.x0 + WORLD.x1) / 2;
    v.y = clamp(v.y, WORLD.y0 + hh, WORLD.y1 - hh);
    if (2 * hh > WORLD.y1 - WORLD.y0) v.y = (WORLD.y0 + WORLD.y1) / 2;
    return v;
  },
  set(v) { this.x = v.x; this.y = v.y; this.s = v.s; this.ppu = this.s * G.dpr; },
  to(v, d = 0.55) { this.tw = { from: { x: this.x, y: this.y, s: this.s }, to: v, t: 0, d }; },
  goStop(stop, now) {
    this.mode = 'room'; this.stop = stop;
    const v = this.clampView(this.fit(stop));
    if (now) { this.tw = null; this.set(v); } else this.to(v, 0.5);
    World.dirty = true;
  },
  goRoom(room, now) { const st = this.stops().filter(s => s.room === room); if (st.length) this.goStop(st[0], now); },
  goHouse() { this.mode = 'house'; this.to(this.clampView(this.houseView()), 0.7); SFX.play('whoosh', { dur: 0.5, f0: 1200, f1: 300 }); },
  nearestStop(x, y) {
    let best = null, bd = 1e18;
    for (const s of this.stops()) { const d = (s.x - x) ** 2 + ((s.y - y) * 1.4) ** 2; if (d < bd) { bd = d; best = s; } }
    return best;
  },
  // the next stop over in a direction (dx, dy one of -1, 0, 1)
  neighbour(dx, dy) {
    const cur = this.stop || this.nearestStop(this.x, this.y);
    let best = null, bd = 1e18;
    for (const s of this.stops()) {
      if (s === cur) continue;
      const ox = s.x - cur.x, oy = s.y - cur.y;
      if (dx && Math.sign(ox) !== dx) continue;
      if (dy && Math.sign(oy) !== dy) continue;
      if (dx && Math.abs(oy) > 200) continue;
      if (dy && Math.abs(ox) > 400) continue;
      const d = ox * ox + oy * oy;
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  },
  /* ---------- swiping ---------- */
  panStart() { this.panning = true; this.tw = null; this.vx = this.vy = 0; },
  panBy(dx, dy, dt) {
    this.x -= dx / this.s; this.y -= dy / this.s;
    if (dt > 0) { this.vx = lerp(this.vx, -dx / this.s / dt, 0.4); this.vy = lerp(this.vy, -dy / this.s / dt, 0.4); }
    this.clampView(this);
    this.ppu = this.s * G.dpr;
  },
  panEnd() {
    this.panning = false;
    // a flick carries on to the next room; otherwise settle on the nearest
    const cur = this.stop || this.nearestStop(this.x, this.y);
    let tgt = this.nearestStop(this.x + this.vx * 0.12, this.y + this.vy * 0.12);
    const fx = Math.abs(this.vx) > 900 ? -Math.sign(-this.vx) : 0, fy = Math.abs(this.vy) > 900 ? Math.sign(this.vy) : 0;
    if (tgt === cur && (fx || fy)) tgt = this.neighbour(fx, fx ? 0 : fy) || cur;
    if (tgt !== cur) SFX.play('swish');
    this.goStop(tgt);
  },
  update(dt) {
    const was = { x: this.x, y: this.y, s: this.s };
    if (this.tw) {
      const T = this.tw; T.t += dt;
      const k = Ease.inOut(Math.min(1, T.t / T.d));
      this.x = lerp(T.from.x, T.to.x, k); this.y = lerp(T.from.y, T.to.y, k);
      this.s = T.from.s * Math.pow(T.to.s / T.from.s, k);
      if (T.t >= T.d) this.tw = null;
    }
    this.ppu = this.s * G.dpr;
    this.moving = !!this.tw || this.panning || was.x !== this.x || was.y !== this.y || was.s !== this.s;
    if (this.moving) this.settleT = 0; else this.settleT += dt;
    // a thing carried to the edge of the screen takes the camera along
    if (this.mode === 'room' && !this.tw) {
      const held = Input.heldPtr();
      let dir = null;
      if (held) {
        const m = Math.min(G.W, G.H) * 0.07;
        if (held.x < m) dir = [-1, 0]; else if (held.x > G.W - m) dir = [1, 0];
        else if (held.y < m * 0.9) dir = [0, -1]; else if (held.y > G.H - m * 0.9) dir = [0, 1];
      }
      if (dir && (!this.edgeDir || this.edgeDir[0] !== dir[0] || this.edgeDir[1] !== dir[1])) { this.edgeDir = dir; this.edgeT = 0; }
      if (!dir) this.edgeDir = null;
      if (this.edgeDir) {
        this.edgeT += dt;
        if (this.edgeT > 0.45) {
          const n = this.neighbour(this.edgeDir[0], this.edgeDir[1]);
          if (n) { this.goStop(n); SFX.play('swish'); }
          this.edgeT = -0.6;
        }
      }
    }
  },
  view() {
    const hw = G.W / 2 / this.s, hh = G.H / 2 / this.s;
    return { x0: this.x - hw, y0: this.y - hh, x1: this.x + hw, y1: this.y + hh };
  },
  toWorld(px, py) { return [this.x + (px - G.W / 2) / this.s, this.y + (py - G.H / 2) / this.s]; },
  toScreen(wx, wy) { return [G.W / 2 + (wx - this.x) * this.s, G.H / 2 + (wy - this.y) * this.s]; },
  apply(ctx) { ctx.setTransform(this.ppu, 0, 0, this.ppu, G.dpr * (G.W / 2 - this.x * this.s), G.dpr * (G.H / 2 - this.y * this.s)); },
};

/* ---------- src/house.js ---------- */
/* house.js — the dollhouse and the world round it, painted on a canvas of its own behind the
   game (only when the camera or the time of day changes): the sky, hills, the roof, the walls and
   floors between the rooms, the painted rooms and the garden. */

const Backdrops = {
  img: {},
  load(done) {
    const names = Object.keys(BACKDROPS);
    let left = names.length;
    names.forEach(n => {
      const im = new Image();
      im.onload = im.onerror = () => { if (--left === 0 && done) done(); };
      im.src = BACKDROPS[n].src;
      this.img[n] = im;
    });
  },
  ok(n) { const im = this.img[n]; return im && im.complete && im.naturalWidth > 0; },
};

const SKY_DAY = ['#7cc8f2', '#bfe6fb', '#e6f6ff'], SKY_NIGHT = ['#0b1636', '#1d2d5c', '#34477a'], SKY_DUSK = ['#5a6ab8', '#f0a080', '#ffd8a0'];
function skyCols(n) {
  // day through a pink dusk to night
  const d = n < 0.5 ? n * 2 : (n - 0.5) * 2;
  return [0, 1, 2].map(i => n < 0.5 ? mix(SKY_DAY[i], SKY_DUSK[i], d * 0.8) : mix(mix(SKY_DAY[i], SKY_DUSK[i], 0.8), SKY_NIGHT[i], d));
}

const House = {
  _key: null,
  // the whole background, onto the canvas behind the game
  paint() {
    const bg = document.getElementById('bgc');
    if (!bg) return;
    // which furniture in view is still, and how it looks: part of what the background shows
    const v = Cam.view();
    let sig = '';
    for (const f of World.fixtures) {
      const seen = f.x1 >= v.x0 - 40 && f.x0 <= v.x1 + 40 && f.y1 >= v.y0 - 220 && f.y0 <= v.y1 + 40;
      f._static = seen && f.isStatic();
      if (f._static) sig += f.id + f.staticKey() + ';';
    }
    const key = [G.W, G.H, G.dpr, Cam.x.toFixed(1), Cam.y.toFixed(1), Cam.s.toFixed(4), Math.round(World.night * 30), sig].join(',');
    if (key === this._key) return;
    this._key = key;
    const W = Math.round(G.W * G.dpr), H = Math.round(G.H * G.dpr);
    if (bg.width !== W || bg.height !== H) { bg.width = W; bg.height = H; }
    const g = bg.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    // sky, in screen space
    const n = World.night, sc = skyCols(n);
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, sc[0]); gr.addColorStop(0.6, sc[1]); gr.addColorStop(1, sc[2]);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    Cam.apply(g);
    this.drawWorld(g, v);
    const still = World.fixtures.filter(f => f._static).sort((a, b) => a.z - b.z);
    for (const f of still) { g.save(); f.drawStatic(g); g.restore(); }
  },
  drawWorld(g, v) {
    const n = World.night;
    // stars and the moon, the sun, clouds
    if (n > 0.05) {
      const f = seeded(77);
      g.fillStyle = rgba('#fff8d8', n);
      for (let i = 0; i < 160; i++) {
        const x = WORLD.x0 + f() * (WORLD.x1 - WORLD.x0), y = WORLD.y0 + f() * 1500, r = 3 + f() * 5;
        if (x < v.x0 - 10 || x > v.x1 + 10 || y < v.y0 - 10 || y > v.y1 + 10) continue;
        g.beginPath(); starPath(g, x, y, r * 1.8, r * 0.7, 4); g.fill();
      }
    }
    const sunX = GARDEN_X + 2300, sunY = lerp(-420, 700, n);
    if (n < 0.95) {
      g.save(); g.globalAlpha = 1 - n;
      g.fillStyle = 'rgba(255,240,150,0.35)'; g.beginPath(); g.arc(sunX, sunY, 260, 0, TAU); g.fill();
      g.beginPath(); g.arc(sunX, sunY, 150, 0, TAU); g.fillStyle = '#ffd84a'; g.fill(); g.lineWidth = 10; g.strokeStyle = '#e89a2a'; g.stroke();
      g.restore();
    }
    if (n > 0.05) {
      const mx = GARDEN_X + 1000, my = lerp(500, -480, n);
      g.save(); g.globalAlpha = n;
      g.fillStyle = 'rgba(255,250,220,0.18)'; g.beginPath(); g.arc(mx, my, 240, 0, TAU); g.fill();
      g.beginPath(); g.arc(mx, my, 130, 0, TAU); g.fillStyle = '#fff4c8'; g.fill(); g.lineWidth = 10; g.strokeStyle = '#d8c890'; g.stroke();
      g.fillStyle = 'rgba(200,190,150,0.55)'; [[-40, -30, 26], [35, 20, 18], [-10, 50, 14]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(mx + dx, my + dy, r, 0, TAU); g.fill(); });
      g.restore();
    }
    // clouds drift slowly
    const ct = World.t * 6;
    g.fillStyle = rgba(n > 0.5 ? '#5a6a9a' : '#ffffff', n > 0.5 ? 0.5 : 0.92);
    for (let i = 0; i < 9; i++) {
      const span = WORLD.x1 - WORLD.x0 + 1600, x = WORLD.x0 - 800 + ((i * 1370 + ct * (1 + i % 3 * 0.4)) % span), y = -650 + (i % 4) * 230 + (i % 2) * 90;
      if (x + 400 < v.x0 || x - 400 > v.x1 || y + 200 < v.y0 || y - 200 > v.y1) continue;
      g.beginPath(); cloudPath(g, x, y, 150 + (i % 3) * 40, 7, i + 3); g.fill();
    }
    // distant hills behind everything
    const hillY = GROUND_TOP + 640;
    g.fillStyle = mix('#8fd27a', '#22385a', n * 0.85);
    g.beginPath(); g.moveTo(WORLD.x0, GROUND_Y);
    for (let x = WORLD.x0; x <= WORLD.x1; x += 120) g.lineTo(x, hillY - 120 - Math.sin(x * 0.0021) * 110 - Math.sin(x * 0.0057 + 1) * 50);
    g.lineTo(WORLD.x1, GROUND_Y); g.closePath(); g.fill();
    g.fillStyle = mix('#6cc25a', '#1a2e4a', n * 0.85);
    g.beginPath(); g.moveTo(WORLD.x0, GROUND_Y);
    for (let x = WORLD.x0; x <= WORLD.x1; x += 100) g.lineTo(x, hillY + 60 - Math.sin(x * 0.003 + 2) * 70);
    g.lineTo(WORLD.x1, GROUND_Y); g.closePath(); g.fill();
    this.drawHouse(g, v);
    // the ground under it all
    g.fillStyle = '#6cc04a'; g.fillRect(WORLD.x0 - 4000, GROUND_Y - 10, WORLD.x1 - WORLD.x0 + 8000, 50);
    g.fillStyle = '#8a5a34'; g.fillRect(WORLD.x0 - 4000, GROUND_Y + 40, WORLD.x1 - WORLD.x0 + 8000, 6000);
    g.fillStyle = '#74482a';
    const f = seeded(5);
    for (let i = 0; i < 70; i++) { const x = WORLD.x0 + f() * (WORLD.x1 - WORLD.x0), y = GROUND_Y + 70 + f() * 160; if (x > v.x0 - 30 && x < v.x1 + 30) { g.beginPath(); g.ellipse(x, y, 14 + f() * 16, 7 + f() * 6, 0, 0, TAU); g.fill(); } }
    g.lineWidth = 8; g.strokeStyle = PLINE; g.beginPath(); g.moveTo(WORLD.x0, GROUND_Y + 40); g.lineTo(WORLD.x1, GROUND_Y + 40); g.stroke();
  },
  drawHouse(g, v) {
    const L = -WALL, R = HOUSE_COLS * RW + (HOUSE_COLS - 1) * WALL + WALL, T = -70;
    // roof: rows of rounded red tiles, eaves over the walls
    const ex = 170, apexY = -760, baseY = T + 10, mid = (L + R) / 2;
    g.save();
    g.beginPath(); g.moveTo(L - ex, baseY); g.lineTo(mid, apexY); g.lineTo(R + ex, baseY); g.closePath();
    g.fillStyle = '#d8553a'; g.fill();
    g.clip();
    const rows = 9;
    for (let r = 0; r < rows; r++) {
      const y = apexY + (baseY - apexY) * (r + 1) / rows, tw = 90;
      g.fillStyle = r % 2 ? '#e2654a' : '#cc4a30';
      for (let x = L - ex - (r % 2) * tw / 2; x < R + ex; x += tw) {
        g.beginPath(); g.moveTo(x, y - 80); g.lineTo(x, y - 10); g.quadraticCurveTo(x + tw / 2, y + 22, x + tw, y - 10); g.lineTo(x + tw, y - 80); g.closePath(); g.fill();
        g.lineWidth = 4; g.strokeStyle = 'rgba(110,30,20,0.6)'; g.beginPath(); g.moveTo(x, y - 10); g.quadraticCurveTo(x + tw / 2, y + 22, x + tw, y - 10); g.stroke();
      }
    }
    g.restore();
    g.beginPath(); g.moveTo(L - ex, baseY); g.lineTo(mid, apexY); g.lineTo(R + ex, baseY); g.closePath();
    g.lineWidth = 12; g.strokeStyle = PLINE; g.lineJoin = 'round'; g.stroke();
    // an attic window in the roof
    const aw = 220, ay = -380;
    g.beginPath(); g.arc(mid, ay, aw / 2, 0, TAU); g.fillStyle = '#f6efe0'; g.fill(); g.lineWidth = 10; g.strokeStyle = PLINE; g.stroke();
    g.beginPath(); g.arc(mid, ay, aw / 2 - 22, 0, TAU); g.fillStyle = World.night > 0.5 ? '#ffd870' : '#8fd3f4'; g.fill(); g.lineWidth = 6; g.stroke();
    g.beginPath(); g.moveTo(mid - aw / 2 + 22, ay); g.lineTo(mid + aw / 2 - 22, ay); g.moveTo(mid, ay - aw / 2 + 22); g.lineTo(mid, ay + aw / 2 - 22); g.lineWidth = 8; g.strokeStyle = '#f6efe0'; g.stroke();
    // chimney
    const cx = mid + 1200, cTop = -900, cBot = apexY + (baseY - apexY) * ((cx - mid) / (R + ex - mid)) * 1 + 40;
    g.fillStyle = '#b8503a'; g.fillRect(cx - 90, cTop, 180, cBot - cTop);
    g.fillStyle = 'rgba(80,20,10,0.35)'; for (let y = cTop + 30; y < cBot; y += 50) g.fillRect(cx - 90, y, 180, 6);
    g.lineWidth = 10; g.strokeStyle = PLINE; g.strokeRect(cx - 90, cTop, 180, cBot - cTop);
    g.fillStyle = '#8a3a2a'; g.fillRect(cx - 110, cTop - 40, 220, 50); g.strokeRect(cx - 110, cTop - 40, 220, 50);
    if (World.fireOn) { const t = World.t; for (let i = 0; i < 4; i++) { const k = ((t * 0.3 + i / 4) % 1); g.fillStyle = rgba('#e8e8e8', 0.55 * (1 - k)); g.beginPath(); g.arc(cx + Math.sin(k * 6 + i) * 40, cTop - 60 - k * 360, 40 + k * 70, 0, TAU); g.fill(); } }
    // rooms
    for (const r of World.rooms) {
      if (r.x > v.x1 || r.x + r.w < v.x0 || r.y - 300 > v.y1 || r.y + r.h < v.y0) continue;
      const B = BACKDROPS[r.bg], im = Backdrops.img[r.bg];
      if (!Backdrops.ok(r.bg)) { g.fillStyle = r.outdoor ? '#7ac85a' : '#efe2c8'; g.fillRect(r.x, r.y, r.w, r.h); continue; }
      if (r.outdoor) {
        const h = r.w * B.h / B.w;
        g.drawImage(im, r.x, r.y + r.h - h, r.w, h);
      } else g.drawImage(im, r.x, r.y, r.w, r.h);
    }
    // walls and floors between the rooms
    const wood = (x, y, w, h) => {
      const gr = g.createLinearGradient(0, y, 0, y + h);
      gr.addColorStop(0, '#d8a46a'); gr.addColorStop(0.45, '#b97f48'); gr.addColorStop(1, '#8a5530');
      g.fillStyle = gr; g.fillRect(x, y, w, h);
      g.lineWidth = 6; g.strokeStyle = PLINE; g.strokeRect(x, y, w, h);
    };
    const plaster = (x, y, w, h) => {
      const gr = g.createLinearGradient(x, 0, x + w, 0);
      gr.addColorStop(0, '#fff4dc'); gr.addColorStop(0.5, '#f2e2c2'); gr.addColorStop(1, '#dcc8a2');
      g.fillStyle = gr; g.fillRect(x, y, w, h);
      g.lineWidth = 6; g.strokeStyle = PLINE; g.strokeRect(x, y, w, h);
    };
    for (let c = 0; c <= HOUSE_COLS; c++) {
      const x = c * (RW + WALL) - WALL;
      plaster(x, T, WALL, GROUND_Y - T);
    }
    wood(L, T, R - L, -T);                         // the ceiling under the roof
    wood(L, RH, R - L, SLAB);                       // the floor between upstairs and down
    wood(L - 20, GROUND_Y - 6, R - L + 40, 46);     // the foundation
  },
};

/* ---------- src/input.js ---------- */
/* input.js — fingers. Each finger is one of: on a button, holding a thing (picked up once it has
   moved a little; a quick touch without moving is a tap), on a piece of furniture (a tap), or
   swiping the camera. Several fingers can carry several things at once. */

const Input = {
  ptrs: {},
  heldThings() { const out = []; for (const k in this.ptrs) { const P = this.ptrs[k]; if (P.grabbed && P.thing) out.push(P.thing); } return out; },
  heldPtr() { for (const k in this.ptrs) { const P = this.ptrs[k]; if (P.grabbed) return P; } return null; },
  panning() { for (const k in this.ptrs) if (this.ptrs[k].mode === 'pan') return true; return false; },
  down(p) {
    const [wx, wy] = Cam.toWorld(p.x, p.y);
    const P = { id: p.id, x: p.x, y: p.y, sx: p.x, sy: p.y, t0: G.t, lx: p.x, ly: p.y, mode: null, moved: false };
    this.ptrs[p.id] = P;
    const b = UI.buttonAt(p.x, p.y);
    if (b) { P.mode = 'button'; P.button = b; b.down = true; SFX.play('tap'); return; }
    if (UI.panelOpen) { P.mode = 'panel'; UI.panelDown(p.x, p.y); return; }
    if (Cam.tw && Cam.mode === 'house') { P.mode = 'none'; return; }
    const slop = 26 / Cam.s;
    const t = World.thingAt(wx, wy, Cam.mode === 'house' ? 4 / Cam.s : slop);
    if (t && Object.values(this.ptrs).some(Q => Q !== P && Q.thing === t)) { P.mode = 'none'; return; }
    if (t) { P.mode = 'thing'; P.thing = t; P.wx = wx; P.wy = wy; P.house = Cam.mode === 'house'; t.sqv = Math.min(t.sqv, -2.5); return; }
    if (Cam.mode === 'house') { P.mode = 'house'; P.wx = wx; P.wy = wy; return; }
    const fh = World.fixtureAt(wx, wy);
    if (fh) { P.mode = 'fixture'; P.fixture = fh.f; P.part = fh.part; P.wx = wx; P.wy = wy; return; }
    P.mode = Cam.mode === 'house' ? 'house' : 'empty';
    P.wx = wx; P.wy = wy;
  },
  move(p) {
    const P = this.ptrs[p.id]; if (!P) return;
    const dt = Math.max(1 / 240, G.t - (P.mt || P.t0)); P.mt = G.t;
    const ddx = p.x - P.x, ddy = p.y - P.y;
    P.x = p.x; P.y = p.y;
    const far = Math.hypot(p.x - P.sx, p.y - P.sy);
    if (P.mode === 'button') { P.button.down = UI.hit(P.button, p.x, p.y); return; }
    if (P.mode === 'thing') {
      if (!P.grabbed && far > 9) {
        if (P.thing.gone || P.thing.held || P.thing.state === 'hand') { P.mode = 'none'; return; }
        P.grabbed = true; P.moved = true; P.thing.grab(P); SFX.play('pickup');
      }
      return;
    }
    if ((P.mode === 'fixture' || P.mode === 'empty') && far > 16 && Cam.mode === 'room') {
      // a swipe that started on furniture or on nothing moves the camera
      P.mode = 'pan'; P.moved = true; Cam.panStart();
    }
    if (P.mode === 'house' && far > 16) P.moved = true;
    if (P.mode === 'pan') Cam.panBy(ddx, ddy, dt);
  },
  up(p, cancel) {
    const P = this.ptrs[p.id]; if (!P) return;
    delete this.ptrs[p.id];
    if (P.mode === 'button') {
      P.button.down = false;
      const swallow = UI.swallowTap; UI.swallowTap = false;      // the long press that opened the grown-ups' page
      if (!swallow && !cancel && UI.hit(P.button, p.x, p.y) && P.button.onTap) P.button.onTap();
      return;
    }
    if (P.mode === 'panel') { if (!cancel) UI.panelTap(p.x, p.y); return; }
    if (P.mode === 'thing') {
      if (P.grabbed) { P.thing.release(); SFX.play('drop'); }
      else if (!cancel && P.house) this.goRoomAt(P.wx, P.wy);
      else if (!cancel && !P.thing.gone) P.thing.tap();
      return;
    }
    if (P.mode === 'fixture' && !cancel) { P.fixture.tap(P.part.name, P.wx, P.wy); return; }
    if (P.mode === 'pan') { if (!this.panning()) Cam.panEnd(); return; }
    if (P.mode === 'house' && !cancel && !P.moved) { this.goRoomAt(P.wx, P.wy); return; }
    if (P.mode === 'empty' && !cancel) {
      // a tap on nothing: a little sparkle where the finger was
      Parts.add('sparkle', P.wx, P.wy, { size: 18, life: 0.5, layer: 1 });
      SFX.play('blip');
    }
  },
  goRoomAt(wx, wy) {
    const r = World.roomAt(wx, wy) || World.nearestRoom(wx, wy);
    const st = Cam.stops().filter(s => s.room === r).sort((a, b) => Math.abs(a.x - wx) - Math.abs(b.x - wx))[0];
    if (st) { Cam.goStop(st); SFX.play('whoosh', { dur: 0.5, f0: 300, f1: 1200 }); }
  },
  // every frame: held things follow their fingers (the camera may be moving under them)
  update(dt) {
    for (const k in this.ptrs) {
      const P = this.ptrs[k];
      if (P.grabbed && P.thing && !P.thing.gone) { const [wx, wy] = Cam.toWorld(P.x, P.y); P.thing.follow(wx, wy, dt); }
    }
  },
};

/* ---------- src/ui.js ---------- */
/* ui.js — the few buttons on screen (all pictures, no words): the house (see the whole
   dollhouse), the sun and moon (day or night). Holding the house button for three seconds opens
   the grown-ups' page: skin tones, sound and voice, and tidying the house back to its first day. */

const FONT = '"Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", sans-serif';
const UI = {
  buttons: [], panelOpen: false, holdT: 0,
  init() {
    this.buttons = [
      { id: 'house', r: 38, col: '#ffcf4a', draw: (ctx, r) => Cam.mode === 'house' ? iconBack(ctx, r) : iconHouse(ctx, r), onTap: () => { if (Cam.mode === 'house') Cam.goStop(Cam.stop || Cam.nearestStop(Cam.x, Cam.y)); else Cam.goHouse(); } },
      { id: 'sky', r: 38, col: '#8fd3f4', draw: (ctx, r) => iconSky(ctx, r, World.night), onTap: () => World.setNight(World.nightTo < 0.5) },
    ];
    this.layout();
  },
  layout() {
    const m = 14, r = clamp(Math.min(G.W, G.H) * 0.055, 30, 44);
    const [b0, b1] = this.buttons;
    b0.r = b1.r = r;
    b0.x = G.safe.l + m + r; b0.y = G.safe.t + m + r;
    b1.x = G.W - G.safe.r - m - r; b1.y = G.safe.t + m + r;
  },
  hit(b, x, y) { return dist(x, y, b.x, b.y) <= b.r * 1.2; },
  buttonAt(x, y) { if (this.panelOpen) return null; return this.buttons.find(b => this.hit(b, x, y)) || null; },
  update(dt) {
    const h = this.buttons[0];
    if (h.down) { this.holdT += dt; if (this.holdT > 3 && !this.panelOpen) { this.openPanel(); h.down = false; this.holdT = 3; } }
    else this.holdT = 0;     // (the button's tap has already looked at it by now)
    for (const b of this.buttons) b.k = lerp(b.k || 1, b.down ? 0.86 : 1, Math.min(1, dt * 20));
  },
  draw(ctx) {
    ctx.save(); ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    for (const b of this.buttons) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.k || 1, b.k || 1);
      ctx.fillStyle = 'rgba(40,20,60,0.22)'; ctx.beginPath(); ctx.ellipse(0, b.r * 0.95, b.r * 0.85, b.r * 0.22, 0, 0, TAU); ctx.fill();
      const g = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.45, b.r * 0.05, 0, 0, b.r * 1.05);
      const col = b.id === 'sky' ? (World.night > 0.5 ? '#3a4a8a' : '#8fd3f4') : b.col;
      g.addColorStop(0, lighten(col, 0.5)); g.addColorStop(0.6, col); g.addColorStop(1, darken(col, 0.12));
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = Math.max(3, b.r * 0.1); ctx.strokeStyle = PLINE; ctx.stroke();
      b.draw(ctx, b.r);
      if (b.id === 'house' && this.holdT > 0.6 && b.down) {   // the grown-ups' hold: a ring fills up
        ctx.beginPath(); ctx.arc(0, 0, b.r * 1.18, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, (this.holdT - 0.6) / 2.4)); ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      }
      ctx.restore();
    }
    if (this.panelOpen) this.drawPanel(ctx);
    ctx.restore();
  },
  /* ---------- the grown-ups' page ---------- */
  openPanel() { this.panelOpen = true; this.holdT = 0; this.swallowTap = true; SFX.play('ding'); },
  panelRects() {
    const w = Math.min(G.W - 40, 760), h = Math.min(G.H - 40, 430), x = (G.W - w) / 2, y = (G.H - h) / 2;
    const fam = World.people().filter(p => FAMILY.some(f => f.id === p.who));
    const cw = (w - 40) / Math.max(1, fam.length);
    const people = fam.map((p, i) => ({ p, x: x + 20 + cw * i, y: y + 70, w: cw, h: h * 0.42 }));
    const row = y + h * 0.42 + 100, bw = (w - 80) / 3;
    return {
      x, y, w, h, people,
      sound: { x: x + 20, y: row, w: bw, h: 70 }, voice: { x: x + 40 + bw, y: row, w: bw, h: 70 }, tidy: { x: x + 60 + bw * 2, y: row, w: bw, h: 70 },
      close: { x: x + w - 60, y: y + 10, w: 50, h: 50 },
    };
  },
  drawPanel(ctx) {
    const R = this.panelRects();
    ctx.fillStyle = 'rgba(20,14,30,0.55)'; ctx.fillRect(0, 0, G.W, G.H);
    ctx.beginPath(); rrect(ctx, R.x, R.y, R.w, R.h, 24); ctx.fillStyle = '#fff8ec'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = PLINE; ctx.stroke();
    ctx.fillStyle = PLINE; ctx.font = 'bold 22px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('For grown-ups', R.x + 24, R.y + 34);
    ctx.font = '15px ' + FONT; ctx.fillStyle = '#6a5a6a';
    ctx.fillText('Tap a person to change their skin tone.', R.x + 24, R.y + 62);
    for (const c of R.people) {
      const p = c.p, k = Math.min(c.w / 170, c.h / 330);
      ctx.save(); ctx.beginPath(); ctx.rect(c.x, c.y, c.w, c.h); ctx.clip();
      ctx.translate(c.x + c.w / 2, c.y + c.h - 10 - (p.B.leg + p.footH) * k); ctx.scale(k, k);
      drawPerson(ctx, p.look, { legs: 'stand', armL: [0.14, 0.15], armR: [0.14, 0.15], face: { mouth: 'smile' } });
      ctx.restore();
    }
    const btn = (b, label, on) => {
      ctx.beginPath(); rrect(ctx, b.x, b.y, b.w, b.h, 18); ctx.fillStyle = on === false ? '#e8dcd0' : '#ffd84a'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = PLINE; ctx.stroke();
      ctx.fillStyle = PLINE; ctx.font = 'bold 18px ' + FONT; ctx.textAlign = 'center'; ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2);
    };
    btn(R.sound, SFX.on ? 'Sound: on' : 'Sound: off', SFX.on);
    btn(R.voice, Say.on ? 'Voice: on' : 'Voice: off', Say.on);
    btn(R.tidy, this.tidyArmed ? 'Tap again to tidy' : 'Tidy the house', true);
    ctx.beginPath(); ctx.arc(R.close.x + 25, R.close.y + 25, 22, 0, TAU); ctx.fillStyle = '#ff8a7a'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = PLINE; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R.close.x + 16, R.close.y + 16); ctx.lineTo(R.close.x + 34, R.close.y + 34); ctx.moveTo(R.close.x + 34, R.close.y + 16); ctx.lineTo(R.close.x + 16, R.close.y + 34); ctx.lineWidth = 5; ctx.stroke();
  },
  panelDown() {},
  panelTap(x, y) {
    const R = this.panelRects(), inR = b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
    if (inR(R.close) || !inR(R)) { this.panelOpen = false; this.tidyArmed = false; return; }
    for (const c of R.people) if (inR(c)) { c.p.look.skin = (c.p.look.skin + 1) % SKINS.length; Store.skins[c.p.who] = c.p.look.skin; Store.saveSettings(); World.dirty = true; SFX.play('pop'); return; }
    if (inR(R.sound)) { SFX.on = !SFX.on; Store.saveSettings(); return; }
    if (inR(R.voice)) { Say.on = !Say.on; Store.saveSettings(); return; }
    if (inR(R.tidy)) { if (this.tidyArmed) { this.tidyArmed = false; this.panelOpen = false; Game.tidy(); } else this.tidyArmed = true; return; }
  },
};

/* ---------- button pictures ---------- */
function iconHouse(ctx, r) {
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = r * 0.09; ctx.strokeStyle = PLINE;
  ctx.beginPath(); ctx.moveTo(-r * 0.55, -r * 0.05); ctx.lineTo(0, -r * 0.55); ctx.lineTo(r * 0.55, -r * 0.05); ctx.closePath(); ctx.fillStyle = '#e8553a'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); rrect(ctx, -r * 0.42, -r * 0.08, r * 0.84, r * 0.58, r * 0.06); ctx.fillStyle = '#fff4dc'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); rrect(ctx, -r * 0.12, r * 0.12, r * 0.24, r * 0.38, r * 0.05); ctx.fillStyle = '#4aa0f0'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); rrect(ctx, r * 0.16, r * 0.02, r * 0.18, r * 0.16, r * 0.03); ctx.fillStyle = '#ffe08a'; ctx.fill(); ctx.lineWidth = r * 0.06; ctx.stroke();
  ctx.restore();
}
function iconBack(ctx, r) {
  // a magnifying-glass-free way to say "go in": a room with a person in it
  ctx.save(); ctx.lineWidth = r * 0.09; ctx.strokeStyle = PLINE; ctx.lineJoin = 'round';
  ctx.beginPath(); rrect(ctx, -r * 0.55, -r * 0.42, r * 1.1, r * 0.84, r * 0.12); ctx.fillStyle = '#bfe6fb'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#d8a46a'; ctx.fillRect(-r * 0.5, r * 0.18, r * 1.0, r * 0.2);
  ctx.beginPath(); ctx.arc(0, -r * 0.08, r * 0.16, 0, TAU); ctx.fillStyle = '#f7cba6'; ctx.fill(); ctx.lineWidth = r * 0.06; ctx.stroke();
  ctx.beginPath(); rrect(ctx, -r * 0.13, r * 0.06, r * 0.26, r * 0.22, r * 0.06); ctx.fillStyle = '#ff6aa8'; ctx.fill(); ctx.stroke();
  ctx.restore();
}
function iconSky(ctx, r, n) {
  ctx.save(); ctx.lineWidth = r * 0.08; ctx.strokeStyle = PLINE;
  if (n < 0.5) {
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42); ctx.lineTo(Math.cos(a) * r * 0.66, Math.sin(a) * r * 0.66); ctx.lineCap = 'round'; ctx.strokeStyle = '#e89a2a'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, TAU); ctx.fillStyle = '#ffd84a'; ctx.fill(); ctx.strokeStyle = PLINE; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.arc(r * 0.2, -r * 0.12, r * 0.36, 0, TAU, true);
    ctx.fillStyle = '#fff4c8'; ctx.fill('evenodd');
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0.55, TAU - 0.95); ctx.stroke();
    ctx.fillStyle = '#fff4c8'; [[r * 0.35, -r * 0.4, 0.09], [r * 0.5, r * 0.2, 0.06]].forEach(([x, y, s]) => { ctx.beginPath(); starPath(ctx, x, y, r * s * 1.6, r * s * 0.6, 4); ctx.fill(); });
  }
  ctx.restore();
}

/* ---------- src/store.js ---------- */
/* store.js — the house is kept on this device: where everything was left, who was wearing what,
   whether it was night. Saved a few seconds after anything changes, and when the app is put away.
   Grown-up settings (sound, voice, skin tones) are kept apart so tidying the house keeps them. */

const SAVE_KEY = 'rumpushouse.v1', SETTINGS_KEY = 'rumpushouse.settings';
const Store = {
  skins: {}, saveT: 0,
  loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      if (s.sound === false) SFX.on = false;
      if (s.voice === false) Say.on = false;
      this.skins = s.skins || {};
    } catch (e) {}
  },
  saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ sound: SFX.on, voice: Say.on, skins: this.skins })); } catch (e) {} },
  loadHouse() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  saveHouse() { if (G.test && !G.testSave) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(World.save())); World.dirty = false; } catch (e) {} },
  clearHouse() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  update(dt) {
    if (!World.dirty) { this.saveT = 0; return; }
    this.saveT += dt;
    if (this.saveT > 4 && !Input.heldPtr()) { this.saveT = 0; this.saveHouse(); }
  },
};

/* ---------- src/main.js ---------- */
/* main.js — the canvas, the clock, fingers and starting up. Loaded last. */

const G = { W: 800, H: 600, dpr: 1, safe: { l: 0, t: 0, r: 0, b: 0 }, t: 0, test: false, started: false };

/* ---------- canvas and size ---------- */
const canvas = document.getElementById('cc');
const ctx = canvas.getContext('2d');
function readSafe() {
  const p = document.getElementById('safe');
  if (!p) return;
  const cs = getComputedStyle(p);
  G.safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function resize() {
  const r = canvas.getBoundingClientRect();
  G.W = Math.max(320, Math.round(r.width)); G.H = Math.max(300, Math.round(r.height));
  // sharp, but within a pixel budget: a big iPad at full density would paint 5 million pixels a frame
  G.dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3.4e6 / (G.W * G.H))));
  canvas.width = Math.round(G.W * G.dpr); canvas.height = Math.round(G.H * G.dpr);
  readSafe();
  if (G.started) { UI.layout(); if (Cam.mode === 'house') Cam.set(Cam.clampView(Cam.houseView())); else if (Cam.stop) Cam.goStop(Cam.stop, true); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- the game ---------- */
const Game = {
  // build the house: rooms, furniture, then either the saved house or a new one
  build(fresh) {
    World.init();
    buildRooms();
    const saved = fresh ? null : Store.loadHouse();
    let ok = false;
    if (saved) { try { ok = World.load(saved); } catch (e) { console.warn('the saved house could not be read; starting afresh', e); } }
    if (!ok) {
      if (saved) { World.init(); buildRooms(); Store.clearHouse(); }
      stockHouse();
    }
    for (const p of World.people()) if (Store.skins[p.who] !== undefined) p.look.skin = Store.skins[p.who];
    World.dirty = false;
  },
  tidy() {
    Sound.stopAll();
    Store.clearHouse();
    this.build(true);
    Cam.goRoom(World.room('living'), true);
    SFX.play('jingle');
  },
};

/* ---------- the frame ---------- */
function update(dt) {
  if (!G.started) return;
  G.t += dt;
  Input.update(dt);
  Cam.update(dt);
  World.update(dt);
  UI.update(dt);
  Store.update(dt);
  Sound.update(dt);
}
function draw() {
  if (!G.started) { drawLoading(); return; }
  House.paint();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  Cam.apply(ctx);
  const v = Cam.view();
  World.draw(ctx, v);
  Parts.draw(ctx, 0); Parts.draw(ctx, 1);
  Light.draw(ctx);
  Cam.apply(ctx);
  World.drawHeld(ctx);
  UI.draw(ctx);
}
function drawLoading() {
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.fillStyle = '#bfe6fb'; ctx.fillRect(0, 0, G.W, G.H);
  const p = Art.progress(), w = Math.min(G.W * 0.6, 360), x = (G.W - w) / 2, y = G.H * 0.6;
  ctx.save(); ctx.translate(G.W / 2, G.H * 0.38); iconHouse(ctx, Math.min(G.W, G.H) * 0.14); ctx.restore();
  ctx.beginPath(); rrect(ctx, x, y, w, 26, 13); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = PLINE; ctx.stroke();
  ctx.beginPath(); rrect(ctx, x + 4, y + 4, Math.max(18, (w - 8) * p), 18, 9); ctx.fillStyle = '#69c95c'; ctx.fill();
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - (last || now)) / 1000));
  last = now;
  update(dt); draw();
}

/* ---------- fingers ---------- */
function pt(e) { const r = canvas.getBoundingClientRect(); return { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top }; }
function firstTouch() { SFX.unlock(); if (!G.saidHello) { G.saidHello = true; Say.init(); } }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); firstTouch();
  if (!G.started) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
  Input.down(pt(e));
});
canvas.addEventListener('pointermove', e => { e.preventDefault(); if (G.started) Input.move(pt(e)); });
canvas.addEventListener('pointerup', e => { e.preventDefault(); SFX.unlock(); if (G.started) Input.up(pt(e), false); });
canvas.addEventListener('pointercancel', e => { if (G.started) Input.up(pt(e), true); });
// no pinch-zoom, no long-press menus, no scrolling the page about
['gesturestart', 'gesturechange', 'contextmenu'].forEach(n => document.addEventListener(n, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { SFX.suspend(); if (G.started) Store.saveHouse(); }
  else if (SFX.ctx) SFX.unlock();
});
window.addEventListener('pagehide', () => { if (G.started) Store.saveHouse(); });

/* ---------- start ---------- */
function start() {
  G.test = /[?&]test\b/.test(location.search);
  if (G.test) Rnd.f = seeded(1);
  G.testSave = /[?&]save(&|$)/.test(location.search);
  Store.loadSettings();
  resize();
  let pending = 2;
  const ready = () => {
    if (--pending) return;
    Game.build(G.test && !/[?&]keep\b/.test(location.search));
    UI.init();
    Cam.goRoom(World.room(G.test ? (new URLSearchParams(location.search).get('room') || 'living') : 'living'), true);
    G.started = true;
    if (G.test) testHooks();
  };
  Art.load(ready);
  Backdrops.load(ready);
  if (!G.test) requestAnimationFrame(frame);
  else drawLoading();
  if ('serviceWorker' in navigator && window.isSecureContext && window.top === window && !G.test) navigator.serviceWorker.register('sw.js').catch(() => {});
}

// a remote control for the test driver: step time by hand, move the camera, find things
function testHooks() {
  window.__rh = {
    step(sec, fps = 60) { const n = Math.round(sec * fps); for (let i = 0; i < n; i++) update(1 / fps); draw(); return n; },
    draw() { draw(); },
    room(id) { Cam.goRoom(World.room(id), true); update(0); draw(); return id; },
    house() { Cam.goHouse(); for (let i = 0; i < 60; i++) update(1 / 60); draw(); },
    toScreen(x, y) { return Cam.toScreen(x, y); },
    thing(pred) { const t = World.things.find(pred); return t ? { id: t.id, x: t.x, y: t.y, box: t.box(), state: t.state } : null; },
    world: World, cam: Cam,
  };
  draw();
  document.title = 'ready';
}
start();
</script>
