    setVol(v) { if (Math.abs(v - vol) < 0.02) return; vol = v; try { g.gain.setTargetAtTime(Math.max(0.0001, v), c.currentTime, 0.12); } catch (e) {} },
    stop(fade = 0.25) { try { const n = c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value, n); g.gain.linearRampToValueAtTime(0.0001, n + fade); nodes.forEach(x => { try { x.stop(n + fade + 0.05); } catch (e) {} }); if (this._iv) clearInterval(this._iv); } catch (e) {} },

/* ---------- Sound: running sounds belong to a thing in a room, and fade with distance ---------- */
const Sound = {
  loops: new Map(),
  loop(owner, key, name) {
    const k = owner.id + ':' + key, cur = this.loops.get(k);
    if (cur && cur.name === name) return;
    if (cur) { if (cur.h) cur.h.stop(0.3); this.loops.delete(k); }
    if (name) this.loops.set(k, { owner, name, h: SFX.loop(name) });
  },
  // tunes from the radio and the cot mobile are handles too
  track(owner, key, handle) {
    const k = owner.id + ':' + key, cur = this.loops.get(k);
    if (cur && cur.h && cur.h !== handle) cur.h.stop(0.3);
    if (handle) this.loops.set(k, { owner, name: key, h: handle, music: true }); else this.loops.delete(k);
  },
  volFor(owner) {
    const x = owner.x, y = owner.y - 20;
    if (Cam.mode === 'house') return 0.35;
    const r = World.nearestRoom(x, y), here = World.nearestRoom(Cam.x, Cam.y);
    if (r === here) return 1;
    const d = Math.hypot(r.cx - here.cx, (r.cy - here.cy) * 1.3);
    return d < 2000 ? 0.28 : 0.06;
  },
  update(dt) {
    for (const [k, L] of this.loops) {
      if (L.owner.gone) { if (L.h) L.h.stop(0.3); this.loops.delete(k); continue; }
      if (!L.h && !L.music && SFX.ctx && SFX.ctx.state === 'running') L.h = SFX.loop(L.name);   // sound came on after the first tap
      if (L.h && L.h.setVol) L.h.setVol(SFX.on ? this.volFor(L.owner) * (L.owner.vol === undefined ? 1 : L.owner.vol) : 0);
      if (L.music && L.h && L.h.playing === false) this.loops.delete(k);
    }
  },
  stopAll() { for (const [, L] of this.loops) if (L.h) L.h.stop(0.1); this.loops.clear(); },
};

/* ---------- src/speech.js ---------- */
/* speech.js — the device's own voice: the name of each thing as it is picked up (a word a
   two-year-old is learning), and a few words from the family ("Yummy!", "Night night!") pitched
   for whoever is talking. Never more than one thing at a time, never chattering. */
const Say = {
  voice: null, on: true, last: {}, busyT: 0,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pickVoice = () => {
      const vs = speechSynthesis.getVoices(), lang = (navigator.language || 'en-GB').toLowerCase();
      const en = vs.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
      const same = en.filter(v => v.lang.toLowerCase().replace('_', '-') === lang);
      const nice = l => l.find(v => /enhanced|premium|natural/i.test(v.name));
      this.voice = nice(same) || same[0] || nice(en) || en[0] || null;
    };
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  },
  say(text, o = {}) {
    if (!this.on || !text || !('speechSynthesis' in window) || G.test) return;
    try {
      const go = () => {
        const u = new SpeechSynthesisUtterance(text);
        if (this.voice) u.voice = this.voice;
        u.rate = o.rate || 0.92; u.pitch = clamp(o.pitch || 1.15, 0.1, 2); u.volume = 1;
        speechSynthesis.speak(u);
      };
      // iOS sometimes drops a word spoken straight after cancel(): give it a moment
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 60); } else go();
    } catch (e) {}
  },
  // a thing's name, not the same word again within a few seconds
  word(text) {
    const now = performance.now();
    if (!text || (this.last[text] && now - this.last[text] < 3500)) return;
    this.last[text] = now; this.lastAny = now;
    this.say(text, { rate: 0.9, pitch: 1.15 });
  },
  // a person talking: quieter priority than names (skipped if a name was said just now)
  line(text, pitch, rate) {
    const now = performance.now();
    if (this.lastAny && now - this.lastAny < 1800) return;
    this.lastAny = now;
    this.say(text, { pitch: clamp(0.55 + (pitch || 1) * 0.55, 0.4, 2), rate: 0.95 * (rate || 1) });
  },
};

/* ---------- src/music.js ---------- */
/* music.js — every tune in the house, made with Web Audio like every other sound here: no recordings.

   TUNES holds traditional melodies as text. A note is a name and octave (C4 is middle C; F#4, Bb3) or R for a rest,
   then ':beats' when it is not the tune's usual length. Beats are quarter notes, so in a 6/8 tune an eighth is 0.5,
   and that is the usual length there. '|' ends a bar; '!' marks a note the game wants to catch (the weasel's POP).
   chords has one bar per '|', split evenly unless a chord says ':beats'. words has one syllable per sung note, so
   the test can hold every bar against the lyrics. A short first bar is a pickup: the last bar is short by as much,
   so the tune loops without a stumble.

   Music.play() books notes ahead on the audio clock: every 50 ms it schedules whatever falls in the next 0.15 s, so
   a stuttering frame never knocks a tune off the beat. Each style is its own arrangement, not another waveform:
   radio is a little band (soft lead, two-beat bass, offbeat chords, light drums, all low-passed), musicbox a comb
   of tines over a rocking broken chord, piano two hands, tv a bright jingle band with claps and a glockenspiel. */

/* ---------- reading the text ---------- */
const _MU_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

// a melody -> notes with beat times, each bar's length (for the bar check) and anything it could not read
function _muParse(src, unit) {
  const notes = [], bars = [], bad = [];

  String(src || '').split('|').forEach(chunk => {
    let len = 0;
    chunk.trim().split(/\s+/).forEach(tok => {

      const m = /^(R|([A-G])(#|b)?(-?\d))(?::([\d.\/]+))?(!)?$/.exec(tok), d = m ? _muNum(m[5], unit) : 0;
      if (!m || !(d > 0)) { bad.push(tok); return; }

      t += d; len += d;
    });
    bars.push(len);

// chords, one bar per '|' laid over the melody's bars

    let sum = 0;
    toks.forEach(c => { if (!c.d) c.d = (len - fixed) / free; c.t = t; t += c.d; sum += c.d; list.push(c); });
    sums.push(sum);
  });
  return { list, bars: chunks.length, sums, bad };
}

const _muIn = (pc, lo) => lo + (((pc - lo) % 12) + 12) % 12;                       // pitch class pc in [lo, lo + 12)

function _muWave(c, name) {   // soft custom waveforms, made once per context

/* art.js — the painted pictures: loading the pages, drawing a picture at a size in the world,
   drawing part of one (a door cut out of a cupboard), tinted copies (blocks, books, curtains), and
   pre-scaled copies so a still picture costs a plain copy each frame. */

const Art = {
  pages: [], loaded: 0, failed: 0, ready: false, tints: {},
  load(done) {
    ART_PAGES.forEach((src, i) => {
      const im = new Image();
      im.onload = () => { this.loaded++; this.check(done); };
      im.onerror = () => { this.failed++; this.check(done); };
      im.src = src;
      this.pages[i] = im;
    });
  },
  check(done) { if (this.loaded + this.failed === ART_PAGES.length) { this.ready = true; if (done) done(); } },
  progress() { return (this.loaded + this.failed) / ART_PAGES.length; },
  has(pic) { return !!ART[pic]; },
  // the picture's own height in the world, and its width at that height
  h(pic) { const r = ART[pic]; return r ? r[5] : 100; },
  w(pic, h) { const r = ART[pic]; return r ? (h || r[5]) * r[3] / r[4] : 100; },
  aspect(pic) { const r = ART[pic]; return r ? r[3] / r[4] : 1; },
  src(pic) { const r = ART[pic], pg = r && this.pages[r[0]]; return pg && pg.complete && pg.naturalWidth ? pg : null; },
  // into the box x, y, w, h (top left), whole
  rect(ctx, pic, x, y, w, h) {
    const r = ART[pic], pg = this.src(pic);
    if (!pg) return;
    ctx.drawImage(pg, r[1], r[2], r[3], r[4], x, y, w, h);
  },
  // standing on (x, y) at height h: the bottom middle of the picture on the point
  stand(ctx, pic, x, y, h, flip) {
    const w = this.w(pic, h);
    if (flip) { ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1); this.rect(ctx, pic, -w / 2, -h, w, h); ctx.restore(); }
    else this.rect(ctx, pic, x - w / 2, y - h, w, h);
  },
  // centred on (x, y), its longer side `size`, turned by rot
  centre(ctx, pic, x, y, size, rot) {
    const r = ART[pic]; if (!r) return;
    const k = size / Math.max(r[3], r[4]), w = r[3] * k, h = r[4] * k;
    if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); this.rect(ctx, pic, -w / 2, -h / 2, w, h); ctx.restore(); }
    else this.rect(ctx, pic, x - w / 2, y - h / 2, w, h);
  },
  // part of a picture: u0..u1, v0..v1 are fractions of its width and height, drawn into the box
  part(ctx, pic, u0, v0, u1, v1, x, y, w, h) {
    const r = ART[pic], pg = this.src(pic);
    if (!pg) return;
    const sx = r[1] + r[3] * u0, sy = r[2] + r[4] * v0, sw = r[3] * (u1 - u0), sh = r[4] * (v1 - v0);
    if (sw < 0.5 || sh < 0.5) return;
    ctx.drawImage(pg, sx, sy, sw, sh, x, y, w, h);
  },
  // a canvas copy of a picture at px pixels high (cached), tinted by multiplying with col if given
  copy(pic, px, col) {
    px = Math.max(8, Math.round(px));
    const key = pic + '@' + px + (col || '');
    let c = this.tints[key];
    if (c) return c;
    const r = ART[pic], pg = this.src(pic);
    if (!pg) return null;
    const w = Math.max(1, Math.round(px * r[3] / r[4]));
    c = makeCanvas(w, px); const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(pg, r[1], r[2], r[3], r[4], 0, 0, w, px);
    if (col) {
      g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, w, px);
      g.globalCompositeOperation = 'destination-in'; g.drawImage(pg, r[1], r[2], r[3], r[4], 0, 0, w, px);
    }
    this.tints[key] = c;
    return c;
  },
  // a pre-scaled copy for the current zoom: a still prop costs one plain copy a frame. While the
  // camera zooms the cache would thrash, so moving cameras draw straight from the page.
  blitCache: new Map(),
  standFast(ctx, pic, x, y, h, col, flip) {
    const w = this.w(pic, h);
    if (!col && (Cam.moving || !this.ready)) { this.stand(ctx, pic, x, y, h, flip); return; }
    const px = Math.max(8, Math.round(h * Cam.ppu / 6) * 6);
    const key = pic + '#' + px + (col || '');
    let c = this.blitCache.get(key);
    if (c) { this.blitCache.delete(key); this.blitCache.set(key, c); }
    else {
      c = this.copy(pic, col ? Math.min(px, 512) : px, col);
      if (!c) return;
      if (!col) delete this.tints[pic + '@' + px];
      this.blitCache.set(key, c);
      if (this.blitCache.size > 180) this.blitCache.delete(this.blitCache.keys().next().value);
    }
    if (flip) { ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1); ctx.drawImage(c, -w / 2, -h, w, h); ctx.restore(); }
    else ctx.drawImage(c, x - w / 2, y - h, w, h);
  },
};

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function copyCanvas(src) { const c = makeCanvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); return c; }
// the painted part of a sprite: the whole copy, as every picture is cut tight to its paint. Never
// read back from the pixels: where the pictures count as from another address (the claude.ai copy)
// the browser refuses, and the refusal stopped the frame before an eater's head was drawn.
function opaqueBox(c) { return { x: 0, y: 0, w: c.width, h: c.height }; }

/* ---------- bites: a copy of a food with n mouthfuls gone from its top ---------- */
function bitten(src, n, seed) {
  const c = copyCanvas(src), g = c.getContext('2d'), b = src._box || (src._box = opaqueBox(src));
  const f = seeded(seed || 3);
  g.globalCompositeOperation = 'destination-out';
  for (let k = 1; k <= n; k++) {
    const depth = b.y + b.h * (k === 1 ? 0.3 : k === 2 ? 0.58 : 0.86), R = b.w * 0.2;
    for (let i = -2; i <= 2; i++) {
      g.beginPath(); g.arc(b.x + b.w / 2 + i * b.w * 0.2 + (f() - 0.5) * 8, depth - R * 0.55 + Math.abs(i) * R * 0.12, R, 0, TAU); g.fill();
    }
    g.fillRect(b.x - 4, 0, b.w + 8, depth - R * 1.1);
  }
  return c;
}

/* ---------- cooked looks: what the hob, oven, toaster and microwave do to a food ---------- */
function keepShape(g, shape) { g.globalCompositeOperation = 'destination-in'; g.drawImage(shape, 0, 0); g.globalCompositeOperation = 'source-over'; }
function cookSprite(src, how, seed) {

  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, R = Math.max(b.w, b.h) / 2;
  const c = makeCanvas(W, H), g = c.getContext('2d'), f = seeded(seed || 11);
  g.drawImage(src, 0, 0);

    g.globalCompositeOperation = 'multiply';
    const gr = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.05);
    gr.addColorStop(0, '#e8b070'); gr.addColorStop(0.7, '#c47a36'); gr.addColorStop(1, '#6a3410');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    keepShape(g, src);
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(60,25,5,0.25)';
    for (let i = 0; i < 26; i++) { g.beginPath(); g.arc(b.x + f() * b.w, b.y + f() * b.h, 1 + f() * 3, 0, TAU); g.fill(); }
  } else if (how === 'bake') {    // a golden glaze and a shine
    g.globalCompositeOperation = 'source-atop';
    const gr = g.createLinearGradient(0, b.y, 0, b.y + b.h);
    gr.addColorStop(0, 'rgba(255,200,90,0.35)'); gr.addColorStop(1, 'rgba(170,90,20,0.45)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,230,0.45)'; g.beginPath(); g.ellipse(cx - b.w * 0.18, b.y + b.h * 0.25, b.w * 0.2, b.h * 0.07, -0.4, 0, TAU); g.fill();
  } else if (how === 'fry') {     // seared brown underneath, a shine of butter
    g.globalCompositeOperation = 'source-atop';
    const gr = g.createLinearGradient(0, b.y + b.h * 0.45, 0, b.y + b.h);

    g.fillStyle = gr; g.fillRect(0, 0, W, H);

    g.fillStyle = 'rgba(255,250,210,0.5)'; g.beginPath(); g.ellipse(cx + b.w * 0.15, b.y + b.h * 0.22, b.w * 0.16, b.h * 0.05, -0.3, 0, TAU); g.fill();
  } else if (how === 'micro' || how === 'hot') {  // warmed through: a little rosy
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(255,120,60,0.16)'; g.fillRect(0, 0, W, H);
  } else if (how === 'burnt') {   // left too long: nearly black, with a curl of smoke drawn by the game
    g.globalCompositeOperation = 'multiply'; g.fillStyle = '#4a3a30'; g.fillRect(0, 0, W, H); keepShape(g, src);
  }
  c._box = b;
  return c;
}

/* ---------- little prop behaviours ---------- */
// a pan on the cooker: a tap turns its ring on or off
function panTap(p) {
  const c = p.on && p.on.owner && p.on.owner.type === 'cooker' ? p.on.owner : null;
  if (!c) { SFX.play('clank'); hop(p, 0.5); return; }
  const i = c.ringAt(p.x);
  c.tap(i === 1 ? 'ringR' : 'ringL');
}
function hop(p, k = 1) { if (p.state === 'rest' && !p.carrier) { p.startFall(0, -520 * k, false); p.floorTarget = p.y; } p.sqv = -6; }
function kick(p, v) {
  if (p.carrier || p.seat) return;
  const dir = Rnd.f() < 0.5 ? -1 : 1, onFloor = !p.on && !p.carrier;
  p.startFall(dir * v, -v * 0.6, false);
  if (onFloor) p.floorTarget = p.room().bandY(p.y);
}
// a toy that drives itself along the floor for a moment
function drive(p, sound, speed = 420) {
  if (sound) SFX.play(sound);
  if (p.carrier) return;
  if (p.state !== 'rest') return;
  p.flip = p.flip ? false : Rnd.f() < 0.5;
  p.driveT = 1.6; p.driveV = (p.flip ? -1 : 1) * speed;
  if (!p._driveHooked) {
    p._driveHooked = true;
    const up = p.update.bind(p);
    p.update = dt => {
      up(dt);
      if (p.driveT > 0 && p.state === 'rest' && !p.held) {
        p.driveT -= dt;
        const r = p.room(), nx = p.x + p.driveV * dt;
        const lo = p.on ? p.on.x0 + p.w * 0.4 : r.x + p.w * 0.6, hi = p.on ? p.on.x1 - p.w * 0.4 : r.x + r.w - p.w * 0.6;
        if (nx < lo || nx > hi) { p.driveV = -p.driveV; p.flip = !p.flip; }
        else p.x = nx;
        for (const w of (p.seats[0] || { who: [] }).who) w.x = p.x;
        if (Rnd.f() < dt * 8) Parts.add('dust', p.x - Math.sign(p.driveV) * p.w * 0.4, p.y - 6, { size: 10, life: 0.5, vy: -20, layer: 0 });
      }
    };
  }
}
function launch(p) {
  SFX.play('whoosh', { dur: 0.8, f0: 300, f1: 2500 });
  p.startFall(0, -1900, false); p.floorTarget = p.on ? p.on.y : p.y;
  if (p.on) { p.floorTarget = null; }
  p.trail = 1.2;
  for (let i = 0; i < 10; i++) Parts.add('puff', p.x + rand(-10, 10), p.y, { size: rand(16, 30), life: rand(0.6, 1.1), vx: rand(-60, 60), vy: rand(20, 80), col: '#ffffff', layer: 0 });
}
function unwrap(p) {
  SFX.play('crinkle'); SFX.play('jingle');
  const what = pick(SURPRISES);
  Parts.burst('confetti', p.x, p.y - p.h * 0.6, 26, { v0: 200, v1: 520, g: 700, life: 1.6, sizeR: [8, 14], cols: ['#ff4a6a', '#ffd84a', '#4aa0f0', '#5ac85a', '#b07ae8'], spread: Math.PI, ang: -Math.PI / 2 });
  const x = p.x, y = p.y, home = p.home;
  World.remove(p);
  const n = spawnProp(what, x, y - 40, { home });
  if (what === 'block') n.tint = pick(BLOCK_TINTS);
  n.startFall(0, -700, false); n.floorTarget = y;
  Say.word(n.name);
}
function picnicTap(p) {
  const r = p.room(), near = World.inRoom(r, 'prop').filter(t => t.def.food && t.fromPicnic).length;
  SFX.play('pop', { f: 600 });
  if (near >= 4 || World.crowded()) { hop(p); return; }
  const f = spawnProp(pick(PICNIC_STOCK), p.x, p.y - p.h * 0.7);
  f.fromPicnic = true; f.noSave = false;
  f.startFall(rand(-1, 1) * 300, -650, false);
  if (!p.on && !p.carrier) f.floorTarget = p.room().bandY(p.y + rand(-10, 30));
  Say.word(f.name);
}
function blowBubbles(p) {
  SFX.play('bubbles');
  for (let i = 0; i < 9; i++) {
    Parts.add('bubble', p.x + rand(-20, 20), p.y - p.h * 0.9, { size: rand(14, 34), life: rand(2.5, 4.5), vx: rand(-90, 90), vy: rand(-140, -60), drag: 0.6, g: -10, layer: 1, poppable: true });
  }
}
function pour(p) {
  SFX.play('pour');
  p.pourT = 1.6;
  if (!p._pourHooked) {
    p._pourHooked = true;
    const up = p.update.bind(p);
    p.update = dt => {
      up(dt);
      if (p.pourT > 0) {
        p.pourT -= dt;
        const sx = p.x - p.w * 0.45, sy = p.y - p.h * 0.6;

        World.watered(sx - 40, sy, dt);

    };
  }
}

/* ---------- src/people_draw.js ---------- */
/* people_draw.js — the family, drawn in code in the stickers' look (bold dark outlines, soft
   shading, a gloss highlight) so they can sit, lie, dangle, dance and pull every face.
   drawPerson(ctx, look, pose) draws one person with the hip at (0, 0); the caller moves the
   canvas there. A look is how someone is made (age, skin, hair, clothes); a pose is what they are
   doing this frame (legs, arms, lean, face). */

const PLINE = '#3b2a2a';
const SKINS = ['#ffe3cf', '#f7cba6', '#e9b088', '#c98a5c', '#9b623f', '#6a4029'];
const HAIR_COLS = {
  black: '#2e2626', darkbrown: '#4a2f22', brown: '#7a4a2a', auburn: '#9e3f22', ginger: '#e07a2c', blonde: '#f2c75a',
  grey: '#b9b4b0', white: '#efebe4', pink: '#ff7ab8', blue: '#4aa0f0', green: '#5cc85a', purple: '#9a62e0',
};
const HAIR_STYLES = ['short', 'curly', 'long', 'pigtails', 'bun', 'bob', 'ponytail', 'spiky', 'afro', 'bald', 'tuft'];
// body sizes by age: head radius, torso width and height, hip width, leg and arm lengths and widths
const BODY = {
  adult:   { head: 74, tw: 104, th: 118, hw: 92, leg: 112, lw: 34, arm: 100, aw: 28, hand: 19, foot: 30, ol: 5 },
  elder:   { head: 72, tw: 112, th: 112, hw: 100, leg: 100, lw: 34, arm: 96, aw: 28, hand: 19, foot: 30, ol: 5 },
  child:   { head: 68, tw: 84, th: 88, hw: 78, leg: 82, lw: 28, arm: 76, aw: 24, hand: 16, foot: 25, ol: 4.5 },
  toddler: { head: 64, tw: 76, th: 70, hw: 72, leg: 54, lw: 27, arm: 58, aw: 22, hand: 15, foot: 23, ol: 4.5 },
  baby:    { head: 58, tw: 72, th: 58, hw: 70, leg: 38, lw: 26, arm: 44, aw: 21, hand: 14, foot: 19, ol: 4 },
};
// the height of a standing person from feet to the top of the head (without hair)
function bodyHeight(age) { const B = BODY[age]; return B.leg + B.th + B.head * 1.8; }

const _shade = {};
function shadeOf(c, k) { const key = c + k; return _shade[key] || (_shade[key] = mix(c, '#2a1830', k)); }

/* ---------- limbs: a thick stroke with an outline, through a bend ---------- */
// (with three points the curve passes through the middle one: an elbow or a knee)
function limbCtrl(pts) { return [2 * pts[1][0] - (pts[0][0] + pts[2][0]) / 2, 2 * pts[1][1] - (pts[0][1] + pts[2][1]) / 2]; }
function limb(ctx, pts, w, col, ol) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const c = pts.length === 3 ? limbCtrl(pts) : null;
  const path = () => {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    if (c) ctx.quadraticCurveTo(c[0], c[1], pts[2][0], pts[2][1]);
    else for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  };
  path(); ctx.lineWidth = w + ol * 2; ctx.strokeStyle = PLINE; ctx.stroke();
  path(); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
  // a soft shade down one side
  ctx.save(); ctx.translate(w * 0.18, 0); path(); ctx.lineWidth = w * 0.32; ctx.strokeStyle = rgba(shadeOf(col, 0.25), 0.45); ctx.stroke(); ctx.restore();
}
// the limb's point a fraction of the way along it (for where a sleeve or a shorts leg ends)
function limbAt(pts, f) {
  if (pts.length === 3) {
    const c = limbCtrl(pts), u = 1 - f;
    return [u * u * pts[0][0] + 2 * u * f * c[0] + f * f * pts[2][0], u * u * pts[0][1] + 2 * u * f * c[1] + f * f * pts[2][1]];
  }
  return [lerp(pts[0][0], pts[1][0], f), lerp(pts[0][1], pts[1][1], f)];
}
// the first part of a limb (a sleeve, a shorts leg) as a limb of its own
function limbPart(pts, f) {
  if (pts.length === 3) return [pts[0], limbAt(pts, f / 2), limbAt(pts, f)];
  return [pts[0], limbAt(pts, f)];
}
function blob(ctx, x, y, rx, ry, col, ol, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = ol; ctx.strokeStyle = PLINE; ctx.stroke();
}

/* ---------- where everything goes, from the pose ---------- */
// pose: { legs: 'stand'|'walk'|'sit'|'dangle'|'kick'|'lie'|'straddle'|'bath', phase, armL, armR: [shoulder angle, elbow bend],
//         lean, headTilt, bob, squash, face, held: { pic, hand: 'L'|'R' } }
function skeleton(B, pose) {
  const S = {};
  S.shoulderY = -B.th;
  S.headY = -B.th - B.head * 0.82 + (pose.bob || 0) * 0.3;
  S.shL = [-(B.tw / 2 - B.aw * 0.45), -B.th + B.aw * 0.65];
  S.shR = [B.tw / 2 - B.aw * 0.45, -B.th + B.aw * 0.65];
  // arms: angle 0 hangs straight down, +PI/2 straight out to the side, PI straight up
  // (the elbow bend turns the forearm further out; a negative bend brings the hand in and up)
  const arm = (sh, side, a) => {
    if (a && a.to) return reach(sh, a.to, B.arm * 0.52, B.arm * 0.52, side);
    const ang = a ? a[0] : 0.12, bend = a ? (a[1] || 0) : 0.15;
    const up = B.arm * 0.52, lo = B.arm * 0.52;
    const elx = sh[0] + side * Math.sin(ang) * up, ely = sh[1] + Math.cos(ang) * up;
    const a2 = ang + bend;
    const hx = elx + side * Math.sin(a2) * lo, hy = ely + Math.cos(a2) * lo;
    return [[sh[0], sh[1]], [elx, ely], [hx, hy]];
  };
  S.armL = arm(S.shL, -1, pose.armL);
  S.armR = arm(S.shR, 1, pose.armR);
  // legs from the hip joints
  const hjx = B.hw * 0.27, L = B.leg, mode = pose.legs || 'stand', ph = pose.phase || 0;
  const leg = side => {
    const hx = side * hjx, hy = -B.lw * 0.2;
    if (mode === 'sit' || mode === 'bath') {        // thighs toward us (short and round), shins hanging from the seat edge
      const kx = side * (hjx + B.lw * 0.32), ky = B.lw * 0.62;
      const sw = Math.sin(ph * 4 + side * 1.7) * (pose.kick || 0) * L * 0.16;
      return [[hx, hy], [kx, ky], [kx + side * B.lw * 0.12 + sw, ky + L * 0.46]];
    }
    if (mode === 'straddle') {                       // astride a rocking horse or a trike
      return [[hx, hy], [side * (hjx + L * 0.35), L * 0.25], [side * (hjx + L * 0.38), L * 0.7]];
    }
    if (mode === 'dangle') {                         // held up: legs hang and swing
      const sw = Math.sin(ph * 5 + side * 1.3) * L * 0.12;
      return [[hx, hy], [hx + side * L * 0.06 + sw * 0.5, L * 0.5], [hx + side * L * 0.08 + sw, L * 0.98]];
    }
    if (mode === 'kick') {                           // in the air: knees up, feet out
      const k = Math.sin(ph * 9 + side) * 0.5 + 0.5;
      return [[hx, hy], [hx + side * L * 0.38, L * (0.35 + k * 0.1)], [hx + side * L * 0.5, L * (0.75 + k * 0.15)]];
    }
    if (mode === 'walk') {
      const s = Math.sin(ph + (side > 0 ? 0 : Math.PI)), lift = Math.max(0, s) * L * 0.22;
      return [[hx, hy], [hx + side * L * 0.06, L * 0.5 - lift * 0.6], [hx + side * L * 0.04, L - lift]];
    }
    if (mode === 'dance') {
      const s = Math.sin(ph * 2 + (side > 0 ? 0 : Math.PI)), bend = Math.max(0, s) * L * 0.2;
      return [[hx, hy], [hx + side * (L * 0.12 + bend * 0.8), L * 0.5 - bend * 0.3], [hx + side * L * 0.06, L - bend * 0.5]];
    }
    return [[hx, hy], [hx + side * L * 0.04, L * 0.5], [hx + side * L * 0.06, L]];   // stand
  };
  S.legL = leg(-1); S.legR = leg(1);
  S.sitting = mode === 'sit' || mode === 'bath';
  return S;
}
// two-bone reach: shoulder to a target point, the elbow bending outward and down
function reach(sh, to, l1, l2, side) {
  let dx = to[0] - sh[0], dy = to[1] - sh[1], d = Math.hypot(dx, dy);
  const max = (l1 + l2) * 0.98;
  if (d > max) { dx *= max / d; dy *= max / d; d = max; }
  d = Math.max(d, Math.abs(l1 - l2) + 1);
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)), base = Math.atan2(dy, dx);
  const e1 = [sh[0] + Math.cos(base + a) * l1, sh[1] + Math.sin(base + a) * l1], e2 = [sh[0] + Math.cos(base - a) * l1, sh[1] + Math.sin(base - a) * l1];
  // the elbow that is further out to this side (and lower, when it is close)
  const score = e => e[0] * side + e[1] * 0.35;
  const el = score(e1) > score(e2) ? e1 : e2;
  return [[sh[0], sh[1]], el, [sh[0] + dx, sh[1] + dy]];
}

/* ---------- the whole person ---------- */
function drawPerson(ctx, look, pose) {
  const B = BODY[look.age] || BODY.adult, ol = B.ol, skin = SKINS[look.skin] || SKINS[1];
  const S = skeleton(B, pose);
  const top = look.top || { style: 'tee', col: '#5ab0e8' }, bot = look.bottom || { style: 'trousers', col: '#3a4a8a' };
  const hairCol = HAIR_COLS[look.hairCol] || look.hairCol || HAIR_COLS.brown;
  ctx.save();
  if (pose.squash && pose.squash !== 1) ctx.scale(1 + (1 - pose.squash) * 0.6, pose.squash);
  if (pose.lean) ctx.rotate(pose.lean);
  const bob = pose.bob || 0;
  // hair that hangs behind
  ctx.save(); ctx.translate(0, bob); ctx.rotate((pose.headTilt || 0) * 0.5);
  drawHairBack(ctx, look.hair, hairCol, B, S.headY, ol, pose);
  ctx.restore();
  // legs, then the shoes on them
  if (pose.legs !== 'bath') {
    drawLegs(ctx, look, B, S, skin, bot, ol, pose);
  }
  // body
  ctx.save(); ctx.translate(0, bob * 0.4);
  drawTorso(ctx, look, B, S, top, bot, ol, pose);
  ctx.restore();
  // arms, and whatever a hand holds; a hand up at the face goes in front of the head
  const atFace = A => A[2][1] < S.shoulderY - B.head * 0.2 && Math.abs(A[2][0]) < B.head * 0.95;
  const frontL = atFace(S.armL), frontR = atFace(S.armR);
  ctx.save(); ctx.translate(0, bob * 0.4);
  if (!frontL) drawArm(ctx, S.armL, B, skin, top, ol, pose, 'L');
  if (!frontR) drawArm(ctx, S.armR, B, skin, top, ol, pose, 'R');
  ctx.restore();
  // head
  ctx.save(); ctx.translate(0, S.headY + bob); ctx.rotate(pose.headTilt || 0);
  drawHead(ctx, look, B, skin, hairCol, ol, pose);
  ctx.restore();
  if (frontL || frontR) {
    ctx.save(); ctx.translate(0, bob * 0.4);
    if (frontL) drawArm(ctx, S.armL, B, skin, top, ol, pose, 'L');
    if (frontR) drawArm(ctx, S.armR, B, skin, top, ol, pose, 'R');
    ctx.restore();
  }
  ctx.restore();
}

function drawLegs(ctx, look, B, S, skin, bot, ol, pose) {
  const style = bot.style, legCol = style === 'shorts' || style === 'skirt' || style === 'nappy' ? skin : bot.col;
  const tights = look.tights;
  const sitting = S.sitting;
  [S.legL, S.legR].forEach((L, i) => {
    const side = i ? 1 : -1;
    if (sitting) {                                    // a round knee toward us, then the shin
      limb(ctx, [L[1], L[2]], B.lw, tights || legCol, ol);
      const thigh = style === 'skirt' || style === 'nappy' ? (tights || skin) : bot.col;
      blob(ctx, L[1][0], L[1][1] - B.lw * 0.2, B.lw * 0.86, B.lw * 0.7, style === 'shorts' ? bot.col : thigh, ol);
      ctx.beginPath(); ctx.ellipse(L[1][0] - side * B.lw * 0.25, L[1][1] - B.lw * 0.5, B.lw * 0.28, B.lw * 0.14, 0, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
    } else limb(ctx, L, B.lw, tights || legCol, ol);
    if (pose.dirt > 0.2) { const f = L[L.length - 1]; ctx.save(); ctx.translate(f[0], f[1] - B.lw * 0.8); drawDirt(ctx, pose.dirt * 0.5, -B.lw * 0.6, -B.lw * 0.6, B.lw * 1.2, B.lw * 1.2, 11 + i); ctx.restore(); }
    if (style === 'shorts') limb(ctx, limbPart(L, 0.42), B.lw * 1.12, bot.col, ol);
    // shoe: a rounded lump pointing outward
    const f = L[L.length - 1], sh = look.shoes || '#d8483a';
    if (look.age === 'baby' && !look.shoesOn) blob(ctx, f[0] + side * 3, f[1] + 2, B.foot * 0.62, B.foot * 0.48, look.onesieFeet || skin, ol);
    else {
      blob(ctx, f[0] + side * B.foot * 0.22, f[1] + B.foot * 0.1, B.foot * 0.8, B.foot * 0.5, sh, ol);
      ctx.beginPath(); ctx.ellipse(f[0] + side * B.foot * 0.12, f[1] - B.foot * 0.08, B.foot * 0.28, B.foot * 0.12, 0, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
    }
  });
}

function torsoPath(ctx, B, y0, y1) {
  const tw = B.tw, hw = B.hw, r = tw * 0.32;
  ctx.beginPath();
  ctx.moveTo(-hw / 2, y1);
  ctx.lineTo(-tw / 2, y0 + r);
  ctx.quadraticCurveTo(-tw / 2, y0, -tw / 2 + r, y0);
  ctx.lineTo(tw / 2 - r, y0);
  ctx.quadraticCurveTo(tw / 2, y0, tw / 2, y0 + r);
  ctx.lineTo(hw / 2, y1);
  ctx.quadraticCurveTo(hw / 2, y1 + B.lw * 0.35, hw / 2 - B.lw * 0.4, y1 + B.lw * 0.35);
  ctx.lineTo(-hw / 2 + B.lw * 0.4, y1 + B.lw * 0.35);
  ctx.quadraticCurveTo(-hw / 2, y1 + B.lw * 0.35, -hw / 2, y1);
  ctx.closePath();
}

function drawTorso(ctx, look, B, S, top, bot, ol, pose) {
  const y0 = S.shoulderY, y1 = 0;
  // trousers and skirts start at the waist: the bottom of the torso is in their colour
  const waist = -B.th * 0.22;
  // skirt or dress flares out over the top of the legs
  if (top.style === 'dress' || bot.style === 'skirt') {
    const col = top.style === 'dress' ? top.col : bot.col, flare = B.hw * (pose.legs === 'sit' ? 0.75 : 0.66);
    ctx.beginPath();
    ctx.moveTo(-B.hw * 0.48, waist);
    ctx.quadraticCurveTo(-flare, B.leg * 0.2, -flare * 1.05, B.leg * 0.42);
    ctx.quadraticCurveTo(0, B.leg * 0.5, flare * 1.05, B.leg * 0.42);
    ctx.quadraticCurveTo(flare, B.leg * 0.2, B.hw * 0.48, waist);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = ol; ctx.strokeStyle = PLINE; ctx.stroke();
    ctx.save(); ctx.clip();
    if (top.style === 'dress' && top.pat) drawPattern(ctx, top.pat, top.patCol || '#ffffff', -flare, waist, flare * 2, B.leg * 0.6, B.tw);
    ctx.fillStyle = rgba(shadeOf(col, 0.3), 0.35); ctx.fillRect(flare * 0.35, waist, flare, B.leg);
    ctx.restore();
  }
  torsoPath(ctx, B, y0, y1);
  const g = ctx.createLinearGradient(-B.tw / 2, 0, B.tw / 2, 0);
  g.addColorStop(0, lighten(top.col, 0.12)); g.addColorStop(0.6, top.col); g.addColorStop(1, shadeOf(top.col, 0.18));
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  // trousers or a nappy cover the bottom of the torso
  if (top.style !== 'dress' && top.style !== 'onesie' && bot.style !== 'skirt') {
    ctx.fillStyle = bot.style === 'nappy' ? '#ffffff' : bot.col; ctx.fillRect(-B.tw, waist, B.tw * 2, B.th);
    ctx.fillStyle = rgba(PLINE, 0.18); ctx.fillRect(-B.tw, waist, B.tw * 2, ol * 0.6);
  }
  if (top.pat) drawPattern(ctx, top.pat, top.patCol || '#ffffff', -B.tw / 2, y0, B.tw, (top.style === 'dress' || top.style === 'onesie' ? B.th : B.th * 0.78), B.tw);
  if (top.style === 'dungarees') {            // a bib and straps over the top
    const dc = top.dcol || '#3a6ac8';
    ctx.fillStyle = dc; ctx.fillRect(-B.tw * 0.28, y0 + B.th * 0.36, B.tw * 0.56, B.th);
    ctx.fillRect(-B.tw * 0.34, y0, B.tw * 0.1, B.th * 0.4); ctx.fillRect(B.tw * 0.24, y0, B.tw * 0.1, B.th * 0.4);
    ctx.fillStyle = '#ffd84a'; [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(s * B.tw * 0.22, y0 + B.th * 0.42, B.tw * 0.045, 0, TAU); ctx.fill(); });
  }
  if (top.style === 'cardigan') {             // an open front with buttons
    ctx.strokeStyle = rgba(PLINE, 0.6); ctx.lineWidth = ol * 0.7;
    ctx.beginPath(); ctx.moveTo(0, y0 + B.th * 0.12); ctx.lineTo(0, waist); ctx.stroke();
    ctx.fillStyle = lighten(top.col, 0.5);
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(B.tw * 0.07, y0 + B.th * (0.3 + i * 0.18), B.tw * 0.035, 0, TAU); ctx.fill(); }
  }
  // collar
  ctx.fillStyle = rgba(PLINE, 0.12); ctx.beginPath(); ctx.ellipse(0, y0 + 2, B.tw * 0.2, B.th * 0.07, 0, 0, TAU); ctx.fill();
  if (pose.dirt) drawDirt(ctx, pose.dirt, -B.tw / 2, y0, B.tw, B.th, 5);
  ctx.restore();
  torsoPath(ctx, B, y0, y1);
  ctx.lineWidth = ol; ctx.strokeStyle = PLINE; ctx.stroke();
}

function drawPattern(ctx, pat, col, x, y, w, h, scale) {
  const s = scale / 100;
  ctx.fillStyle = col;
  if (pat === 'stripes') {
    for (let yy = y + 10 * s; yy < y + h; yy += 22 * s) ctx.fillRect(x - 10, yy, w + 20, 9 * s);
  } else if (pat === 'spots') {
    for (let j = 0, yy = y + 12 * s; yy < y + h; yy += 22 * s, j++) for (let xx = x + (j % 2 ? 6 : 17) * s; xx < x + w; xx += 22 * s) { ctx.beginPath(); ctx.arc(xx, yy, 5 * s, 0, TAU); ctx.fill(); }
  } else if (pat === 'stars') {
    for (let j = 0, yy = y + 16 * s; yy < y + h; yy += 30 * s, j++) for (let xx = x + (j % 2 ? 10 : 25) * s; xx < x + w; xx += 30 * s) { ctx.beginPath(); starPath(ctx, xx, yy, 8 * s, 3.6 * s); ctx.fill(); }
  } else if (pat === 'heart') {
    ctx.beginPath(); heartPath(ctx, x + w / 2, y + h * 0.42, w * 0.17); ctx.fill();
  } else if (pat === 'dino') {             // a little dinosaur on the chest
    const cx = x + w / 2, cy = y + h * 0.45, k = w / 100;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 22 * k, 13 * k, 0, 0, TAU);
    ctx.moveTo(cx + 14 * k, cy - 6 * k); ctx.quadraticCurveTo(cx + 22 * k, cy - 28 * k, cx + 30 * k, cy - 24 * k);
    ctx.lineTo(cx + 32 * k, cy - 16 * k); ctx.quadraticCurveTo(cx + 26 * k, cy - 14 * k, cx + 22 * k, cy - 2 * k);
    ctx.moveTo(cx - 18 * k, cy); ctx.lineTo(cx - 36 * k, cy + 8 * k); ctx.lineTo(cx - 16 * k, cy + 8 * k);
    ctx.fill();
    ctx.fillRect(cx - 12 * k, cy + 8 * k, 6 * k, 10 * k); ctx.fillRect(cx + 6 * k, cy + 8 * k, 6 * k, 10 * k);
  } else if (pat === 'rainbow') {
    ['#ff4a4a', '#ffa82a', '#ffe04a', '#5ac85a', '#4aa0f0'].forEach((c, i) => {
      ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.6, w * (0.34 - i * 0.05), Math.PI, 0); ctx.lineWidth = w * 0.05; ctx.strokeStyle = c; ctx.stroke();
    });
  } else if (pat === 'flower') {
    const cx = x + w / 2, cy = y + h * 0.42, r = w * 0.07;
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 1.3, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, TAU); ctx.fill();
  }
}

// muddy splodges, kept in place by a seed
function drawDirt(ctx, amount, x, y, w, h, seed) {
  const f = seeded(seed * 97 + 3), n = Math.round(amount * 9), s = w / 80;
  for (let i = 0; i < n; i++) {
    const cx = x + f() * w, cy = y + f() * h, rx = (9 + f() * 12) * s, ry = (7 + f() * 9) * s;
    ctx.beginPath(); blobPath(ctx, cx, cy, rx, ry, 7, 0.35, seed + i); ctx.fillStyle = 'rgba(105,64,30,0.85)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - rx * 0.3, cy - ry * 0.3, rx * 0.25, ry * 0.18, 0, 0, TAU); ctx.fillStyle = 'rgba(170,120,70,0.6)'; ctx.fill();
  }
}

function drawArm(ctx, A, B, skin, top, ol, pose, side) {
  const sleeve = top.style === 'tee' || top.style === 'dress' || top.style === 'dungarees' ? 0.4 : top.style === 'vest' ? 0 : 0.96;
  limb(ctx, A, B.aw, skin, ol);
  if (sleeve > 0) limb(ctx, limbPart(A, sleeve), B.aw * 1.12, top.col, ol);
  const h = A[2];
  // the held thing sits in the hand, drawn before the fingers wrap round it
  const held = pose.held && pose.held.hand === side ? pose.held : null;
  if (held && held.draw) held.draw(ctx, h[0], h[1]);
  blob(ctx, h[0], h[1], B.hand, B.hand * 0.95, skin, ol);
  ctx.beginPath(); ctx.arc(h[0] - B.hand * 0.3, h[1] - B.hand * 0.35, B.hand * 0.28, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
  if (held && held.drawOver) held.drawOver(ctx, h[0], h[1]);
}

/* ---------- head and face ---------- */
function drawHead(ctx, look, B, skin, hairCol, ol, pose) {
  const rx = B.head, ry = B.head * 0.93, face = pose.face || {};
  // ears
  [-1, 1].forEach(s => blob(ctx, s * rx * 0.97, ry * 0.08, rx * 0.17, ry * 0.21, skin, ol));
  // the face
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  const g = ctx.createRadialGradient(-rx * 0.3, -ry * 0.35, rx * 0.15, 0, 0, rx * 1.1);
  g.addColorStop(0, lighten(skin, 0.18)); g.addColorStop(0.7, skin); g.addColorStop(1, shadeOf(skin, 0.14));
  ctx.fillStyle = g; ctx.fill();
  if (face.tint) { ctx.fillStyle = face.tint; ctx.fill(); }
  ctx.lineWidth = ol; ctx.strokeStyle = PLINE; ctx.stroke();
  if (pose.dirt > 0.5) { ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.clip(); drawDirt(ctx, (pose.dirt - 0.5) * 1.2, -rx * 0.8, -ry * 0.1, rx * 1.6, ry * 0.9, 9); ctx.restore(); }
  drawFace(ctx, look, B, rx, ry, skin, hairCol, ol, face);
  drawHairFront(ctx, look.hair, hairCol, B, rx, ry, ol, pose);
  if (look.specs) drawSpecs(ctx, rx, ry, ol, look.specs);
  if (look.moustache) {
    ctx.beginPath();
    ctx.moveTo(0, ry * 0.36);
    ctx.bezierCurveTo(-rx * 0.12, ry * 0.26, -rx * 0.42, ry * 0.3, -rx * 0.46, ry * 0.48);
    ctx.bezierCurveTo(-rx * 0.3, ry * 0.44, -rx * 0.12, ry * 0.46, 0, ry * 0.42);
    ctx.bezierCurveTo(rx * 0.12, ry * 0.46, rx * 0.3, ry * 0.44, rx * 0.46, ry * 0.48);
    ctx.bezierCurveTo(rx * 0.42, ry * 0.3, rx * 0.12, ry * 0.26, 0, ry * 0.36);
    ctx.fillStyle = look.moustache; ctx.fill(); ctx.lineWidth = ol * 0.7; ctx.strokeStyle = PLINE; ctx.stroke();
  }
  if (pose.over) pose.over(ctx, rx, ry);      // hats, foam, milk moustaches: things on the head
}

function drawFace(ctx, look, B, rx, ry, skin, hairCol, ol, face) {
  const eyeY = ry * 0.06, eyeX = rx * 0.37, ew = rx * 0.15, eh = ry * 0.21;
  const lookX = (face.look ? face.look[0] : 0) * ew * 0.35, lookY = (face.look ? face.look[1] : 0) * eh * 0.3;
  const eyes = face.eyes || 'open', blink = face.blink || 0;
  // cheeks
  const blush = face.blush === undefined ? 0.55 : face.blush;
  if (blush > 0) {
    ctx.fillStyle = rgba(face.cheek || '#ff7a8a', 0.45 * blush);
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(s * rx * 0.6, ry * 0.36, rx * 0.17, ry * 0.11, 0, 0, TAU); ctx.fill(); });
  }
  if (look.freckles) {
    ctx.fillStyle = rgba(shadeOf(skin, 0.45), 0.7);
    [-1, 1].forEach(s => { for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(s * rx * (0.5 + i * 0.09), ry * (0.28 + (i % 2) * 0.06), rx * 0.022, 0, TAU); ctx.fill(); } });
  }
  // eyes
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [-1, 1].forEach(s => {
    const x = s * eyeX, y = eyeY, kind = eyes === 'wink' && s > 0 ? 'closed' : eyes;
    ctx.strokeStyle = PLINE; ctx.fillStyle = PLINE;
    if (kind === 'closed' || blink > 0.85) {           // asleep, or mid-blink: a soft curve
      ctx.beginPath(); ctx.arc(x, y - eh * 0.15, ew * 1.05, 0.15 * Math.PI, 0.85 * Math.PI); ctx.lineWidth = ol * 1.1; ctx.stroke();
    } else if (kind === 'happy') {                        // ^ ^
      ctx.beginPath(); ctx.arc(x, y + eh * 0.35, ew * 1.05, 1.15 * Math.PI, 1.85 * Math.PI); ctx.lineWidth = ol * 1.2; ctx.stroke();
    } else if (kind === 'squint') {                       // > <
      ctx.beginPath(); ctx.moveTo(x - s * ew, y - eh * 0.6); ctx.lineTo(x + s * ew * 0.9, y); ctx.lineTo(x - s * ew, y + eh * 0.6);
      ctx.lineWidth = ol * 1.2; ctx.stroke();
    } else if (kind === 'x') {
      ctx.beginPath(); ctx.moveTo(x - ew, y - ew); ctx.lineTo(x + ew, y + ew); ctx.moveTo(x + ew, y - ew); ctx.lineTo(x - ew, y + ew); ctx.lineWidth = ol; ctx.stroke();
    } else if (kind === 'heart') {
      ctx.beginPath(); heartPath(ctx, x, y, ew * 1.3); ctx.fillStyle = '#ef3361'; ctx.fill(); ctx.lineWidth = ol * 0.6; ctx.stroke();
    } else if (kind === 'spiral') {
      ctx.beginPath(); for (let a = 0; a < TAU * 2.2; a += 0.3) { const r = a / (TAU * 2.2) * ew * 1.2; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
      ctx.lineWidth = ol * 0.6; ctx.stroke();
    } else {
      const big = kind === 'wide' ? 1.25 : 1, w = ew * big, h = eh * big * (1 - blink * 0.8);
      ctx.beginPath(); ctx.ellipse(x + lookX, y + lookY, w, Math.max(1, h), 0, 0, TAU); ctx.fill();
      if (h > eh * 0.35) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(x + lookX - w * 0.32, y + lookY - h * 0.38, w * 0.38, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(x + lookX + w * 0.35, y + lookY + h * 0.3, w * 0.17, 0, TAU); ctx.fill();
      }
      if (kind === 'half') {                              // sleepy: heavy lids
        ctx.fillStyle = skin; ctx.fillRect(x - w * 1.3, y - h * 1.3, w * 2.6, h * 1.25);
        ctx.beginPath(); ctx.moveTo(x - w * 1.15, y - h * 0.05); ctx.lineTo(x + w * 1.15, y - h * 0.05); ctx.lineWidth = ol; ctx.strokeStyle = PLINE; ctx.stroke();
      }
      if (blink > 0 && blink <= 0.85) {
        ctx.fillStyle = skin; ctx.fillRect(x - w * 1.3, y - eh * 1.3, w * 2.6, eh * 1.3 * blink * 1.6);
      }
    }
  });
  // brows
  const brows = face.brows || 'normal';
  if (brows !== 'none') {
    ctx.strokeStyle = shadeOf(hairCol === HAIR_COLS.white || hairCol === HAIR_COLS.grey ? '#8a8480' : hairCol, 0.2); ctx.lineWidth = ol * 1.25;
    [-1, 1].forEach(s => {
      const x = s * eyeX, y = eyeY - eh * 1.55;
      ctx.beginPath();
      if (brows === 'up') { ctx.arc(x, y + ew * 0.2, ew * 1.1, 1.2 * Math.PI, 1.8 * Math.PI); }
      else if (brows === 'worried') { ctx.moveTo(x - s * ew, y - ew * 0.1); ctx.lineTo(x + s * ew, y + ew * 0.5 * -1); }
      else if (brows === 'angry') { ctx.moveTo(x - s * ew * 0.2 + s * ew, y + ew * 0.5); ctx.lineTo(x - s * ew, y - ew * 0.2); }
      else { ctx.arc(x, y + ew * 0.8, ew * 1.05, 1.28 * Math.PI, 1.72 * Math.PI); }
      ctx.stroke();
    });
  }
  // nose
  ctx.beginPath(); ctx.ellipse(0, ry * 0.25, rx * 0.075, ry * 0.055, 0, 0, TAU); ctx.fillStyle = shadeOf(skin, 0.12); ctx.fill();
  ctx.beginPath(); ctx.arc(-rx * 0.025, ry * 0.23, rx * 0.025, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  drawMouth(ctx, rx, ry, ol, face);
}

function drawMouth(ctx, rx, ry, ol, face) {
  const m = face.mouth || 'smile', y = ry * 0.47, w = rx * 0.27;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = PLINE; ctx.lineWidth = ol * 1.1;
  const inside = (path) => { path(); ctx.fillStyle = '#7a2a3a'; ctx.fill(); ctx.save(); ctx.clip(); ctx.fillStyle = '#ff7a8a'; ctx.beginPath(); ctx.ellipse(0, y + w * 0.7, w * 0.7, w * 0.4, 0, 0, TAU); ctx.fill(); ctx.restore(); path(); ctx.stroke(); };
  if (m === 'smile') { ctx.beginPath(); ctx.arc(0, y - w * 0.55, w, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  else if (m === 'flat') { ctx.beginPath(); ctx.moveTo(-w * 0.6, y); ctx.lineTo(w * 0.6, y); ctx.stroke(); }
  else if (m === 'frown') { ctx.beginPath(); ctx.arc(0, y + w * 0.75, w * 0.8, 1.22 * Math.PI, 1.78 * Math.PI); ctx.stroke(); }
  else if (m === 'grin' || m === 'laugh') {
    const h = m === 'laugh' ? w * 1.0 : w * 0.7;
    inside(() => { ctx.beginPath(); ctx.moveTo(-w, y - w * 0.15); ctx.quadraticCurveTo(0, y - w * 0.05, w, y - w * 0.15); ctx.quadraticCurveTo(w * 0.8, y + h, 0, y + h); ctx.quadraticCurveTo(-w * 0.8, y + h, -w, y - w * 0.15); ctx.closePath(); });
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-w * 0.6, y - w * 0.12, w * 1.2, w * 0.2);
  }
  else if (m === 'o' || m === 'O' || m === 'yawn') {
    const r = m === 'o' ? w * 0.38 : m === 'O' ? w * 0.6 : w * 0.62, h = m === 'yawn' ? r * 1.6 : r * 1.1;
    inside(() => { ctx.beginPath(); ctx.ellipse(0, y + r * 0.2, r, h, 0, 0, TAU); });
  }
  else if (m === 'chew') {
    const k = face.chew || 0;
    if (k < 0.3) { ctx.beginPath(); ctx.moveTo(-w * 0.5, y + w * 0.05); ctx.quadraticCurveTo(0, y + w * 0.35, w * 0.5, y + w * 0.05); ctx.stroke(); }
    else inside(() => { ctx.beginPath(); ctx.ellipse(0, y + w * 0.15, w * 0.55, w * 0.55 * k, 0, 0, TAU); });
  }
  else if (m === 'tongue') {
    ctx.beginPath(); ctx.moveTo(-w * 0.8, y + w * 0.1); ctx.quadraticCurveTo(-w * 0.3, y - w * 0.1, 0, y + w * 0.05); ctx.quadraticCurveTo(w * 0.3, y + w * 0.2, w * 0.8, y); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(w * 0.1, y + w * 0.45, w * 0.36, w * 0.45, 0.1, 0, Math.PI); ctx.fillStyle = '#ff6a8a'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.1, y + w * 0.15); ctx.lineTo(w * 0.1, y + w * 0.6); ctx.lineWidth = ol * 0.6; ctx.stroke();
  }
  else if (m === 'pucker') {
    ctx.beginPath(); ctx.ellipse(0, y + w * 0.1, w * 0.26, w * 0.22, 0, 0, TAU); ctx.fillStyle = '#c84a5a'; ctx.fill(); ctx.stroke();
    ctx.lineWidth = ol * 0.6; [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(s * w * 0.42, y - w * 0.12); ctx.lineTo(s * w * 0.6, y - w * 0.22); ctx.moveTo(s * w * 0.42, y + w * 0.3); ctx.lineTo(s * w * 0.6, y + w * 0.42); ctx.stroke(); });
  }
  else if (m === 'wavy') {
    ctx.beginPath(); ctx.moveTo(-w, y); for (let i = 1; i <= 8; i++) ctx.lineTo(-w + i * w / 4, y + (i % 2 ? -1 : 1) * w * 0.16); ctx.stroke();
  }
  else if (m === 'kiss') {
    ctx.beginPath(); ctx.arc(-w * 0.1, y - w * 0.05, w * 0.2, -0.5 * Math.PI, 0.5 * Math.PI); ctx.arc(-w * 0.1, y + w * 0.32, w * 0.2, -0.5 * Math.PI, 0.5 * Math.PI); ctx.stroke();
  }
  else if (m === 'blow') {                      // cheeks out, lips round: blowing on something hot
    ctx.beginPath(); ctx.ellipse(w * 0.1, y + w * 0.05, w * 0.18, w * 0.15, 0, 0, TAU); ctx.fillStyle = '#7a2a3a'; ctx.fill(); ctx.stroke();
  }
  if (face.dummy) {                              // a dummy in the mouth
    blob(ctx, 0, y + w * 0.2, w * 0.75, w * 0.42, '#4aa0f0', ol * 0.8);
    blob(ctx, 0, y + w * 0.2, w * 0.25, w * 0.25, '#ffd84a', ol * 0.6);
  }
}

function drawSpecs(ctx, rx, ry, ol, col) {
  const y = ry * 0.06, x = rx * 0.37, r = rx * 0.23;
  ctx.lineWidth = ol * 0.9; ctx.strokeStyle = col === true ? '#5a4a6a' : col;
  ctx.fillStyle = 'rgba(220,240,255,0.25)';
  [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(s * x, y, r, 0, TAU); ctx.fill(); ctx.stroke(); });
  ctx.beginPath(); ctx.moveTo(-x + r, y - r * 0.1); ctx.quadraticCurveTo(0, y - r * 0.45, x - r, y - r * 0.1); ctx.stroke();
}

/* ---------- hair ---------- */
function hairFill(ctx, col, ol) {
  const g = ctx.createLinearGradient(0, -100, 0, 60);
  g.addColorStop(0, lighten(col, 0.15)); g.addColorStop(1, shadeOf(col, 0.15));
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = ol; ctx.strokeStyle = PLINE; ctx.stroke();
}
function hairShine(ctx, x, y, w, h) {
  ctx.beginPath(); ctx.ellipse(x, y, w, h, -0.5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
}
function drawHairBack(ctx, style, col, B, hy, ol, pose) {
  const rx = B.head, ry = B.head * 0.93;
  ctx.save(); ctx.translate(0, hy); ctx.rotate(pose.headTilt || 0);
  if (style === 'long') {
    ctx.beginPath();
    ctx.moveTo(-rx * 1.02, -ry * 0.2);
    ctx.quadraticCurveTo(-rx * 1.22, ry * 1.1, -rx * 0.95, ry * 1.75);
    ctx.quadraticCurveTo(0, ry * 1.95, rx * 0.95, ry * 1.75);
    ctx.quadraticCurveTo(rx * 1.22, ry * 1.1, rx * 1.02, -ry * 0.2);
    ctx.quadraticCurveTo(0, -ry * 1.4, -rx * 1.02, -ry * 0.2);
    hairFill(ctx, col, ol);
  } else if (style === 'bob') {
    ctx.beginPath();
    ctx.moveTo(-rx * 1.06, -ry * 0.1);
    ctx.quadraticCurveTo(-rx * 1.2, ry * 0.75, -rx * 0.9, ry * 0.95);
    ctx.lineTo(rx * 0.9, ry * 0.95);
    ctx.quadraticCurveTo(rx * 1.2, ry * 0.75, rx * 1.06, -ry * 0.1);
    ctx.quadraticCurveTo(0, -ry * 1.4, -rx * 1.06, -ry * 0.1);
    hairFill(ctx, col, ol);
  } else if (style === 'pigtails') {
    const sw = Math.sin((pose.phase || 0) * 3) * 0.12 + (pose.lean || 0);
    [-1, 1].forEach(s => {
      ctx.save(); ctx.translate(s * rx * 0.98, -ry * 0.15); ctx.rotate(s * 0.35 + sw);
      ctx.beginPath(); ctx.ellipse(s * rx * 0.28, ry * 0.32, rx * 0.3, ry * 0.42, s * 0.2, 0, TAU); hairFill(ctx, col, ol);
      ctx.restore();
    });
  } else if (style === 'bun') {
    blob(ctx, 0, -ry * 1.02, rx * 0.42, ry * 0.36, col, ol);
    hairShine(ctx, -rx * 0.12, -ry * 1.12, rx * 0.12, ry * 0.07);
  } else if (style === 'ponytail') {
    const sw = Math.sin((pose.phase || 0) * 3) * 0.2 + (pose.lean || 0) * 1.5;
    ctx.save(); ctx.translate(rx * 0.55, -ry * 0.75); ctx.rotate(0.5 + sw);
    ctx.beginPath(); ctx.moveTo(-rx * 0.15, 0); ctx.quadraticCurveTo(rx * 0.55, ry * 0.4, rx * 0.25, ry * 1.25); ctx.quadraticCurveTo(-rx * 0.05, ry * 0.7, -rx * 0.15, 0);
    hairFill(ctx, col, ol); ctx.restore();
  } else if (style === 'afro') {
    ctx.beginPath(); cloudPath(ctx, 0, -ry * 0.25, rx * 1.5, 11, 5); hairFill(ctx, col, ol);
  }
  ctx.restore();
}
function drawHairFront(ctx, style, col, B, rx, ry, ol, pose) {
  ctx.lineJoin = 'round';
  if (style === 'short') {
    ctx.beginPath();
    ctx.moveTo(-rx * 1.0, ry * 0.05);
    ctx.quadraticCurveTo(-rx * 1.12, -ry * 1.05, 0, -ry * 1.06);
    ctx.quadraticCurveTo(rx * 1.12, -ry * 1.05, rx * 1.0, ry * 0.05);
    ctx.quadraticCurveTo(rx * 0.9, -ry * 0.45, rx * 0.5, -ry * 0.55);
    ctx.quadraticCurveTo(-rx * 0.1, -ry * 0.3, -rx * 0.55, -ry * 0.55);
    ctx.quadraticCurveTo(-rx * 0.9, -ry * 0.45, -rx * 1.0, ry * 0.05);
    hairFill(ctx, col, ol);
    hairShine(ctx, -rx * 0.35, -ry * 0.8, rx * 0.22, ry * 0.08);
  } else if (style === 'curly') {
    ctx.beginPath();
    const n = 9;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI * (1.05 + i * 0.9 / n), x = Math.cos(a) * rx * 0.92, y = Math.sin(a) * ry * 0.86 - ry * 0.08;
      ctx.moveTo(x + rx * 0.27, y); ctx.arc(x, y, rx * 0.27, 0, TAU);
    }
    hairFill(ctx, col, ol);
    ctx.beginPath(); for (let i = 0; i <= n; i++) { const a = Math.PI * (1.05 + i * 0.9 / n), x = Math.cos(a) * rx * 0.92, y = Math.sin(a) * ry * 0.86 - ry * 0.08; ctx.moveTo(x + rx * 0.25, y); ctx.arc(x, y, rx * 0.25, 0, TAU); }
    ctx.fillStyle = lighten(col, 0.05); ctx.fill();
    for (let i = 1; i < n; i += 2) { const a = Math.PI * (1.05 + i * 0.9 / n); hairShine(ctx, Math.cos(a) * rx * 0.88 - rx * 0.06, Math.sin(a) * ry * 0.84 - ry * 0.16, rx * 0.08, ry * 0.05); }
  } else if (style === 'long' || style === 'bob') {
    ctx.beginPath();
    ctx.moveTo(-rx * 1.02, ry * (style === 'bob' ? 0.6 : 0.5));
    ctx.quadraticCurveTo(-rx * 1.15, -ry * 1.02, 0, -ry * 1.08);
    ctx.quadraticCurveTo(rx * 1.15, -ry * 1.02, rx * 1.02, ry * (style === 'bob' ? 0.6 : 0.5));
    ctx.quadraticCurveTo(rx * 0.85, -ry * 0.2, rx * 0.6, -ry * 0.42);
    if (style === 'bob') { ctx.lineTo(-rx * 0.6, -ry * 0.42); }
    else { ctx.quadraticCurveTo(rx * 0.2, -ry * 0.5, 0, -ry * 0.78); ctx.quadraticCurveTo(-rx * 0.2, -ry * 0.5, -rx * 0.6, -ry * 0.42); }
    ctx.quadraticCurveTo(-rx * 0.85, -ry * 0.2, -rx * 1.02, ry * (style === 'bob' ? 0.6 : 0.5));
    hairFill(ctx, col, ol);
    hairShine(ctx, -rx * 0.45, -ry * 0.78, rx * 0.22, ry * 0.08);
  } else if (style === 'pigtails' || style === 'ponytail') {
    ctx.beginPath();
    ctx.moveTo(-rx * 1.0, ry * 0.0);
    ctx.quadraticCurveTo(-rx * 1.1, -ry * 1.05, 0, -ry * 1.07);
    ctx.quadraticCurveTo(rx * 1.1, -ry * 1.05, rx * 1.0, ry * 0.0);
    ctx.quadraticCurveTo(rx * 0.92, -ry * 0.38, rx * 0.72, -ry * 0.48);
    ctx.lineTo(-rx * 0.72, -ry * 0.48);
    ctx.quadraticCurveTo(-rx * 0.92, -ry * 0.38, -rx * 1.0, ry * 0.0);
    hairFill(ctx, col, ol);
    hairShine(ctx, -rx * 0.38, -ry * 0.82, rx * 0.22, ry * 0.08);
    if (style === 'pigtails') [-1, 1].forEach(s => blob(ctx, s * rx * 1.0, -ry * 0.12, rx * 0.1, ry * 0.1, '#ff5a8a', ol * 0.7));
  } else if (style === 'bun') {
    ctx.beginPath();
    ctx.moveTo(-rx * 1.0, ry * 0.0);
    ctx.quadraticCurveTo(-rx * 1.08, -ry * 1.02, 0, -ry * 1.04);
    ctx.quadraticCurveTo(rx * 1.08, -ry * 1.02, rx * 1.0, ry * 0.0);
    ctx.quadraticCurveTo(rx * 0.7, -ry * 0.62, 0, -ry * 0.68);
    ctx.quadraticCurveTo(-rx * 0.7, -ry * 0.62, -rx * 1.0, ry * 0.0);
    hairFill(ctx, col, ol);
    ctx.strokeStyle = rgba(PLINE, 0.35); ctx.lineWidth = ol * 0.5;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * rx * 0.22, -ry * 0.68); ctx.quadraticCurveTo(i * rx * 0.3, -ry * 0.95, i * rx * 0.12, -ry * 1.02); ctx.stroke(); }
  } else if (style === 'spiky') {
    ctx.beginPath();
    ctx.moveTo(-rx * 1.0, -ry * 0.05);
    const n = 7;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI * (1.0 + i / n), r1 = 1.0, r2 = 1.38;
      ctx.lineTo(Math.cos(a) * rx * r1, Math.sin(a) * ry * r1 - ry * 0.05);
      if (i < n) { const b = Math.PI * (1.0 + (i + 0.5) / n); ctx.lineTo(Math.cos(b) * rx * r2, Math.sin(b) * ry * r2 - ry * 0.05); }
    }
    ctx.quadraticCurveTo(rx * 0.6, -ry * 0.45, 0, -ry * 0.55);
    ctx.quadraticCurveTo(-rx * 0.6, -ry * 0.45, -rx * 1.0, -ry * 0.05);
    hairFill(ctx, col, ol);
  } else if (style === 'afro') {
    ctx.beginPath();
    ctx.moveTo(-rx * 0.95, -ry * 0.1); ctx.quadraticCurveTo(0, -ry * 0.75, rx * 0.95, -ry * 0.1);
    ctx.quadraticCurveTo(rx * 1.1, -ry * 1.15, 0, -ry * 1.2); ctx.quadraticCurveTo(-rx * 1.1, -ry * 1.15, -rx * 0.95, -ry * 0.1);
    hairFill(ctx, col, ol);
  } else if (style === 'bald') {                 // a fluffy fringe round the back, above the ears
    [-1, 1].forEach(s => {
      ctx.beginPath();
      [[0.98, -0.42, 0.13], [1.04, -0.22, 0.14], [0.98, -0.02, 0.12]].forEach(([u, v, r]) => { ctx.moveTo(s * rx * u + rx * r, ry * v); ctx.arc(s * rx * u, ry * v, rx * r, 0, TAU); });
      hairFill(ctx, col, ol);
    });
    hairShine(ctx, -rx * 0.35, -ry * 0.65, rx * 0.22, ry * 0.1);
  } else if (style === 'tuft') {
    ctx.beginPath();
    ctx.moveTo(-rx * 0.1, -ry * 0.96);
    ctx.bezierCurveTo(-rx * 0.25, -ry * 1.5, rx * 0.45, -ry * 1.55, rx * 0.3, -ry * 1.18);
    ctx.bezierCurveTo(rx * 0.2, -ry * 0.98, rx * 0.02, -ry * 1.12, rx * 0.12, -ry * 1.28);
    ctx.bezierCurveTo(rx * 0.0, -ry * 1.15, rx * 0.05, -ry * 0.95, rx * 0.12, -ry * 0.92);
    ctx.closePath();
    hairFill(ctx, col, ol);
  }
}

/* ---------- src/world.js ---------- */
/* world.js — the house: where the rooms are, the floors and furniture tops things land on, every
   thing in the house (furniture, props, people, pets), the draw order, and saving it all.
   World units: a room is 1500 x 1000; a grown-up stands about 400 tall. y grows downward. */

const RW = 1500, RH = 1000, WALL = 60, SLAB = 80;
const HOUSE_COLS = 4;
const GARDEN_X = HOUSE_COLS * RW + (HOUSE_COLS - 1) * WALL + WALL;   // after the house's right-hand outer wall
const GARDEN_W = 3000;
const GROUND_TOP = RH + SLAB;                    // top of the ground floor
const GROUND_Y = GROUND_TOP + RH;                // the bottom of the house, where the outside ground is
const WORLD = { x0: -700, x1: GARDEN_X + GARDEN_W + 500, y0: -900, y1: GROUND_Y + 260 };
const GRAV = 2600;

const ROOM_DEFS = [
  { id: 'kitchen', col: 0, floor: 0, bg: 'bg_kitchen', name: 'kitchen' },
  { id: 'dining', col: 1, floor: 0, bg: BACKDROPS.bg_dining ? 'bg_dining' : 'bg_kitchen', name: 'dining room' },
  { id: 'living', col: 2, floor: 0, bg: 'bg_living', name: 'living room' },
  { id: 'hall', col: 3, floor: 0, bg: 'bg_hall', name: 'hall' },
  { id: 'bath', col: 0, floor: 1, bg: 'bg_bath', name: 'bathroom' },
  { id: 'play', col: 1, floor: 1, bg: BACKDROPS.bg_play ? 'bg_play' : 'bg_kids', name: 'playroom' },
  { id: 'kids', col: 2, floor: 1, bg: 'bg_kids', name: 'bedroom' },
  { id: 'bedroom', col: 3, floor: 1, bg: 'bg_bedroom', name: 'bedroom' },
  { id: 'garden', x: GARDEN_X, y: GROUND_TOP, w: GARDEN_W, h: RH, bg: 'bg_garden', outdoor: true, name: 'garden' },
];

class Room {
  constructor(d) {
    Object.assign(this, d);
    if (d.col !== undefined) { this.x = d.col * (RW + WALL); this.y = d.floor === 1 ? 0 : GROUND_TOP; this.w = RW; this.h = RH; }
    const B = BACKDROPS[d.bg];
    this.wallY = this.y + (d.outdoor ? 743 : B.wall * RH);
    this.baseY = this.wallY + (d.outdoor ? 47 : 70);          // furniture stands here, against the wall
    this.floorTop = this.baseY + 28;                           // the floor band things can be put down on
    this.floorBot = this.y + RH - 14;
    this.floorY = Math.min(this.baseY + 140, this.y + 930);    // where thrown and dropped things settle
    this.lightOn = false; this.music = 0; this.tv = 0; this.dark = 0; this.curtains = 0;
  }
  contains(x, y, pad = 0) { return x >= this.x - pad && x <= this.x + this.w + pad && y >= this.y - pad && y <= this.y + this.h + pad; }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  // the camera stops in this room (the garden is two screens wide)
  stops() {
    if (this.w <= RW) return [[this.cx, this.cy]];
    const n = Math.round(this.w / RW), out = [];
    for (let i = 0; i < n; i++) out.push([this.x + (i + 0.5) * this.w / n, this.cy]);
    return out;
  }
  // clamp a point into the floor band
  bandY(y) { return clamp(y, this.floorTop, this.floorBot); }
}

/* ---------- surfaces: tops of furniture, shelves inside cupboards, seats for props, steps ---------- */
// { x0, x1, y, z, owner, inside (a box that hides what is in it when shut), accepts(thing), onLand(thing), soft, water }
let _sid = 0;
function surface(o) { return Object.assign({ id: 's' + (++_sid), z: 0, owner: null, inside: null, soft: false }, o); }

/* ---------- the world ---------- */
let _tid = 0;
const later = (fn, ms) => World.after(ms / 1000, fn);
const newId = p => (p || 't') + (++_tid).toString(36) + Math.floor(Math.random() * 1296).toString(36);

const World = {
  rooms: [], roomById: {}, fixtures: [], things: [], surfaces: [], timers: [], t: 0, night: 0, nightTo: 0, dirty: false,
  init() {
    this.timers = []; this.night = this.nightTo = 0; this.fireOn = false;
    this.rooms = ROOM_DEFS.map(d => new Room(d));
    this.rooms.forEach(r => { this.roomById[r.id] = r; });
    this.fixtures = []; this.things = []; this.surfaces = [];
  },
  room(id) { return this.roomById[id]; },
  roomAt(x, y) {
    for (const r of this.rooms) if (r.contains(x, y)) return r;
    return null;
  },
  // the room a point belongs to, or the nearest one (things dropped in the walls or the sky)
  nearestRoom(x, y) {
    let best = null, bd = 1e18;
    for (const r of this.rooms) {
      const dx = x < r.x ? r.x - x : x > r.x + r.w ? x - r.x - r.w : 0, dy = y < r.y ? r.y - y : y > r.y + r.h ? y - r.y - r.h : 0;
      const d = dx * dx + dy * dy * 1.5;
      if (d < bd) { bd = d; best = r; }
    }
    return best;
  },
  addFixture(f) { this.fixtures.push(f); return f; },
  addSurface(s) { this.surfaces.push(s); return s; },
  add(t) { this.things.push(t); this.dirty = true; return t; },
  remove(t) {
    const i = this.things.indexOf(t); if (i >= 0) this.things.splice(i, 1);
    // anything resting on it falls; anyone sitting in it gets out
    for (const o of this.things) if (o.carrier === t) o.unrest();
    if (t.seats) for (const s of t.seats) for (const w of s.who.slice()) { if (w.standUp) w.standUp(0); else s.leave(w); }
    if (t.seat) t.seat.leave(t);
    t.gone = true; this.dirty = true;
  },
  thing(id) { return this.things.find(t => t.id === id) || null; },
  fixture(id) { return this.fixtures.find(f => f.id === id) || null; },
  people() { return this.things.filter(t => t.kind === 'person'); },
  // the house is full: nothing new turns up (presents, refills) until things are eaten or tidied
  crowded() { return this.things.length > 220; },
  foodCount() { let n = 0; for (const t of this.things) if (t.kind === 'prop' && t.def.food) n++; return n; },
  inRoom(room, kind) { return this.things.filter(t => (!kind || t.kind === kind) && room.contains(t.x, t.y - 10)); },

  /* ---------- where a falling thing comes to rest ---------- */
  // every surface under x, including the tops of carriers (plates, prams, buckets)
  surfacesAt(x, w) {
    const out = [];
    for (const s of this.surfaces) {
      if (x < s.x0 - w * 0.25 || x > s.x1 + w * 0.25) continue;
      if (s.inside && s.inside.shut()) continue;
      out.push(s);
    }
    for (const t of this.things) if (t.carry && !t.held && t.state !== 'gone' && !t.hidden()) {
      const c = t.carrySurface();
      if (c && x >= c.x0 - w * 0.1 && x <= c.x1 + w * 0.1) out.push(c);
    }
    return out;
  },
  // the first surface crossed going down from y0 to y1
  landing(thing, x, y0, y1) {
    let best = null;
    for (const s of this.surfacesAt(x, thing.w || 60)) {
      if (s.owner === thing || (s.carrier && (s.carrier === thing || s.carrier.carrier === thing))) continue;
      if (s.accepts && !s.accepts(thing)) continue;
      if (s.y >= y0 - 0.5 && s.y <= y1 && (!best || s.y < best.y)) best = s;
    }
    return best;
  },

  /* ---------- time ---------- */
  // run fn after sec seconds of game time
  after(sec, fn) { this.timers.push({ t: this.t + sec, fn }); },
  update(dt) {
    this.t += dt;
    if (this.timers.length) {
      const due = this.timers.filter(T => T.t <= this.t);
      if (due.length) { this.timers = this.timers.filter(T => T.t > this.t); for (const T of due) { try { T.fn(); } catch (e) { console.error(e); } } }
    }
    // day turns to night (and back) over a couple of seconds
    if (this.night !== this.nightTo) {
      const k = dt / 2.4;
      this.night = this.nightTo > this.night ? Math.min(this.nightTo, this.night + k) : Math.max(this.nightTo, this.night - k);
    }
    for (const f of this.fixtures) f.update(dt);
    // music in a room comes from a radio playing in it now (before anyone decides whether to dance)
    for (const r of this.rooms) r.music = 0;
    for (const t of this.things) if (t.type === 'radio' && t.music && t.music.playing !== false && !t.hidden()) { const r = t.room(); if (r) r.music = 1; }
    for (const t of this.things.slice()) if (!t.gone) t.update(dt);
    Parts.update(dt);
  },
  setNight(on) {
    if ((this.nightTo > 0.5) === on) return;
    this.nightTo = on ? 1 : 0; this.dirty = true;
    SFX.play(on ? 'owl' : 'rooster');
    for (const p of this.people()) p.timeChanged(on);
  },

  /* ---------- drawing: everything sorted back to front ---------- */
  draw(ctx, view) {
    const L = [];
    const inView = (x0, y0, x1, y1) => x1 >= view.x0 && x0 <= view.x1 && y1 >= view.y0 && y0 <= view.y1;
    for (const f of this.fixtures) {
      if (!inView(f.x0, f.y0 - 200, f.x1, f.y1)) continue;
      f.layers(L);
    }
    for (const t of this.things) {
      if (t.gone || t.held || t.hidden() || (t.carrier && t.carrier.held) || (t.seat && t.seat.owner.held)) continue;
      const b = t.box();
      if (!inView(b.x0 - 80, b.y0 - 120, b.x1 + 80, b.y1 + 40)) continue;
      L.push({ z: t.zOrder(), fn: () => t.draw(ctx), t });
      if (t.def && t.def.front && t.seats.some(s => s.who.length)) L.push({ z: t.zOrder() + 0.8, fn: () => t.drawFront(ctx) });
    }
    L.sort((a, b) => a.z - b.z);
    for (const l of L) l.fn(ctx);
  },
  drawHeld(ctx) {
    for (const t of this.things) if (t.held && !t.gone) {
      t.draw(ctx);
      // what rides on it and who sits in it come along, on top
      for (const o of this.things) if (o !== t && !o.gone && (o.carrier === t || (o.seat && o.seat.owner === t))) o.draw(ctx);
      if (t.def && t.def.front && t.seats.some(s => s.who.length)) t.drawFront(ctx);
    }
  },

  /* ---------- finding what a finger is on ---------- */
  // the topmost thing (prop, person or pet) under a point, with some forgiveness for small fingers
  thingAt(x, y, slop) {
    let best = null, bz = -1e18;
    for (const t of this.things) {
      if (t.gone || t.held || t.hidden() || t.fixed) continue;
      const b = t.box(), s = slop + (t.kind === 'prop' ? Math.max(0, 70 - Math.min(b.x1 - b.x0, b.y1 - b.y0)) * 0.5 : 0);
      if (x < b.x0 - s || x > b.x1 + s || y < b.y0 - s || y > b.y1 + s) continue;
      // prefer what is drawn on top, and things the finger is actually inside
      const inside = x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1;
      const z = t.zOrder() + (inside ? (t.kind === 'prop' ? 2e6 : 1e6) : 0) + (t.kind === 'prop' ? 0.5 : 0);
      if (z > bz) { bz = z; best = t; }
    }
    return best;
  },
  fixtureAt(x, y) {
    let best = null, bz = -1e18, part = null;
    for (const f of this.fixtures) {
      const p = f.hit(x, y);
      if (p && f.z + (p.pri || 0) > bz) { bz = f.z + (p.pri || 0); best = f; part = p; }
    }
    return best ? { f: best, part } : null;
  },

  /* ---------- saving ---------- */
  save() {
    return {
      v: 1, night: this.nightTo,
      fixtures: this.fixtures.map(f => f.save()).filter(Boolean),
      things: this.things.filter(t => !t.gone && !t.noSave).map(t => t.save()),
      rooms: this.rooms.map(r => ({ id: r.id, light: r.lightOn })),
    };
  },
  load(d) {
    if (!d || d.v !== 1) return false;
    this.night = this.nightTo = d.night || 0;
    (d.rooms || []).forEach(s => { const r = this.room(s.id); if (r) r.lightOn = !!s.light; });
    const byId = {};
    this.fixtures.forEach(f => { byId[f.id] = f; });
    (d.fixtures || []).forEach(s => { const f = byId[s.id]; if (f) f.load(s); });
    this.things = [];
    const made = [];
    for (const s of d.things || []) { const t = thingFromSave(s); if (t) { this.things.push(t); made.push([t, s]); } }
    // second pass: what rests on what, who sits where
    for (const [t, s] of made) t.relink(s);
    return true;
  },
};

/* ---------- src/things.js ---------- */
/* things.js — everything a finger can pick up: the common part (being held, thrown, falling,
   bouncing, landing on furniture or anywhere on the floor, riding on a plate or in a pram), seats,
   and props (toys, food, hats, everything else). People and pets build on Thing. */

/* ---------- seats: on sofas, beds, chairs, the swing, the pram ---------- */
// o: { u, v (where the hip goes, as fractions of the owner's picture), pose, cap: [u0, v0, u1, v1] (where a drop is caught),
//      max, kinds (who may sit: 'person' | 'pet'), dx (each extra sitter is shifted by this, in world units), flip }
class Seat {
  constructor(owner, o) {
    this.owner = owner; Object.assign(this, { pose: 'sit', max: 1, kinds: ['person'], dx: 0, dy: 0 }, o);
    this.who = [];
  }
  get z() { return this.owner.zOrder ? this.owner.zOrder() : this.owner.z; }
  pos(i = 0) {
    const [x, y] = this.owner.at(this.u, this.v);
    return [x + i * this.dx, y + i * this.dy];
  }
  free(t) { return this.who.length < this.max && this.kinds.indexOf(t.kind) >= 0 && (!this.fits || this.fits(t)); }
  captures(x, y) {
    const [x0, y0] = this.owner.at(this.cap[0], this.cap[1]), [x1, y1] = this.owner.at(this.cap[2], this.cap[3]);
    return x >= x0 && x <= x1 && y >= y0 && y <= y1;
  }
  take(t) { if (this.who.indexOf(t) < 0) this.who.push(t); t.seat = this; t.seatI = this.who.indexOf(t); if (this.onTake) this.onTake(t); }
  leave(t) { const i = this.who.indexOf(t); if (i >= 0) this.who.splice(i, 1); this.who.forEach((w, j) => { w.seatI = j; }); if (t.seat === this) t.seat = null; if (this.onLeave) this.onLeave(t); }
}

/* ---------- the common part ---------- */
class Thing {
  constructor(kind, o) {
    this.kind = kind; this.id = o.id || newId(kind[0]);
    this.x = o.x || 0; this.y = o.y || 0; this.vx = 0; this.vy = 0; this.rot = 0; this.vr = 0;
    this.state = 'fall'; this.on = null; this.carrier = null; this.seat = null; this.seatI = 0; this.held = null;
    this.squash = 1; this.sqv = 0; this.t = Rnd.f() * 10; this.restT = 0; this.floorTarget = null; this.firstFall = false;
    this.w = 60; this.h = 60;
  }
  hidden() {
    if (this.on && this.on.inside && this.on.inside.shut()) return true;
    if (this.carrier && this.carrier.hidden()) return true;
    if (this.seat && this.seat.hides && this.seat.hides(this)) return true;
    return false;
  }
  zOrder() {
    if (this.held) return 1e9;
    if (this.slot) return this.slot.owner.z + (this.slot.owner.slotZ === undefined ? -0.2 : this.slot.owner.slotZ);
    if (this.seat) return this.seat.z + 0.6 + this.seatI * 0.01;
    if (this.carrier) return this.carrier.zOrder() + 0.02;
    if (this.on && this.on.z) return this.on.z + 0.5 + this.x * 1e-7;
    return this.y + 0.3;
  }
  room() { return World.nearestRoom(this.x, this.y - 20); }
  box() { return { x0: this.x - this.w / 2, y0: this.y - this.h, x1: this.x + this.w / 2, y1: this.y }; }
  centre() { const b = this.box(); return [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2]; }

  /* ---------- fingers ---------- */
  grab(ptr) {
    if (this.seat) this.seat.leave(this);
    this.on = null; this.carrier = null; this.slot = null; this.held = ptr; this.state = 'held'; this.vx = this.vy = 0;
    World.dirty = true;
  }
  // where the thing goes when the finger is at (px, py); props ride a little above the fingertip
  follow(px, py, dt) {
    const tx = px, ty = py + this.h * 0.5 - this.liftBy();
    const k = Math.min(1, dt * 30);
    const nx = lerp(this.x, tx, k), ny = lerp(this.y, ty, k);
    if (dt > 0) { this.vx = lerp(this.vx, (nx - this.x) / dt, 0.35); this.vy = lerp(this.vy, (ny - this.y) / dt, 0.35); }
    this.x = nx; this.y = ny;
  }
  liftBy() { return 30; }
  release() {
    this.held = null;
    const vx = clamp(this.vx, -2600, 2600), vy = clamp(this.vy, -2600, 2600), spd = Math.hypot(vx, vy);
    World.dirty = true;
    if (spd < 900 && this.dropOnto()) return;
    this.startFall(spd < 260 ? 0 : vx * 0.7, spd < 260 ? 0 : vy * 0.7, spd < 500);
  }
  dropOnto() { return Interact.drop(this); }
  // falling from here; a gentle drop onto the floor band stays where it was put
  startFall(vx, vy, gentle) {
    this.state = 'fall'; this.on = null; this.carrier = null; this.slot = null; this.vx = vx; this.vy = vy; this.firstFall = true;
    const r = World.nearestRoom(this.x, this.y - 10);
    this.x = clamp(this.x, r.x + this.w * 0.3, r.x + r.w - this.w * 0.3);
    if (this.y - this.h < r.y - (r.outdoor ? 600 : 0)) { this.y = r.y + this.h + 10 - (r.outdoor ? 600 : 0); this.vy = Math.max(0, this.vy); }
    if (gentle && this.y >= r.floorTop - 30 && this.y <= r.y + r.h + 60) this.floorTarget = r.bandY(this.y);
    else this.floorTarget = r.floorY + (Rnd.f() - 0.5) * 30;
    this.fallRoom = r;
  }
  unrest() { if (this.state === 'rest') this.startFall(0, 0, false); }
  // lands on s (a surface), or on the floor when s is null
  land(s, y) {
    const impact = this.vy;
    this.y = y; this.state = 'rest'; this.on = s; this.restT = 0;
    if (s && s.carrier) { this.carrier = s.carrier; this.cdx = this.x - s.carrier.x; }
    if (impact > 700 && this.bounce() > 0) {
      this.vy = -impact * this.bounce(); this.vx *= 0.75; this.state = 'fall'; this.on = null; this.carrier = null; this.firstFall = false;
      this.onBounce(impact); return;
    }
    this.vy = 0;
    if (!this.rolls()) this.vx = 0;
    this.sqv = -Math.min(6, impact / 260);
    this.onLand(impact, s);
    if (s && s.onLand) s.onLand(this);
  }
  bounce() { return 0.2; }
  rolls() { return false; }
  onBounce(v) { SFX.play('boing', { f: 160 + Math.random() * 80 }); }
  onLand(v, s) { if (v > 300) SFX.play(s && s.soft ? 'squish' : 'thud'); }

  physics(dt) {
    // squash and stretch after a landing
    this.sqv += (1 - this.squash) * 220 * dt - this.sqv * 12 * dt;
    this.squash = clamp(this.squash + this.sqv * dt, 0.6, 1.3);
    if (this.held) return;
    if (this.state === 'rest') {
      this.restT += dt;
      if (this.carrier) {
        if (this.carrier.gone) { this.unrest(); return; }
        const c = this.carrier.carrySurface();
        this.x = this.carrier.x + this.cdx; this.y = c.y;
      } else if (this.rolls() && Math.abs(this.vx) > 8 && !(this.on && this.on.inside)) {
        this.x += this.vx * dt; this.vx *= Math.exp(-dt * (this.on ? 1.6 : 0.9)); this.rot += this.vx * dt / (this.h * 0.5);
        const r = this.room();
        if (this.on && (this.x < this.on.x0 - 5 || this.x > this.on.x1 + 5)) { this.startFall(this.vx, 0, false); return; }
        if (!this.on && r) {
          if (this.x < r.x + this.w * 0.5) { this.x = r.x + this.w * 0.5; this.vx = Math.abs(this.vx) * 0.6; this.onBounce(400); }
          if (this.x > r.x + r.w - this.w * 0.5) { this.x = r.x + r.w - this.w * 0.5; this.vx = -Math.abs(this.vx) * 0.6; this.onBounce(400); }
        }
      }
      if (this.on && this.on.gone) this.unrest();
      return;
    }
    if (this.state !== 'fall') return;
    const y0 = this.y - (this.firstFall ? 46 : 0);
    this.firstFall = false;
    this.vy += GRAV * dt; this.vx *= Math.exp(-dt * 0.4);
    this.x += this.vx * dt; this.y += this.vy * dt; this.rot += this.vr * dt;
    const r = this.fallRoom || this.room();
    // walls of the room keep thrown things in
    if (r) {
      if (this.x < r.x + this.w * 0.4) { this.x = r.x + this.w * 0.4; this.vx = Math.abs(this.vx) * 0.5; }
      if (this.x > r.x + r.w - this.w * 0.4) { this.x = r.x + r.w - this.w * 0.4; this.vx = -Math.abs(this.vx) * 0.5; }
      if (this.y - this.h < r.y && this.vy < 0) { this.vy = Math.abs(this.vy) * 0.3; }
    }
    if (this.vy > 0) {
      const s = World.landing(this, this.x, y0, this.y);
      if (s && (this.floorTarget === null || s.y <= this.floorTarget + 2)) { this.land(s, s.y); return; }
      if (this.floorTarget !== null && this.y >= this.floorTarget) {
        if (r && this.floorTarget < r.floorTop - 8) { this.floorTarget = r.floorY; return; }
        this.land(null, this.floorTarget);
        if (this.state === 'fall') this.floorTarget = r ? (this.floorTarget > r.floorY ? this.floorTarget : r.floorY) : this.floorTarget;
        return;
      }
    }
    if (this.y > WORLD.y1) { this.y = r ? r.floorY : GROUND_Y - 100; this.vy = 0; this.land(null, this.y); }
  }
  update(dt) { this.t += dt; this.physics(dt); }
  tap() {}
  // the shadow under a thing resting on the floor or a top
  drawShadow(ctx, w) {
    if (this.state !== 'rest' && this.state !== 'fall') return;
    let gy = this.y, k = 1;
    if (this.state === 'fall') { gy = this.floorTarget || this.y; k = clamp(1 - (gy - this.y) / 600, 0.2, 1); }
    ctx.fillStyle = 'rgba(40,25,30,' + (0.2 * k) + ')';
    ctx.beginPath(); ctx.ellipse(this.x, gy - 2, w * 0.45 * k, w * 0.1 * k, 0, 0, TAU); ctx.fill();
  }
  save() { return { k: this.kind, id: this.id, x: Math.round(this.x), y: Math.round(this.y), on: this.saveOn() }; }
  saveOn() {
    if (this.seat) return { seat: this.seat.owner.id, si: this.seat.owner.seats.indexOf(this.seat) };
    if (this.carrier) return { carrier: this.carrier.id, dx: Math.round(this.cdx) };
    if (this.on && this.on.id && this.on.owner) return { s: this.on.owner.id, si: this.on.owner.surfaces.indexOf(this.on) };
    if (this.slot) return { slot: this.slot.owner.id, name: this.slot.name };
    return null;
  }
  relink(s) {
    const o = s.on;
    this.state = 'rest'; this.on = null;
    if (!o) { this.settle(); return; }
    if (o.seat) { const f = World.fixture(o.seat) || World.thing(o.seat); const st = f && f.seats && f.seats[o.si]; if (st && st.free(this)) { st.take(this); this.state = 'seat'; return; } }
    if (o.carrier) { const c = World.thing(o.carrier); if (c && c.carry) { this.carrier = c; this.cdx = o.dx; this.on = c.carrySurface(); return; } }
    if (o.s) { const f = World.fixture(o.s); const sf = f && f.surfaces[o.si]; if (sf) { this.on = sf; this.y = sf.y; return; } }
    if (o.slot) { const f = World.fixture(o.slot); if (f && f.putInSlot) { f.putInSlot(this, o.name); return; } }
    this.settle();
  }
  // saved in mid-air (held when the app was put away, or waiting in the toilet): it falls when the house comes back
  settle() {
    if (this.on || this.carrier || this.seat) return;
    const r = World.nearestRoom(this.x, this.y - 10);
    if (this.y < r.floorTop - 5 || this.y > r.floorBot + 30) this.startFall(0, 0, false);
  }
}

/* ---------- props ---------- */
class Prop extends Thing {
  constructor(o) {
    super('prop', o);
    this.type = o.type; this.def = PROPS[o.type] || PROPS.ball;
    this.h = o.h || this.def.h; this.w = this.h * Art.aspect(this.def.pic) * (this.def.wk || 1);
    this.cooked = o.cooked || null; this.bites = o.bites || 0; this.tint = o.tint || this.def.tint || null; this.clean = 0;
    this.home = o.home || null;     // where it goes back to after being flushed or binned
    this.carry = this.def.carry || null;
    this.seats = this.def.seat ? [new Seat(this, this.def.seat)] : [];
    this.surfaces = [];
    this._spr = null;
  }
  get name() { return this.def.name; }
  bounce() { return this.def.bounce === undefined ? 0.22 : this.def.bounce; }
  rolls() { return !!this.def.rolls; }
  liftBy() { return this.h * 0.5 + 34; }
  // a point on the picture, as fractions of its width and height (for seats on prams and trikes)
  at(u, v) { return [this.x - this.w / 2 + u * this.w, this.y - this.h + v * this.h]; }
  carrySurface() {
    const c = this.carry;
    if (!this._cs) this._cs = surface({ carrier: this, owner: this });
    const s = this._cs;
    s.x0 = this.x - this.w / 2 + c[0] * this.w; s.x1 = this.x - this.w / 2 + c[1] * this.w; s.y = this.y - this.h + c[2] * this.h;
    s.z = this.zOrder(); s.accepts = this.def.carries || (t => t.kind === 'prop');
    return s;
  }
  grab(ptr) { super.grab(ptr); if (this.def.say !== false) Say.word(this.name); if (this.def.onGrab) this.def.onGrab(this); }
  onLand(v, s) {
    if (v > 260) {
      const m = this.def.sound;
