    case 'fan': return right ? [m.x + 42 + Math.sin(t * 26) * 14, m.y - 8] : idle();
    case 'cup': return right ? [m.x + 26, m.y + 6] : idle();
    case 'hold': return [m.x + s * 24, m.y + 26];
    case 'cover': return [m.x + s * 12, m.y + 2];
    case 'cheeks': return [m.x + s * (m.hw + 14), m.y - 8];
    case 'hug': return [-s * 16, m.y + 34];
    case 'head': return [s * 30, g.bodyTop + 6];

/* ---------- src/monster.js ---------- */
/* monster.js — a monster on screen: its design, what its face and body are doing this moment,
   how it idles (breathes, blinks, looks about, wobbles its antennae) and how it is drawn.
   Reactions change pose/face/fx/tint through scripts run on the monster's own task list. */

function randomDesign(f = Rnd.f) {
  const p = arr => arr[Math.floor(f() * arr.length)];
  return {
    body: p(BODY_KEYS), color: p(COLORS.slice(0, 9).concat(f() < 0.3 ? ['rainbow'] : [])), eyes: p(EYES), mouth: p(MOUTHS),
    top: p(TOPS.slice(1)), arms: p(ARMS.slice(0, 6)), legs: p(LEGS), pattern: p(PATTERNS), seed: Math.floor(f() * 1e9),
  };

const POSE0 = () => ({ x: 0, lift: 0, rot: 0, sx: 1, sy: 1, flip: 1, shake: 0, skew: 0 });
const FACE0 = () => ({ eyes: 'open', mouth: 'smile', open: 0, wide: 1, brows: null, blush: 0, cheeks: 0, mdx: 0, mdy: 0, chatter: false, stuckCol: null, tongueCol: null });

class Monster {
  constructor(rec) {
    this.rec = rec;
    this.tasks = new Tasks();
    this.x = 0; this.y = 0; this.scale = 1;
    this.t = rand(0, 10);
    this.blink = 0; this.blinkIn = rand(1, 3);
    this.glance = [0, 0]; this.glanceIn = 1;
    this.lookAt = null;
    this.mat = [1, 0, 0, 1, 0, 0];
    this.held = null;
    this.setDesign(rec.design);
    this.reset();
  }
  setDesign(d) {
    this.d = d;
    this.g = monsterGeometry(d);
    this.pal = PAL[d.color];
    this.cache = {};
    this.springs = [{ x: 0, y: 0, vx: 0, vy: 0 }, { x: 0, y: 0, vx: 0, vy: 0 }];
    this.lastHead = null;
  }
  reset() {
    this.pose = POSE0(); this.face = FACE0(); this.fx = FX0();
    this.tint = { col: null, amt: 0, level: 1 };
    this.armPose = 'idle'; this.legAmt = 0; this.legPhase = 0; this.flap = 3; this.clawOpen = 0;
    // a reaction's own drawings ({ layer: 'back' | 'body' | 'face' | 'front', draw(ctx, m) }), and the colours it may have changed
    this.decor = []; this.pal = PAL[this.d.color]; this.cache = {};
  }
  get busy() { return this.tasks.busy; }
  play(script) { return this.tasks.add(script); }

  update(dt) {
    this.t += dt;
    this.tasks.update(dt);

    this.blinkIn -= dt;
    if (this.blinkIn <= 0) { this.blinkT = 0; this.blinkIn = chance(0.2) ? 0.3 : rand(2, 5); }
    if (this.blinkT !== undefined) {
      this.blinkT += dt;
      this.blink = this.blinkT < 0.07 ? this.blinkT / 0.07 : this.blinkT < 0.16 ? 1 - (this.blinkT - 0.07) / 0.09 : 0;
      if (this.blinkT >= 0.16) { this.blinkT = undefined; this.blink = 0; }
    }

    this.glanceIn -= dt;
    if (this.glanceIn <= 0) { this.glance = chance(0.4) ? [0, 0.1] : [rand(-0.9, 0.9), rand(-0.5, 0.6)]; this.glanceIn = rand(1.2, 3.5); }

  computeMatrix() {

    if (by < g.bodyTop + 20 && by > g.bodyTop - g.height * 0.3 && Math.abs(bx) < g.B.w * 0.7) return true;
    return Math.abs(bx) < g.B.w + pad && Math.abs(by) < g.B.h + pad && g.F.inside(bx * 0.85, by * 0.85);
  }

    const [bx, by] = this.toBody(x, y), g = this.g, m = g.mouth;
    for (const e of g.eyes) if (dist(bx, by, e.x, e.y) < e.r * 1.35 + 6) return 'eyes';
    if (Math.abs(bx - m.x) < m.hw * 1.15 && Math.abs(by - m.y) < 26) return 'mouth';
    if (by < g.bodyTop + 14 && Math.abs(bx) < g.B.w) return 'top';
    if (by > g.B.h - 8 && by < g.ground + 20) return 'legs';
    if (!g.F.inside(bx, by) && Math.abs(bx) > g.B.w * 0.75 && by > g.B.armY - 40 && by < g.B.armY + 70) return 'arms';
    if (g.F.inside(bx, by)) return 'pattern';

  }

  draw(ctx) {
    const s = this.scale, P = this.pose, g = this.g;

    drawBody(ctx, this);
    this.drawDecor(ctx, 'body');
    this.drawLump(ctx);
    drawEyes(ctx, this);
    drawMouth(ctx, this);
    this.drawFaceFx(ctx);
    this.drawDecor(ctx, 'face');

    lp.type = 'lowpass'; lp.frequency.value = 900; a.connect(lp); lp.connect(g); g.connect(SFX.out); _env(g, t, 0.005, 0.03, 0.1, 0.5);
    a.start(t); a.stop(t + 0.2);
  },
  // water bubbling in a throat
  gargle(c, t, o) {
    const d = o.dur || 0.9;
    _flutter(c, _noise(c, t, d, 'lowpass', 600, 400, 3, 0.5, null, 0.05), t, d, 19, 0.45);
    for (let i = 0; i < 12; i++) _osc(c, 'sine', 180 + Math.random() * 220, t + Math.random() * d, 0.05, 0.18, null, 520);
  },
  // a tin can: clank! (o.f tunes it); rattling about in a tummy
  clank(c, t, o) { const f = o.f || 1250; [[1, 0.35], [2.4, 0.2], [3.9, 0.12]].forEach(([k, a]) => _osc(c, 'triangle', f * k, t, 0.28 / Math.sqrt(k), a)); _noise(c, t, 0.03, 'bandpass', 4000, null, 2, 0.5, null, 0.001); },
  rattle(c, t) { for (let i = 0; i < 6; i++) SOUNDS.clank(c, t + i * 0.05 + Math.random() * 0.03, { f: 1100 + Math.random() * 900 }); },
  // slime: a wet, low bloop
  glorp(c, t, o) { const f = o.f || 140; _osc(c, 'sine', f, t, 0.18, 0.55, null, f * 3); _noise(c, t, 0.14, 'lowpass', 800, 300, 4, 0.35, null, 0.01); },
  inhale(c, t, o) { const d = o.dur || 0.8; _noise(c, t, d, 'bandpass', 900, 2600, 2.5, 1.1, null, d * 0.6); },
  scrub(c, t) { for (let i = 0; i < 4; i++) _noise(c, t + i * 0.09, 0.07, 'bandpass', i % 2 ? 2600 : 1700, null, 2, 1.2, null, 0.005); },
  // a fly going round and round
  buzz(c, t, o) {
    const d = o.dur || 1.2, a = c.createOscillator(), g = _gain(c), l = c.createOscillator(), lg = _gain(c, 30);
    a.type = 'sawtooth'; a.frequency.value = 230; l.frequency.value = 3; l.connect(lg); lg.connect(a.frequency);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 1.5;
    a.connect(bp); bp.connect(g); g.connect(SFX.out); _env(g, t, 0.2, d * 0.6, d * 0.3, 0.35);
    a.start(t); l.start(t); a.stop(t + d + 0.1); l.stop(t + d + 0.1);
  },
  // loops
  hum(c, t, o) {
    const f = o.f || 110, a = c.createOscillator(), b = c.createOscillator(), lp = c.createBiquadFilter(), g = _gain(c);
    a.type = 'sawtooth'; a.frequency.value = f; b.type = 'square'; b.frequency.value = f * 2.01;
    lp.type = 'lowpass'; lp.frequency.value = o.lp || 700;
    a.connect(lp); b.connect(lp); lp.connect(g); g.connect(SFX.out);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(o.vol || 0.12, t + 0.15);
    a.start(t); b.start(t);
    return _loop(c, [a, b], g);
  },
  blender(c, t) {
    const a = c.createOscillator(), lp = c.createBiquadFilter(), g = _gain(c);
    a.type = 'sawtooth'; a.frequency.setValueAtTime(70, t); a.frequency.exponentialRampToValueAtTime(190, t + 0.6);
    lp.type = 'lowpass'; lp.frequency.value = 1400; lp.Q.value = 2;
    a.connect(lp); lp.connect(g); g.connect(SFX.out);
    const s = c.createBufferSource(); s.buffer = SFX.noiseBuf; s.loop = true;
    const nf = c.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 1600; nf.Q.value = 0.7;
    const ng = _gain(c, 0.5); s.connect(nf); nf.connect(ng); ng.connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.2);
    _flutter(c, g, t, 30, 33, 0.08);
    a.start(t); s.start(t);
    return _loop(c, [a, s], g);
  },
  bubbling(c, t, o) {   // a pot or fryer bubbling: random bloops until stopped
    const g = _gain(c, 1); g.connect(SFX.out);
    let alive = true, tt = t;
    const oil = o.oil;
    const next = () => {
      if (!alive) return;
      const now = c.currentTime;
      while (tt < now + 0.3) {
        tt += (oil ? 0.02 : 0.07) + Math.random() * (oil ? 0.05 : 0.15);
        if (oil) _noise(c, tt, 0.02, 'highpass', 4500, null, 1, 0.25, g); else _osc(c, 'sine', 200 + Math.random() * 300, tt, 0.06, 0.12, g, 600 + Math.random() * 500);
      }
      setTimeout(next, 150);
    };
    next();
    let hiss = null;
    if (oil) {   // the steady hiss of hot oil under the pops
      hiss = c.createBufferSource(); hiss.buffer = SFX.noiseBuf; hiss.loop = true;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
      const hg = _gain(c, 0.0001); hg.gain.linearRampToValueAtTime(0.13, t + 0.3);
      hiss.connect(hp); hp.connect(hg); hg.connect(g); hiss.start(t);
    }
    return { stop() { alive = false; try { const n = c.currentTime; g.gain.setValueAtTime(g.gain.value, n); g.gain.linearRampToValueAtTime(0.0001, n + 0.2); if (hiss) hiss.stop(n + 0.25); } catch (e) {} } };
  },
};

/* ---------- src/speech.js ---------- */
/* speech.js — says food names, colours and monster names in the device's own voice. */
const Say = {
  voice: null, on: true,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pickVoice = () => {
      const vs = speechSynthesis.getVoices(), lang = (navigator.language || 'en-GB').toLowerCase();
      const en = vs.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
      const same = en.filter(v => v.lang.toLowerCase().replace('_', '-') === lang);
      const nice = l => l.find(v => /enhanced|premium|natural/i.test(v.name));
      this.voice = nice(same) || same[0] || nice(en) || en[0] || null;
    };
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  },
  say(text, o = {}) {
    if (!this.on || !text || !('speechSynthesis' in window)) return;
    try {
      const go = () => {
        const u = new SpeechSynthesisUtterance(text);
        if (this.voice) u.voice = this.voice;
        u.rate = o.rate || 0.92; u.pitch = o.pitch || 1.15; u.volume = 1;
        speechSynthesis.speak(u);
      };
      // iOS sometimes drops a word spoken straight after cancel(): give it a moment
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 60); } else go();
    } catch (e) {}
  },
};

  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (d[(y * w + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? { x: 0, y: 0, w, h } : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };

/* ---------- bites ---------- */
// a copy of the sprite with n mouthfuls gone from the top; the scalloped edge of a bite
function bitten(src, n, seed) {
  const c = copyCanvas(src), g = c.getContext('2d'), b = src._box || (src._box = opaqueBox(src));
  const f = seeded(seed || 3);
  g.globalCompositeOperation = 'destination-out';
  for (let k = 1; k <= n; k++) {
    const depth = b.y + b.h * (k === 1 ? 0.3 : k === 2 ? 0.58 : 0.86), R = b.w * 0.2;
    for (let i = -2; i <= 2; i++) {
      g.beginPath(); g.arc(b.x + b.w / 2 + i * b.w * 0.2 + (f() - 0.5) * 8, depth - R * 0.55 + Math.abs(i) * R * 0.12, R, 0, TAU); g.fill();
    }

/* ---------- cooking: each way of cooking has its own look ---------- */
const COOK = {
  toast: { name: 'toasted', fx: ['crunchy'] },
  bake: { name: 'baked', fx: ['hot'] },
  fry: { name: 'fried', fx: ['crunchy'] },
  airfry: { name: 'crispy', fx: ['crunchy'] },
  waffle: { name: 'waffled', fx: [] },
  micro: { name: 'hot', fx: ['hot'] },
  pan: { name: 'fried', fx: ['hot'] },
  freeze: { name: 'frozen', fx: ['cold'] },
};
// re-apply the sprite's own outline as a mask, after painting over it
function keepShape(g, shape) { g.globalCompositeOperation = 'destination-in'; g.drawImage(shape, 0, 0); g.globalCompositeOperation = 'source-over'; }
function cookSprite(src, how, seed) {
  const W = src.width, H = src.height, b = src._box || (src._box = opaqueBox(src));
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, R = Math.max(b.w, b.h) / 2;
  const c = makeCanvas(W, H), g = c.getContext('2d'), f = seeded(seed || 11);
  switch (how) {
    case 'toast': {          // browned all over, darkest at the edges
      g.drawImage(src, 0, 0);
      g.globalCompositeOperation = 'multiply';
      const gr = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.05);
      gr.addColorStop(0, '#e8b070'); gr.addColorStop(0.7, '#c47a36'); gr.addColorStop(1, '#6a3410');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      keepShape(g, src);
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = 'rgba(60,25,5,0.25)';
      for (let i = 0; i < 26; i++) { g.beginPath(); g.arc(b.x + f() * b.w, b.y + f() * b.h, 2 + f() * 5, 0, TAU); g.fill(); }
      break;
    }
    case 'bake': {           // a golden glaze and a shine
      g.drawImage(src, 0, 0);
      g.globalCompositeOperation = 'source-atop';
      const gr = g.createLinearGradient(0, b.y, 0, b.y + b.h);
      gr.addColorStop(0, 'rgba(255,200,90,0.35)'); gr.addColorStop(1, 'rgba(170,90,20,0.45)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,255,230,0.45)'; g.beginPath(); g.ellipse(cx - b.w * 0.18, b.y + b.h * 0.25, b.w * 0.2, b.h * 0.07, -0.4, 0, TAU); g.fill();
      break;
    }
    case 'fry': {            // dunked in batter: a lumpy golden coat the shape of the food
      const pad = Math.round(R * 0.12), m = makeCanvas(W, H), mg = m.getContext('2d');
      for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; mg.drawImage(src, Math.cos(a) * pad, Math.sin(a) * pad); }
      mg.drawImage(src, 0, 0);
      // a darker rim one step further out, for the outline
      for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; g.drawImage(m, Math.cos(a) * 4, Math.sin(a) * 4); }
      g.globalCompositeOperation = 'source-in'; g.fillStyle = '#6a3a10'; g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'source-over';
      const coat = makeCanvas(W, H), cg = coat.getContext('2d');
      cg.drawImage(m, 0, 0);
      cg.globalCompositeOperation = 'source-in';
      const gr = cg.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R * 1.25);
      gr.addColorStop(0, '#ffe08a'); gr.addColorStop(0.5, '#f0a83a'); gr.addColorStop(1, '#b8661c');
      cg.fillStyle = gr; cg.fillRect(0, 0, W, H);
      cg.globalCompositeOperation = 'source-atop';
      for (let i = 0; i < 90; i++) {
        const x = b.x - pad + f() * (b.w + pad * 2), y = b.y - pad + f() * (b.h + pad * 2), r = 2 + f() * 6;
        cg.fillStyle = f() < 0.5 ? 'rgba(255,240,180,0.55)' : 'rgba(150,80,20,0.35)';
        cg.beginPath(); cg.arc(x, y, r, 0, TAU); cg.fill();
      }
      g.drawImage(coat, 0, 0);
      g.globalAlpha = 0.28; g.drawImage(src, 0, 0); g.globalAlpha = 1;   // the food shows faintly through
      break;
    }
    case 'airfry': {         // crisp brown edges and crumbly bits
      g.drawImage(src, 0, 0);
      const edge = makeCanvas(W, H), eg = edge.getContext('2d');
      eg.fillStyle = '#7a3a10'; eg.fillRect(0, 0, W, H);
      eg.globalCompositeOperation = 'destination-out';
      const sh = Math.max(4, R * 0.09);
      eg.drawImage(src, -sh, -sh * 0.4); eg.drawImage(src, sh, -sh * 0.4); eg.drawImage(src, 0, sh * 0.8);
      g.globalCompositeOperation = 'source-atop'; g.globalAlpha = 0.55; g.drawImage(edge, 0, 0); g.globalAlpha = 1;
      g.fillStyle = 'rgba(255,220,140,0.5)';
      for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(b.x + f() * b.w, b.y + f() * b.h, 1.5 + f() * 3, 0, TAU); g.fill(); }
      break;
    }
    case 'waffle': {         // squashed flat in the waffle maker, the grid pressed into it
      const sq = makeCanvas(W, H), sg = sq.getContext('2d');
      sg.drawImage(src, b.x, b.y, b.w, b.h, cx - b.w * 0.6, cy - b.h * 0.3, b.w * 1.2, b.h * 0.6);
      g.drawImage(sq, 0, 0);
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = 'rgba(240,170,60,0.35)'; g.fillRect(0, 0, W, H);
      const step = R * 0.24;
      g.fillStyle = 'rgba(120,60,10,0.45)';
      for (let x = cx - R * 1.4; x < cx + R * 1.4; x += step) g.fillRect(x, 0, step * 0.22, H);
      for (let y = cy - R; y < cy + R; y += step * 0.6) g.fillRect(0, y, W, step * 0.14);
      g.fillStyle = 'rgba(255,240,200,0.35)';
      for (let x = cx - R * 1.4; x < cx + R * 1.4; x += step) g.fillRect(x + step * 0.25, 0, step * 0.08, H);
      break;
    }
    case 'micro': {          // warmed through: a little puffed and rosy
      g.drawImage(src, 0, 0);
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = 'rgba(255,120,60,0.16)'; g.fillRect(0, 0, W, H);
      break;
    }
    case 'pan': {            // seared brown on the bottom, a shine of butter
      g.drawImage(src, 0, 0);
      g.globalCompositeOperation = 'source-atop';
      const gr = g.createLinearGradient(0, b.y + b.h * 0.45, 0, b.y + b.h);
      gr.addColorStop(0, 'rgba(120,60,10,0)'); gr.addColorStop(1, 'rgba(110,50,8,0.7)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(90,40,5,0.35)';
      for (let i = 0; i < 14; i++) { g.beginPath(); g.ellipse(b.x + f() * b.w, b.y + b.h * (0.55 + f() * 0.4), 4 + f() * 9, 2 + f() * 4, f(), 0, TAU); g.fill(); }
      g.fillStyle = 'rgba(255,250,210,0.5)'; g.beginPath(); g.ellipse(cx + b.w * 0.15, b.y + b.h * 0.22, b.w * 0.16, b.h * 0.05, -0.3, 0, TAU); g.fill();
      break;
    }
    case 'freeze': {         // frozen inside a block of ice
      const s = Math.max(b.w, b.h) * 1.08, x = cx - s / 2, y = cy - s / 2, r = s * 0.16;
      const tint = makeCanvas(W, H), tg = tint.getContext('2d');
      tg.drawImage(src, 0, 0); tg.globalCompositeOperation = 'source-atop'; tg.fillStyle = 'rgba(150,215,255,0.28)'; tg.fillRect(0, 0, W, H);
      const k = 0.86; g.save(); g.translate(cx, cy); g.scale(k, k); g.translate(-cx, -cy); g.drawImage(tint, 0, 0); g.restore();
      g.beginPath(); rrect(g, x, y, s, s, r);
      const gr = g.createLinearGradient(x, y, x + s, y + s);
      gr.addColorStop(0, 'rgba(230,248,255,0.5)'); gr.addColorStop(0.5, 'rgba(170,225,255,0.2)'); gr.addColorStop(1, 'rgba(120,190,240,0.45)');
      g.fillStyle = gr; g.fill();
      g.lineWidth = Math.max(3, s * 0.025); g.strokeStyle = '#3d86c6'; g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = Math.max(3, s * 0.03); g.lineCap = 'round';
      g.beginPath(); g.moveTo(x + r * 0.8, y + s * 0.12); g.lineTo(x + s * 0.42, y + s * 0.12); g.stroke();
      g.beginPath(); g.moveTo(x + s * 0.1, y + r); g.lineTo(x + s * 0.1, y + s * 0.4); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.75)';
      for (let i = 0; i < 18; i++) { g.beginPath(); g.arc(x + f() * s, y + f() * s * 0.35, 1 + f() * 2.5, 0, TAU); g.fill(); }
      break;
    }
    default: g.drawImage(src, 0, 0);
  }
  c._box = how === 'fry' || how === 'freeze' ? opaqueBox(c) : b;
  return c;
}

/* ---------- src/tastes.js ---------- */
/* tastes.js — what each monster loves, likes and won't eat.
   Loves: foods the colour of the monster, the kind of food its mouth is made for, two favourites
   of its own, and a way of cooking it adores. Won't eat: one kind of food, three foods of its own
   and a way of cooking it can't stand. Monster munchies (socks, worms...) are loved by the gross
   ones and refused by the rest. Everything else it likes. */

const MOUTH_LOVES = { smile: 'junk', fangs: 'meat', buck: 'crunchy', shark: 'fish', tongue: 'sweet', tiny: 'small', grin: 'soft', tusks: 'big' };
const HATE_GROUPS = ['veg', 'fruit', 'sweet', 'meat', 'fish', 'spicy', 'sour', 'dairy', 'bread', 'crunchy', 'soft', 'hot', 'cold', 'beans', 'egg'];
const COOK_KEYS = ['toast', 'bake', 'fry', 'airfry', 'waffle', 'micro', 'pan', 'freeze'];

function makePersona(design, seed) {
  const f = seeded(seed);
  const love = MOUTH_LOVES[design.mouth];
  const pool = HATE_GROUPS.filter(g => g !== love && !(love === 'sweet' && g === 'cold') && !(love === 'soft' && g === 'hot'));
  const ids = Object.keys(FOOD_DATA).filter(id => FOOD_DATA[id][0] !== 'munch');
  const picks = shuffle(ids.slice(), f);
  const cooks = shuffle(COOK_KEYS.slice(), f);
  return { hate: pool[Math.floor(f() * pool.length)], gross: f() < 0.5, loves: picks.slice(0, 2), hates: picks.slice(2, 5), cookLove: cooks[0], cookHate: cooks[1] };
}

function prefOf(mon, id) {
  const d = mon.design, P = mon.persona, F = FOODS[id];
  if (!F || !P) return 'like';
  if (P.loves.indexOf(id) >= 0) return 'love';
  if (P.hates.indexOf(id) >= 0) return 'dislike';
  if (F.groups.indexOf('munch') >= 0) return P.gross ? 'love' : 'dislike';
  if (F.col === d.color || (d.color === 'rainbow' && (F.col === 'rainbow' || F.groups.indexOf('sweet') >= 0))) return 'love';
  if (F.groups.indexOf(MOUTH_LOVES[d.mouth]) >= 0) return 'love';
  if (F.groups.indexOf(P.hate) >= 0) return 'dislike';
  return 'like';
}

// the order effects play in; gassy always last, as the punchline
const FX_ORDER = ['candles', 'pinch', 'prickly', 'rock', 'vanish', 'bigbite', 'peel', 'typewriter', 'noodles', 'suck', 'cheesy', 'squirt', 'juicy',
  'moustache', 'stain', 'crunchy', 'chewy', 'sticky', 'slimy', 'hot', 'cold', 'spicy', 'sour', 'bitter', 'salty', 'tears', 'fizzy', 'seeds', 'pit',
  'bones', 'marbles', 'popcorn', 'bubblegum', 'ink', 'tickle', 'butterfly', 'sneeze', 'stinky', 'sugar', 'jiggly', 'strong', 'hulk', 'sleepy', 'gassy'];
// never left out of a dish with too much going on: broccoli's hulk and the beans' revenge
const FX_KEEP = ['hulk', 'gassy'];

/* A serving: one food, or a dish made in the kitchen.
   { parts: [food ids], cook: [cooking ways], kind: 'food' | 'burger' | 'pizza' | ..., fx: [extra effects] } */
// ways of eating a thing whole, which make no sense once it is chopped, built into a dish or blended
const WHOLE_ONLY = ['peel', 'typewriter', 'rock', 'bones', 'suck', 'vanish', 'pinch', 'candles', 'noodles', 'slimy'];
// what still comes through in a smoothie or a soup
const LIQUID_OK = ['sour', 'spicy', 'bitter', 'salty', 'tears', 'stinky', 'cold', 'hot', 'fizzy', 'gassy', 'sugar', 'strong', 'hulk', 'jiggly', 'sleepy', 'stain', 'moustache', 'juicy'];
function servingFx(s) {
  const all = [], liquid = s.kind === 'smoothie' || s.kind === 'soup', dish = s.kind && s.kind !== 'food';
  s.parts.forEach(id => (FOODS[id] ? FOODS[id].fx : []).forEach(x => {
    if (liquid ? LIQUID_OK.indexOf(x) < 0 : dish && WHOLE_ONLY.indexOf(x) >= 0) return;
    all.push(x);
  }));
  (s.cook || []).forEach(k => (COOK[k] ? COOK[k].fx : []).forEach(x => all.push(x)));
  (s.fx || []).forEach(x => all.push(x));
  // cooking undoes some things: frozen food is not hot, cooked food is not cold
  let set = all.filter((x, i) => all.indexOf(x) === i);
  if ((s.cook || []).indexOf('freeze') >= 0) set = set.filter(x => x !== 'hot');
  if ((s.cook || []).some(k => k !== 'freeze')) set = set.filter(x => x !== 'cold');
  // the hulk has a flex in it already
  if (set.indexOf('hulk') >= 0) set = set.filter(x => x !== 'strong');
  const order = (a, b) => FX_ORDER.indexOf(a) - FX_ORDER.indexOf(b);
  set.sort(order);
  const max = s.parts.length > 1 ? 4 : 3;
  // keep the hulk and gassy if they are there: drop from the middle instead
  if (set.length > max) { const keep = set.filter(x => FX_KEEP.indexOf(x) >= 0); set = set.filter(x => FX_KEEP.indexOf(x) < 0).slice(0, max - keep.length).concat(keep).sort(order); }
  return set;
}

// what the monster makes of a serving, and which bits of a dish it picks out and spits
function servingVerdict(mon, s) {
  const prefs = s.parts.map(id => prefOf(mon, id));
  const n = prefs.length, nDis = prefs.filter(p => p === 'dislike').length, nLove = prefs.filter(p => p === 'love').length;
  let v;
  if (n === 1) v = prefs[0];
  else if (nDis * 2 > n) v = 'dislike';
  else v = nLove ? 'love' : 'like';
  const P = mon.persona || {}, cook = s.cook || [];
  // its favourite way of cooking wins a monster over, but not to a munchy it won't eat: cooked yucky is still yucky
  const yucky = n === 1 && v === 'dislike' && FOODS[s.parts[0]] && FOODS[s.parts[0]].groups.indexOf('munch') >= 0;
  if (cook.indexOf(P.cookLove) >= 0 && !yucky) v = v === 'dislike' ? 'like' : 'love';
  if (cook.indexOf(P.cookHate) >= 0) v = v === 'love' ? 'like' : 'dislike';
  const spit = n > 1 && v !== 'dislike' ? s.parts.filter((id, i) => prefs[i] === 'dislike').filter((id, i, a) => a.indexOf(id) === i) : [];
  return { verdict: v, spit };
}

// a loved food for the thought bubble, preferring ones not yet tried
function wantedFood(mon) {
  const ids = Object.keys(FOOD_DATA).filter(id => prefOf(mon, id) === 'love');
  if (!ids.length) return null;
  const fresh = ids.filter(id => !(mon.tried && mon.tried[id]));
  return pick(fresh.length ? fresh : ids);
}

/* ---------- src/reactions.js ---------- */
/* reactions.js — what a monster does with a mouthful. feedScript runs it in order: anything that
   happens before the food goes in (a crab pinches, a cactus prickles, candles are blown out), the
   way it goes in (chomped, crunched, slurped, sucked, gulped...), what it does after (sour, spicy,
   frozen, fizzy, a sugar rush...), dish bits it picks out and spits, the verdict (love, like,
   won't eat) and, last, any beans' revenge. Each effect is its own little scene. */

const VOICE = m => (m.rec.voice || 1);
const babble = (m, mood, n, vol) => SFX.play('babble', { pitch: VOICE(m), mood, n, vol });
const K = m => m.scale;

/* ---------- small helpers ---------- */
function setFace(m, eyes, mouth, open) { if (eyes) m.face.eyes = eyes; if (mouth) m.face.mouth = mouth; if (open !== undefined) m.face.open = open; }
function heldSize(m) { return clamp(m.g.B.w * 1.15, 92, 140); }
function crumbs(c, n, big) {
  const m = c.m, [x, y] = m.mouthPos(), col = c.S.col || '#d8a050';
  Parts.burst('crumb', x, y + 6 * K(m), n, { ang: Math.PI / 2, spread: Math.PI * 1.3, v0: 80, v1: big ? 320 : 200, g: 1100, sizeR: [3 * K(m), (big ? 8 : 5) * K(m)], lifeR: [0.8, 1.5], col, bounce: 0.35, vr: 8, floor: c.st.floor, cols: [col, darken(col, 0.15), lighten(col, 0.2)] });
}
function drops(c, x, y, n, col, o = {}) {
  Parts.burst('drop', x, y, n, Object.assign({ ang: -Math.PI / 2, spread: Math.PI, v0: 120, v1: 330, g: 1300, sizeR: [3 * K(c.m), 6 * K(c.m)], lifeR: [0.8, 1.3], col, floor: c.st.floor }, o));
}
function hold(m, spr, o = {}) { const size = heldSize(m); m.held = Object.assign({ spr, size, dx: 0, dy: size * 0.42, rot: 0 }, o); return m.held; }
// the rest of what is held flies out of the mouth and bounces away
function spitHeld(c, dir) {
  const m = c.m, H = m.held;
  if (!H) return;
  const [x, y] = m.toScreen(m.g.mouth.x + (H.dx || 0), m.g.mouth.y + (H.dy || 0));
  const d = dir || (m.x > c.st.mid ? -1 : 1);
  Parts.add('sprite', x, y, { img: H.spr, size: H.size * K(m) * (H.k || 1), vx: d * rand(260, 380), vy: -rand(420, 560), g: 1500, vr: d * rand(6, 10), bounce: 0.45, life: 2.2, floor: c.st.floor + 8, fade: u => (u < 0.75 ? 1 : 1 - (u - 0.75) / 0.25) });
  m.held = null;
}
function* chew(m, d, hard) {
  m.face.eyes = hard ? 'squeeze' : 'happy';
  yield* during(d, e => { m.face.cheeks = 0.45 + 0.45 * Math.abs(Math.sin(e * 17)); m.pose.sy = 1 + Math.sin(e * 17) * 0.03; m.face.mouth = 'smile'; m.face.open = 0; });
  m.face.cheeks = 0; m.pose.sy = 1; m.face.eyes = 'open';
}
function* gulp(m, big) {
  SFX.play('gulp'); m.face.eyes = 'closed'; m.face.cheeks = big ? 0.6 : 0;
  yield* tween(big ? 0.5 : 0.35, p => { m.fx.lump = p; m.face.cheeks = big ? 0.6 * (1 - p) : 0; m.pose.sy = 1 + Math.sin(p * Math.PI) * (big ? 0.06 : 0.03); });
  m.fx.lump = -1; m.face.eyes = 'open'; m.pose.sy = 1;
}
function* relax(m, d = 0.3) {
  const P0 = Object.assign({}, m.pose), T0 = m.tint.amt, F0 = Object.assign({}, m.face), X0 = Object.assign({}, m.fx);
  m.face.eyes = 'open'; m.face.mouth = 'smile'; m.face.brows = null; m.face.chatter = false; m.face.tongueCol = null;
  m.armPose = 'idle'; m.legAmt = 0; m.flap = 3;
  const flip0 = P0.flip;
  yield* tween(d, p => {
    const P = m.pose;
    P.x = lerp(P0.x, 0, p); P.lift = lerp(P0.lift, 0, p); P.rot = lerp(P0.rot, 0, p); P.sx = lerp(P0.sx, 1, p); P.sy = lerp(P0.sy, 1, p);
    P.flip = flip0 > 0 ? lerp(flip0, 1, p) : 1; P.shake = lerp(P0.shake, 0, p); P.skew = lerp(P0.skew, 0, p);
    m.tint.amt = lerp(T0, 0, p);
    m.face.open = lerp(F0.open, 0, p); m.face.cheeks = lerp(F0.cheeks, 0, p); m.face.blush = lerp(F0.blush, 0, p); m.face.wide = lerp(F0.wide, 1, p);
    m.face.mdx = lerp(F0.mdx, 0, p); m.face.mdy = lerp(F0.mdy, 0, p);
    ['sweat', 'ice', 'muscle', 'dizzy', 'ink', 'gumSplat', 'mustAmt', 'gum'].forEach(k => { m.fx[k] = lerp(X0[k], 0, p); });
    m.fx.sauce.forEach(sp => { sp.a = 1 - p; });

// a hop with squash on the way down and the way up
function* hop(m, h = 40, d = 0.45) {

/* ---------- the whole mouthful ---------- */
function* feedScript(m, S, st, opts = {}) {
  const fx = servingFx(S), V = servingVerdict(m.rec, S);
  const c = { m, S, st, fx, verdict: V.verdict, fartKind: opts.fartKind, yuck: yuckOf(S) };
  m.lookAt = null;
  if (c.yuck) yield* yuckScript(c);   // a monster munchy on its own has a scene of its own (yuck.js)
  else {
    for (const k of fx) if (PRE[k]) yield* PRE[k](c);
    yield* eatStyle(c)(c);
    for (const k of fx) {
      if (!AFTER[k] || k === 'gassy') continue;
      if (c.verdict === 'dislike' && ON_DISLIKE.indexOf(k) < 0) continue;
      yield* AFTER[k](c);
    }
    // what it won't eat is picked out and spat away: munchies all together, with a big bleh (yuck.js)
    for (const id of V.spit) if (!isMunchy(id)) yield* spitPart(c, id);
    if (V.spit.some(isMunchy)) yield* spitMunchies(c, V.spit.filter(isMunchy));
    yield* (yuckyEnd(c) || VERDICT[c.verdict])(c);
    if (fx.indexOf('gassy') >= 0) yield* AFTER.gassy(c);
  }
  yield* relax(m, 0.35);
  if (opts.done) opts.done(c.verdict);
}

/* hulk.js — broccoli makes a monster HULK OUT. A heartbeat or two, then it swells up huge and goes
   green from the toes up, arms and shoulders bulging and an angry mark on its head; it roars,
   smashes the floor with both fists (the floor cracks), beats its chest, and lets go like a
   balloon, back to its own size and colour. A monster that won't eat broccoli does it in a rage,
   spits the broccoli right across the room and ends in a huff. */

const HULK_PAL = { base: '#55a838', light: '#97d86a', dark: '#2f7428', line: '#143a12', belly: '#c4ea98', mark: '#3e8a2c', say: 'Green' };

// each fading to a green shaded light at the top to dark at the bottom, and its parts go along (pal.toward)
function hulkPal(own, t) {
  if (t >= 1 && !own.stops) return HULK_PAL;
  const p = {};
  for (const k in HULK_PAL) p[k] = k === 'say' ? own.say : mix(own[k], HULK_PAL[k], t);
  if (own.stops) { p.stops = own.stops.map((c, i, a) => mix(c, mix(HULK_PAL.light, HULK_PAL.dark, i / (a.length - 1)), t)); p.toward = { pal: HULK_PAL, t }; }

// as big as the room allows: the head stays on the screen, the sides on the stage
function hulkSize(m, st) {
  const half = (m.g.B.w + 40) * m.scale, tall = ((m.y - st.top) / m.scale - 24) / m.g.height;
  return clamp(Math.min(1.45, tall, (m.x - st.left) / half, (st.right - m.x) / half), 1.1, 1.45);
}

// shoulders bulging out behind the arms, and the cross-shaped anger mark throbbing on its head
function hulkDecor(H) {
  return [
    { layer: 'back', draw(ctx, m) {
      if (H.k < 0.02) return;
      const pal = m.pal, r = 24 * H.k;
      m.g.sockets.forEach(([x, y], i) => {
        const s = i ? 1 : -1;

        ctx.fillStyle = pal.base; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = pal.line; ctx.stroke();

    } },
    { layer: 'front', draw(ctx, m) {
      if (H.k < 0.02) return;

    } },
  ];
}

function smashFx(c, i) {

      Parts.add('sprite', x, y, { img: Hd.spr, size: Hd.size * K(m) * m.pose.sx, vx: d * 900, vy: -520, g: 1300, vr: d * 14, bounce: 0.4, life: 2.2, floor: st.floor + 8, fade: u => (u < 0.75 ? 1 : 1 - (u - 0.75) / 0.25) });

/* ---------- src/yuck.js ---------- */
/* yuck.js — the monster munchies eaten on their own (a sock, a boot, a worm, a caterpillar, a snail,
   slime, a mud pie, a rock, a bone, a flower, a cactus, a leaf, a tin can) each have a big scene of
   their own: one for a monster that loves yucky things, one for a monster that won't touch them.
   One that loves it ends with hearts, a lick round its lips and a burp to be proud of; one that
   won't goes green, gets the taste out of its mouth (a raspberry, a tongue scrub, a gargle, a gag
   or a shake like a wet dog) and has a huff. A cooked one still comes through hot or cold.
     YUCK[id] = { love(c), dislike(c), refuse: the ways it may get the taste out, or an ending of its own, burp: which burp }
   Chopped, blended or in a soup a munchy is still yucky: the dish ends the same way, and one picked out
   of a dish that is otherwise eaten is spat across the room with a raspberry. */

const SICK = '#8fd14a';   // the green a monster goes when something is too horrible

function* yuckScript(c) {

  for (const k of cook) if (k === 'hot' || k === 'cold') yield* AFTER[k](c);
  if (c.verdict === 'dislike') yield* (typeof Y.refuse === 'function' ? Y.refuse(c) : yuckRefuse(c, Y.refuse || REFUSE_KINDS));
  else if (c.verdict === 'love') yield* grossLove(c, Y.burp);
  else yield* VERDICT.like(c);

  if (m.decor.length) yield* tween(0.25, p => { m.decor.forEach(d => { d.alpha = 1 - p; }); });
  m.decor = [];
}
// what cooking adds to a munchy: crunch from the toaster or a fryer, hot from the oven, cold from the freezer
function cookedFx(S) {

  let fx = [];
  cook.forEach(k => (COOK[k] ? COOK[k].fx : []).forEach(x => { if (fx.indexOf(x) < 0) fx.push(x); }));
  if (cook.indexOf('freeze') >= 0) fx = fx.filter(x => x !== 'hot');
  if (cook.some(k => k !== 'freeze')) fx = fx.filter(x => x !== 'cold');

// loves munchies; going green and getting the taste out from one that won't, refusing the dish
function yuckyEnd(c) {
  const p = c.S.parts.filter(isMunchy).map(id => prefOf(c.m.rec, id));
  if (c.verdict === 'love' && p.indexOf('love') >= 0) return c => grossLove(c);

    const [x, y] = m.mouthPos();
    Parts.add('sprite', x, y, { img: Art.sprite(FOODS[id].pic, 128), size: 52 * K(m), vx: dir * rand(420, 560), vy: -rand(420, 560), g: 1500, vr: dir * rand(8, 12), bounce: 0.4, life: 2, floor: c.st.floor + 8, fade: u => (u < 0.75 ? 1 : 1 - (u - 0.75) / 0.25) });
    yield* tween(0.2, p => { m.pose.x = -dir * 8 * Math.sin(p * Math.PI); m.face.open = 0.6 * (1 - p); });
    yield* wait(0.08);

/* ---------- small helpers ---------- */

}

}
// a spray out of its mouth: spit, water or mud

}

REFUSE.bleh = function* (c) {

  setFace(m, 'squeeze', 'tongue', 0.5); SFX.play('raspberry', { dur: 0.7 });
  yield* during(0.75, (e, dt) => { m.face.mdx = Math.sin(e * 34) * 4; m.pose.shake = 2.5; if (Math.random() < dt * 22) spray(c, '#d8f2ff', 1, { v0: 200, v1: 420, spread: 1.6 }); });
  m.face.mdx = 0; m.pose.shake = 0;
  SFX.play('brr');
  yield* during(0.4, e => { m.pose.skew = Math.sin(e * 40) * 0.08 * (1 - e / 0.4); });
  m.pose.skew = 0;
};
// both hands scrubbing at its tongue, then flicking the yuck off them
REFUSE.wipe = function* (c) {
  const m = c.m;
  setFace(m, 'squeeze', 'tongue', 0.6); m.armPose = 'wipe';
  for (let i = 0; i < 3; i++) { SFX.play('scrub'); yield* during(0.3, e => { m.face.mdx = Math.sin(e * 26) * 3; }); }
  m.face.mdx = 0; m.armPose = 'shake';
  spray(c, SICK, 8, { spread: 2.8, v0: 150, v1: 300 });
  yield* wait(0.35);
  m.armPose = 'idle';
};
// a glass of water: gargled, then spat out in a fountain
REFUSE.gargle = function* (c) {
  const m = c.m;
  yield* drinkWater(c, 2);
  setFace(m, 'closed', 'o', 0.3); m.face.cheeks = 1;
  SFX.play('gargle', { dur: 0.8 });
  yield* during(0.8, (e, dt) => {
    m.pose.rot = -0.12 + Math.sin(e * 30) * 0.02;
    if (Math.random() < dt * 14) { const [x, y] = m.mouthPos(); Parts.add('bubble', x + rand(-10, 10) * K(m), y, { size: rand(3, 6) * K(m), vy: -rand(60, 120), life: 0.6, col: '#bfefff' }); }
  });
  m.face.cheeks = 0; m.pose.rot = 0;
  setFace(m, 'squeeze', 'o', 0.8); SFX.play('splash', { vol: 0.8 });
  for (let i = 0; i < 26; i++) { const [x, y] = m.mouthPos(); Parts.add('drop', x, y, { size: rand(4, 7) * K(m), col: '#9fdcff', vx: rand(-90, 90), vy: -rand(500, 760), g: 1300, life: 1.6, floor: c.st.floor }); }
  yield* wait(0.5);
};
// hurk! hurk! HURK!: cheeks bulging, a hand over its mouth (nothing comes up)
REFUSE.hurk = function* (c) {
  const m = c.m;
  m.armPose = 'cover';
  for (let i = 0; i < 3; i++) {
    setFace(m, 'wide', 'flat', 0); SFX.play('gag');
    yield* tween(0.2 + i * 0.04, p => { const b = Math.sin(p * Math.PI); m.face.cheeks = (1 + i * 0.2) * b; m.pose.rot = 0.08 * b * (i % 2 ? 1 : -1); m.pose.sy = 1 + 0.06 * b; });
    setFace(m, 'squeeze', 'wavy', 0);
    yield* wait(0.16);
  }
  m.armPose = 'idle'; m.face.cheeks = 0; m.pose.rot = 0;
  SFX.play('blow', { dur: 0.4 }); setFace(m, 'closed', 'blow', 0);
  yield* wait(0.35);
};
// a shake like a wet dog, the yuck flying off it
REFUSE.dog = function* (c) {
  const m = c.m;
  setFace(m, 'shut', 'wavy', 0); SFX.play('brr');
  yield* during(0.9, (e, dt) => {
    const k = 1 - e / 0.9; m.pose.rot = Math.sin(e * 38) * 0.22 * k; m.pose.skew = Math.sin(e * 38 + 1) * 0.1 * k;
    if (Math.random() < dt * 30) { const [x, y] = m.centerPos(); Parts.add('drop', x + rand(-1, 1) * m.g.B.w * K(m), y + rand(-1, 1) * m.g.B.h * K(m), { size: rand(3, 6) * K(m), col: pick([SICK, '#b5e07a', '#d8f2ff']), vx: rand(-400, 400), vy: -rand(150, 400), g: 1300, life: 1.2, floor: c.st.floor }); }
  });
  m.pose.rot = 0; m.pose.skew = 0;
};

/* ---------- a monster that loves it: hearts, a lick round its lips, a burp ---------- */
const BURPS = {};
function* grossLove(c, burp) {
  const m = c.m;
  setFace(m, 'heart', 'grin', 0.8); m.face.blush = 1;
  SFX.play('jingle'); babble(m, 'happy', 3);
  const [x, y] = m.headPos();
  Parts.burst('heart', x, y, 12, { ang: -Math.PI / 2, spread: 2.4, v0: 140, v1: 340, g: -60, drag: 1.5, sizeR: [9 * K(m), 16 * K(m)], lifeR: [1.2, 1.9], col: '#ef3361' });
  m.armPose = 'belly';
  yield* during(0.4, e => { m.pose.lift = Math.abs(Math.sin(e * 10)) * 12; });
  m.pose.lift = 0;
  // a lick right round its lips
  setFace(m, 'heart', 'tongue', 0.35); SFX.play('slurp', { dur: 0.5 });
  yield* tween(0.55, p => { const a = p * TAU; m.face.mdx = Math.sin(a) * m.g.mouth.hw * 0.35; m.face.mdy = (Math.cos(a) - 1) * 4; });
  m.face.mdx = 0; m.face.mdy = 0;
  yield* BURPS[burp || pick(['big', 'big', 'echo', 'tiny'])](c);
  m.armPose = 'idle'; m.face.blush = 0;
}
function burpCloud(c, n, k = 1) {
  const m = c.m, [x, y] = m.mouthPos();
  for (let i = 0; i < n; i++) Parts.add('puff', x, y, { size: rand(12, 20) * K(m) * k, grow: 2.6, vx: rand(-90, 90), vy: -rand(60, 170), drag: 1.4, life: rand(1.2, 1.8), col: pick(['#b5cc5a', '#c9c26a', '#a3bd55']), alpha: 0.85 });
  Parts.add('ring', x, y, { size: 22 * K(m) * k, grow: 5, life: 0.55, col: 'rgba(255,255,255,0.9)', width: 6 * K(m) });
}
function* giggleBehindHand(m, d = 0.4) { setFace(m, 'happy', 'grin', 0.5); m.armPose = 'cover'; babble(m, 'giggle', 5); yield* wait(d); }
// the big one: cheeks fill, BUUURP, a green cloud with flies in it
BURPS.big = function* (c) {
  const m = c.m;
  setFace(m, 'closed', 'flat', 0);
  yield* tween(0.35, p => { m.face.cheeks = 1.3 * p; m.pose.sy = 1 + 0.06 * p; m.pose.sx = 1 + 0.04 * p; });
  setFace(m, 'squeeze', 'o', 1.3); m.face.wide = 1.3; m.face.cheeks = 0;
  SFX.play('burp', { dur: 1.2, f: 72 }); c.st.shake = 5;
  burpCloud(c, 7);
  const [x, y] = m.mouthPos();
  for (let i = 0; i < 2; i++) Parts.add('fly', x, y, { size: 5 * K(m), cx: x, cy: y - 50 * K(m), rx: rand(40, 70) * K(m), ry: rand(20, 30) * K(m), ang: i * 3, spin: rand(4, 7), life: 2.2 });
  yield* tween(0.9, p => { m.pose.sx = lerp(1.04, 1, p); m.pose.sy = lerp(1.06, 1, p); m.pose.rot = -0.12 * Math.sin(p * Math.PI); m.pose.x = -10 * Math.sin(p * Math.PI); });
  m.face.wide = 1;
  yield* giggleBehindHand(m);
};
// a burp, and the room burps back, and back again
BURPS.echo = function* (c) {
  const m = c.m;
  setFace(m, 'squeeze', 'o', 1.0);
  SFX.play('burp', { dur: 0.6, f: 90 }); burpCloud(c, 3, 0.8);
  yield* tween(0.35, p => { m.pose.rot = -0.08 * Math.sin(p * Math.PI); });
  setFace(m, 'wide', 'o', 0.3);
  for (let i = 0; i < 2; i++) {
    yield* wait(0.18);
    SFX.play('burp', { dur: 0.5, f: 90, vol: i ? 0.22 : 0.45 });
    m.lookAt = null; m.glance = [i ? -1 : 1, -0.2]; m.glanceIn = 1;
    yield* wait(0.3);
  }
  yield* giggleBehindHand(m);
};
// it swells up for an enormous one... and out comes a tiny urp
BURPS.tiny = function* (c) {
  const m = c.m;
  setFace(m, 'squeeze', 'flat', 0);
  yield* tween(0.7, p => { m.face.cheeks = 1.5 * p; m.pose.sx = 1 + 0.12 * p; m.pose.sy = 1 + 0.08 * p; m.pose.shake = 2 * p; });
  m.pose.shake = 0;
  setFace(m, 'wide', 'o', 0.3); m.face.cheeks = 0;
  SFX.play('burp', { dur: 0.16, f: 240, vol: 0.6 });
  const [x, y] = m.mouthPos();
  Parts.add('ring', x, y, { size: 6 * K(m), grow: 2.5, life: 0.35, col: 'rgba(255,255,255,0.9)', width: 3 * K(m) });
  yield* tween(0.25, p => { m.pose.sx = lerp(1.12, 1, p); m.pose.sy = lerp(1.08, 1, p); });
  yield* wait(0.35);
  yield* giggleBehindHand(m);
};
// a tin can's burp: it rings like a bell, and so does the monster
BURPS.clang = function* (c) {
  const m = c.m;
  setFace(m, 'closed', 'flat', 0);
  yield* tween(0.3, p => { m.face.cheeks = 1.2 * p; });
  setFace(m, 'squeeze', 'o', 1.2); m.face.cheeks = 0;
  SFX.play('burp', { dur: 0.9, f: 84 }); SFX.play('clank', { f: 600 }); SFX.play('ding', { f: 990 });
  burpCloud(c, 3, 0.8);
  const [x, y] = m.mouthPos();
  for (let i = 0; i < 3; i++) Parts.add('ring', x, y, { size: (16 + i * 8) * K(m), grow: 4 + i, life: 0.5 + i * 0.15, col: 'rgba(200,210,230,0.9)', width: 4 * K(m) });
  yield* during(0.8, e => { m.pose.skew = Math.sin(e * 60) * 0.06 * (1 - e / 0.8); });
  m.pose.skew = 0;
  yield* giggleBehindHand(m, 0.45);
};
// the caterpillar's: one last butterfly comes out with it
BURPS.butterfly = function* (c) {
  const m = c.m;
  setFace(m, 'closed', 'flat', 0);
  yield* tween(0.3, p => { m.face.cheeks = 1.1 * p; });
  setFace(m, 'wide', 'o', 0.9); m.face.cheeks = 0;
  SFX.play('burp', { dur: 0.5, f: 110 }); SFX.play('flutterSound');
  const [x, y] = m.mouthPos();
  Parts.add('ring', x, y, { size: 14 * K(m), grow: 4, life: 0.45, col: 'rgba(255,255,255,0.9)', width: 4 * K(m) });
  Parts.add('butterfly', x, y, { size: 28 * K(m), vx: rand(-60, 60), vy: -200, life: 2.6, col: '#ffb02e', col2: '#fff3a0' });
  yield* during(0.8, e => { m.lookAt = { x: x + e * 40, y: y - e * 220 }; });
  m.lookAt = null;
  yield* giggleBehindHand(m, 0.4);
};
// the bone's: it comes out as a bark
BURPS.woof = function* (c) {
  const m = c.m;
  setFace(m, 'closed', 'flat', 0);
  yield* tween(0.35, p => { m.face.cheeks = 1.3 * p; m.pose.sy = 1 + 0.05 * p; });
  setFace(m, 'squeeze', 'o', 1.0); m.face.cheeks = 0;
  SFX.play('woof'); burpCloud(c, 2, 0.7);
  yield* tween(0.25, p => { m.pose.sy = lerp(1.05, 1, p); m.pose.lift = Math.sin(p * Math.PI) * 10; });
  setFace(m, 'wide', 'o', 0.4); m.face.brows = 'up';
  yield* wait(0.4);
  m.face.brows = null;
  yield* giggleBehindHand(m, 0.4);
};

/* ---------- the sock ---------- */
YUCK.sock = {
  // held up to its face and sniffed like a rose: it floats up on the smell, eats it, and the flies come
  *love(c) {
    const m = c.m, M = m.g.mouth, s = heldSize(m), side = { dx: M.hw + s * 0.25, dy: -s * 0.1, rot: -0.35, k: 0.8 };
    const H = hold(m, c.S.spr, side); m.armPose = 'cup';
    setFace(m, 'closed', 'o', 0.25);
    SFX.play('inhale', { dur: 0.9 });
    yield* during(0.9, (e, dt) => {
      const k = e / 0.9; m.pose.sy = 1 + 0.07 * k; m.pose.sx = 1 + 0.05 * k; m.pose.rot = 0.1 * k;
      if (Math.random() < dt * 10) { const [hx, hy] = heldAt(m), [mx] = m.mouthPos(); Parts.add('stink', hx, hy - 12 * K(m), { size: 7 * K(m), col: '#8ab83a', vx: (mx - hx) * 1.3, vy: -30, life: 0.75 }); }
    });
    // ahhh: up it floats on the smell, eyes shut, swaying
    setFace(m, 'closed', 'smile', 0); m.face.blush = 1;
    SFX.play('mmm', { pitch: VOICE(m), dur: 1.0 });
    yield* during(0.9, e => { m.pose.lift = Math.sin(Math.min(1, e / 0.45) * Math.PI / 2) * 36; m.pose.rot = 0.1 + Math.sin(e * 5) * 0.08; });
    const r0 = m.pose.rot;
    yield* tween(0.2, p => { m.pose.lift = 36 * (1 - p); m.pose.rot = r0 * (1 - p); m.pose.sx = lerp(1.05, 1, p); m.pose.sy = lerp(1.07, 1, p); });
    SFX.play('thud'); m.face.blush = 0;
    // in it goes
    yield* tween(0.18, p => { H.dx = lerp(side.dx, 0, p); H.dy = lerp(side.dy, s * 0.42, p); H.rot = lerp(side.rot, 0, p); H.k = lerp(side.k, 1, p); });
    yield* EAT.chomp(c, { bites: 2, crunch: c.crunch });
    // the flies come to see what smells so good
    const [hx, hy] = m.headPos();
    for (let i = 0; i < 6; i++) Parts.add('fly', hx, hy, { size: 5 * K(m), cx: hx, cy: hy - 24 * K(m), rx: rand(70, 130) * K(m), ry: rand(25, 50) * K(m), ang: i * 1.05, spin: rand(4, 7) * (i % 2 ? 1 : -1), life: 3.4 });
    for (let i = 0; i < 4; i++) Parts.add('stink', hx + (i - 1.5) * 34 * K(m), hy + 10 * K(m), { size: 8 * K(m), col: '#7cb342', vy: -45, life: 1.6 });
    SFX.play('buzz', { dur: 1.3 });
    setFace(m, 'happy', 'grin', 0.5); m.armPose = 'wave'; babble(m, 'giggle', 5);
    yield* during(1.1, e => { m.lookAt = { x: hx + Math.cos(e * 5) * 110 * K(m), y: hy - 24 * K(m) }; m.pose.rot = Math.sin(e * 8) * 0.06; });
    m.lookAt = null; m.pose.rot = 0; m.armPose = 'idle';
  },
  // one sniff and it faints clean away, flat on its back, legs kicking at the air
  *dislike(c) {
    const m = c.m, M = m.g.mouth, s = heldSize(m), dir = dirOf(c);
    hold(m, c.S.spr, { dx: M.hw + s * 0.25, dy: -s * 0.1, rot: -0.35, k: 0.8 }); m.armPose = 'cup';
    setFace(m, 'open', 'smile', 0);
    for (let i = 0; i < 2; i++) { SFX.play('sniff'); yield* tween(0.22, p => { m.pose.sy = 1 + 0.04 * Math.sin(p * Math.PI); }); }
    // the smell hits
    const [hx, hy] = heldAt(m);
    for (let i = 0; i < 5; i++) Parts.add('stink', hx + rand(-20, 20) * K(m), hy, { size: 8 * K(m), col: '#7cb342', vy: -50, life: 1.3 });
    setFace(m, 'cross', 'wavy', 0); m.face.brows = 'up'; SFX.play('gasp');
    m.tint.col = SICK; m.tint.level = 0;
    yield* tween(0.5, p => { m.tint.amt = 0.7; m.tint.level = p; m.pose.shake = 3 * p; m.pose.sy = 1 + 0.05 * p; });
    setFace(m, 'spiral', 'wavy', 0);
    yield* wait(0.25);
    // TIMBER
    m.pose.shake = 0; m.face.brows = null;
    dropHeld(c, -dir * 90);
    setFace(m, 'x', 'tongue', 0.3); m.armPose = 'up';
    SFX.play('slide', { dur: 0.55 });
    const fall = dir * 1.45, slide = r => dir * m.g.ground * 0.6 * Math.sin(Math.abs(r));
    yield* tween(0.55, p => { const r = fall * Ease.in(p); m.pose.rot = r; m.pose.lift = restLift(m, r); m.pose.x = slide(r); });
    SFX.play('thud'); c.st.shake = 7;
    const [bx] = m.bottomPos();
    for (let i = 0; i < 5; i++) Parts.add('puff', bx + dir * rand(0, 160) * K(m), c.st.floor - 4, { size: rand(10, 16) * K(m), grow: 2.2, vx: rand(-60, 60), vy: -rand(20, 70), life: 0.9, col: '#d9c49a', alpha: 0.7 });
    // out cold: stars, flies, legs kicking
    m.fx.dizzy = 1; m.legAmt = 1;
    const [cx, cy] = m.centerPos();
    for (let i = 0; i < 3; i++) Parts.add('fly', cx, cy, { size: 5 * K(m), cx, cy: cy - 50 * K(m), rx: rand(60, 100) * K(m), ry: rand(15, 30) * K(m), ang: i * 2, spin: rand(4, 7), life: 2.2 });
    yield* wait(1.0);
    m.legAmt = 0;
    // boing! back up
    SFX.play('boing', { f: 260 }); setFace(m, 'spiral', 'o', 0.5);
    yield* tween(0.4, p => { const r = fall * (1 - Ease.back(p)); m.pose.rot = r; m.pose.lift = restLift(m, r) + Math.sin(p * Math.PI) * 30; m.pose.x = slide(r); });
    m.pose.rot = 0; m.pose.lift = 0; m.pose.x = 0; m.pose.sy = 1; m.fx.dizzy = 0;
    yield* shakeHead(m, 0.4, 0.14);
  },
};

/* ---------- the boot ---------- */
YUCK.boot = {
  // the whole boot in one go, mouth stretched enormous; chewed to rubbery squeaks with the lace
  // hanging out, the lace slurped up last; and the boot squeaks in its tummy when it pats it
  *love(c) {
    const m = c.m, base = c.S.spr, s = heldSize(m);
    const H = hold(m, base, { dy: s * 0.6, k: 1.15, rot: -0.12 }); m.armPose = 'hold';
    setFace(m, 'wide', 'smile', 0); SFX.play('gasp');
    yield* tween(0.45, p => { m.face.wide = lerp(1, 1.7, Ease.back(p)); m.face.open = lerp(0, 1.4, Ease.out(p)); m.pose.sy = 1 + 0.1 * p; });
    SFX.play('squish'); bite(c);
    yield* tween(0.14, p => { H.dy = lerp(s * 0.6, 0, p); H.k = lerp(1.15, 0.5, p); });
    m.held = null; m.armPose = 'idle';
    const lace = { len: 1, swing: 0 }, L = { layer: 'face', draw: (ctx, m) => drawLace(ctx, m, lace) };
    m.decor.push(L);
    yield* tween(0.12, p => { m.face.open = lerp(1.4, 0, p); m.face.wide = lerp(1.7, 1.15, p); m.face.cheeks = 1.4 * p; m.pose.sy = 1.1 - 0.1 * p; });
    setFace(m, 'happy');
    for (let i = 0; i < 6; i++) {
      SFX.play('squeakToy', { f: 1100 + (i % 3) * 180 });
      yield* tween(0.22, p => { const b = Math.sin(p * Math.PI); m.face.cheeks = 1.1 + b * 0.4; m.face.mdx = (i % 2 ? 1 : -1) * b * 8; m.pose.sy = 1 + b * 0.04; lace.swing = (i % 2 ? 1 : -1) * b; });
    }
    m.face.mdx = 0;
    // the lace goes in last, like spaghetti
    SFX.play('slurp', { dur: 0.5 });
    yield* tween(0.5, p => { lace.len = 1 - p; lace.swing = Math.sin(p * 30) * 0.5; });
    removeDecor(m, L); SFX.play('pop', { f: 900 });
    m.face.wide = 1; m.face.cheeks = 0;
    yield* gulp(m, true);
    // it squeaks in there
    const tum = { a: 0, k: 1 }, T = { layer: 'body', draw: (ctx, m) => drawInTummy(ctx, m, base, tum) };
    m.decor.push(T);
    m.armPose = 'pat'; setFace(m, 'happy', 'smile', 0);
    yield* tween(0.2, p => { tum.a = p; });
    for (let i = 0; i < 3; i++) {
      yield* wait(0.12);
      SFX.play('squeakToy', { f: 1500 + i * 120 });
      const [bx, by] = m.toScreen(0, m.g.B.belly[1]);
      Parts.add('note', bx + 30 * K(m), by, { size: 14 * K(m), vx: rand(20, 60), vy: -90, life: 0.9, col: '#7a4a1a' });
      yield* tween(0.18, p => { const b = Math.sin(p * Math.PI); tum.k = 1 + b * 0.15; m.pose.sy = 1 - b * 0.08; m.pose.sx = 1 + b * 0.05; });
    }
    babble(m, 'giggle', 4);
    yield* tween(0.3, p => { tum.a = 1 - p; });
    removeDecor(m, T); m.armPose = 'idle';
  },
  // it bites: rubber. It pulls; the boot stretches... and snaps back up, SMACK, into its face
  *dislike(c) {
    const m = c.m, base = c.S.spr, s = heldSize(m), dir = dirOf(c);
    const H = hold(m, base); m.armPose = 'hold';
    yield* snap(c, 1);
    setFace(m, 'squeeze', 'teeth', 0); m.armPose = 'tug';
    SFX.play('stretch', { dur: 0.9 });
    yield* tween(0.9, p => { const k = Ease.inOut(p); H.sy = 1 + 0.9 * k; H.sx = 1 - 0.18 * k; H.dy = s * 0.42 + s * 0.45 * k; m.pose.sy = 1 + 0.06 * k; m.pose.rot = Math.sin(p * 40) * 0.02 * k; });
    SFX.play('smack'); SFX.play('boing', { f: 180 });
    yield* tween(0.1, p => { H.sy = lerp(1.9, 0.75, p); H.sx = lerp(0.82, 1.15, p); H.dy = lerp(s * 0.87, -s * 0.22, p); });
    m.armPose = 'cheeks'; setFace(m, 'x', 'o', 0.6); m.fx.dizzy = 1;
    const [ex, ey] = m.toScreen(0, m.g.B.eyeY);
    Parts.burst('star', ex, ey, 7, { v0: 140, v1: 280, sizeR: [6 * K(m), 11 * K(m)], lifeR: [0.4, 0.7], col: '#ffd23f', vr: 8 });
    yield* tween(0.2, p => { const b = Math.sin(p * Math.PI); m.pose.rot = -dir * 0.2 * b; m.pose.sx = 1 + 0.08 * b; m.pose.sy = 1 - 0.08 * b; H.sy = lerp(0.75, 1, p); H.sx = lerp(1.15, 1, p); });
    // it hangs on its face a moment, then slides off
    yield* wait(0.35);

  *love(c) {

    yield* tween(0.6, p => { const [tx, ty] = perch(); B.x = lerp(x, tx, Ease.inOut(p)) + Math.sin(p * 9) * 24 * (1 - p) * K(m); B.y = lerp(y, ty, Ease.inOut(p)) - Math.sin(p * Math.PI) * 70 * K(m); B.vx = B.vy = 0; m.lookAt = { x: B.x, y: B.y }; });
    B.flapRate = 4; setFace(m, 'happy', 'o', 0.3);
    yield* during(0.65, () => { const [tx, ty] = perch(); B.x = tx; B.y = ty; B.vx = B.vy = 0; m.lookAt = { x: tx, y: ty }; });
    B.flapRate = 14; B.vx = 60; B.vy = -220;

  burp: 'butterfly',

    m.face.mdx = 0; m.face.brows = null; H.sx = 1;

/* ---------- the worm ---------- */
YUCK.worm = {
  // slurped up like spaghetti, wriggling all the way; it pokes its head back out to look about,
  // and gets slurped up again
  *love(c) {
    const m = c.m, s = heldSize(m);
    const H = hold(m, c.S.spr, { dy: s * 0.55 }); m.armPose = 'hold';
    setFace(m, 'happy', 'tongue', 0.3);
    yield* during(0.4, e => { H.rot = Math.sin(e * 12) * 0.2; });
    H.rot = 0;
    setFace(m, 'open', 'o', 0.3);
    const st = { len: 1 }, D = { layer: 'face', draw: (ctx, m) => drawWormStrand(ctx, m, st) };
    m.decor.push(D);
    SFX.play('slurp', { dur: 1.0 });
    yield* tween(1.0, p => { st.len = 1 - p; H.k = lerp(1, 0.35, p); H.alpha = 1 - clamp((p - 0.7) / 0.3, 0, 1); m.face.open = 0.25 + Math.sin(p * 30) * 0.05; m.face.eyes = p > 0.5 ? 'closed' : 'open'; });
    removeDecor(m, D); m.held = null; m.armPose = 'idle';
    SFX.play('pop', { f: 700 });
    // knock knock: its head pops back out
    yield* wait(0.25);
    const peek = { out: 0, look: 0, side: dirOf(c) }, P = { layer: 'face', draw: (ctx, m) => drawWormHead(ctx, m, peek) };
    m.decor.push(P);
    SFX.play('squeak', { f: 1900 }); setFace(m, 'cross', 'o', 0.35);
    yield* tween(0.25, p => { peek.out = Ease.back(p); });
    yield* during(0.9, e => { peek.look = Math.sin(e * 6); });
    // shloop
    SFX.play('slurp', { dur: 0.25 });
    yield* tween(0.15, p => { peek.out = 1 - p; });
    removeDecor(m, P); SFX.play('pop', { f: 900 });
    setFace(m, 'happy', 'smile', 0);
    yield* gulp(m);
  },
  // it starts to slurp... and stops. It pulls the worm back out of its mouth hand over hand, and it
  // just keeps coming, piling up on the floor, until the end pops out and the whole long thing
  // wriggles away
  *dislike(c) {
    const m = c.m, s = heldSize(m), dir = dirOf(c);
    const H = hold(m, c.S.spr, { dy: s * 0.55 }); m.armPose = 'hold';
    setFace(m, 'open', 'o', 0.3);
    const st = { len: 1 }, D = { layer: 'face', draw: (ctx, m) => drawWormStrand(ctx, m, st) };
    m.decor.push(D);
    SFX.play('slurp', { dur: 0.45 });
    yield* tween(0.45, p => { st.len = 1 - p * 0.6; H.k = lerp(1, 0.5, p); H.alpha = 1 - p; });
    removeDecor(m, D); m.held = null;
    // wait...
    setFace(m, 'wide', 'o', 0.3); m.face.brows = 'up';
    yield* goGreen(m, 0.4);
    // out it comes, and out, and out
    const W = { len: 30, dir, free: false, gone: 0 }, L = { layer: 'front', draw: (ctx, m) => drawLongWorm(ctx, m, W) };
    m.decor.push(L);
    m.armPose = 'pull'; m.pullDir = dir; setFace(m, 'squeeze', 'o', 0.35); m.face.brows = null;
    for (let i = 0; i < 4; i++) {
      SFX.play('stretch', { dur: 0.3 });
      const L0 = W.len;
      yield* tween(0.36, p => { W.len = L0 + 95 * Ease.out(p); m.pose.rot = dir * 0.05 * Math.sin(p * Math.PI); });
    }
    // the end pops out and it sits down hard
    SFX.play('pop', { f: 500 }); SFX.play('thud');
    W.free = true; m.armPose = 'idle'; m.pullDir = 0; setFace(m, 'x', 'o', 0.5);
    yield* tween(0.22, p => { const b = Math.sin(p * Math.PI); m.pose.sy = 1 - 0.12 * b; m.pose.sx = 1 + 0.08 * b; });
    // and off it wriggles
    setFace(m, 'half', 'wavy', 0);
    yield* tween(1.0, p => { W.gone = p; L.alpha = 1 - clamp((p - 0.6) / 0.4, 0, 1); });
    removeDecor(m, L);
  },
};

/* ---------- the snail ---------- */
YUCK.snail = {
  // sucked right out of its shell, slurrrp, POP; it peeps into the empty shell (nobody home),
  // tosses it over its shoulder, and licks the slime off its chin
  *love(c) {
    const m = c.m, s = heldSize(m), M = m.g.mouth, dir = dirOf(c);
    const H = hold(m, c.S.spr, { dy: s * 0.5 }); m.armPose = 'hold';
    setFace(m, 'happy', 'tongue', 0.3);
    yield* tween(0.35, p => { H.dy = lerp(s * 0.5, s * 0.85, p); H.dx = dir * s * 0.3 * p; });
    setFace(m, 'open', 'pucker', 0);
    const goo = { k: 0 }, D = { layer: 'face', draw: (ctx, m) => drawSnailGoo(ctx, m, goo) };
    m.decor.push(D);
    SFX.play('suck', { dur: 0.9 });
    H.spr = shellSprite(c.S.spr);
    yield* tween(0.9, p => { goo.k = p; m.pose.sx = 1 - Math.sin(p * Math.PI) * 0.06; m.face.eyes = p > 0.4 ? 'squeeze' : 'wide'; H.rot = Math.sin(p * 30) * 0.06; });
    removeDecor(m, D); SFX.play('pop', { f: 420 }); H.rot = 0; m.pose.sx = 1;
    yield* gulp(m);

    const e0 = nearEye(m, dir), x1 = e0.x + dir * (e0.r + s * 0.25), y1 = e0.y - M.y;
    setFace(m, 'open', 'o', 0.2);
    yield* tween(0.3, p => { H.dx = lerp(dir * s * 0.3, x1, p); H.dy = lerp(s * 0.85, y1, p); H.k = lerp(1, 0.7, p); H.rot = -dir * 0.6 * p; });
    yield* during(0.5, e => { H.rot = -dir * 0.6 + Math.sin(e * 22) * 0.15; });
    // over its shoulder
    flingHeld(c, -dir, { vx: -dir * 300, vy: -700, life: 2.4, bounce: 0.35, layer: 0 });
    m.armPose = 'idle';
    yield* wait(0.2);
    // slime down its chin, licked off
    m.fx.sauce = [{ x: M.x - M.hw * 0.3, y: M.y + M.hw * 0.5, r: 7, col: '#d6e46a', seed: 3 }, { x: M.x + M.hw * 0.35, y: M.y + M.hw * 0.6, r: 6, col: '#d6e46a', seed: 6 }];
    const [mx, my] = m.mouthPos();

    setFace(m, 'happy', 'tongue', 0.4); SFX.play('slurp', { dur: 0.5 });

    m.pose.shake = 0;

  // a lick: its tongue goes green and slimy, strings of slime hanging off it; the snail hides in
  // its shell and gets thrown away, and the monster scrubs and scrubs at its tongue
  *dislike(c) {
    const m = c.m, s = heldSize(m), M = m.g.mouth, dir = dirOf(c);
    const H = hold(m, c.S.spr); m.armPose = 'hold';
    setFace(m, 'half', 'tongue', 0.3);
    yield* tween(0.3, p => { H.dy = lerp(s * 0.42, tongueTip(m) - M.y + s * 0.28, p); });
    SFX.play('glorp', { f: 170 });
    yield* tween(0.2, p => { m.face.mdy = 4 * Math.sin(p * Math.PI); });
    m.face.tongueCol = '#b9d84a';
    const sl = { n: 0 }, D = { layer: 'face', draw: (ctx, m) => drawTongueSlime(ctx, m, sl) };
    m.decor.push(D);
    setFace(m, 'wide', 'tongue', 0.5); m.face.brows = 'up';
    H.spr = shellSprite(c.S.spr); SFX.play('pop', { f: 300 });   // the snail hides
    m.tint.col = SICK; m.tint.level = 0;
    yield* tween(0.6, p => { sl.n = p; m.tint.amt = 0.6; m.tint.level = p; });
    // away with the snail
    flingHeld(c, dir);
    m.face.brows = null;
    // scrub, scrub, scrub
    m.armPose = 'wipe'; setFace(m, 'squeeze', 'tongue', 0.5);
    for (let i = 0; i < 3; i++) { SFX.play('scrub'); yield* during(0.3, e => { m.face.mdx = Math.sin(e * 26) * 3; sl.n = 1 - (i + e / 0.3) / 3; }); }
    m.face.mdx = 0; m.armPose = 'shake';
    spray(c, '#b9d84a', 8, { spread: 2.6, v0: 150, v1: 320 });
    yield* wait(0.35);
    removeDecor(m, D); m.face.tongueCol = null; m.armPose = 'idle';
  },
  refuse: ['bleh', 'gargle', 'hurk', 'dog'],

/* ---------- the slime ---------- */
YUCK.slime = {
  // slurped in one go and it turns to jelly, wobbling, bubbles going up inside it; then it blows a
  // slime bubble that pops all over its face
  *love(c) {
    const m = c.m, s = heldSize(m);
    const H = hold(m, c.S.spr); m.armPose = 'hold';
    yield* during(0.35, e => { H.sx = 1 + Math.sin(e * 18) * 0.1; H.sy = 1 - Math.sin(e * 18) * 0.08; });
    setFace(m, 'open', 'o', 0.6); SFX.play('slurp', { dur: 0.6 });
    yield* tween(0.5, p => { H.dy = lerp(s * 0.42, 0, p * p); H.k = lerp(1, 0.2, p * p); H.sx = 1 - p * 0.5; H.sy = 1; m.face.open = 0.6 + p * 0.3; });
    m.held = null; m.armPose = 'idle';
    yield* gulp(m);
    // jelly monster
    setFace(m, 'happy', 'grin', 0.4); m.tint.col = '#7ae020'; m.tint.level = 1;
    const B = { layer: 'body', draw: (ctx, m) => drawInsideBubbles(ctx, m) };
    m.decor.push(B);
    yield* during(1.3, (e, dt) => {
      const k = Math.exp(-e * 1.2);
      m.tint.amt = 0.35 * Math.min(1, e * 4);
      m.pose.skew = Math.sin(e * 14) * 0.3 * k; m.pose.sx = 1 + Math.sin(e * 14 + 1) * 0.08 * k; m.pose.sy = 1 - Math.sin(e * 14 + 1) * 0.06 * k;

    });
    m.pose.skew = 0; m.pose.sx = 1; m.pose.sy = 1;
    // a slime bubble...
    const bub = { r: 0 }, D = { layer: 'front', draw: (ctx, m) => drawSlimeBubble(ctx, m, bub) };
    m.decor.push(D);
    setFace(m, 'cross', 'pucker', 0); SFX.play('blow', { dur: 1.1 });
    yield* tween(1.1, p => { bub.r = Ease.out(p) * 1.1 + Math.sin(p * 20) * 0.02; });
    // ...POP
    removeDecor(m, D); SFX.play('pop', { f: 260 }); SFX.play('splat');
    m.fx.sauce = splatFace(m, '#8ae02a', 8, 2);
    const [x, y] = m.mouthPos();
    Parts.burst('drop', x, y, 12, { spread: TAU, v0: 160, v1: 360, g: 1200, sizeR: [3 * K(m), 6 * K(m)], lifeR: [0.6, 1.1], col: '#8ae02a', floor: c.st.floor });
    setFace(m, 'closed', 'flat', 0);

    removeDecor(m, B);
  },
  // a bite, and it sticks: a string of slime stretches from its mouth to the blob in its hand, longer

  // does it lands on the floor, SPLAT
  *dislike(c) {
    const m = c.m, s = heldSize(m), dir = dirOf(c);
    const H = hold(m, c.S.spr); m.armPose = 'hold';
    yield* snap(c, 0.9);
    setFace(m, 'wide', 'o', 0.25); m.face.brows = 'up';
    const goo = { thick: 1 }, D = { layer: 'face', draw: (ctx, m) => drawGooString(ctx, m, goo) };
    m.decor.push(D);
    SFX.play('stretch', { dur: 0.9 }); SFX.play('glorp');
    m.armPose = 'tug';
    yield* tween(0.9, p => { const k = Ease.inOut(p); H.dx = dir * s * 0.7 * k; H.dy = s * 0.42 + s * 0.45 * k; goo.thick = 1 - 0.7 * k; m.pose.rot = -dir * 0.06 * k; });

    setFace(m, 'squeeze', 'tongue', 0.4); m.pose.rot = 0; m.face.brows = null;

    const x0 = H.dx, y0 = H.dy;
    yield* during(0.6, e => { H.dx = x0 + Math.sin(e * 30) * 14; H.dy = y0 + Math.cos(e * 30) * 6; });

    const [x, y] = heldAt(m), up = 300, t = (up + Math.sqrt(up * up + 2 * 1500 * Math.max(10, c.st.floor - y))) / 1500;

    Parts.add('sprite', x, y, { img: H.spr, size: H.size * K(m), vx: dir * 260, vy: -up, g: 1500, vr: dir * 6, life: t, onDie: p => { SFX.play('splat'); Parts.add('splat', p.x, c.st.floor - 2, { size: 34 * K(m), col: '#7ad020', flat: true, life: 2.4, layer: 0, fade: u => (u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3) }); } });
    yield* wait(t + 0.15);
  },
  refuse: ['bleh', 'wipe', 'gargle', 'hurk'],
};

/* ---------- the mud pie ---------- */
YUCK.mudpie = {

// a flower growing out of the top of its head
function drawHeadFlower(ctx, m, F) {
  if (F.k < 0.02) return;
  const { x, y, s } = flowerSpot(m), k = F.k * s, tx = x + Math.sin(m.t * 2.5) * 5 * k, ty = y - 34 * k;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.quadraticCurveTo(x - 2, y - 16 * k, tx, ty);
  ctx.lineWidth = 8; ctx.strokeStyle = '#1f5a2a'; ctx.stroke(); ctx.lineWidth = 4; ctx.strokeStyle = '#4fb05a'; ctx.stroke();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU + m.t * 0.3;

    ctx.beginPath(); ctx.ellipse(0, 0, 8 * k, 4.5 * k, 0, 0, TAU); ctx.fillStyle = '#ffd020'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#7a5208'; ctx.stroke();
    ctx.restore();

// a bump coming up on top of its head

/* ---------- pictures made from the painted ones ---------- */
// a round part cut out of a painted picture, its edge drawn back on (cx, cy, r in the picture's own pixels)
function cutCircle(src, pic, cx, cy, r, edge) {
  const box = ART[pic];
  if (!box) return src;
  const W = src.width, k = (W * 0.96) / Math.max(box[3], box[4]), X = W / 2 + (cx - box[3] / 2) * k, Y = W / 2 + (cy - box[4] / 2) * k, R = r * k;
  const c = makeCanvas(W, W), g = c.getContext('2d');
  g.save(); g.beginPath(); g.arc(X, Y, R, 0, TAU); g.clip(); g.drawImage(src, 0, 0); g.restore();
  g.beginPath(); g.arc(X, Y, R, 0, TAU); g.lineWidth = Math.max(3, W * 0.022); g.strokeStyle = edge; g.stroke();

// the snail's shell with nobody in it, and the sunflower with every petal sneezed off
function shellSprite(src) { return cutCircle(src, 'snail', 248, 132, 112, '#3a1a0a'); }
function baldFlower(src) { return cutCircle(src, 'sunflower', 189, 192, 92, '#3a1a0a'); }

/* ---------- src/ui.js ---------- */
/* ui.js — the toddler-sized interface: round buttons with pictures, the pantry (tabs, food tiles,
   page arrows, love and yuck badges), the thought bubble, text with an outline, and the chomping
   jaws that close between screens. No words a two-year-old would need to read. */

const UI_LINE = '#3a2a4a';
const FONT = '"Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", sans-serif';

/* ---------- buttons ---------- */
// b: { x, y, r, icon, col, onTap, k (press), hidden, pulse, iconK, draw(ctx, r) }
function button(o) { return Object.assign({ x: 0, y: 0, r: 34, col: '#ffcf4a', k: 1, press: 0, pulse: 0, hidden: false, iconK: 1 }, o); }
function hitButton(b, x, y) { return !b.hidden && dist(x, y, b.x, b.y) <= b.r * 1.15; }
function updateButton(b, dt, t) {
  const target = b.down ? 0.86 : 1;
  b.k += (target - b.k) * Math.min(1, dt * 22);
  b.bob = b.pulse ? Math.sin(t * 5) * b.r * 0.08 * b.pulse : 0;
}
function drawButton(ctx, b) {
  if (b.hidden) return;
  const r = b.r, k = b.k * (b.pulse ? 1 + Math.sin(b._t || 0) * 0 : 1);
  ctx.save();
  ctx.translate(b.x, b.y + (b.bob || 0));
  ctx.fillStyle = 'rgba(40,20,60,0.22)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.85, r * 0.22, 0, 0, TAU); ctx.fill();
  ctx.scale(k, k);
  if (!b.bare) {
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.05, 0, 0, r * 1.05);
    g.addColorStop(0, lighten(b.col, 0.55)); g.addColorStop(0.55, b.col); g.addColorStop(1, darken(b.col, 0.12));
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = Math.max(3, r * 0.1); ctx.strokeStyle = UI_LINE; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.84, Math.PI * 1.1, Math.PI * 1.6); ctx.lineWidth = r * 0.08; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineCap = 'round'; ctx.stroke();
  }
  if (b.icon) Art.blit(ctx, b.icon, 0, 0, r * 1.5 * b.iconK);
  if (b.draw) b.draw(ctx, r);
  ctx.restore();
}

/* ---------- outlined text (names, the title) ---------- */
function drawText(ctx, text, x, y, size, fill, line, align) {
  ctx.save();
  ctx.font = 'bold ' + Math.round(size) + 'px ' + FONT;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.22); ctx.strokeStyle = line || UI_LINE;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill || '#ffffff'; ctx.fillText(text, x, y);
  ctx.restore();
}

/* ---------- the pantry: tabs of food, a grid of tiles, arrows for more ---------- */
class Pantry {
  constructor(opts = {}) {
    this.tab = 0; this.page = 0; this.press = null; this.t = 0;
    this.lists = opts.lists || TABS.map(t => ({ icon: t.icon, ids: FOODS_BY_TAB[t.id] }));
    this.badge = opts.badge || null;      // id -> 'love' | 'dislike' | null
    this.style = opts.style || 'cupboard';
    this.bounce = {};
  }
  layout(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    const n = this.lists.length, pad = Math.max(6, Math.min(w, h) * 0.025);
    this.pad = pad;
    // tabs: one row across the top (two rows when there are many and room is narrow)
    const tabRows = n > 5 && w / n < 46 ? 2 : 1, perRow = Math.ceil(n / tabRows);
    const tw = (w - pad * 2) / perRow, th = Math.min(tw * 0.92, h * (tabRows === 2 ? 0.13 : 0.16), 78);
    this.tabs = this.lists.map((L, i) => ({ x: x + pad + (i % perRow) * tw + tw / 2, y: y + pad + Math.floor(i / perRow) * th + th / 2, w: tw, h: th }));
    const gy = y + pad + tabRows * th + pad * 0.6, gh = y + h - pad - gy;
    // tiles: the biggest that fit the longest list on one page; failing that, big tiles and arrows
    const most = Math.max.apply(null, this.lists.map(L => L.ids.length));
    let best = null;
    for (let cols = 3; cols <= 8; cols++) {
      const s = Math.min((w - pad * 2) / cols, 160);
      const one = Math.floor(gh / s), paged = Math.max(1, Math.floor((gh - s * 0.45) / s));
      const fits = cols * one >= most && s >= 72;
      const score = fits ? 1000 + s : s >= 72 ? s * cols * paged / most : s / 100;
      const rows = fits ? Math.ceil(most / cols) : paged;
      if (!best || score > best.score) best = { cols, rows, s, score };
    }
    this.cols = best.cols; this.rows = best.rows; this.tile = best.s;
    this.gx = x + (w - this.cols * this.tile) / 2; this.gy = gy;
    this.arrowY = gy + this.rows * this.tile + this.tile * 0.24;
    this.arrowR = Math.min(this.tile * 0.24, 30);
  }
  ids() { return this.lists[this.tab].ids; }
  pages() { return Math.max(1, Math.ceil(this.ids().length / (this.cols * this.rows))); }
  shown() { const per = this.cols * this.rows, all = this.ids(); this.page = Math.min(this.page, this.pages() - 1); return all.slice(this.page * per, this.page * per + per); }
  tileRect(i) { const c = i % this.cols, r = Math.floor(i / this.cols); return { x: this.gx + c * this.tile, y: this.gy + r * this.tile, s: this.tile }; }
  // where a food's tile sits on screen, if it is showing
  tileOf(id) { const i = this.shown().indexOf(id); if (i < 0) return null; const R = this.tileRect(i); return [R.x + R.s / 2, R.y + R.s / 2, R.s]; }
  arrows() { const p = this.pages(); return { left: this.page > 0, right: this.page < p - 1, ly: this.arrowY, lx: this.x + this.pad + this.arrowR * 1.4, rx: this.x + this.w - this.pad - this.arrowR * 1.4 }; }
  // what a finger landed on: { tab }, { arrow }, { food, x, y } or null
  hit(x, y) {
    if (x < this.x || x > this.x + this.w || y < this.y || y > this.y + this.h) return null;
    for (let i = 0; i < this.tabs.length; i++) { const T = this.tabs[i]; if (Math.abs(x - T.x) < T.w / 2 && Math.abs(y - T.y) < T.h / 2) return { tab: i }; }
    const A = this.arrows(), ar = this.arrowR * 1.6;
    if (A.left && dist(x, y, A.lx, A.ly) < ar) return { arrow: -1 };
    if (A.right && dist(x, y, A.rx, A.ly) < ar) return { arrow: 1 };
    const ids = this.shown();
    for (let i = 0; i < ids.length; i++) { const R = this.tileRect(i); if (x >= R.x && x < R.x + R.s && y >= R.y && y < R.y + R.s) return { food: ids[i], x: R.x + R.s / 2, y: R.y + R.s / 2, s: R.s }; }
    return { panel: true };
  }
  tapTab(i) { if (i === this.tab) return; this.tab = i; this.page = 0; this.bounce = {}; SFX.play('pop', { f: 500 + i * 60 }); }
  turn(d) { const p = this.pages(); this.page = (this.page + d + p) % p; SFX.play('swish'); }
  poke(id) { this.bounce[id] = 1; }
  update(dt) { this.t += dt; for (const k in this.bounce) { this.bounce[k] -= dt * 2.5; if (this.bounce[k] <= 0) delete this.bounce[k]; } }
  draw(ctx, hidden) {
    const { x, y, w, h } = this;
    // the cupboard
    ctx.save();
    ctx.fillStyle = 'rgba(40,20,60,0.25)'; ctx.beginPath(); rrect(ctx, x + 4, y + 8, w, h, 26); ctx.fill();
    ctx.beginPath(); rrect(ctx, x, y, w, h, 26);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#fff8ec'); g.addColorStop(1, '#f6e6cc');
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = UI_LINE; ctx.stroke();
    // shelves under each row of tiles
    ctx.fillStyle = '#e9cfa6';
    for (let r = 1; r <= this.rows; r++) { const sy = this.gy + r * this.tile - this.tile * 0.08; ctx.beginPath(); rrect(ctx, x + this.pad, sy, w - this.pad * 2, this.tile * 0.07, 4); ctx.fill(); }
    // tabs
    this.tabs.forEach((T, i) => {
      const on = i === this.tab;
      ctx.beginPath(); rrect(ctx, T.x - T.w / 2 + 3, T.y - T.h / 2 + 2, T.w - 6, T.h - 4, 16);
      ctx.fillStyle = on ? '#ffd84a' : '#fff1d6'; ctx.fill();
      ctx.lineWidth = on ? 4 : 2.5; ctx.strokeStyle = on ? UI_LINE : 'rgba(58,42,74,0.35)'; ctx.stroke();
      Art.blit(ctx, this.lists[i].icon, T.x, T.y + (on ? Math.sin(this.t * 6) * 2 : 0), Math.min(T.w, T.h) * (on ? 0.86 : 0.74));
    });
    // tiles
    this.shown().forEach((id, i) => {
      if (hidden === id) return;
      const R = this.tileRect(i), b = this.bounce[id] || 0, s = R.s * (0.84 + Math.sin(b * Math.PI) * 0.12);
      Art.blit(ctx, FOODS[id].pic, R.x + R.s / 2, R.y + R.s / 2 - Math.sin(b * Math.PI) * 8, s);
      const bd = this.badge && this.badge(id);
      if (bd) drawBadge(ctx, bd, R.x + R.s * 0.82, R.y + R.s * 0.2, R.s * 0.15);
    });
    // page arrows and dots
    const A = this.arrows(), P = this.pages();
    if (P > 1) {
      [[A.left, A.lx, -1], [A.right, A.rx, 1]].forEach(([on, ax, d]) => {
        if (!on) return;
        const r = this.arrowR, wob = Math.sin(this.t * 4) * 3 * d;
        ctx.beginPath(); ctx.arc(ax + wob, A.ly, r, 0, TAU); ctx.fillStyle = '#7ec8f0'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = UI_LINE; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ax + wob - d * r * 0.3, A.ly - r * 0.45); ctx.lineTo(ax + wob + d * r * 0.4, A.ly); ctx.lineTo(ax + wob - d * r * 0.3, A.ly + r * 0.45);
        ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      });
      for (let i = 0; i < P; i++) { ctx.beginPath(); ctx.arc(x + w / 2 + (i - (P - 1) / 2) * 18, A.ly, i === this.page ? 6 : 4, 0, TAU); ctx.fillStyle = i === this.page ? UI_LINE : 'rgba(58,42,74,0.3)'; ctx.fill(); }
    }
    ctx.restore();
  }
}
// a little heart (loved) or green splat with a cross (won't eat) on a tried food
function drawBadge(ctx, kind, x, y, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r * 1.25, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = UI_LINE; ctx.stroke();
  if (kind === 'love') { ctx.beginPath(); heartPath(ctx, x, y + r * 0.1, r * 0.8); ctx.fillStyle = '#ef3361'; ctx.fill(); }
  else if (kind === 'dislike') {
    ctx.strokeStyle = '#5aa02c'; ctx.lineWidth = r * 0.42; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - r * 0.5, y - r * 0.5); ctx.lineTo(x + r * 0.5, y + r * 0.5); ctx.moveTo(x + r * 0.5, y - r * 0.5); ctx.lineTo(x - r * 0.5, y + r * 0.5); ctx.stroke();
  } else { ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, TAU); ctx.fillStyle = '#ffcf4a'; ctx.fill(); }
  ctx.restore();
}

/* ---------- thought bubble: what the monster fancies ---------- */
function drawThought(ctx, x, y, r, pic, t, fromX, fromY) {
  ctx.save();
  const bob = Math.sin(t * 2.5) * r * 0.06;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = UI_LINE; ctx.lineWidth = 4;
  [[0.25, 0.12], [0.5, 0.18]].forEach(([u, k]) => { const bx = lerp(fromX, x, u), by = lerp(fromY, y + r, u); ctx.beginPath(); ctx.arc(bx, by, r * k, 0, TAU); ctx.fill(); ctx.stroke(); });
  ctx.beginPath(); cloudPath(ctx, x, y + bob, r, 7, 21);
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); cloudPath(ctx, x, y + bob, r * 0.96, 7, 21); ctx.fill();
  Art.blit(ctx, pic, x, y + bob, r * 1.25);
  ctx.restore();
}

/* ---------- chomp: two rows of teeth close over the screen and open on the next one ---------- */
function drawJaws(ctx, W, H, c) {   // c: 0 open .. 1 shut
  if (c <= 0.001) return;
  const e = Ease.inOut(c), half = H / 2 + 6, tooth = Math.max(40, W / 12);
  ctx.save();
  [-1, 1].forEach(s => {
    const edge = s < 0 ? lerp(-half, H / 2, e) : lerp(H + half, H / 2, e);
    ctx.beginPath();
    if (s < 0) { ctx.moveTo(-10, -10); ctx.lineTo(W + 10, -10); ctx.lineTo(W + 10, edge - tooth * 0.5); }
    else { ctx.moveTo(-10, H + 10); ctx.lineTo(W + 10, H + 10); ctx.lineTo(W + 10, edge + tooth * 0.5); }
    for (let x = W + 10; x > -tooth; x -= tooth) {
      const tip = s < 0 ? edge + tooth * 0.45 : edge - tooth * 0.45, base = s < 0 ? edge - tooth * 0.5 : edge + tooth * 0.5;
      ctx.lineTo(x - tooth * 0.12, base); ctx.quadraticCurveTo(x - tooth * 0.5, tip + (s < 0 ? 6 : -6), x - tooth * 0.88, base);
    }
    ctx.lineTo(-10, s < 0 ? edge - tooth * 0.5 : edge + tooth * 0.5); ctx.closePath();
    ctx.fillStyle = '#7a1f3d'; ctx.fill();
    // the teeth themselves, white along the edge
    ctx.save(); ctx.clip();
    for (let x = W + 10; x > -tooth; x -= tooth) {
      const base = s < 0 ? edge - tooth * 0.5 : edge + tooth * 0.5, tip = s < 0 ? edge + tooth * 0.45 : edge - tooth * 0.45;
      ctx.beginPath(); ctx.moveTo(x - tooth * 0.12, base); ctx.quadraticCurveTo(x - tooth * 0.5, tip + (s < 0 ? 6 : -6), x - tooth * 0.88, base); ctx.closePath();
      ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#c8b8a8'; ctx.stroke();
    }
    ctx.restore();
    ctx.lineWidth = 5; ctx.strokeStyle = '#4a1024'; ctx.stroke();
  });
  ctx.restore();
}

/* ---------- src/scenes.js ---------- */
/* scenes.js — the painted backdrops. Each picture knows the height where feet (or the kitchen
   counter) stand; it is scaled so that line lands where the screen wants its ground, covering the
   width and everything above. Below the picture, the floor colour carries on. */

const Backdrops = {
  img: {}, floor: {},
  load(done) {
    const names = Object.keys(BACKDROPS);
    let left = names.length;
    names.forEach(n => {
      const im = new Image();
      im.onload = () => { this.floor[n] = this.sampleFloor(im); if (--left === 0 && done) done(); };
      im.onerror = () => { if (--left === 0 && done) done(); };
      im.src = BACKDROPS[n].src;
      this.img[n] = im;
    });
  },
  // the average colour of the picture's bottom edge
  sampleFloor(im) {
    try {
      const c = makeCanvas(32, 4), g = c.getContext('2d');
      g.drawImage(im, 0, im.height - 8, im.width, 8, 0, 0, 32, 4);
      const d = g.getImageData(0, 0, 32, 4).data; let r = 0, gg = 0, b = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
      const n = d.length / 4; return hexOf([r / n, gg / n, b / n]);
    } catch (e) { return '#c89a60'; }
  },
  // where the picture lands for a screen W x H with its ground at gy
  fit(name, W, H, gy) {
    const B = BACKDROPS[name], s = Math.max(W / B.w, gy / (B.ground * B.h));
    return { s, x: (W - B.w * s) / 2, y: gy - B.ground * B.h * s, w: B.w * s, h: B.h * s };
  },
  // the backdrop lives on its own canvas behind the game, painted only when the screen, its size or
  // its ground line change; every frame the game canvas is cleared and only what moves is drawn
  draw(ctx, name, W, H, gy) {
    const im = this.img[name], bg = document.getElementById('bgc');
    if (!bg || !im || !im.complete || !im.naturalWidth) return;
    const dpr = G.dpr, key = name + ':' + W + 'x' + H + '@' + Math.round(gy) + '*' + dpr;
    if (bg._key === key) return;
    bg._key = key;
    bg.width = Math.round(W * dpr); bg.height = Math.round(H * dpr);
    const g = bg.getContext('2d'), F = this.fit(name, W, H, gy);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = this.floor[name] || '#c89a60'; g.fillRect(0, 0, W, H);
    g.imageSmoothingQuality = 'high';
    g.drawImage(im, F.x, F.y, F.w, F.h);
  },
  // nothing behind the game (the loading picture paints its own ground)
  clear() { const bg = document.getElementById('bgc'); if (bg) { bg._key = null; bg.width = 1; bg.height = 1; } },
};

      persona: { hate: 'veg', gross: false, loves: ['strawberry', 'icecream'], hates: ['sprouts', 'onion', 'fish'], cookLove: 'waffle', cookHate: 'pan' } },
