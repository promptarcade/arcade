const Store = {
  data: { monsters: [] },
  load() {
    try { const s = localStorage.getItem(STORE_KEY); if (s) { const d = JSON.parse(s); if (d && Array.isArray(d.monsters)) this.data = d; } } catch (e) {}
    if (!this.data.monsters.length) this.data.monsters = starterMonsters();
  },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) {} },
  get(id) { return this.data.monsters.find(m => m.id === id) || null; },
  add(rec) { this.data.monsters.push(rec); this.save(); },
  remove(id) { this.data.monsters = this.data.monsters.filter(m => m.id !== id); this.save(); },
};

/* ---------- src/app.js ---------- */
/* app.js — what every screen shares: the size of things, the list of screens, and going from one
   to another behind a pair of chomping jaws. Screens have enter(params), layout(), update(dt),
   draw(ctx), optional down/move/up(p) and drawOver(ctx), and a `buttons` list. */

const G = { W: 800, H: 600, dpr: 1, safe: { l: 0, t: 0, r: 0, b: 0 }, t: 0, cur: null, name: '', next: null, jaw: 0, jawDir: 0, test: false, ptrs: {}, started: false };
const SCREENS = {};

function go(name, params) {
  if (G.next || !SCREENS[name]) return;
  G.next = { name, params: params || {} }; G.jawDir = 1;
  SFX.play('chomp');
}
// go after a short beat (for a hop or a cheer first), unless the screen has changed meanwhile
function goLater(ms, name, params) {
  const visit = G.visit;
  setTimeout(() => { if (G.visit === visit && !G.next) go(name, params); }, ms);
}
function enterScreen(name, params) {
  if (G.cur && G.cur.exit) G.cur.exit();
  Parts.clear();
  G.visit = (G.visit || 0) + 1;
  G.cur = SCREENS[name]; G.name = name;
  G.cur.buttons = [];
  G.cur.enter(params || {});
  G.cur.layout();
}

/* ---------- src/screen_home.js ---------- */
/* screen_home.js — Monster Town: the monsters a child has made stand in a row on the grass and
   watch the finger. Tap one to feed it. Tap the egg to hatch a new one. Hold a monster still for a
   moment to show a bin for it; the bin asks a grown-up for the answer to a sum before the monster
   goes. Swipe to see more when there are many. */

SCREENS.home = {
  enter() {
    this.mons = Store.data.monsters.map(rec => new Monster(rec));
    this.scroll = 0; this.vel = 0; this.drag = null; this.deleting = null; this.binBtn = null; this.gate = null; this.eggShake = 0; this.hatching = 0; this.leaving = null;
  },
  layout() {
    const { W, H, safe } = G, land = W > H;
    this.ground = Math.round(H * (land ? 0.84 : 0.8));
    this.titleY = safe.t + Math.min(H * 0.12, 84);
    this.slot = clamp(Math.min(W, H) * (land ? 0.3 : 0.4), 150, 290);
    const room = this.ground - (this.titleY + 60);
    this.scale = clamp(Math.min(this.slot / 270, room / 340), 0.35, 1.05);
    this.mons.forEach(m => { m.scale = this.scale; });
    this.place();
    if (this.gate) this.layoutGate();
  },
  count() { return this.mons.length + 1; },
  span() { return this.count() * this.slot; },
  // x of item i (0 = the egg) on screen
  itemX(i) {
    const W = G.W, span = this.span();
    const x0 = span < W - 40 ? (W - span) / 2 : 20 - this.scroll;
    return x0 + this.slot * (i + 0.5);
  },
  maxScroll() { return Math.max(0, this.span() - G.W + 40); },
  place() { this.mons.forEach((m, i) => { m.x = this.itemX(i + 1); m.y = this.ground; }); },
  update(dt) {
    if (!this.drag) {
      this.scroll += this.vel * dt; this.vel *= Math.exp(-dt * 4);
      const mx = this.maxScroll();
      if (this.scroll < 0) { this.scroll += (0 - this.scroll) * Math.min(1, dt * 10); this.vel = 0; }
      if (this.scroll > mx) { this.scroll += (mx - this.scroll) * Math.min(1, dt * 10); this.vel = 0; }
    }
    this.place();
    const look = this.finger || null;
    this.mons.forEach(m => { m.lookAt = look; m.update(dt); });
    // a long press shows the bin
    if (this.drag && !this.drag.moved && this.drag.mon && !this.deleting && G.t - this.drag.t0 > 0.9) this.showBin(this.drag.mon);
    // the egg wobbles now and then to say "tap me"
    this.eggShake = Math.max(0, this.eggShake - dt);
    if (!this.eggShake && Math.random() < dt * 0.35) { this.eggShake = 0.6; }
    if (this.hatching) { this.hatching += dt; if (this.hatching > 0.75) { this.hatching = 0; go('builder', { fresh: true }); } }
    if (this.deleting) { const m = this.mons.find(x => x.rec.id === this.deleting); if (m) { m.pose.rot = Math.sin(G.t * 30) * 0.05; const b = this.binBtn; if (b) { b.x = m.x; b.y = m.y - m.g.height * m.scale - b.r * 0.6; } } }
    if (this.gate && this.gate.wrong) { this.gate.wrong -= dt; if (this.gate.wrong <= 0) this.cancelBin(); }
  },
  showBin(m) {
    this.deleting = m.rec.id; this.drag = null;
    SFX.play('boing', { f: 180 });
    this.binBtn = button({ r: 34, icon: 'i_bin', col: '#ffffff', onTap: () => this.openGate(m) });
    this.buttons = [this.binBtn];
  },
  /* The grown-up check: the answer to a sum, typed on number keys. The answer has two different
     digits that are not next to each other on the keys, so a double tap or a mash of neighbouring
     keys doesn't open it, and a wrong digit shuts it: a toddler tapping at random gets through
     about one time in a hundred, after first holding a monster still and finding the bin. */
  openGate(m) {
    let a, b, ans;
    do { a = randi(12, 89); b = randi(2, 9); ans = String(a + b); } while (ans[0] === ans[1] || this.keysTouch(+ans[0], +ans[1]));
    this.gate = { m, a, b, ans, typed: '', wrong: 0 };
    this.binBtn = null;
    SFX.play('pop', { f: 500 });
    this.layoutGate();
  },
  // are two digits' keys side by side (or corner to corner)? 1 2 3 / 4 5 6 / 7 8 9 / 0 under the 8
  keysTouch(p, q) {
    const at = d => (d ? [(d - 1) % 3, Math.floor((d - 1) / 3)] : [1, 3]), P = at(p), Q = at(q);
    return Math.abs(P[0] - Q[0]) <= 1 && Math.abs(P[1] - Q[1]) <= 1;
  },
  layoutGate() {
    const Q = this.gate, { W, H, safe } = G, land = W > H * 1.2;
    const w = Math.min(W - safe.l - safe.r - 32, land ? 720 : 460), h = Math.min(H - safe.t - safe.b - 32, land ? 420 : 620);
    const B = Q.box = { x: safe.l + (W - safe.l - safe.r - w) / 2, y: safe.t + (H - safe.t - safe.b - h) / 2, w, h };
    Q.font = clamp(Math.min(w * (land ? 0.5 : 1), h) * 0.13, 24, 64);
    // the words and the sum on the left (landscape) or at the top; the keys on the right or below
    const kx = land ? B.x + w * 0.5 : B.x, kw = land ? w * 0.5 : w, ky = land ? B.y : B.y + h * 0.4, kh = land ? h : h * 0.6;
    Q.textX = land ? B.x + w * 0.25 : B.x + w / 2;
    Q.nameY = B.y + h * (land ? 0.2 : 0.08); Q.sumY = B.y + h * (land ? 0.47 : 0.2); Q.ansY = B.y + h * (land ? 0.74 : 0.31);
    const r = Math.max(22, Math.min(kw / 3, kh / 4) * 0.38);
    this.buttons = [];
    for (let d = 0; d <= 9; d++) {
      const i = d ? d - 1 : 10, x = kx + kw * ((i % 3) + 0.5) / 3, y = ky + kh * (Math.floor(i / 3) + 0.5) / 4;
      this.buttons.push(button({ x, y, r, col: '#fff1d6', onTap: () => this.typeDigit(d), draw: (ctx, rr) => drawText(ctx, String(d), 0, rr * 0.05, rr * 1.15, UI_LINE, '#fff1d6') }));
    }
    const cr = Math.max(22, r * 0.75);
    this.buttons.push(button({ x: B.x + cr + 12, y: B.y + cr + 12, r: cr, icon: 'i_back', col: '#ffcf4a', onTap: () => this.cancelBin() }));
  },
  typeDigit(d) {
    const Q = this.gate;
    if (!Q || Q.wrong) return;
    Q.typed += d;
    if (Q.ans.indexOf(Q.typed) !== 0) { Q.wrong = 0.6; SFX.play('boing', { f: 160 }); return; }   // wrong: it shakes and shuts
    if (Q.typed === Q.ans) this.removeMon(Q.m);
  },
  removeMon(m) {
    const [x, y] = m.centerPos();
    Parts.burst('puff', x, y, 12, { v0: 60, v1: 220, sizeR: [18, 34], lifeR: [0.5, 0.9], col: '#ffffff', grow: 1.8 });
    Parts.burst('star', x, y, 8, { v0: 100, v1: 260, sizeR: [8, 13], lifeR: [0.5, 0.8], col: '#ffd23f', vr: 6 });
    SFX.play('poof'); SFX.play('sad');
    Store.remove(m.rec.id);
    this.mons = this.mons.filter(x => x !== m);
    this.cancelBin();
  },
  cancelBin() { const m = this.mons.find(x => x.rec.id === this.deleting); if (m) m.pose.rot = 0; this.deleting = null; this.binBtn = null; this.gate = null; this.buttons = []; },
  hitItem(x, y) {
    if (dist(x, y, this.itemX(0), this.ground - this.slot * 0.32) < this.slot * 0.36) return { egg: true };
    for (const m of this.mons) if (m.hit(x, y, 30)) return { mon: m };
    return null;
  },
  down(p) {
    this.finger = { x: p.x, y: p.y };
    if (this.gate) { const B = this.gate.box; if (p.x < B.x || p.x > B.x + B.w || p.y < B.y || p.y > B.y + B.h) this.cancelBin(); return; }
    if (this.deleting) { this.cancelBin(); return; }
    const h = this.hitItem(p.x, p.y);
    this.drag = { x0: p.x, last: p.x, t0: G.t, moved: false, mon: h && h.mon, egg: h && h.egg, lt: G.t };
    this.vel = 0;
    if (h && h.mon && !h.mon.busy) h.mon.play(tickle(h.mon));
  },
  move(p) {
    this.finger = { x: p.x, y: p.y };
    const D = this.drag;
    if (!D) return;
    if (Math.abs(p.x - D.x0) > 14) D.moved = true;
    if (D.moved && this.maxScroll() > 0) {
      const dx = p.x - D.last, dt = Math.max(0.001, G.t - D.lt);
      this.scroll -= dx; this.vel = -dx / dt * 0.6; D.last = p.x; D.lt = G.t;
    }
  },
  up(p) {
    this.finger = null;
    const D = this.drag; this.drag = null;
    if (!D || D.moved || this.deleting || this.leaving || this.hatching) return;
    if (D.egg) { this.hatching = 0.001; SFX.play('hatch'); return; }
    if (D.mon) {
      const m = D.mon; this.leaving = m;
      Say.say(m.rec.name);
      m.tasks.clear(); m.reset();
      m.play((function* () { m.face.eyes = 'happy'; m.face.mouth = 'grin'; m.face.open = 0.6; babble(m, 'happy', 2); yield* hop(m, 50, 0.45); })());
      goLater(450, 'feed', { id: m.rec.id });
    }
  },
  draw(ctx) {
    const { W, H } = G;
    Backdrops.draw(ctx, 'bg_home', W, H, this.ground);
    this.drawTitle(ctx);
    // the egg
    const ex = this.itemX(0), ey = this.ground - this.slot * 0.3, es = this.slot * 0.62;
    const sh = this.hatching ? Math.sin(G.t * 60) * 0.12 * (1 + this.hatching * 3) : this.eggShake ? Math.sin(this.eggShake * 30) * 0.15 : 0;
    ctx.fillStyle = 'rgba(40,24,60,0.2)'; ctx.beginPath(); ctx.ellipse(ex, this.ground + 2, es * 0.35, es * 0.08, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(ex, this.ground); ctx.rotate(sh); Art.draw(ctx, 'i_egg', 0, -es * 0.48, es); ctx.restore();
    if (this.hatching) { const k = this.hatching / 0.75; ctx.fillStyle = 'rgba(255,255,255,' + k * 0.9 + ')'; ctx.beginPath(); ctx.arc(ex, ey, es * (0.3 + k), 0, TAU); ctx.fill(); }
    Parts.draw(ctx, 0);
    this.mons.forEach(m => {
      if (m.x < -this.slot || m.x > W + this.slot) return;
      m.draw(ctx);
      drawText(ctx, m.rec.name, m.x, this.ground + Math.min(30, (H - this.ground) * 0.45), clamp(this.slot * 0.13, 16, 28), '#ffffff');
    });
    Parts.draw(ctx, 1);
    if (this.gate) this.drawGate(ctx);
  },
  // the grown-up check's card: the bin and the monster's name, the sum, the answer so far (the keys
  // are buttons, drawn over it)
  drawGate(ctx) {
    const Q = this.gate, B = Q.box, f = Q.font, shake = Q.wrong ? Math.sin(G.t * 50) * f * 0.15 : 0;
    ctx.save();
    ctx.fillStyle = 'rgba(40,20,60,0.45)'; ctx.fillRect(0, 0, G.W, G.H);
    ctx.fillStyle = 'rgba(40,20,60,0.25)'; ctx.beginPath(); rrect(ctx, B.x + 4, B.y + 8, B.w, B.h, 26); ctx.fill();
    ctx.beginPath(); rrect(ctx, B.x, B.y, B.w, B.h, 26);
    const g = ctx.createLinearGradient(0, B.y, 0, B.y + B.h); g.addColorStop(0, '#fff8ec'); g.addColorStop(1, '#f6e6cc');
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = UI_LINE; ctx.stroke();
    ctx.font = 'bold ' + Math.round(f * 0.55) + 'px ' + FONT;
    const name = Q.m.rec.name, nw = ctx.measureText(name).width + f * 0.95;
    Art.blit(ctx, 'i_bin', Q.textX - nw / 2 + f * 0.35, Q.nameY, f * 0.75);
    drawText(ctx, name, Q.textX + f * 0.45, Q.nameY, f * 0.55, '#ffffff');
    drawText(ctx, Q.a + ' + ' + Q.b + ' =', Q.textX + shake, Q.sumY, f, '#ffd84a');
    for (let i = 0; i < 2; i++) {
      const s = f * 1.15, x = Q.textX + shake + (i - 0.5) * s * 1.2;
      ctx.beginPath(); rrect(ctx, x - s / 2, Q.ansY - s / 2, s, s, s * 0.2);
      ctx.fillStyle = Q.wrong ? '#ffd0d0' : '#ffffff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = UI_LINE; ctx.stroke();
      if (Q.typed[i]) drawText(ctx, Q.typed[i], x, Q.ansY + s * 0.04, f * 0.9, Q.wrong ? '#e8352e' : UI_LINE, '#ffffff');
    }
    ctx.restore();
  },
  drawTitle(ctx) {
    const text = 'Chomp Chums', size = clamp(Math.min(G.W / 9, G.H / 7), 34, 88), cols = ['#ff5f8f', '#ffd84a', '#69c95c', '#4aa7f2', '#ff9b3d', '#9a6be2'];
    ctx.save();
    ctx.font = 'bold ' + size + 'px ' + FONT;
    const widths = text.split('').map(ch => ctx.measureText(ch).width), total = widths.reduce((a, b) => a + b, 0);
    let x = G.W / 2 - total / 2;
    text.split('').forEach((ch, i) => {
      const y = this.titleY + Math.sin(G.t * 3 + i * 0.6) * size * 0.06;
      if (ch !== ' ') drawText(ctx, ch, x + widths[i] / 2, y, size, cols[i % cols.length]);
      x += widths[i];
    });
    ctx.restore();
  },
};
// a poke makes a monster giggle and wiggle
function* tickle(m) {
  m.face.eyes = 'happy'; m.face.mouth = 'grin'; m.face.open = 0.5;
  babble(m, 'giggle', 3);
  yield* during(0.5, e => { m.pose.rot = Math.sin(e * 30) * 0.08; m.pose.sx = 1 + Math.sin(e * 30) * 0.04; });
  m.pose.rot = 0; m.pose.sx = 1; m.face.eyes = 'open'; m.face.mouth = 'smile'; m.face.open = 0;
}

/* ---------- src/screen_builder.js ---------- */
/* screen_builder.js — making a monster on the workshop stage. Paint pots change the colour (and
   say it); picture buttons change each part; tapping a part on the monster changes that part; the
   dice makes a surprise monster; the big tick says done and goes to dinner. */

const PART_BUTTONS = [['body', 'i_blob'], ['eyes', 'i_eye'], ['mouth', 'i_mouth'], ['top', 'i_horns'], ['arms', 'i_arm'], ['legs', 'i_foot'], ['pattern', 'i_spots']];

SCREENS.builder = {
  enter(p) {
    if (p.fresh) {
      const design = randomDesign();
      this.rec = newMonster(design);
      this.fresh = true;
    } else {
      this.rec = Store.get(p.id) || Store.data.monsters[0];
      this.fresh = false;
    }
    this.mon = new Monster(this.rec);
    this.changed = false; this.leaving = false;
    if (this.fresh) this.mon.play(popOut(this.mon));
  },
  layout() {
    const { W, H, safe } = G, land = W > H;
    this.land = land;
    const B = this.buttons = [];
    const r = clamp(Math.min(W, H) * (land ? 0.062 : 0.05), 26, 44);
    B.push(button({ x: safe.l + r + 14, y: safe.t + r + 14, r, icon: 'i_home', col: '#ffcf4a', onTap: () => this.leave('home') }));
    this.done = button({ r: r * 1.35, icon: 'i_tick', col: '#ffffff', pulse: 1, onTap: () => this.leave('feed') });
    this.pots = COLORS.map(c => button({ r: r * 0.92, col: PAL[c].base, color: c, bare: true, onTap: () => this.paint(c) }));
    this.parts = PART_BUTTONS.map(([k, icon]) => button({ r, icon, col: '#fff3d6', part: k, iconK: 0.95, onTap: () => this.change(k) }));
    this.dice = button({ r, icon: 'i_dice', col: '#bfe4ff', onTap: () => this.surprise() });
    if (land) {
      this.ground = Math.round(H * 0.84);
      const colW = r * 2.3, top = safe.t + r * 3.3 + 22;
      this.pots.forEach((b, i) => { b.x = safe.l + 18 + r + (i % 2) * colW; b.y = top + Math.floor(i / 2) * r * 2.25; });
      [...this.parts, this.dice].forEach((b, i) => { b.x = W - safe.r - 18 - r - (i % 2) * colW; b.y = top + Math.floor(i / 2) * r * 2.25; });
      this.done.x = W - safe.r - this.done.r - 22; this.done.y = H - safe.b - this.done.r - 18;
      const free = W - 2 * (18 + colW + r * 2);
      this.mon.x = W / 2; this.mon.y = this.ground;
      this.mon.scale = clamp(Math.min((this.ground - safe.t - 70) / 380, free / 300), 0.5, 1.5);
      // on a short screen the part buttons reach the bottom corner: put the tick on the stage instead,
      // between the monster and the buttons
      const gridBottom = Math.max(...[...this.parts, this.dice].map(b => b.y + b.r));
      if (this.done.y - this.done.r < gridBottom + 10) {
        const left = W / 2 + this.mon.scale * 130 + this.done.r, right = W - safe.r - 18 - colW - r * 2 - this.done.r;
        this.done.x = Math.max(left, (left + right) / 2);
      }
    } else {
      this.ground = Math.round(H * 0.56);
      const row = (list, y) => { const step = Math.min((W - safe.l - safe.r - 24) / list.length, r * 2.4); const x0 = W / 2 - step * (list.length - 1) / 2; list.forEach((b, i) => { b.x = x0 + i * step; b.y = y; }); };
      row([...this.parts, this.dice], this.ground + r * 1.9);
      row(this.pots.slice(0, 5), this.ground + r * 4.4);
      row(this.pots.slice(5), this.ground + r * 6.6);
      this.done.x = W - safe.r - this.done.r - 18; this.done.y = H - safe.b - this.done.r - 16;
      this.mon.x = W / 2; this.mon.y = this.ground;
      this.mon.scale = clamp(Math.min((this.ground - safe.t - 60) / 380, W * 0.7 / 300), 0.45, 1.4);
    }
    B.push(...this.pots, ...this.parts, this.dice, this.done);
    this.markColor();
  },
  markColor() { this.pots.forEach(b => { b.pulse = b.color === this.rec.design.color ? 1 : 0; }); },
  // redo the monster's look after a change, with a puff where it changed
  remake(where) {
    this.mon.setDesign(this.rec.design);
    this.changed = true;
    const [x, y] = where || this.mon.centerPos();
    Parts.burst('puff', x, y, 7, { v0: 40, v1: 140, sizeR: [12 * this.mon.scale, 22 * this.mon.scale], lifeR: [0.35, 0.6], col: '#ffffff', grow: 1.7, alpha: 0.9 });
    Parts.burst('star', x, y, 5, { v0: 80, v1: 200, sizeR: [6, 10], lifeR: [0.4, 0.7], cols: ['#ffd23f', '#ff8ac0', '#7fd0ff'], vr: 6 });
    if (!this.mon.busy) this.mon.play(admire(this.mon));
  },
  paint(c) {
    if (c === this.rec.design.color) { this.mon.play(admire(this.mon)); return; }
    this.rec.design.color = c;
    SFX.play('paint');
    Say.say(PAL[c].say);
    const [x, y] = this.mon.centerPos();
    Parts.burst('drop', x, y - 40 * this.mon.scale, 14, { v0: 150, v1: 380, g: 1300, sizeR: [5, 10], lifeR: [0.6, 1], cols: PAL[c].stops || [PAL[c].base, PAL[c].light], floor: this.ground });
    this.remake();
    this.markColor();
  },
  change(k) {
    const list = PART_LISTS[k], d = this.rec.design;
    d[k] = list[(list.indexOf(d[k]) + 1) % list.length];
    SFX.play('poof'); SFX.play('boing', { f: 240 + PART_BUTTONS.findIndex(p => p[0] === k) * 40 });
    this.remake(this.partPos(k));
  },
  surprise() {
    const keep = this.rec.design.seed;
    this.rec.design = Object.assign(randomDesign(), { seed: keep });
    this.mon.d = this.rec.design;
    SFX.play('whoosh'); SFX.play('sparkle');
    this.remake();
    this.markColor();
    Say.say(PAL[this.rec.design.color].say);
  },
  // the screen point of a part, for its puff
  partPos(k) {
    const m = this.mon, g = m.g;
    if (k === 'eyes') return m.toScreen(0, g.eyes[0].y);
    if (k === 'mouth') return m.toScreen(g.mouth.x, g.mouth.y);
    if (k === 'top') return m.toScreen(0, g.bodyTop - 20);
    if (k === 'legs') return m.toScreen(0, g.ground - 20);
    if (k === 'arms') return m.toScreen(g.sockets[1][0] + 20, g.sockets[1][1] + 20);
    return m.centerPos();
  },
  leave(where) {
    if (this.leaving) return;
    this.leaving = true;
    if (this.fresh) { if (!Store.get(this.rec.id)) Store.add(this.rec); }
    else Store.save();
    if (where === 'feed') {
      Say.say(this.rec.name);
      this.mon.play((function* (m) { m.face.eyes = 'heart'; m.face.mouth = 'grin'; m.face.open = 0.7; babble(m, 'happy', 3); yield* hop(m, 60, 0.45); })(this.mon));
      goLater(500, 'feed', { id: this.rec.id });
    } else go('home');
  },
  down(p) {
    this.finger = p;
    const part = this.mon.partAt(p.x, p.y);
    if (part) this.change(part);
    else if (this.mon.hit(p.x, p.y)) this.change('pattern');
  },
  move(p) { this.finger = p; },
  up() { this.finger = null; },
  update(dt) { this.mon.lookAt = this.finger || null; this.mon.update(dt); },
  draw(ctx) {
    const { W, H } = G;
    Backdrops.draw(ctx, 'bg_builder', W, H, this.ground);
    Parts.draw(ctx, 0);
    this.mon.draw(ctx);
    Parts.draw(ctx, 1);
  },
  // paint pots are drawn here (they have no picture): a glossy blob of paint, rainbow in stripes
  drawOver(ctx) {
    this.pots.forEach(b => {
      const r = b.r * b.k, y = b.y + (b.bob || 0), col = b.color;
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x, y, r, 0, TAU);
      if (PAL[col].stops) {
        ctx.save(); ctx.clip();
        PAL[col].stops.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(b.x - r, y - r + (i * 2 * r) / 6, 2 * r, (2 * r) / 6 + 1); });
        ctx.restore();
      } else { const g = ctx.createRadialGradient(b.x - r * 0.35, y - r * 0.4, r * 0.1, b.x, y, r); g.addColorStop(0, PAL[col].light); g.addColorStop(1, PAL[col].base); ctx.fillStyle = g; ctx.fill(); }
      ctx.lineWidth = b.pulse ? 6 : 4; ctx.strokeStyle = UI_LINE; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(b.x - r * 0.35, y - r * 0.4, r * 0.25, r * 0.14, -0.6, 0, TAU); ctx.fill();
      // a drip
      ctx.fillStyle = PAL[col].stops ? PAL[col].stops[4] : PAL[col].base;
      ctx.beginPath(); ctx.ellipse(b.x + r * 0.45, y + r * 0.95, r * 0.14, r * 0.22, 0, 0, TAU); ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
      ctx.restore();
    });
  },
};
// a fresh monster pops out of its egg
function* popOut(m) {
  m.pose.sy = 0.2; m.pose.sx = 0.2;
  m.face.eyes = 'happy'; m.face.mouth = 'grin'; m.face.open = 0.8;
  SFX.play('boing', { f: 200 });
  yield* tween(0.5, p => { m.pose.sx = Ease.elastic(p); m.pose.sy = Ease.elastic(p); });
  babble(m, 'happy', 3);
  yield* wait(0.4);
  m.face.eyes = 'open'; m.face.mouth = 'smile'; m.face.open = 0;
}
// a quick look at its new self
function* admire(m) {
  m.face.eyes = 'star'; m.face.mouth = 'grin'; m.face.open = 0.5;
  babble(m, 'happy', 2);
  yield* during(0.45, e => { m.pose.rot = Math.sin(e * 24) * 0.07; m.pose.lift = Math.abs(Math.sin(e * 12)) * 8; });
  m.pose.rot = 0; m.pose.lift = 0; m.face.eyes = 'open'; m.face.mouth = 'smile'; m.face.open = 0;
}

/* ---------- src/screen_feed.js ---------- */
/* screen_feed.js — dinner time. The monster stands in the dining room; the pantry is beside it.
   Tap a food and it flies to the monster; or drag it there (the monster watches it come, opens
   wide, drools for favourites and leans away from foods it won't eat). Extra food waits on a
   plate. Dishes from the kitchen arrive on the plate too. A thought bubble shows a favourite. */

function servingOf(id, cook) {
  const F = FOODS[id];
  cook = cook || [];
  let spr = Art.sprite(F.pic, 256);
  cook.forEach((k, i) => { spr = cookSprite(spr, k, 7 + i); });
  return { parts: [id], cook, kind: 'food', spr, col: F.rgb, inside: F.inside, drink: F.tab === 'drinks' && id !== 'icecube' && cook.indexOf('freeze') < 0, name: F.name, moustache: F.rgb };
}

SCREENS.feed = {
  enter(p) {
    this.rec = Store.get(p.id) || Store.data.monsters[0];
    if (!this.rec) { setTimeout(() => go('home'), 0); return; }
    this.mon = new Monster(this.rec);
    this.pantry = this.pantry || new Pantry({});
    this.pantry.badge = id => { const v = this.rec.tried[id]; return v === 'love' || v === 'dislike' ? v : null; };
    this.held = null; this.flying = []; this.queue = []; this.bubble = null; this.idle = 0; this.finger = null; this.eating = false; this.flustered = false;
    this.stage = { floor: 0, left: 0, right: 0, top: 0, mid: 0, shake: 0 };
    this.dish = p.dish ? { S: p.dish, t: 0 } : null;
    if (this.dish) SFX.play('ding');
  },
  layout() {
    if (!this.rec) return;
    const { W, H, safe } = G, land = W > H;
    const r = clamp(Math.min(W, H) * 0.055, 26, 40);
    const B = this.buttons = [];
    [['i_home', '#ffcf4a', () => go('home')], ['i_brush', '#ffb3d1', () => go('builder', { id: this.rec.id })], ['k_chefhat', '#bfe4ff', () => go('kitchen', { id: this.rec.id })]]
      .forEach(([icon, col, onTap], i) => B.push(button({ x: safe.l + r + 14 + i * r * 2.45, y: safe.t + r + 14, r, icon, col, onTap })));
    B[2].pulse = 0.6;
    const st = this.stage, m = this.mon;
    if (land) {
      const px = Math.round(W * 0.52);
      this.pantry.layout(px, safe.t + 12, W - px - safe.r - 12, H - safe.t - safe.b - 24);
      this.ground = Math.round(H * 0.86);
      st.left = safe.l + 10; st.right = px - 10;
      m.x = st.left + (st.right - st.left) * 0.42;
      m.scale = clamp(Math.min((this.ground - safe.t - r * 2 - 40) / 380, (st.right - st.left) * 0.62 / 280), 0.4, 1.5);
      this.plate = { x: st.left + (st.right - st.left) * 0.84, y: this.ground - 4, r: clamp((st.right - st.left) * 0.13, 44, 90) };
    } else {
      const py = Math.round(H * 0.54);
      this.pantry.layout(safe.l + 10, py, W - safe.l - safe.r - 20, H - py - safe.b - 10);
      this.ground = py - 16;
      st.left = safe.l + 10; st.right = W - safe.r - 10;
      m.x = W * 0.42;
      m.scale = clamp(Math.min((this.ground - safe.t - r * 2 - 40) / 380, W * 0.6 / 280), 0.35, 1.3);
      this.plate = { x: W * 0.84, y: this.ground - 4, r: clamp(W * 0.1, 40, 80) };
    }
    m.y = this.ground;
    st.floor = this.ground; st.top = 0; st.mid = (st.left + st.right) / 2;
    Parts.floor = this.ground;
  },
  // a mouthful reaches the monster: eat now, or wait on the plate
  serve(S) {
    const m = this.mon;
    if (m.busy || this.eating) {
      if (this.queue.length < 3) { this.queue.push(S); SFX.play('plop'); }
      else { SFX.play('boing', { f: 160 }); }
      return;
    }
    this.eating = true; this.idle = 0; this.bubble = null;
    m.lookAt = null;
    m.play(feedScript(m, S, this.stage, { done: v => {
      this.eating = false; this.flustered = false;
      if (S.parts.length === 1 && S.kind === 'food' && !(S.cook || []).length) { this.rec.tried[S.parts[0]] = v; this.pantry.poke(S.parts[0]); }
      Store.save();
    } }));
  },
  mouth() { return this.mon.mouthPos(); },
  // the plate holds three and the mouth one (taken while the monster is busy): all full, counting what is on its way?
  full() { return this.flying.filter(F => !F.back).length + this.queue.length + (this.eating || this.mon.busy ? 1 : 0) >= 4; },
  // send a food flying from (x, y) to the monster's mouth
  fling(S, x, y) {
    const [mx, my] = this.mouth();
    this.flying.push({ S, x0: x, y0: y, x, y, t: 0, dur: clamp(dist(x, y, mx, my) / 900, 0.35, 0.7), size: this.pantry.tile || 90 });
    SFX.play('whoosh', { dur: 0.3 });
  },
  down(p) {
    this.finger = p; this.idle = 0;
    // the thought bubble: tap it to feed what it shows
    if (this.bubble && this.bubble.shown && dist(p.x, p.y, this.bubble.x, this.bubble.y) < this.bubble.r * 1.2) {
      const id = this.bubble.id; this.bubble = null;
      Say.say(FOODS[id].name);
      this.fling(servingOf(id), p.x, p.y);
      return;
    }
    // the dish or a waiting food on the plate (one food in the hand at a time: other fingers can't grab)
    const P = this.plate;
    if (!this.held && (this.dish || this.queue.length) && dist(p.x, p.y, P.x, P.y - P.r * 0.6) < P.r * 1.3) {
      const S = this.dish ? this.dish.S : this.queue.shift();
      this.dish = null;
      this.held = { S, x: p.x, y: p.y, ptr: p.id, size: P.r * 1.6, t0: G.t, x0: p.x, y0: p.y, fromPlate: true };
      Say.say(S.name);
      return;
    }
    const h = this.pantry.hit(p.x, p.y);
    if (h) {
      if (h.tab !== undefined) this.pantry.tapTab(h.tab);
      else if (h.arrow) this.pantry.turn(h.arrow);
      else if (h.food && !this.held) {
        // one too many: it stays in the cupboard, and a monster with its mouth full gets in a flap (once a mouthful)
        if (this.full()) {
          this.pantry.poke(h.food); SFX.play('boing', { f: 160 });
          if (this.eating && !this.flustered) { this.flustered = true; this.mon.play(tooMuch(this.mon)); }
          return;
        }
        const S = servingOf(h.food);
        this.held = { S, id: h.food, x: p.x, y: p.y, ptr: p.id, size: h.s, t0: G.t, x0: p.x, y0: p.y, tile: [h.x, h.y] };
        Say.say(FOODS[h.food].name);
        this.pantry.poke(h.food);
        SFX.play('pop', { f: 700 });
      }
      return;
    }
    if (this.mon.hit(p.x, p.y) && !this.mon.busy) this.mon.play(tickle(this.mon));
  },
  move(p) {
    this.finger = p;
    const H = this.held;
    if (H && H.ptr === p.id) { H.x = p.x; H.y = p.y; if (dist(p.x, p.y, H.x0, H.y0) > 14) H.moved = true; }
  },
  up(p, cancel) {
    this.finger = null;
    const H = this.held;
    if (!H || H.ptr !== p.id) return;
    this.held = null;
    const m = this.mon, [mx, my] = this.mouth();
    const near = dist(p.x, p.y, mx, my) < Math.max(150, 260 * m.scale) || m.hit(p.x, p.y, 40);
    if (!cancel && (!H.moved || near)) { this.fling(H.S, H.x, H.y); m.face.open = 0; return; }
    // dropped somewhere else: back to where it came from
    if (H.fromPlate) { if (H.S.kind !== 'food' && !this.dish) this.dish = { S: H.S, t: 0 }; else this.queue.unshift(H.S); return; }
    this.flying.push({ S: H.S, x0: H.x, y0: H.y, x: H.x, y: H.y, t: 0, dur: 0.3, size: H.size, back: H.tile });
  },
  update(dt) {
    if (!this.rec) return;
    const m = this.mon, st = this.stage;
    st.shake *= Math.exp(-dt * 6);
    // a dragged food: the monster watches it, opens wide as it nears, drools for favourites
    if (this.held && !m.busy) {
      const H = this.held, [mx, my] = this.mouth(), d = dist(H.x, H.y, mx, my), k = clamp(1 - d / (420 * m.scale + 120), 0, 1);
      m.lookAt = { x: H.x, y: H.y };
      const v = H.S.parts.length === 1 ? prefOf(this.rec, H.S.parts[0]) : 'like';
      if (v === 'dislike' && k > 0.2) { m.face.eyes = 'half'; m.face.mouth = 'frown'; m.face.open = 0; m.pose.rot = -0.12 * k * (H.x > m.x ? 1 : -1); }
      else { m.face.eyes = v === 'love' && k > 0.5 ? 'heart' : k > 0.3 ? 'wide' : 'open'; m.face.mouth = 'smile'; m.face.open = k * 1.1; m.pose.rot = 0; }
      if (v === 'love' && k > 0.4 && Math.random() < dt * 3) { const [x, y] = this.mouth(); Parts.add('drop', x + 8 * m.scale, y + 10 * m.scale, { size: 5 * m.scale, col: '#cfeeff', vy: 40, g: 900, life: 1.2, floor: this.ground }); }
    } else if (!m.busy) {
      m.lookAt = this.finger || null;
      if (m.face.open > 0 || m.pose.rot) { m.face.open *= 0.85; m.pose.rot *= 0.85; if (m.face.open < 0.02) { m.face.open = 0; m.face.eyes = 'open'; m.face.mouth = 'smile'; } if (Math.abs(m.pose.rot) < 0.002) m.pose.rot = 0; }
    }
    m.update(dt);
    // foods in the air
    for (let i = this.flying.length - 1; i >= 0; i--) {
      const F = this.flying[i];
      F.t += dt;
      const u = Math.min(1, F.t / F.dur);
      if (F.back) { F.x = lerp(F.x0, F.back[0], Ease.inOut(u)); F.y = lerp(F.y0, F.back[1], Ease.inOut(u)); F.k = 1 - u * 0.3; }
      else { const [mx, my] = this.mouth(); F.x = lerp(F.x0, mx, u); F.y = lerp(F.y0, my, u) - Math.sin(u * Math.PI) * 120; F.k = lerp(1, 0.8, u); F.rot = u * 6; }
      if (u >= 1) { this.flying.splice(i, 1); if (!F.back) this.serve(F.S); }
    }
    // the next waiting food, once the monster is free and nothing is already on its way
    const inAir = this.flying.some(F => !F.back);
    if (!m.busy && !this.eating && !inAir && this.queue.length && !this.held) { const S = this.queue.shift(); this.fling(S, this.plate.x, this.plate.y - this.plate.r * 0.5); }
    // a dish nobody touches gets eaten anyway
    if (this.dish && !m.busy && !this.eating && !inAir && !this.held) { this.dish.t += dt; if (this.dish.t > 5) { const S = this.dish.S; this.dish = null; this.fling(S, this.plate.x, this.plate.y - this.plate.r * 0.5); } }
    // thought bubble when nothing has happened for a while
    this.idle += dt;
    if (!this.bubble && this.idle > 7 && !m.busy && !this.held) {
      const id = wantedFood(this.rec);
      if (id) { this.bubble = { id, t: 0 }; SFX.play('bloop', { f: 600 }); babble(m, 'ask', 2, 0.8); }
    }
    if (this.bubble) {
      const b = this.bubble; b.t += dt;
      const [hx, hy] = m.headPos();
      b.r = clamp(70 * m.scale, 46, 80); b.x = hx + b.r * 1.5; b.y = Math.max(G.safe.t + b.r + 70, hy - b.r * 0.6); b.shown = true;
      if (b.t > 6 || m.busy) { this.bubble = null; this.idle = 0; }
    }
    this.pantry.update(dt);
  },
  draw(ctx) {
    if (!this.rec) return;
    const { W, H } = G, m = this.mon, st = this.stage;
    Backdrops.draw(ctx, 'bg_feed', W, H, this.ground);
    ctx.save();
    if (st.shake > 0.3) ctx.translate((Math.random() * 2 - 1) * st.shake, (Math.random() * 2 - 1) * st.shake);
    // the plate, with whatever waits on it
    const P = this.plate;
    if (this.dish || this.queue.length) {
      Art.blit(ctx, 'k_plate', P.x, P.y - P.r * 0.15, P.r * 2);
      if (this.dish) { const b = Math.abs(Math.sin(G.t * 4)) * 8; ctx.drawImage(this.dish.S.spr, P.x - P.r * 0.9, P.y - P.r * 1.6 - b, P.r * 1.8, P.r * 1.8); }
      this.queue.forEach((S, i) => ctx.drawImage(S.spr, P.x - P.r * 0.7 + (i - 1) * P.r * 0.35, P.y - P.r * 1.35 - i * 6, P.r * 1.4, P.r * 1.4));
    }
    Parts.draw(ctx, 0);
    m.draw(ctx);
    Parts.draw(ctx, 1);
    this.flying.forEach(F => { const s = F.size * (F.k || 1); ctx.save(); ctx.translate(F.x, F.y); ctx.rotate(F.rot || 0); ctx.drawImage(F.S.spr, -s / 2, -s / 2, s, s); ctx.restore(); });
    if (this.bubble && this.bubble.shown) { const [hx, hy] = m.headPos(); drawThought(ctx, this.bubble.x, this.bubble.y, this.bubble.r, FOODS[this.bubble.id].pic, G.t, hx + 10, hy - 10); }
    ctx.restore();
    this.pantry.draw(ctx);
  },
  drawOver(ctx) {
    const H = this.held;
    if (!H) return;
    const s = H.size * 1.25, wob = Math.sin(G.t * 12) * 0.08;
    ctx.save(); ctx.translate(H.x, H.y); ctx.rotate(wob);
    ctx.fillStyle = 'rgba(40,20,60,0.2)'; ctx.beginPath(); ctx.ellipse(6, s * 0.45, s * 0.35, s * 0.1, 0, 0, TAU); ctx.fill();
    ctx.drawImage(H.S.spr, -s / 2, -s / 2, s, s);
    ctx.restore();
  },
};

/* ---------- src/screen_kitchen.js ---------- */
/* screen_kitchen.js — the kitchen: every station as a big picture to tap. The monster waits at the
   bottom of the screen, watching. */

const STATIONS = [
  ['chop', 'k_board', 'chopping board'], ['blend', 'k_blender', 'blender'], ['burger', 'burger', 'burger'], ['pizza', 'k_pizzaoven', 'pizza'],
  ['dessert', 'sundae', 'ice cream'], ['soup', 'k_pot', 'soup'], ['toaster', 'k_toaster', 'toaster'], ['oven', 'k_oven', 'oven'],
  ['airfryer', 'k_airfryer', 'air fryer'], ['fryer', 'k_deepfryer', 'deep fryer'], ['waffle', 'k_waffle', 'waffle maker'],
  ['micro', 'k_microwave', 'microwave'], ['pan', 'k_pan', 'frying pan'], ['freezer', 'k_freezer', 'freezer'],
];

SCREENS.kitchen = {
  enter(p) {
    this.rec = Store.get(p.id) || Store.data.monsters[0];
    this.mon = new Monster(this.rec);
    this.items = STATIONS.map(([key, pic, name]) => ({ key, pic, name, bounce: 0 }));
    this.finger = null; this.picked = null;
  },
  layout() {
    const { W, H, safe } = G, land = W > H;
    const r = clamp(Math.min(W, H) * 0.055, 26, 40);
    this.buttons = [
      button({ x: safe.l + r + 14, y: safe.t + r + 14, r, icon: 'i_back', col: '#ffcf4a', onTap: () => go('feed', { id: this.rec.id }) }),
    ];
    this.counter = Math.round(H * (land ? 0.62 : 0.64));
    const cols = land ? 7 : 4, rows = Math.ceil(this.items.length / cols);
    const top = safe.t + r * 2 + 30, bottom = H - safe.b - (land ? H * 0.2 : H * 0.17);
    const cw = (W - safe.l - safe.r - 24) / cols, ch = (bottom - top) / rows, s = Math.min(cw, ch) * 0.86;
    this.items.forEach((it, i) => {
      const c = i % cols, rw = Math.floor(i / cols), inRow = Math.min(cols, this.items.length - rw * cols);
      it.x = W / 2 + (c - (inRow - 1) / 2) * cw; it.y = top + rw * ch + ch * 0.55; it.s = s;
    });
    // shelves for any row standing above the counter
    this.shelves = [];
    for (let rw = 0; rw < rows; rw++) { const y = top + rw * ch + ch * 0.55 + s * 0.45; if (y < this.counter - 20) this.shelves.push({ y, x0: safe.l + 10, x1: W - safe.r - 10 }); }
    // the monster waits underneath, if there is room
    const m = this.mon, room = H - safe.b - (top + rows * ch);
    this.showMon = room > 90;
    m.scale = clamp(room / 330, 0.25, 0.55); m.x = safe.l + 24 + 110 * m.scale; m.y = H - safe.b - 6;
  },
  hit(x, y) { return this.items.find(it => Math.abs(x - it.x) < it.s * 0.55 && Math.abs(y - it.y) < it.s * 0.55); },
  down(p) {
    this.finger = p;
    const it = this.hit(p.x, p.y);
    if (it && !this.picked) {
      this.picked = it; it.bounce = 1;
      SFX.play('pop', { f: 500 + this.items.indexOf(it) * 30 }); Say.say(it.name);
      goLater(380, it.key, { id: this.rec.id });
    } else if (this.showMon && this.mon.hit(p.x, p.y) && !this.mon.busy) this.mon.play(tickle(this.mon));
  },
  move(p) { this.finger = p; },
  up() { this.finger = null; },
  update(dt) {
    this.items.forEach(it => { it.bounce = Math.max(0, it.bounce - dt * 2.5); });
    this.mon.lookAt = this.finger || (this.picked ? { x: this.picked.x, y: this.picked.y } : null);
    this.mon.update(dt);
  },
  draw(ctx) {
    const { W, H } = G;
    Backdrops.draw(ctx, 'bg_kitchen', W, H, this.counter);
    this.shelves.forEach(S => {
      ctx.fillStyle = 'rgba(80,40,10,0.18)'; ctx.fillRect(S.x0, S.y + 14, S.x1 - S.x0, 10);
      ctx.beginPath(); rrect(ctx, S.x0, S.y - 2, S.x1 - S.x0, 16, 6); ctx.fillStyle = '#d9a46a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#8a5a2a'; ctx.stroke();
      ctx.fillStyle = 'rgba(255,240,210,0.6)'; ctx.fillRect(S.x0 + 6, S.y + 1, S.x1 - S.x0 - 12, 3);
    });
    this.items.forEach((it, i) => {
      const b = Math.sin(it.bounce * Math.PI), idle = Math.sin(G.t * 2 + i) * 0.02;
      ctx.fillStyle = 'rgba(60,30,20,0.18)'; ctx.beginPath(); ctx.ellipse(it.x, it.y + it.s * 0.45, it.s * 0.36, it.s * 0.07, 0, 0, TAU); ctx.fill();
      Art.blit(ctx, it.pic, it.x, it.y - b * it.s * 0.15, it.s * (0.92 + b * (b ? 0.12 : 0)), idle);
    });
    Parts.draw(ctx, 0); if (this.showMon) this.mon.draw(ctx); Parts.draw(ctx, 1);
  },
};

/* ---------- src/stations_cook.js ---------- */
/* stations_cook.js — the cooking machines. Each takes one food: drag it in or tap it in the pantry,
   tap the machine to start, and it comes out cooked (tap it again to cook it again). The tick, or a
   tap on the cooked food, serves it to the monster. What each machine looks like and does while it
   cooks is its own code below; the shared part only handles fingers, the pantry and timing. */

const CookBase = {
  enter(p) {
    this.rec = Store.get(p.id) || Store.data.monsters[0];
    this.pantry = this.pantry || new Pantry({});
    this.item = null;          // { id, cook: [...], spr } inside the machine
    this.state = 'empty';      // empty, loaded, cooking, done
    this.t = 0; this.held = null; this.fly = null; this.loop = null; this.v = {};
    if (this.cfg.reset) this.cfg.reset(this);
  },
  exit() { if (this.loop) { this.loop.stop(); this.loop = null; } },
  layout() {
    const { W, H, safe } = G, land = W > H, cfg = this.cfg;
    const r = clamp(Math.min(W, H) * 0.055, 26, 40);
    this.buttons = [button({ x: safe.l + r + 14, y: safe.t + r + 14, r, icon: 'i_back', col: '#ffcf4a', onTap: () => go('kitchen', { id: this.rec.id }) })];
    this.serveBtn = button({ r: r * 1.25, icon: 'i_tick', col: '#ffffff', pulse: 1, hidden: this.state !== 'done', onTap: () => this.serve() });
    this.buttons.push(this.serveBtn);
    let ax0, ax1, top, bottom;
    if (land) {
      const px = Math.round(W * 0.53);
      this.pantry.layout(px, safe.t + 12, W - px - safe.r - 12, H - safe.t - safe.b - 24);
      this.counter = Math.round(H * 0.74); ax0 = safe.l + 10; ax1 = px - 10; top = safe.t + r * 2 + 30; bottom = this.counter;
      this.serveBtn.x = px - this.serveBtn.r - 18; this.serveBtn.y = H - safe.b - this.serveBtn.r - 16;
    } else {
      const py = Math.round(H * 0.55);
      this.pantry.layout(safe.l + 10, py, W - safe.l - safe.r - 20, H - py - safe.b - 10);
      this.counter = py - 18; ax0 = safe.l + 10; ax1 = W - safe.r - 10; top = safe.t + r * 2 + 30; bottom = this.counter;
      this.serveBtn.x = W - safe.r - this.serveBtn.r - 16; this.serveBtn.y = safe.t + this.serveBtn.r + 14;
    }
    const aw = ax1 - ax0, ah = bottom - top, asp = cfg.pic ? Art.aspect(cfg.pic) : (cfg.aspect || 1);
    let h = Math.min(ah * (cfg.fill || 0.8), aw * 0.72 / asp);
    const w = h * asp;
    this.A = { x: (ax0 + ax1) / 2 - w / 2, y: bottom - h - (cfg.lift || 0) * h, w, h, cx: (ax0 + ax1) / 2 };
    Parts.floor = this.counter;
  },
  // a point inside the machine's picture, as fractions of its box
  at(fx, fy) { const A = this.A; return [A.x + A.w * fx, A.y + A.h * fy]; },
  overMachine(x, y) { const A = this.A; return x > A.x - 30 && x < A.x + A.w + 30 && y > A.y - 40 && y < A.y + A.h + 20; },
  load(id, fromX, fromY) {
    if (this.state === 'cooking') return;
    const spr = Art.sprite(FOODS[id].pic, 256);
    this.fly = { id, spr, x0: fromX, y0: fromY, t: 0 };
    SFX.play('whoosh', { dur: 0.25 });
  },
  landed(id, spr) {
    if (this.state === 'cooking') { SFX.play('boing', { f: 180 }); return; }   // the machine is busy: it bounces off
    this.item = { id, cook: [], spr };
    this.state = 'loaded'; this.t = 0;
    SFX.play('plop');
    if (this.cfg.loaded) this.cfg.loaded(this);
  },
  start() {
    if ((this.state !== 'loaded' && this.state !== 'done') || this.fly) return;
    if (this.loop) { this.loop.stop(); this.loop = null; }
    this.state = 'cooking'; this.t = 0; this.serveBtn.hidden = true;
    this.raw = this.item.spr;
    this.cooked = cookSprite(this.item.spr, this.cfg.cook, 3 + this.item.cook.length);
    Say.say(this.cfg.say || '');
    this.cfg.start(this);
  },
  finish() {
    this.item.cook.push(this.cfg.cook);
    this.item.spr = this.cooked;
    this.state = 'done'; this.t = 0; this.serveBtn.hidden = false;
    if (this.loop) { this.loop.stop(); this.loop = null; }
    this.cfg.done(this);
  },
  serve() {
    if (this.state !== 'done') return;
    const S = servingOf(this.item.id, this.item.cook);
    S.spr = this.item.spr; S.name = (COOK[this.cfg.cook] ? COOK[this.cfg.cook].name + ' ' : '') + FOODS[this.item.id].name;
    SFX.play('sparkle');
    go('feed', { id: this.rec.id, dish: S });
  },
  down(p) {
    const h = this.pantry.hit(p.x, p.y);
    if (h) {
      if (h.tab !== undefined) this.pantry.tapTab(h.tab);
      else if (h.arrow) this.pantry.turn(h.arrow);
      else if (h.food && this.state !== 'cooking' && !this.held) { this.held = { id: h.food, x: p.x, y: p.y, x0: p.x, y0: p.y, ptr: p.id, s: h.s, tile: [h.x, h.y] }; Say.say(FOODS[h.food].name); this.pantry.poke(h.food); SFX.play('pop', { f: 700 }); }
      return;
    }
    if (this.cfg.tap && this.cfg.tap(this, p)) return;
    if (this.overMachine(p.x, p.y)) {
      if (this.state === 'loaded' || this.state === 'done') {
        if (this.state === 'done' && this.cfg.serveTap && this.cfg.serveTap(this, p)) { this.serve(); return; }
        this.start();
      } else if (this.state === 'empty') { SFX.play('boing', { f: 200 }); if (this.cfg.poke) this.cfg.poke(this); }
    }
  },
  move(p) { const H = this.held; if (H && H.ptr === p.id) { H.x = p.x; H.y = p.y; if (dist(p.x, p.y, H.x0, H.y0) > 14) H.moved = true; } },
  up(p) {
    const H = this.held;
    if (!H || H.ptr !== p.id) return;
    this.held = null;
    if (!H.moved || this.overMachine(p.x, p.y)) this.load(H.id, H.x, H.y);
  },
  update(dt) {
    this.t += dt;
    this.pantry.update(dt);
    if (this.fly) {
      const F = this.fly, [tx, ty] = this.cfg.loadPoint(this);
      F.t += dt; const u = Math.min(1, F.t / 0.45);
      F.x = lerp(F.x0, tx, u); F.y = lerp(F.y0, ty, u) - Math.sin(u * Math.PI) * 140;
      if (u >= 1) { this.fly = null; this.landed(F.id, F.spr); }
    }
    if (this.state === 'cooking') { this.cfg.cooking(this, dt); if (this.t >= this.cfg.time && !this.cfg.manual) this.finish(); }
    if (this.cfg.update) this.cfg.update(this, dt);
  },
  draw(ctx) {
    const { W, H } = G;
    Backdrops.draw(ctx, 'bg_kitchen', W, H, this.counter);
    ctx.fillStyle = 'rgba(70,35,15,0.2)'; ctx.beginPath(); ctx.ellipse(this.A.cx, this.counter + 4, this.A.w * 0.55, this.A.w * 0.06, 0, 0, TAU); ctx.fill();
    Parts.draw(ctx, 0);
    this.cfg.draw(this, ctx);
    Parts.draw(ctx, 1);
    if (this.fly) { const F = this.fly, s = 110; ctx.drawImage(F.spr, F.x - s / 2, F.y - s / 2, s, s); }
    this.pantry.draw(ctx);
  },
  drawOver(ctx) {
    const H = this.held;
    if (!H) return;
    const s = H.s * 1.25; ctx.save(); ctx.translate(H.x, H.y); ctx.rotate(Math.sin(G.t * 12) * 0.08);
    Art.draw(ctx, FOODS[H.id].pic, 0, 0, s); ctx.restore();
  },
};
function makeCookStation(key, cfg) { SCREENS[key] = Object.assign(Object.create(CookBase), { key, cfg }); }
// the food, fading from raw to cooked as it cooks
function drawCooking(st, ctx, x, y, s, rot) {
  if (!st.item) return;
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  if (st.state === 'cooking') {
    const k = clamp(st.t / st.cfg.time, 0, 1);
    ctx.drawImage(st.raw, -s / 2, -s / 2, s, s);
    ctx.globalAlpha = k; ctx.drawImage(st.cooked, -s / 2, -s / 2, s, s);
  } else ctx.drawImage(st.item.spr, -s / 2, -s / 2, s, s);
  ctx.restore();
}
function steamFrom(x, y, s, n = 1) { for (let i = 0; i < n; i++) Parts.add('puff', x + rand(-s, s) * 0.4, y, { size: rand(8, 14), grow: 2.4, vy: -rand(70, 130), vx: rand(-25, 25), life: rand(0.8, 1.3), col: '#ffffff', alpha: 0.65 }); }

/* ---------- toaster: the slice sinks, the slots glow, DING, it pops sky high ---------- */
makeCookStation('toaster', {
  pic: 'k_toaster', cook: 'toast', time: 2.6, say: 'toasting', fill: 0.62,
  loadPoint: st => st.at(0.48, 0.0),
  reset: st => { st.v.sink = 0; st.v.pop = null; },
  loaded: st => { st.v.sink = 0; },
  start: st => { SFX.play('clunk'); st.v.sink = 0; },
  cooking: (st, dt) => {
    st.v.sink = Math.min(1, st.v.sink + dt / 0.25);
    if (Math.floor(st.t * 4) !== Math.floor((st.t - dt) * 4)) SFX.play('tick');
    if (Math.random() < dt * 6) { const [x, y] = st.at(rand(0.3, 0.7), 0.02); Parts.add('stink', x, y, { size: 6, col: 'rgba(255,170,90,0.6)', vy: -40, life: 0.8 }); }
  },
  done: st => {
    SFX.play('ding'); SFX.play('spring');
    st.v.pop = { y: 0, vy: -1100, rot: 0 };
    const [x, y] = st.at(0.48, 0.05);
    Parts.burst('crumb', x, y, 8, { ang: -Math.PI / 2, spread: 1.6, v0: 150, v1: 350, g: 1200, sizeR: [3, 6], lifeR: [0.8, 1.3], col: '#c8823a', bounce: 0.3, vr: 8 });
  },
  update: (st, dt) => {
    const P = st.v.pop;
    if (P) { P.vy += 2400 * dt; P.y += P.vy * dt; P.rot += dt * 9; if (P.y >= 0 && P.vy > 0) { P.y = 0; P.vy = 0; st.v.pop = null; SFX.play('thud'); } }
  },
  serveTap: () => true,
  draw: (st, ctx) => {
    const A = st.A, s = A.w * 0.58, slotY = A.y + A.h * 0.1, sx = A.x + A.w * 0.48;
    Art.blit(ctx, 'k_toaster', A.x + A.w / 2, A.y + A.h / 2, Math.max(A.w, A.h));
    if (st.state === 'cooking') {   // the slots glow red-hot
      const g = 0.5 + Math.sin(st.t * 10) * 0.2;
      ctx.save(); ctx.globalAlpha = g; ctx.fillStyle = '#ff6a1a';
      ctx.beginPath(); ctx.ellipse(sx, A.y + A.h * 0.075, A.w * 0.24, A.h * 0.025, -0.05, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sx + 2, A.y + A.h * 0.125, A.w * 0.24, A.h * 0.022, -0.05, 0, TAU); ctx.fill();
      ctx.restore();
      st.A.shake = Math.sin(st.t * 40) * 1.5;
    }
    if (!st.item) return;
    // the slice: above the slot only (the rest is inside the toaster)
    const P = st.v.pop, popY = P ? P.y : 0, sink = st.state === 'cooking' ? st.v.sink : 0;
    const cy = slotY - s * 0.32 + sink * s * 0.5 + popY;
    ctx.save();
    if (!P || popY > -s * 0.2) { ctx.beginPath(); ctx.rect(A.x - 200, -1e4, A.w + 400, slotY + 1e4); ctx.clip(); }
    drawCooking(st, ctx, sx, cy, s, P ? P.rot : 0);
    ctx.restore();
  },
});

/* ---------- oven: inside, behind glass; it browns while you watch ---------- */
makeCookStation('oven', {
  pic: 'k_oven', cook: 'bake', time: 3.4, say: 'baking', fill: 0.86,
  loadPoint: st => st.at(0.5, 0.66),
  start: st => { SFX.play('door'); SFX.play('click'); st.loop = SFX.play('hum', { f: 70, lp: 300, vol: 0.08 }); },
  cooking: (st, dt) => {
    if (Math.floor(st.t * 3) !== Math.floor((st.t - dt) * 3)) SFX.play('tick');
    if (Math.random() < dt * 5) { const [x, y] = st.at(rand(0.2, 0.8), 0.0); Parts.add('stink', x, y, { size: 7, col: 'rgba(255,190,120,0.5)', vy: -50, life: 1 }); }
  },
  done: st => { SFX.play('ding'); SFX.play('door'); const [x, y] = st.at(0.5, 0.5); steamFrom(x, y, st.A.w * 0.5, 6); },
  update: (st, dt) => { if (st.state === 'done' && st.t < 3 && Math.random() < dt * 4) { const [x, y] = st.at(0.5, 0.52); steamFrom(x, y, st.A.w * 0.4); } },
  serveTap: () => true,
  draw: (st, ctx) => {
    const A = st.A;
    Art.blit(ctx, 'k_oven', A.x + A.w / 2, A.y + A.h / 2, Math.max(A.w, A.h));
    const x0 = A.x + A.w * 0.17, x1 = A.x + A.w * 0.83, y0 = A.y + A.h * 0.465, y1 = A.y + A.h * 0.825, cooking = st.state === 'cooking';
    // the oven's inside, lit
    ctx.save();
    ctx.beginPath(); rrect(ctx, x0, y0, x1 - x0, y1 - y0, A.w * 0.03); ctx.clip();
    const g = ctx.createRadialGradient((x0 + x1) / 2, y1, 4, (x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0) * 0.7);
    if (cooking) { const f = 0.85 + Math.sin(st.t * 18) * 0.08; g.addColorStop(0, rgba('#ffd27a', f)); g.addColorStop(1, '#a8401a'); }
    else { g.addColorStop(0, '#5a4a40'); g.addColorStop(1, '#2a2020'); }
    ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = cooking ? '#ffb070' : '#7a6a60'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y0 + (y1 - y0) * 0.72); ctx.lineTo(x1, y0 + (y1 - y0) * 0.72); ctx.stroke();
    if (cooking) { ctx.strokeStyle = '#ff5a1a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x0 + 6, y1 - 6); for (let x = x0 + 6; x < x1 - 6; x += 14) ctx.lineTo(x + 7, y1 - (Math.floor((x - x0) / 14) % 2 ? 10 : 4)); ctx.stroke(); }
    if (st.item) drawCooking(st, ctx, (x0 + x1) / 2, y0 + (y1 - y0) * 0.5, (y1 - y0) * 1.0);
    // the glass, shut while cooking
    if (cooking) { ctx.fillStyle = 'rgba(160,200,230,0.18)'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x0 + (x1 - x0) * 0.15, y1); ctx.lineTo(x0 + (x1 - x0) * 0.4, y0); ctx.stroke(); }
    ctx.restore();
  },
});

/* ---------- air fryer: the drawer pulls out to load, whirrs shut, pops out crispy ---------- */
makeCookStation('airfryer', {
  pic: 'k_airfryer', cook: 'airfry', time: 2.8, say: 'air frying', fill: 0.78, lift: 0.12,
  loadPoint: st => st.at(0.5, 0.86),
  reset: st => { st.v.open = 1; },
  start: st => { SFX.play('clunk'); st.loop = SFX.play('hum', { f: 140, lp: 900, vol: 0.09 }); },
  cooking: (st, dt) => {
    st.v.open = Math.max(0, st.v.open - dt / 0.25);
    if (Math.random() < dt * 8) { const [x, y] = st.at(rand(0.25, 0.75), 0.02); Parts.add('puff', x, y, { size: 6, grow: 2, vy: -90, vx: rand(-20, 20), life: 0.7, col: '#ffffff', alpha: 0.45 }); }
  },
  done: st => { SFX.play('beep', { n: 3 }); SFX.play('clunk'); st.v.opening = true; },
  update: (st, dt) => { if (st.v.opening) { st.v.open = Math.min(1, st.v.open + dt / 0.3); if (st.v.open >= 1) st.v.opening = false; } if (st.state === 'loaded') st.v.open = 1; },
  serveTap: () => true,
  draw: (st, ctx) => {
    const A = st.A, o = st.v.open;
    ctx.save();
    if (st.state === 'cooking') ctx.translate(Math.sin(st.t * 50) * 1.2, 0);
    Art.blit(ctx, 'k_airfryer', A.x + A.w / 2, A.y + A.h / 2, Math.max(A.w, A.h));
    // the dial spins while it runs
    const [dx, dy] = st.at(0.5, 0.365), rr = A.w * 0.075, ang = st.state === 'cooking' ? -st.t * 3 : 0;
    ctx.strokeStyle = '#ff5a3a'; ctx.lineWidth = Math.max(3, A.w * 0.018); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + Math.sin(ang) * rr, dy - Math.cos(ang) * rr); ctx.stroke();
    // the drawer, pulled out towards you with the food in its basket
    if (o > 0.02) {
      const w = A.w * (0.86 + 0.12 * o), h = A.h * 0.42, x = A.cx - w / 2, y = A.y + A.h * (0.55 + 0.22 * o);
      ctx.beginPath(); ctx.ellipse(A.cx, y + 4, w * 0.44, h * 0.2, 0, 0, TAU); ctx.fillStyle = '#1e1e22'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.strokeStyle = 'rgba(120,120,130,0.6)'; ctx.lineWidth = 1.5;
      for (let i = -4; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(A.cx + i * w * 0.09, y - h * 0.15); ctx.lineTo(A.cx + i * w * 0.09, y + h * 0.18); ctx.stroke(); }
      if (st.item) drawCooking(st, ctx, A.cx, y - h * 0.08, A.w * 0.5);
      ctx.beginPath(); rrect(ctx, x, y + h * 0.1, w, h * 0.78, h * 0.25);
      const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#4a4a52'); g.addColorStop(1, '#1e1e24'); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#120c10'; ctx.stroke();
      ctx.beginPath(); rrect(ctx, A.cx - w * 0.07, y + h * 0.22, w * 0.14, h * 0.5, w * 0.05); ctx.fillStyle = '#e8e8ec'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.restore();
  },
});

/* ---------- deep fryer: the basket goes down into bubbling oil and comes up golden ---------- */
makeCookStation('fryer', {
  pic: 'k_deepfryer', cook: 'fry', time: 3.0, say: 'frying', fill: 0.7, lift: 0.04,
  loadPoint: st => st.at(0.5, -0.1),
  reset: st => { st.v.down = 0; },
  start: st => { SFX.play('splash', { vol: 0.5 }); st.loop = SFX.play('bubbling', { oil: true }); SFX.play('sizzle', { dur: 1.2 }); },
  cooking: (st, dt) => {
    st.v.down = Math.min(1, st.v.down + dt / 0.35);
    const [ox, oy] = st.at(0.5, 0.3);
    if (Math.random() < dt * 22) Parts.add('bubble', ox + rand(-0.32, 0.32) * st.A.w, oy + rand(-4, 6), { size: rand(4, 9), vy: -rand(20, 60), life: rand(0.3, 0.6), col: '#ffd76a' });
    if (Math.random() < dt * 6) Parts.add('drop', ox + rand(-0.3, 0.3) * st.A.w, oy, { size: 3, col: '#ffcf4a', vx: rand(-120, 120), vy: -rand(200, 380), g: 1300, life: 0.8, edge: false });
    if (Math.random() < dt * 4) steamFrom(ox, oy - 10, st.A.w * 0.5);
  },
  done: st => { SFX.play('ding'); st.v.lifting = true; },
  update: (st, dt) => {
    if (st.v.lifting) { st.v.down = Math.max(0, st.v.down - dt / 0.35); if (st.v.down <= 0) { st.v.lifting = false; SFX.play('swish'); const [x, y] = st.at(0.5, 0.05); Parts.burst('drop', x, y, 6, { ang: Math.PI / 2, spread: 1.2, v0: 40, v1: 120, g: 1100, sizeR: [3, 5], lifeR: [0.6, 1], col: '#ffcf4a' }); } }
  },
  serveTap: () => true,
  draw: (st, ctx) => {
    const A = st.A, d = st.v.down, oilY = A.y + A.h * 0.3;
    Art.blit(ctx, 'k_deepfryer', A.x + A.w / 2, A.y + A.h / 2, Math.max(A.w, A.h));
    // the oil, shining, bubbling hard when hot
    ctx.save();

    // the basket and its food, clipped where it dips under the oil

    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(60,60,70,0.7)';

/* ---------- waffle maker: the lid comes down, steam squeezes out, a waffle in the food's colours ---------- */
makeCookStation('waffle', {
  aspect: 1.25, cook: 'waffle', time: 2.6, say: 'waffles', fill: 0.62,
  loadPoint: st => [st.A.cx, st.A.y + st.A.h * 0.66],
  reset: st => { st.v.lid = 0; },
  start: st => { SFX.play('clunk'); },
  cooking: (st, dt) => {
    const was = st.v.lid; st.v.lid = Math.min(1, st.v.lid + dt / 0.35);
    if (was < 1 && st.v.lid >= 1) { SFX.play('squish'); SFX.play('sizzle', { dur: 1.4 }); }
    if (st.v.lid >= 1 && Math.random() < dt * 10) { const s = Math.random() < 0.5 ? -1 : 1; steamFrom(st.A.cx + s * st.A.w * 0.42, st.A.y + st.A.h * 0.6, 20); }
  },
  done: st => { SFX.play('ding'); st.v.opening = true; },
  update: (st, dt) => { if (st.v.opening) { st.v.lid = Math.max(0, st.v.lid - dt / 0.4); if (st.v.lid <= 0) st.v.opening = false; } },
  serveTap: () => true,
  draw: (st, ctx) => {
    const A = st.A, cx = A.cx, by = A.y + A.h * 0.7, rx = A.w * 0.44, ry = A.h * 0.17, L = '#120c10';
    const grid = (x, y, ax, ay) => {
      ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, ax * 0.86, ay * 0.86, 0, 0, TAU); ctx.clip();
      ctx.fillStyle = '#3a3a42'; ctx.fillRect(x - ax, y - ay, ax * 2, ay * 2);
      ctx.fillStyle = '#26262c';
      for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) { ctx.beginPath(); rrect(ctx, x + i * ax * 0.26 - ax * 0.1, y + j * ay * 0.26 - ay * 0.1, ax * 0.2, ay * 0.2, 3); ctx.fill(); }
      ctx.restore();
    };
    const lid = st.v.lid;
    // the lid when it is up stands behind the base
    const lidUp = lid < 0.5, ly = lerp(by - ry * 2.3, by - ry * 0.25, Ease.inOut(lid)), lry = lerp(ry * 2.1, ry * 1.05, Ease.inOut(lid));
    const drawLid = () => {
      ctx.beginPath(); ctx.ellipse(cx, ly, rx, lry, 0, 0, TAU);
      const g = ctx.createLinearGradient(0, ly - lry, 0, ly + lry); g.addColorStop(0, '#5a5a64'); g.addColorStop(1, '#25252b'); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = L; ctx.stroke();
      if (lidUp) grid(cx, ly, rx, lry);
      else { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.ellipse(cx - rx * 0.3, ly - lry * 0.4, rx * 0.35, lry * 0.25, -0.2, 0, TAU); ctx.fill(); }
      ctx.beginPath(); ctx.arc(cx, ly - lry * 0.9, A.w * 0.025, 0, TAU); ctx.fillStyle = st.state === 'cooking' ? '#ff3a2a' : '#7a2a2a'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    };
    if (lidUp) drawLid();
    // the base
    ctx.beginPath(); ctx.ellipse(cx, by + ry * 0.35, rx * 1.04, ry * 1.25, 0, 0, TAU); ctx.fillStyle = '#1c1c22'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = L; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, by, rx, ry, 0, 0, TAU); ctx.fillStyle = '#4a4a52'; ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
    grid(cx, by, rx, ry);
    if (st.item && lid < 0.95) drawCooking(st, ctx, cx, by - ry * 0.3, A.w * 0.45);

});

  done: st => { SFX.play('ding'); },
  update: (st, dt) => { const F = st.v.flip; if (F) { F.t += dt; if (F.t >= 0.7) { st.v.flip = null; st.v.flips++; SFX.play('sizzle', { dur: 0.6 }); SFX.play('thud'); } } },

        ctx.beginPath(); ctx.moveTo(fx - 2.5, fy); ctx.quadraticCurveTo(fx, fy - h, fx + 2.5, fy); ctx.fillStyle = '#d8f0ff'; ctx.fill();
      }

    Art.blit(ctx, 'k_pan', A.x + A.w / 2, A.y + A.h / 2, Math.max(A.w, A.h));
    if (!st.item) return;
    const F = st.v.flip, s = A.w * 0.4;
    let y = py, rot = 0;
    if (F) { const u = F.t / 0.7; y = py - Math.sin(u * Math.PI) * A.h * 1.1; rot = u * TAU; }

/* ---------- src/stations_prep.js ---------- */
/* stations_prep.js — the stations where food is put together: the chopping board, the blender,
   the soup pot, the burger bar, the pizza and the dessert bar. Each makes a dish (a serving with
   several parts) and sends it to the monster. */

// shared furniture: back and tick buttons, a bin, the picker and the working area
function prepLayout(st, o = {}) {
  const { W, H, safe } = G, land = W > H;
  const r = clamp(Math.min(W, H) * 0.055, 26, 40);
  st.buttons = [button({ x: safe.l + r + 14, y: safe.t + r + 14, r, icon: 'i_back', col: '#ffcf4a', onTap: () => go('kitchen', { id: st.rec.id }) })];
  st.serveBtn = button({ r: r * 1.25, icon: 'i_tick', col: '#ffffff', pulse: 1, hidden: !st.ready, onTap: () => st.serve() });
  st.buttons.push(st.serveBtn);
  if (o.bin) { st.binBtn = button({ x: safe.l + r * 3.5 + 14, y: safe.t + r + 14, r, icon: 'i_bin', col: '#d8f0c8', onTap: () => st.clear() }); st.buttons.push(st.binBtn); }
  let work;
  if (land) {
    const px = Math.round(W * (o.pickerAt || 0.55));
    st.pantry.layout(px, safe.t + 12, W - px - safe.r - 12, H - safe.t - safe.b - 24);
    work = { x0: safe.l + 10, y0: safe.t + r * 2 + 24, x1: px - 10, y1: H - safe.b - 10 };
    st.serveBtn.x = px - st.serveBtn.r - 16; st.serveBtn.y = H - safe.b - st.serveBtn.r - 14;
  } else {
    const py = Math.round(H * (o.pickerAtV || 0.57));
    st.pantry.layout(safe.l + 10, py, W - safe.l - safe.r - 20, H - py - safe.b - 10);
    work = { x0: safe.l + 10, y0: safe.t + r * 2 + 24, x1: W - safe.r - 10, y1: py - 10 };
    st.serveBtn.x = W - safe.r - st.serveBtn.r - 14; st.serveBtn.y = safe.t + st.serveBtn.r + 14;
  }
  work.w = work.x1 - work.x0; work.h = work.y1 - work.y0; work.cx = (work.x0 + work.x1) / 2; work.cy = (work.y0 + work.y1) / 2;
  st.work = work; st.land = land;
  return work;
}
function setReady(st, on) { st.ready = on; if (st.serveBtn) st.serveBtn.hidden = !on; }
// a picker tap or drag, shared by every prep station: returns true when the finger was in the picker
function pickerDown(st, p) {
  const h = st.pantry.hit(p.x, p.y);
  if (!h) return false;
  if (h.tab !== undefined) st.pantry.tapTab(h.tab);
  else if (h.arrow) st.pantry.turn(h.arrow);
  else if (h.food && !st.held) { st.held = { id: h.food, x: p.x, y: p.y, x0: p.x, y0: p.y, ptr: p.id, s: h.s }; Say.say(FOODS[h.food].name); st.pantry.poke(h.food); SFX.play('pop', { f: 700 }); }
  return true;
}
function pickerMove(st, p) { const H = st.held; if (H && H.ptr === p.id) { H.x = p.x; H.y = p.y; if (dist(p.x, p.y, H.x0, H.y0) > 14) H.moved = true; return true; } return false; }
function drawPicked(st, ctx) {
  const H = st.held; if (!H) return;
  ctx.save(); ctx.translate(H.x, H.y); ctx.rotate(Math.sin(G.t * 12) * 0.08); Art.draw(ctx, FOODS[H.id].pic, 0, 0, H.s * 1.25); ctx.restore();
}
function sendDish(st, S) { SFX.play('sparkle'); go('feed', { id: st.rec.id, dish: S }); }
// a picture of a finished dish, for the monster to eat: draw(ctx, size) fills a square canvas
function dishSprite(draw, px = 256) { const c = makeCanvas(px, px); draw(c.getContext('2d'), px); return c; }

/* =================== the chopping board: swipe to slice =================== */
// A piece of food is the part of its picture inside a convex polygon, in the picture's own units (a
// 256 square). A swipe across a piece's food cuts that piece along the swipe: the two halves slide
// apart and tip a little, each showing the inside of the food and an outline along its cut, so they
// lie on the board as separate pieces. A piece's pivot P (its middle) is drawn at (ox, oy).
const CHOP_U = 256;
SCREENS.chop = {
  enter(p) {
    this.rec = Store.get(p.id) || Store.data.monsters[0];
    this.pantry = this.pantry || new Pantry({});
    this.pieces = []; this.foods = []; this.held = null; this.knife = null; this.ready = false;
  },
  layout() {
    const w = prepLayout(this, { bin: true }), old = this.board, oldSize = this.size;
    const bw = Math.min(w.w * 0.92, w.h * 1.35), bh = Math.min(w.h * 0.86, bw * 0.72);
    const b = this.board = { x: w.cx - bw / 2, y: w.cy - bh / 2 + 10, w: bw, h: bh };
    this.size = Math.min(bw, bh) * 0.62;
    // the screen turned: the pieces keep their places on the board, drawn afresh at their new size
    if (old && this.pieces.length) {
      const f = this.size / oldSize;
      this.pieces.forEach(pc => { pc.ox = b.x + b.w / 2 + (pc.ox - old.x - old.w / 2) * f; pc.oy = b.y + b.h / 2 + (pc.oy - old.y - old.h / 2) * f; pc.k *= f; pieceImage(pc); });
    }
  },
  clear() { this.pieces = []; this.foods = []; setReady(this, false); SFX.play('swish'); },
  // put a whole food on the board: one piece, the whole square of its picture
  add(id) {
    if (this.foods.length >= 3) { this.pieces = this.pieces.filter(pc => pc.id !== this.foods[0]); this.foods.shift(); }
    const b = this.board, n = this.foods.length, s = this.size * (n ? 0.8 : 1);
    const px = n === 0 ? b.x + b.w / 2 : b.x + b.w * (n === 1 ? 0.27 : 0.73), py = b.y + b.h * 0.5;
    this.foods.push(id);
    const pc = chopPiece(id, [[0, 0], [CHOP_U, 0], [CHOP_U, CHOP_U], [0, CHOP_U]], [], px, py, s / CHOP_U, 0);
    pc.drop = 1;
    this.pieces.push(pc);
    SFX.play('plop'); Say.say(FOODS[id].name);
  },
  // the blade is at (x, y): note, in each piece's own picture, the first and the last food it has
  // touched; once it leaves the piece, cut from the one to the other (gaps in a bunch of grapes, or
  // round a banana's curve, are all one cut)
  stroke(x, y) {
    this.pieces.slice().forEach(pc => {
      if (this.pieces.indexOf(pc) < 0) return;

/* ---------- src/stations_build.js ---------- */
/* stations_build.js — building food: the burger bar (layers dropped onto a wobbly stack), the
   pizza (sauce, then cheese and toppings in any order, into the oven, then the cutter) and the
   dessert bar (a cone, a sundae glass, a cupcake or a cake, piled with scoops and toppings that a
   finger can move about). */

/* =================== burger bar =================== */
const BURGER_LAYERS = ['b_patty', 'b_cheese', 'b_lettuce', 'b_tomato', 'b_onion', 'b_pickles', 'b_bacon', 'b_egg', 'b_ketchup', 'b_mustard', 'b_jalapeno', 'b_pineapple', 'b_avocado', 'b_chicken', 'b_buntop'];
// the ones painted from above lie flatter in a stack
const FLAT_LAYER = { b_lettuce: 0.5, b_tomato: 0.5, b_onion: 0.5, b_pickles: 0.5, b_egg: 0.5, b_ketchup: 0.6, b_mustard: 0.6, b_jalapeno: 0.5, b_pineapple: 0.45, b_avocado: 0.55 };
const LAYER_SOUND = { b_patty: 'thud', b_chicken: 'thud', b_buntop: 'thud', b_cheese: 'squish', b_ketchup: 'squish', b_mustard: 'squish', b_egg: 'squish', b_avocado: 'squish', b_bacon: 'squish', b_lettuce: 'crinkle', b_onion: 'crinkle' };
function layerH(id, w) { return (w / Art.aspect(id)) * (FLAT_LAYER[id] || 1); }

SCREENS.burger = {
  enter(p) {
    this.rec = Store.get(p.id) || Store.data.monsters[0];
    this.pantry = this.pantry || new Pantry({ lists: [{ icon: 'burger', ids: BURGER_LAYERS }] });
    this.stack = ['b_bunbottom']; this.fall = null; this.squash = 0; this.ready = false; this.held = null; this.flag = 0;
  },
  layout() {
    const w = prepLayout(this, { bin: true });
    this.bw = Math.min(w.w * 0.62, 340);
    this.base = { x: w.cx, y: w.y1 - w.h * 0.08 };
  },
  // heights of each layer, bottom up, and the y of each one's bottom edge (at scale 1)
  geometry() {
    let y = 0; const out = [];
    this.stack.forEach(id => { const h = layerH(id, this.bw); out.push({ id, y, h }); y += h * (FOODS[id].thick || 0.6); });
    return { layers: out, top: y };
  },
  add(id) {
    if (this.fall) return;
    this.fall = { id, y: -G.H, vy: 0 };
    Say.say(FOODS[id].name);
  },
  clear() {
    const G0 = this.geometry(), k = this.viewK(G0);
    G0.layers.forEach((L, i) => {
      if (!i) return;
      const y = this.base.y - (L.y + L.h / 2) * k;
      Parts.add('sprite', this.base.x, y, { img: Art.sprite(L.id, 192), size: this.bw * k * 0.9, vx: rand(-420, 420), vy: -rand(200, 500), g: 1600, vr: rand(-8, 8), bounce: 0.35, life: 1.8, floor: this.base.y + 10, fade: u => (u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3) });
    });

    this.stack = ['b_bunbottom']; this.flag = 0; setReady(this, false);
  },
  viewK(G0) { const room = this.work.h * 0.8; return Math.min(1, room / Math.max(1, G0.top + 60)); },
  serve() {
    const ids = this.stack.slice();
    const spr = dishSprite((g, px) => {
      const G0 = this.geometry(), hgt = G0.top + 80, k = Math.min(px * 0.9 / this.bw, px * 0.92 / hgt);
      g.translate(px / 2, px * 0.96); g.scale(k, k);
      this.drawStack(g, 0, 0, G0, 0);

    const S = servingOfParts(ids, 'burger', spr, { fx: ids.length >= 4 ? ['bigbite'] : [], name: 'burger' });
    sendDish(this, S);
  },
  down(p) { if (pickerDown(this, p)) return; },
  move(p) { pickerMove(this, p); },
  up(p) { const H = this.held; if (H && H.ptr === p.id) { this.held = null; this.add(H.id); } },
  update(dt) {
    this.pantry.update(dt);

        Parts.burst('crumb', x, y, 5, { ang: -Math.PI / 2, spread: 2, v0: 80, v1: 200, g: 1200, sizeR: [3, 5], lifeR: [0.4, 0.8], col: FOODS[F.id].rgb, bounce: 0.3, floor: this.base.y + 6 });
        if (F.id === 'b_buntop') { setReady(this, true); this.flag = 0; SFX.play('jingle'); Parts.burst('spark', x, y - 40, 10, { v0: 120, v1: 260, sizeR: [6, 11], lifeR: [0.5, 0.9], cols: ['#fff3a0', '#ffffff', '#ffd23f'] }); }
      }
    }

  drawStack(ctx, x, y, G0, wob) {

      Art.drawBase(ctx, L.id, x + sway, y - L.y * sq + L.h * 0.0, this.bw, FLAT_LAYER[L.id] || 1);

  draw(ctx) {

    Backdrops.draw(ctx, 'bg_kitchen', W, H, b.y);
    // the plate
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.fillStyle = 'rgba(70,35,15,0.2)'; ctx.beginPath(); ctx.ellipse(6, 10, this.bw * 0.72, this.bw * 0.13, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, this.bw * 0.7, this.bw * 0.14, 0, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#3a2a4a'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -2, this.bw * 0.5, this.bw * 0.09, 0, 0, TAU); ctx.strokeStyle = '#d8dce8'; ctx.lineWidth = 3; ctx.stroke();

// cheese shreds melted in the oven: one gooey layer with browned spots; the toppings right under it

function drawMeltedCheese(ctx, R, seed, under) {

}

/* =================== dessert bar =================== */
// The base stands on the counter, scoops pile up on it and toppings stick where they are put. A
// finger picks up anything on it: a topping goes wherever it is let go; a scoop goes back into the
// pile at the height it is let go, leaning the way it was moved, and takes its toppings with it
// (each topping is fixed to the scoop or base it sits on).
const DESSERT_BASES = ['d_cone', 'd_glass', 'd_cupcake', 'd_sponge'];
const DESSERT_SCOOPS = ['d_strawberry', 'd_chocolate', 'd_vanilla', 'd_mint', 'd_blueberry', 'd_mango', 'd_cream'];
const DESSERT_TOPS = ['d_sauce', 'd_cherry', 'd_wafer', 'd_flake', 'd_sprinkles'];
// a topping's width (of the dessert's width), and how far below the top of the pile a tapped one's bottom lands
const TOPPING = { d_sauce: [0.78, 0.3], d_sprinkles: [0.55, 0.18], d_cherry: [0.3, 0.08], d_wafer: [0.3, 0.15], d_flake: [0.3, 0.15] };
// each base's outline: fractions of its width across, and of its height up from the counter
const BASE_SHAPE = {
  d_cone: [[-0.48, 1], [0.48, 1], [0.05, 0.03], [-0.05, 0.03]],
  d_glass: [[-0.47, 1], [0.47, 1], [0.3, 0.5], [0.07, 0.4], [0.07, 0.1], [0.3, 0.03], [-0.3, 0.03], [-0.07, 0.1], [-0.07, 0.4], [-0.3, 0.5]],
  d_cupcake: [[-0.48, 0.98], [0.48, 0.98], [0.4, 0.03], [-0.4, 0.03]],
  d_sponge: [[-0.48, 0.95], [0.48, 0.95], [0.48, 0.04], [-0.48, 0.04]],
};
SCREENS.dessert = {
  enter(p) {
    this.rec = Store.get(p.id) || Store.data.monsters[0];
    this.pantry = this.pantry || new Pantry({ lists: [{ icon: 'd_cone', ids: DESSERT_BASES }, { icon: 'd_strawberry', ids: DESSERT_SCOOPS }, { icon: 'd_cherry', ids: DESSERT_TOPS }] });
    this.pantry.tab = 0;
    // scoops: { id, dx: its lean on the one below (of the width), x, y: its bottom middle as it glides }
    // tops: { id, on: the scoop it sits on (null: the base), ox, oy: from that one's top middle, rot }
    this.base = null; this.scoops = []; this.tops = []; this.fall = null; this.moving = null; this.ready = false; this.held = null; this.squash = 0;
  },
  layout() {
    const w = prepLayout(this, { bin: true });
    this.dw = Math.min(w.w * 0.42, w.h * 0.34, 230);
    this.floor = w.y1 - w.h * 0.06; this.cx = w.cx;
  },
  clear() { this.base = null; this.scoops = []; this.tops = []; this.fall = null; this.moving = null; setReady(this, false); SFX.play('swish'); this.pantry.tab = 0; },
  baseW() { return this.dw * (this.base === 'd_cone' ? 0.72 : 1); },
  baseH() { return this.base ? this.baseW() / Art.aspect(this.base) : 0; },
  // how far up the base the first scoop sits
  seat() { const h = this.baseH(), b = this.base; return b === 'd_cone' ? h * 0.86 : b === 'd_glass' ? h * 0.72 : b === 'd_cupcake' ? h * 0.75 : h * 0.85; },
  // where the next scoop's bottom sits (upwards from the floor)
  rim() { return this.seat() + this.scoops.reduce((a, s) => a + this.scoopH(s.id) * 0.6, 0); },
  scoopH(id) { return (this.dw * 0.82) / Art.aspect(id); },
  topW(id) { return this.dw * TOPPING[id][0]; },
  // the middle of the top of the pile
  topX() { return this.cx + this.scoops.reduce((a, s) => a + s.dx, 0) * this.dw; },
  // where each scoop belongs: its bottom middle, leaning with the ones below it
  slots() {
    let h = this.seat(), lean = 0;
    return this.scoops.map(s => {
      const sh = this.scoopH(s.id); lean += s.dx;
      const at = [this.cx + lean * this.dw, this.floor - h + sh * 0.12];
      h += sh * 0.6;
      return at;
    });
  },
  // a scoop as drawn: in the pile it sways a little and squashes for a moment when something lands
  scoopAt(s) {
    const i = this.scoops.indexOf(s);
    return i < 0 ? [s.x, s.y] : [s.x + Math.sin(G.t * 2 + i) * i * 0.8, this.floor - (this.floor - s.y) * (1 - this.squash * 0.06)];
  },
  // the top middle of the scoop (or base) a topping sits on
  anchor(on) {
    if (!on) return [this.cx, this.floor - this.baseH()];
    const [x, y] = this.scoopAt(on);
    return [x, y - this.scoopH(on.id)];
  },
  topPos(t) { const [x, y] = this.anchor(t.on); return [x + t.ox * this.dw, y + t.oy * this.dw]; },
  // the outlines of the dessert's parts, the top one first: each scoop an oval, then the base
  shapes() {
    const out = [];

      for (let k = 0; k < 16; k++) { const a = (k / 16) * TAU; poly.push([x + Math.cos(a) * this.dw * 0.38, y - sh * 0.5 + Math.sin(a) * sh * 0.46]); }
      out.push({ on: s, poly });

    if (this.base) { const w = this.baseW(), h = this.baseH(); out.push({ on: null, poly: BASE_SHAPE[this.base].map(([u, v]) => [this.cx + u * w, this.floor - v * h]) }); }

  // fix a topping, its middle at (x, y), to the part of the dessert under it, or to the nearest edge
  stick(t, x, y) {
    const S = this.shapes();

    if (!hit) {
      let best = Infinity;
      S.forEach(sh => { const q = nearestOnPoly(sh.poly, x, y), d = dist(x, y, q[0], q[1]); if (d < best) { best = d; hit = sh; px = q[0]; py = q[1]; } });

  },
  landSound(id) {
    SFX.play(id === 'd_sauce' ? 'squish' : id === 'd_cherry' ? 'boing' : 'plop', DESSERT_SCOOPS.indexOf(id) >= 0 ? {} : { f: 500 });
    if (id === 'd_cherry') SFX.play('jingle');
  },
  sprinkle(x, y) {
    Parts.burst('confetti', x, y, 30, { ang: Math.PI / 2, spread: 0.9, v0: 40, v1: 160, g: 500, sizeR: [5, 8], lifeR: [0.6, 1], cols: ['#ff5f8f', '#ffd84a', '#4aa7f2', '#69c95c', '#9a6be2', '#ffffff'] });
    SFX.play('crinkle');
  },
  // a tap in the cupboard: a base swaps in, a scoop or topping drops onto the top of the pile
  add(id) {
    if (this.fall) return;
    Say.say(FOODS[id].name);
    if (DESSERT_BASES.indexOf(id) >= 0) { this.base = id; this.scoops = []; this.tops = []; this.moving = null; SFX.play('thud'); setReady(this, true); this.pantry.tab = 1; return; }
    if (!this.base) { this.base = 'd_cone'; setReady(this, true); }
    if (id === 'd_sprinkles') this.sprinkle(this.topX(), this.floor - this.rim() - 120);
    this.fall = { id, y: -G.H * 0.6, vy: 0, dx: DESSERT_SCOOPS.indexOf(id) < 0 && id !== 'd_sauce' ? rand(-0.12, 0.12) : 0 };
  },
  // a topping dragged out of the cupboard goes where it is let go
  put(id, x, y) {
    if (!this.base) { this.base = 'd_cone'; setReady(this, true); }
    const t = { id, rot: id === 'd_wafer' || id === 'd_flake' ? rand(-0.5, 0.5) : 0, pop: 1 };
    this.stick(t, x, y); this.tops.push(t);
