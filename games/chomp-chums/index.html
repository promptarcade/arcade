  },
  // is a finger at (px, py) on topping t? On its paint, not a see-through part of its picture (a
  // cherry showing through the sauce's empty corner is the cherry's); or, loosely, near its middle
  touches(t, px, py, loose) {
    const [x, y] = this.topPos(t), c = Math.cos(t.rot), s = Math.sin(t.rot), lx = (px - x) * c + (py - y) * s, ly = (py - y) * c - (px - x) * s;
    if (loose) return Math.hypot(lx, ly) < 26;
    const w = this.topW(t.id), r = ART[t.id], k = (CHOP_U * 0.96 / Math.max(r[3], r[4])) * r[3] / w, a = foodAlpha(t.id);
    if (!a) return Math.abs(lx) < w / 2 && Math.abs(ly) < w / Art.aspect(t.id) / 2;
    return [[0, 0], [8, 0], [-8, 0], [0, 8], [0, -8]].some(([dx, dy]) => {
      const u = Math.round(CHOP_U / 2 + (lx + dx) * k), v = Math.round(CHOP_U / 2 + (ly + dy) * k);
      return u >= 0 && v >= 0 && u < CHOP_U && v < CHOP_U && a[(v * CHOP_U + u) * 4 + 3] > 40;
    });
  },
  // a finger on the dessert picks up the topping under it (the front one first; failing that one
  // whose middle is near), or else the scoop
  grab(p) {
    const n = this.tops.length;
    for (let j = 2 * n - 1; j >= 0; j--) {
      const i = j % n, t = this.tops[i];
      if (!this.touches(t, p.x, p.y, j < n)) continue;
      const [x, y] = this.topPos(t);
      this.tops.splice(i, 1); this.tops.push(t);   // in front of the others from now on
      t.held = true; this.moving = { t, ptr: p.id, x, y, dx: x - p.x, dy: y - p.y };
      SFX.play('pop', { f: 800 }); Say.say(FOODS[t.id].name);
      return;
    }
    for (let i = this.scoops.length - 1; i >= 0; i--) {
      const s = this.scoops[i], [x, y] = this.scoopAt(s), sh = this.scoopH(s.id), ex = (p.x - x) / (this.dw * 0.41), ey = (p.y - y + sh * 0.5) / (sh * 0.5);
      if (ex * ex + ey * ey > 1) continue;
      this.scoops.splice(i, 1); s.x = x; s.y = y;
      this.moving = { s, ptr: p.id, dx: x - p.x, dy: y - p.y };
      SFX.play('pop', { f: 600 }); Say.say(FOODS[s.id].name);
      return;
    }
  },
  // let go of what the finger was moving: a topping sticks where it is; a scoop goes back into the
  // pile where it is nearest in height, leaning the way it was moved (not so far it falls off)
  drop() {
    const M = this.moving; this.moving = null;
    if (M.t) { M.t.held = false; this.stick(M.t, M.x, M.y); M.t.pop = 1; this.landSound(M.t.id); return; }
    const s = M.s, up = this.floor - s.y + this.scoopH(s.id) * 0.12;
    let h = this.seat(), at = 0, best = Infinity;
    for (let i = 0; i <= this.scoops.length; i++) {
      if (Math.abs(h - up) < best) { best = Math.abs(h - up); at = i; }
      if (i < this.scoops.length) h += this.scoopH(this.scoops[i].id) * 0.6;
    }
    const lean = this.scoops.slice(0, at).reduce((a, q) => a + q.dx, 0);
    s.dx = clamp(lean + clamp((s.x - this.cx) / this.dw - lean, -0.3, 0.3), -0.6, 0.6) - lean;
    const was = this.scoops[this.scoops.length - 1] || null;
    this.scoops.splice(at, 0, s);
    if (at === this.scoops.length - 1) this.rideUp(was, s);
    this.squash = 1; this.landSound(s.id);
  },
  serve() {
    if (!this.base) return;
    if (this.moving) this.drop();
    const at = this.slots(); this.scoops.forEach((s, i) => { s.x = at[i][0]; s.y = at[i][1]; });   // none still gliding into place
    const ids = [this.base].concat(this.scoops.map(s => s.id), this.tops.map(t => t.id));
    // fit the whole dessert, however it leans, in the picture
    let x0 = this.cx - this.dw * 0.5, x1 = this.cx + this.dw * 0.5, y0 = this.floor - this.baseH();
    this.scoops.forEach(s => { const [x, y] = this.scoopAt(s); x0 = Math.min(x0, x - this.dw * 0.41); x1 = Math.max(x1, x + this.dw * 0.41); y0 = Math.min(y0, y - this.scoopH(s.id)); });
    this.tops.forEach(t => { const [x, y] = this.topPos(t), r = this.topW(t.id) * 0.6; x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r); y0 = Math.min(y0, y - r); });
    x0 -= this.dw * 0.05; x1 += this.dw * 0.05;
    const spr = dishSprite((g, px) => { const k = Math.min(px * 0.9 / (x1 - x0), px * 0.92 / (this.floor - y0)); g.translate(px / 2, px * 0.97); g.scale(k, k); g.translate(-(x0 + x1) / 2, -this.floor); this.drawDessert(g); });
    const S = servingOfParts(ids, 'dessert', spr, { name: this.base === 'd_cone' ? 'ice cream' : 'pudding' });
    sendDish(this, S);
  },
  down(p) {
    if (pickerDown(this, p)) return;
    if (!this.moving && !this.held) this.grab(p);
  },
  move(p) {
    if (pickerMove(this, p)) return;
    const M = this.moving;
    if (!M || M.ptr !== p.id) return;
    if (M.s) { M.s.x = p.x + M.dx; M.s.y = p.y + M.dy; } else { M.x = p.x + M.dx; M.y = p.y + M.dy; }
  },
  up(p) {
    const H = this.held;
    if (H && H.ptr === p.id) {
      this.held = null;
      if (H.moved && DESSERT_TOPS.indexOf(H.id) >= 0 && !this.pantry.hit(p.x, p.y)) this.put(H.id, p.x, p.y);
      else this.add(H.id);
      return;
    }
    if (this.moving && this.moving.ptr === p.id) this.drop();
  },
  update(dt) {
    this.pantry.update(dt);
    this.squash = Math.max(0, this.squash - dt * 4);
    // scoops glide to where they belong, after one is taken out or put back
    const slots = this.slots(), e = Math.min(1, dt * 14);
    this.scoops.forEach((s, i) => { s.x += (slots[i][0] - s.x) * e; s.y += (slots[i][1] - s.y) * e; });
    this.tops.forEach(t => { if (t.pop) t.pop = Math.max(0, t.pop - dt * 3); });
    const F = this.fall;
    if (F) {
      const scoop = DESSERT_SCOOPS.indexOf(F.id) >= 0, target = -(this.rim() - (scoop ? 0 : TOPPING[F.id][1] * this.dw));
      F.vy += 2600 * dt; F.y += F.vy * dt;
      if (F.y >= target) {
        this.fall = null; this.squash = 1;
        if (scoop) {
          const was = this.scoops[this.scoops.length - 1] || null, s = { id: F.id, dx: 0 };
          this.scoops.push(s);
          const at = this.slots()[this.scoops.length - 1]; s.x = at[0]; s.y = at[1];
          this.rideUp(was, s);
        } else {
          const t = { id: F.id, rot: F.id === 'd_wafer' || F.id === 'd_flake' ? rand(-0.5, 0.5) : 0 };
          this.stick(t, this.topX() + F.dx * this.dw, this.floor + target - this.topW(F.id) / Art.aspect(F.id) / 2);
          this.tops.push(t);
        }
        this.landSound(F.id);
      }
    }
  },
  drawDessert(ctx) {
    if (!this.base) return;
    const b = this.base, drawBase = () => Art.drawBase(ctx, b, this.cx, this.floor, this.baseW());
    if (b !== 'd_glass') drawBase();
    this.scoops.forEach(s => { const [x, y] = this.scoopAt(s); Art.drawBase(ctx, s.id, x, y, this.dw * 0.82); });
    if (b === 'd_glass') { ctx.save(); ctx.globalAlpha = 0.85; drawBase(); ctx.restore(); }
    // toppings on a scoop in a finger are drawn with it, over everything
    this.tops.forEach(t => { if (t.held || (t.on && this.scoops.indexOf(t.on) < 0)) return; const [x, y] = this.topPos(t); this.drawTop(ctx, t, x, y); });
  },
  // a topping with its middle at (x, y); it swells for a moment when put down
  drawTop(ctx, t, x, y) {
    const w = this.topW(t.id), h = w / Art.aspect(t.id), k = 1 + Math.sin((t.pop || 0) * Math.PI) * 0.18;
    ctx.save(); ctx.translate(x, y); if (t.rot) ctx.rotate(t.rot); if (k !== 1) ctx.scale(k, k);
    Art.drawBase(ctx, t.id, 0, h / 2, w);
    ctx.restore();
  },
  draw(ctx) {
    const { W, H } = G;
    Backdrops.draw(ctx, 'bg_kitchen', W, H, this.floor);
    ctx.fillStyle = 'rgba(70,35,15,0.2)'; ctx.beginPath(); ctx.ellipse(this.cx, this.floor + 4, this.dw * 0.5, this.dw * 0.08, 0, 0, TAU); ctx.fill();
    this.drawDessert(ctx);
    const F = this.fall;
    if (F) { const scoop = DESSERT_SCOOPS.indexOf(F.id) >= 0; Art.drawBase(ctx, F.id, this.topX() + F.dx * this.dw, this.floor + F.y + (scoop ? this.scoopH(F.id) * 0.12 : 0), scoop ? this.dw * 0.82 : this.topW(F.id)); }
    if (!this.base) { ctx.save(); ctx.globalAlpha = 0.3 + Math.sin(G.t * 4) * 0.1; Art.draw(ctx, 'sundae', this.cx, this.floor - this.dw * 0.7, this.dw * 1.2); ctx.restore(); }
    Parts.draw(ctx, 0); Parts.draw(ctx, 1);
    this.pantry.draw(ctx);
  },
  drawOver(ctx) {
    const M = this.moving;
    if (M && M.s) {
      Art.drawBase(ctx, M.s.id, M.s.x, M.s.y, this.dw * 0.82);
      this.tops.forEach(t => { if (t.on !== M.s) return; const [x, y] = this.topPos(t); this.drawTop(ctx, t, x, y); });
    } else if (M) this.drawTop(ctx, M.t, M.x, M.y);
    drawPicked(this, ctx);
  },
};

/* ---------- src/main.js ---------- */
/* main.js — the canvas, the clock, fingers and starting up. Loaded last. */

/* ---------- canvas and size ---------- */
const canvas = document.getElementById('cc');
const ctx = canvas.getContext('2d');
function readSafe() {
  const p = document.getElementById('safe');
  if (!p) return;
  const cs = getComputedStyle(p);
  G.safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function resize() {
  const r = canvas.getBoundingClientRect();
  G.W = Math.max(320, Math.round(r.width)); G.H = Math.max(300, Math.round(r.height));
  // sharp, but within a pixel budget: a big iPad at full density would paint 5 million pixels a frame
  G.dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3.4e6 / (G.W * G.H))));
  canvas.width = Math.round(G.W * G.dpr); canvas.height = Math.round(G.H * G.dpr);
  readSafe();
  if (G.cur) G.cur.layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- the frame ---------- */
function update(dt) {
  G.t += dt;
  if (G.jawDir) {
    G.jaw += G.jawDir * dt / 0.2;
    if (G.jaw >= 1) { G.jaw = 1; G.jawDir = -1; enterScreen(G.next.name, G.next.params); G.next = null; SFX.play('thud'); }
    if (G.jaw <= 0 && G.jawDir < 0) { G.jaw = 0; G.jawDir = 0; }
  }
  const S = G.cur;
  if (!S) return;
  (S.buttons || []).forEach(b => updateButton(b, dt, G.t));
  S.update(dt);
  Parts.update(dt);
}
function draw() {
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.clearRect(0, 0, G.W, G.H);
  if (!G.cur) { drawLoading(); return; }
  G.cur.draw(ctx);
  (G.cur.buttons || []).forEach(b => drawButton(ctx, b));
  if (G.cur.drawOver) G.cur.drawOver(ctx);
  drawJaws(ctx, G.W, G.H, G.jaw);
}
function drawLoading() {
  ctx.fillStyle = '#bfe4f6'; ctx.fillRect(0, 0, G.W, G.H);
  const p = (Art.progress() + (Backdrops.ready ? 1 : 0)) / 2, w = Math.min(G.W * 0.6, 360), x = (G.W - w) / 2, y = G.H * 0.6;
  drawText(ctx, 'Chomp Chums', G.W / 2, G.H * 0.4, Math.min(G.W / 9, 72), '#ffd84a');
  ctx.beginPath(); rrect(ctx, x, y, w, 26, 13); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = UI_LINE; ctx.stroke();
  ctx.beginPath(); rrect(ctx, x + 4, y + 4, Math.max(18, (w - 8) * p), 18, 9); ctx.fillStyle = '#69c95c'; ctx.fill();
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - (last || now)) / 1000));
  last = now;
  update(dt); draw();
}

/* ---------- fingers ---------- */
function pt(e) { const r = canvas.getBoundingClientRect(); return { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top }; }
function firstTouch() {
  SFX.unlock();
  if (!G.saidHello) { G.saidHello = true; Say.init(); }
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  firstTouch();
  if (!G.cur || G.jawDir) return;
  const p = pt(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
  const b = (G.cur.buttons || []).slice().reverse().find(b => hitButton(b, p.x, p.y));
  if (b) { b.down = true; G.ptrs[p.id] = { button: b, on: G.visit }; SFX.play('tap'); return; }
  G.ptrs[p.id] = { screen: true, on: G.visit };
  if (G.cur.down) G.cur.down(p);
});
canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  const p = pt(e), P = G.ptrs[p.id];
  if (!P || !G.cur || P.on !== G.visit) return;
  if (P.button) { P.button.down = hitButton(P.button, p.x, p.y); return; }
  if (G.cur.move) G.cur.move(p);
});
function release(e, cancel) {
  const p = pt(e), P = G.ptrs[p.id];
  delete G.ptrs[p.id];
  if (!P || !G.cur) return;
  if (P.button) P.button.down = false;
  if (P.on !== G.visit) return;   // the screen changed under this finger
  if (P.button) { const b = P.button; if (hitButton(b, p.x, p.y) && !cancel && !G.jawDir && b.onTap) b.onTap(); return; }
  if (G.cur.up) G.cur.up(p, cancel);
}
canvas.addEventListener('pointerup', e => { e.preventDefault(); SFX.unlock(); release(e, false); });
canvas.addEventListener('pointercancel', e => release(e, true));
// no pinch-zoom, no long-press menus, no scrolling the page about
['gesturestart', 'gesturechange', 'contextmenu'].forEach(n => document.addEventListener(n, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden) SFX.suspend(); else if (SFX.ctx) SFX.unlock(); });

/* ---------- start ---------- */
function start() {
  G.test = /[?&]test\b/.test(location.search);
  if (G.test) Rnd.f = seeded(1);
  Store.load();
  resize();
  let pending = 2;
  const ready = () => { if (--pending) return; G.started = true; enterScreen('home'); if (G.test) testHooks(); };
  Art.load(ready);
  Backdrops.load(() => { Backdrops.ready = true; ready(); });
  if (!G.test) requestAnimationFrame(frame);
  else draw();
  if ('serviceWorker' in navigator && window.isSecureContext && window.top === window && !G.test) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

// a remote control for the test driver: step time by hand, jump between screens, feed foods
function testHooks() {
  window.__cc = {
    step(sec, fps = 60) { const n = Math.round(sec * fps); for (let i = 0; i < n; i++) update(1 / fps); draw(); return G.name; },
    go(name, params) { enterScreen(name, params); draw(); return G.name; },
    screen() { return G.name; },
    cur() { return G.cur; },
    tap(x, y) { const e = { pointerId: 99, clientX: x, clientY: y, preventDefault() {} }; canvas.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 99, clientX: x, clientY: y, bubbles: true })); canvas.dispatchEvent(new PointerEvent('pointerup', { pointerId: 99, clientX: x, clientY: y, bubbles: true })); return e; },
    store: Store,
  };
  draw();
  document.title = 'ready';
}
start();
</script>
